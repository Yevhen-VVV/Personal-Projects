# Builds the app and publishes it to GitHub Pages.
#
# The checks run first and the deploy depends on them, so a build that would
# ship a broken question -- a missing explanation, an explanation in the wrong
# language, a leaked template token -- never reaches her phone.
name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deployments from the default
    # branch unless another is allowed in its settings, so real deploys come
    # from main; the feature branch is here so the checks still run on it.
    branches: [main, claude/esl-lessons-quizzes-app-lbfl7i]
  # Lets you re-run this by hand after changing repository settings.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; finish the one in flight, then run the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck app and scripts
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Audit generated questions
        run: npm run audit

      - name: Test the content-pack validator
        run: npm run test:pack

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tries to turn Pages on automatically. This does NOT work on a
          # private repository on a free plan -- Pages is unavailable there at
          # all, and the step fails with "Resource not accessible by
          # integration". The repository must be public (or on a paid plan),
          # with Settings -> Pages -> Source set to "GitHub Actions", before
          # this can succeed. Once that is done this step is a no-op.
          enablement: true

      - name: Build
        # Pages serves a project repo from /<repo>/, not the domain root.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
