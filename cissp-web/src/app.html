  function libKeypoints(dn) {
    const d = domainOf(dn);
    const qs = CURATED.filter((q) => q.d === dn).sort((a, b) => a.obj.localeCompare(b.obj, undefined, { numeric: true }));
    const groups = {};
    for (const q of qs) (groups[q.obj] || (groups[q.obj] = [])).push(q);
    return `<div class="stack">${backToLib}
      <h2>Key points</h2>
      ${domainTabs("lib-kp", dn)}
      <p class="eyebrow">D${d.n} · ${esc(d.name)} · ${d.weight}% of the exam</p>
      ${Object.entries(groups).map(([obj, list]) => `<section class="card stack-sm"><h3><span class="mono">${obj}</span> ${esc(d.objectives[obj])}</h3>
        <div>${list.map((q) => `<div class="kp"><p>${esc(q.k)}</p><button type="button" class="btn-quiet btn btn-sm" style="justify-self:start" data-act="study" data-id="${q.id}">See question ${esc(q.id)}</button></div>`).join("")}</div></section>`).join("")}
    </div>`;
  }

  function libBrowse(dn) {
    const d = domainOf(dn);
    const qs = CURATED.filter((q) => q.d === dn).sort((a, b) => a.obj.localeCompare(b.obj, undefined, { numeric: true }) || a.id.localeCompare(b.id));
    return `<div class="stack">${backToLib}
      <h2>Browse questions</h2>
      ${domainTabs("lib-browse", dn)}
      <p class="eyebrow">D${d.n} · ${esc(d.name)} · ${qs.length} questions</p>
      <div class="menu">${qs.map((q) => {
        const r = S.progress.p[q.id];
        const state = !r ? "" : r[3] ? `<span class="chip good">✓</span>` : `<span class="chip bad">✗</span>`;
        return `<button type="button" data-act="study" data-id="${q.id}"><span class="title small" style="font-weight:500">${esc(q.q.split("\n")[0].slice(0, 120))}${q.q.length > 120 ? "…" : ""}</span><span class="detail mono">${q.obj} · ${q.id}</span><span class="side">${state}</span></button>`;
      }).join("")}</div>
    </div>`;
  }

  function libResources() {
    return `<div class="stack">${backToLib}
      <h2>Resources</h2>
      <p class="muted measure">The questions in this app are original and follow the Official Study Guide's reasoning. Use these alongside them; links open in a new tab.</p>
      ${RESOURCES.map(([group, items]) => `<section class="stack-sm"><p class="section-title">${esc(group)}</p>
        <div class="menu">${items.map(([t, url, detail]) => `<a href="${esc(url)}" target="_blank" rel="noopener"><span class="title">${esc(t)}</span><span class="detail">${esc(detail)}</span><span class="side">↗</span></a>`).join("")}</div></section>`).join("")}
    </div>`;
  }

  // ---------------------------------------------------------------- Arcade
  // Experimental, game-like ways to practise. The question games draw on the
  // same bank and count toward the same progress record as Classic practice;
  // Sequence it and Match up use the drills in bank/drills.json. Every answer
  // anywhere in the app earns experience, and badges mark milestones.
  const practiceMode = () => (S.tool.mode === "arcade" ? "arcade" : "classic");

  function practiceHeader() {
    const arcade = practiceMode() === "arcade";
    return `<section class="stack-sm">
      <div class="spread">
        <h2>Practice</h2>
        <div class="seg" role="group" aria-label="Practice style">
          <button type="button" data-act="practice-mode" data-v="classic" aria-pressed="${!arcade}">Classic</button>
          <button type="button" data-act="practice-mode" data-v="arcade" aria-pressed="${arcade}">Arcade</button>
        </div>
      </div>
      <p class="muted">${arcade
        ? "Experimental, game-like ways to practise. Every answer still counts toward your record and your review schedule."
        : "Instant feedback. After each answer you see why every option is right or wrong."}</p>
    </section>`;
  }

  const MEDAL = `<svg class="medal" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-.9z"/></svg>`;
  const answeredTotal = () => Object.values(S.progress.days).reduce((n, v) => n + v[0], 0);
  const G = () => S.game;

  const BADGES = [
    { id: "first", name: "First answer", desc: "Answer your first question.", test: () => answeredTotal() >= 1 },
    { id: "century", name: "Century", desc: "Answer 100 questions.", test: () => answeredTotal() >= 100 },
    { id: "grinder", name: "Grinder", desc: "Answer 1,000 questions.", test: () => answeredTotal() >= 1000 },
    { id: "streak7", name: "Week streak", desc: "Practise seven days in a row.", test: () => streak() >= 7 },
    { id: "streak30", name: "Habit", desc: "Practise 30 days in a row.", test: () => streak() >= 30 },
    { id: "perfect5", name: "Perfect five", desc: "Get a whole Daily 5 right.", test: () => Object.values(G().daily).some((d) => d[0] === d[1]) },
    { id: "survivor", name: "Survivor", desc: "Score 15 in Survival.", test: () => (G().best.survival || 0) >= 15 },
    { id: "onpace", name: "On pace", desc: "Get 8 of 10 right in a Pace run before time runs out.", test: () => (G().best.paceRight || 0) >= 8 },
    { id: "calibrated", name: "Well calibrated", desc: "Bet Sure 25 times and be right on 85% of them.", test: () => { const c = G().calib[3]; return !!c && c[0] >= 25 && c[1] / c[0] >= 0.85; } },
    { id: "eliminator", name: "Eliminator", desc: "Strike two wrong options cleanly 25 times.", test: () => G().elim[1] >= 25 },
    { id: "recall", name: "Total recall", desc: "Know 15 answers before seeing the options.", test: () => G().recall[1] >= 15 },
    { id: "sequencer", name: "In order", desc: "Solve every sequence without a mistake.", test: () => DRILLS.sequences.every((x) => (G().seq[x.id] || [0, 0])[1] > 0) },
    { id: "matchmaker", name: "Matchmaker", desc: "Clear every match set without a mistake.", test: () => DRILLS.matches.every((x) => (G().match[x.id] || [0, 0])[1] > 0) },
    { id: "rounded", name: "Well rounded", desc: "Reach 75% first-try accuracy in all eight domains, 15 answers each.", test: () => curatedStats().every((x) => x.seen >= 15 && x.firstRate >= READY_TARGET) },
    { id: "mockpass", name: "Pass estimate", desc: "Pass a full-length mock exam.", test: () => S.sessions.some((x) => x.kind === "mock" && x.form === "full" && x.pass) },
    { id: "seer", name: "Seer", desc: "Complete seven daily readings.", test: () => readingsCompleted() >= 7 },
    { id: "shadowwork", name: "Shadow work", desc: "Confront your Shadow and integrate it.", test: () => Object.keys(S.oracle.shadows.wins || {}).length >= 1 },
    { id: "upright", name: "The World upright", desc: "Hold all 22 cards upright at once.", test: () => ARCANA.length === 22 && masteries().every((m) => m.state === "upright") },
  ];

  // Adds experience, awards any newly earned badges and saves the record.
  // During a mock the news waits for the score report.
  let pendingNews = [];
  function reward(xp, { quiet = false } = {}) {
    const g = S.game;
    const news = [];
    const before = Engine.levelFor(g.xp);
    g.xp += Math.max(0, Math.round(xp));
    const after = Engine.levelFor(g.xp);
    if (after.level > before.level) news.push(after.title !== before.title ? `Level ${after.level}: promoted to ${after.title}` : `Level ${after.level} reached`);
    for (const b of BADGES) {
      if (g.badges[b.id]) continue;
      let earned = false;
      try { earned = b.test(); } catch { /* incomplete data: not yet */ }
      if (earned) { g.badges[b.id] = Date.now(); news.push(`Badge: ${b.name}`); }
    }
    saveGame();
    pendingNews.push(...news);
    if (!quiet && pendingNews.length) {
      toast(pendingNews.join(" · "), "celebrate");
      pendingNews = [];
    }
  }

  function levelCard() {
    const g = S.game;
    const lv = Engine.levelFor(g.xp);
    const earned = BADGES.filter((b) => g.badges[b.id]).length;
    return `<div class="level">
      <div class="lvl-badge num" aria-label="Level ${lv.level}">${lv.level}</div>
      <div class="grow stack-sm">
        <div class="spread"><b>${esc(lv.title)}</b><span class="small muted num">${g.xp.toLocaleString()} XP</span></div>
        <div class="meter" aria-hidden="true"><span style="width:${Math.round((100 * lv.into) / lv.span)}%"></span></div>
        <p class="small muted num">${(lv.next - g.xp).toLocaleString()} XP to level ${lv.level + 1} · ${earned} of ${BADGES.length} badges</p>
      </div>
    </div>`;
  }

  const squares = (pattern) => `<span class="squares" aria-label="${[...pattern].filter((c) => c === "1").length} of ${pattern.length} right">${[...pattern].map((c) => `<i class="${c === "1" ? "good" : "bad"}"></i>`).join("")}</span>`;

  function todayArcade() {
    const done = S.game.daily[todayKey()];
    return `<section class="card stack">
      ${levelCard()}
      <div class="spread">
        <p class="small" style="flex:1 1 200px">${done ? `<b>Daily 5</b> ${squares(done[2])} <span class="muted num">${done[0]} of ${done[1]} · new set tomorrow</span>` : "<b>Daily 5</b> <span class=\"muted\">· five questions, one go, new every day</span>"}</p>
        ${done
          ? `<button type="button" class="btn btn-sm" data-act="open-arcade">Arcade</button>`
          : `<button type="button" class="btn btn-sm btn-primary" data-act="arc-start" data-mode="daily">Play</button>`}
      </div>
    </section>`;
  }

  const ARC = {
    daily: { name: "Daily 5", detail: "Five questions from five domains, the same on every device. One go per day." },
    survival: { name: "Survival", detail: "Three lives. The questions get harder the longer you last." },
    pace: { name: "Pace run", detail: "Ten questions on the exam's clock, 72 seconds each. Explanations come at the end." },
    bets: { name: "Confidence bets", detail: "Bet on every answer. Sure pays 3 but costs 6, so only an honest bet pays." },
    elim: { name: "Eliminate two", detail: "Strike two wrong options before you answer, as you should on the exam." },
    blind: { name: "Blind recall", detail: "Answer in your head first, then see the options. Recall beats recognition." },
    seq: { name: "Sequence it", detail: "Put processes in order: incident steps, the RMF, DR tests, the kill chain." },
    match: { name: "Match up", detail: "Pair terms with definitions: security models, fire classes, recovery metrics." },
  };

  function viewArcadeMenu() {
    const g = S.game;
    const done = g.daily[todayKey()];
    const solved = DRILLS.sequences.filter((x) => (g.seq[x.id] || [0, 0])[1] > 0).length;
    const cleared = DRILLS.matches.filter((x) => (g.match[x.id] || [0, 0])[1] > 0).length;
    const bets = [1, 2, 3].reduce((n, b) => n + ((g.calib[b] || [0])[0] || 0), 0);
    const side = {
      survival: g.best.survival ? `Best ${g.best.survival}` : "New",
      pace: g.best.pace ? `Best ${g.best.pace}` : "New",
      bets: bets ? `${bets} bets` : "New",
      elim: g.elim[0] ? `${g.elim[1]} clean` : "New",
      blind: g.recall[0] ? `${g.recall[1]} recalled` : "New",
      seq: `${solved}/${DRILLS.sequences.length}`,
      match: `${cleared}/${DRILLS.matches.length}`,
    };
    const item = (mode) => `<button type="button" data-act="arc-start" data-mode="${mode}">
      <span class="title">${esc(ARC[mode].name)}</span><span class="detail">${esc(ARC[mode].detail)}</span><span class="side">${esc(side[mode])}</span>
    </button>`;
    const cal = Engine.calibration(g.calib);
    const labels = { 1: "Guess", 2: "Likely", 3: "Sure" };
    const earned = BADGES.filter((b) => g.badges[b.id]).length;
    return `<div class="stack-lg">
      ${practiceHeader()}
      <section class="card raised stack">
        ${levelCard()}
        <div class="spread">
          <div class="stack-sm">
            <h3>Daily 5</h3>
            <p class="small muted">${done ? `${squares(done[2])} <span class="num">${done[0]} of ${done[1]} today.</span> A new set arrives tomorrow.` : esc(ARC.daily.detail)}</p>
          </div>
          ${done ? "" : `<button type="button" class="btn btn-primary" data-act="arc-start" data-mode="daily">Play today's five</button>`}
        </div>
      </section>
      <section class="stack">
        <h3>Question games</h3>
        <div class="menu">${["survival", "pace", "bets", "elim", "blind"].map(item).join("")}</div>
      </section>
      <section class="stack">
        <h3>Drills</h3>
        <div class="menu">${["seq", "match"].map(item).join("")}</div>
      </section>
      ${bets ? `<section class="stack">
        <h3>Calibration</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Your bet</th><th class="n">Bets</th><th class="n">Right</th></tr></thead>
          <tbody>${cal.levels.map((l) => `<tr><td>${labels[l.bet]}</td><td class="n">${l.n}</td><td class="n">${l.n ? pct(l.rate) : "–"}</td></tr>`).join("")}</tbody>
        </table></div>
        <p class="small">${esc(cal.verdict)}</p>
      </section>` : ""}
      <section class="stack">
        <div class="spread"><h3>Badges</h3><span class="small muted num">${earned} of ${BADGES.length}</span></div>
        <div class="badges">${BADGES.map((b) => `<div class="badge ${g.badges[b.id] ? "got" : ""}">${MEDAL}<b>${esc(b.name)}</b><span class="small muted">${esc(b.desc)}</span></div>`).join("")}</div>
      </section>
    </div>`;
  }

  // ---- starting, answering and finishing a game
  function pickDrills(list, rec, n) {
    // Least-played first; ties in random order.
    return Engine.shuffle(list).sort((x, y) => (rec[x.id] || [0])[0] - (rec[y.id] || [0])[0]).slice(0, n).map((x) => x.id);
  }
  const seqById = (id) => DRILLS.sequences.find((x) => x.id === id);
  const matchById = (id) => DRILLS.matches.find((x) => x.id === id);
  const seqState = (id) => ({ pool: Engine.shuffle(seqById(id).steps.map((_, i) => i)), placed: [], checked: false });
  const matchState = (id) => {
    const n = matchById(id).pairs.length;
    return { terms: Engine.shuffle([...Array(n).keys()]), defs: Engine.shuffle([...Array(n).keys()]), selTerm: null, selDef: null, matched: [], mistakes: 0, miss: null };
  };

  function startArc(mode) {
    if (!ARC[mode]) return;
    const base = { id: uid(), mode, items: [], orders: {}, idx: 0, answers: [], selected: null, submitted: false, phase: "", struck: [], score: 0, xp: 0, startedAt: Date.now(), shownAt: Date.now(), done: false };
    let a;
    if (mode === "daily") {
      const date = todayKey();
      if (S.game.daily[date]) { toast("Today's five are done. A new set arrives tomorrow."); return; }
      a = { ...base, date, items: Engine.dailyPick(CURATED, date, DOMAINS).map((q) => q.id) };
    } else if (mode === "survival") {
      a = { ...base, lives: 3 };
      a.items.push(Engine.survivalPick(CURATED, S.progress.p, [], 0).id);
    } else if (mode === "seq" || mode === "match") {
      const ids = mode === "seq" ? pickDrills(DRILLS.sequences, S.game.seq, 3) : pickDrills(DRILLS.matches, S.game.match, 3);
      a = { ...base, drills: ids, di: 0, results: [], ...(mode === "seq" ? seqState(ids[0]) : matchState(ids[0])) };
    } else {
      const items = Engine.smartSet(CURATED, S.progress.p, DOMAINS, 10, { selfRatings: S.profile.selfRatings });
      a = { ...base, items: items.map((q) => q.id), phase: mode === "elim" ? "strike" : mode === "blind" ? "recall" : "" };
      if (mode === "pace") a.limitMs = a.items.length * 72000;
    }
    for (const id of a.items) a.orders[id] = Engine.shuffle([0, 1, 2, 3]);
    S.arc = a;
    saveArc();
    S.tab = "practice";
    S.sub = null;
    render();
    window.scrollTo(0, 0);
  }

  const arcQ = () => (S.arc && S.arc.items.length ? byId(S.arc.items[S.arc.idx]) : null);

  function arcSubmit(extra = {}) {
    const a = S.arc;
    if (!a || a.submitted || a.done) return;
    const q = arcQ();
    const chosen = "chosen" in extra ? extra.chosen : a.selected == null ? null : a.orders[q.id][a.selected];
    if (chosen == null && !("chosen" in extra)) return;
    const correct = chosen === q.a;
    const ans = { id: q.id, chosen, correct, ms: Date.now() - a.shownAt, struck: a.struck.slice() };
    const g = S.game;
    let xp = Engine.xpFor(correct, q.diff);
    if (a.mode === "bets") {
      ans.bet = extra.bet;
      ans.pts = Engine.betPoints(extra.bet, correct);
      a.score += ans.pts;
      const c = g.calib[extra.bet] || [0, 0];
      g.calib[extra.bet] = [c[0] + 1, c[1] + (correct ? 1 : 0)];
      if (correct) xp += 5 * (extra.bet - 1);
    } else if (a.mode === "survival") {
      if (correct) a.score++;
      else a.lives--;
    } else if (correct) a.score++;
    if (a.mode === "elim") {
      // Clean means both struck options were wrong ones.
      ans.clean = "clean" in extra ? !!extra.clean : a.phase === "pick";
      g.elim = [g.elim[0] + 1, g.elim[1] + (ans.clean ? 1 : 0)];
      if (ans.clean) xp += 5;
    }
    a.answers.push(ans);
    a.submitted = true;
    a.xp += xp;
    S.progress.p[q.id] = Engine.record(S.progress.p[q.id], correct, Date.now());
    countAnswer(correct);
    saveProgress();
    reward(xp);
    if (a.mode === "pace") { arcNext(); return; }
    saveArc();
    render();
  }

  function arcNext() {
    const a = S.arc;
    if (!a) return;
    if (a.mode === "survival") {
      if (a.lives <= 0) { arcFinish(); return; }
      const q = Engine.survivalPick(CURATED, S.progress.p, a.items, a.score);
      if (!q) { arcFinish(); return; }
      a.items.push(q.id);
      a.orders[q.id] = Engine.shuffle([0, 1, 2, 3]);
    } else if (a.idx + 1 >= a.items.length) { arcFinish(); return; }
    a.idx += 1;
    a.selected = null;
    a.submitted = false;
    a.struck = [];
    a.recall = undefined;
    a.phase = a.mode === "elim" ? "strike" : a.mode === "blind" ? "recall" : "";
    a.shownAt = Date.now();
    saveArc();
    render();
    window.scrollTo(0, 0);
  }

  function arcFinish(reason = "") {
    const a = S.arc;
    if (!a || a.done) return;
    a.done = true;
    a.reason = reason;
    a.endedAt = Date.now();
    const g = S.game;
    const right = a.answers.filter((x) => x.correct).length;
    let bonus = 0;
    if (a.mode === "daily" && a.answers.length) {
      // One go per day: ending early counts the unanswered ones as missed.
      g.daily[a.date] = [right, a.items.length, a.items.map((_, i) => (a.answers[i] && a.answers[i].correct ? "1" : "0")).join("")];
      if (a.answers.length === a.items.length) bonus = 25 + (right === a.items.length ? 25 : 0);
    } else if (a.mode === "survival") {
      g.best.survival = Math.max(g.best.survival || 0, a.score);
      bonus = 3 * a.score;
    } else if (a.mode === "pace") {
      a.usedMs = Math.min(a.endedAt - a.startedAt, a.limitMs);
      const beatClock = a.answers.length === a.items.length && reason !== "time";
      a.paceScore = right * 100 + (beatClock ? Math.round((a.limitMs - a.usedMs) / 1000) : 0);
      g.best.pace = Math.max(g.best.pace || 0, a.paceScore);
      if (beatClock) g.best.paceRight = Math.max(g.best.paceRight || 0, right);
      bonus = 2 * right;
    } else if (a.mode === "bets" && a.answers.length) {
      g.best.bets = Math.max(g.best.bets || 0, a.score);
    }
    a.xp += bonus;
    saveArc();
    reward(bonus);
    render();
    window.scrollTo(0, 0);
  }

  function tickArcClock() {
    const a = S.arc;
    const el = $("#arc-clock");
    if (!a || a.done || a.mode !== "pace") return;
    const left = a.limitMs - (Date.now() - a.startedAt);
    if (el) {
      el.textContent = fmtClock(left);
      el.classList.toggle("low", left < 60000);
    }
    if (left <= 0) arcFinish("time");
  }

  // ---- the question games
  function arcStatus(a) {
    const n = a.mode === "survival" ? a.answers.length + (a.submitted ? 0 : 1) : a.idx + 1;
    if (a.mode === "survival") return `<span class="hearts" aria-label="${a.lives} lives left">${"♥".repeat(Math.max(0, a.lives))}${"♡".repeat(Math.max(0, 3 - a.lives))}</span><span class="mono small num">Score ${a.score}</span>`;
    if (a.mode === "pace") return `<span class="mono small num">${n} / ${a.items.length}</span><span class="clock" id="arc-clock">--:--</span>`;
    if (a.mode === "bets") return `<span class="mono small num">${n} / ${a.items.length} · ${a.score >= 0 ? "+" : ""}${a.score} pts</span>`;
    return `<span class="mono small num">${n} / ${a.items.length} · ${a.score} right</span>`;
  }

  function viewArcQuestion() {
    const a = S.arc;
    const q = arcQ();
    if (!q) { S.arc = null; saveArc(); return viewArcadeMenu(); }
    const order = a.orders[q.id];
    const ans = a.submitted ? a.answers[a.answers.length - 1] : null;
    const d = domainOf(q.d);
    let body = "", bar = "";
    const end = `<button type="button" class="btn btn-quiet" data-act="arc-end">End</button><span class="grow"></span>`;

    if (!a.submitted && a.phase === "recall") {
      body = `<div class="cover stack-sm"><p><b>Answer it in your head first.</b></p><p class="small">Say your answer, or the principle that decides it, before you look. Then pick the option that matches.</p></div>`;
      bar = `${end}<button type="button" class="btn btn-primary" data-act="arc-reveal" style="min-width:150px">Show the options</button>`;
    } else if (!a.submitted && a.phase === "strike") {
      body = `<p class="small muted">Tap two options you are sure are wrong.</p>
        ${optionList(q, order, { selected: null, submitted: false, act: "arc-strike", struck: a.struck })}`;
      bar = `${end}<button type="button" class="btn btn-primary" data-act="arc-strike-go" style="min-width:150px" ${a.struck.length === 2 ? "" : "disabled"}>Strike ${a.struck.length === 2 ? "these two" : `${2 - a.struck.length} more`}</button>`;
    } else if (!a.submitted) {
      body = optionList(q, order, { selected: a.selected, submitted: false, act: "arc-select", struck: a.struck, lockStruck: true });
      if (a.mode === "bets") {
        const off = a.selected == null ? "disabled" : "";
        bar = `<button type="button" class="btn btn-quiet" data-act="arc-end">End</button>
          <div class="bets">
            <button type="button" class="btn" data-act="arc-bet" data-bet="1" ${off}>Guess<small>+1 / 0</small></button>
            <button type="button" class="btn" data-act="arc-bet" data-bet="2" ${off}>Likely<small>+2 / −1</small></button>
            <button type="button" class="btn btn-primary" data-act="arc-bet" data-bet="3" ${off}>Sure<small>+3 / −6</small></button>
          </div>`;
      } else {
        bar = `${end}<button type="button" class="btn btn-primary" data-act="arc-submit" style="min-width:150px" ${a.selected == null ? "disabled" : ""}>${a.mode === "pace" ? "Lock in" : "Check answer"}</button>`;
      }
    } else {
      const extra = a.mode === "bets"
        ? ` <span class="chip ${ans.pts > 0 ? "good" : ans.pts < 0 ? "bad" : ""}">${ans.pts > 0 ? "+" : ""}${ans.pts} pts</span>`
        : a.mode === "survival" && !ans.correct ? ` <span class="chip bad">${a.lives ? `${a.lives} ${a.lives === 1 ? "life" : "lives"} left` : "Out of lives"}</span>` : "";
      const verdict = a.mode === "elim" && !ans.clean && ans.chosen == null
        ? "You struck the correct answer."
        : ans.correct ? "Correct" : `Not quite. The answer is ${"ABCD"[order.indexOf(q.a)]}.`;
      body = `<div class="verdict ${ans.correct ? "good" : "bad"}">${verdict}</div>${extra ? `<div class="row">${extra}</div>` : ""}
        ${optionList(q, order, { submitted: true, chosenOrig: ans.chosen, struck: ans.struck })}
        ${a.mode === "blind" && a.recall === undefined ? `<div class="card stack-sm"><p class="small"><b>Did you have it before you saw the options?</b></p>
          <div class="row"><button type="button" class="btn btn-sm" data-act="arc-recall" data-v="1">Yes, I had it</button><button type="button" class="btn btn-sm" data-act="arc-recall" data-v="0">No</button></div></div>` : ""}
        <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
        ${flagNote(q.id)}`;
      const last = a.mode === "survival" ? a.lives <= 0 : a.idx + 1 >= a.items.length;
      bar = `${end}<button type="button" class="btn btn-primary" data-act="arc-next" style="min-width:150px">${last ? "See results" : "Next question"}</button>`;
    }
    return `<div class="stack">
      <div class="qhead">
        <div class="row"><span class="chip ochre">${esc(ARC[a.mode].name)}</span><span class="chip accent">D${q.d} · ${esc(q.obj)}</span>${diffDots(q.diff)}</div>
        <div class="row">${arcStatus(a)}</div>
      </div>
      <p class="eyebrow">${esc(d.name)} · ${esc(objName(q.obj))}</p>
      <p class="stem">${esc(q.q)}</p>
      ${body}
    </div>
    <div class="actionbar"><div class="actionbar-inner">${bar}</div></div>`;
  }

  // ---- Sequence it
  function viewSeq() {
    const a = S.arc;
    const sq = seqById(a.drills[a.di]);
    const n = sq.steps.length;
    const slots = [];
    for (let i = 0; i < n; i++) {
      const step = a.placed[i];
      if (step == null) { slots.push(`<li><div class="seq-item empty"><span class="letter">${i + 1}</span><span class="small">${i === a.placed.length ? "Tap a step below" : ""}</span></div></li>`); continue; }
      const cls = a.checked ? (step === i ? "right" : "wrong") : "";
      slots.push(`<li><button type="button" class="seq-item ${cls}" ${a.checked ? "disabled" : `data-act="seq-unplace" data-i="${i}" aria-label="Remove ${esc(sq.steps[step])} from position ${i + 1}"`}><span class="letter">${i + 1}</span><span>${esc(sq.steps[step])}</span></button></li>`);
    }
    const left = a.pool.filter((i) => !a.placed.includes(i));
    const right = a.checked ? Engine.orderScore(a.placed, sq.steps.map((_, i) => i)) : 0;
    return `<div class="stack">
      <div class="qhead">
        <div class="row"><span class="chip ochre">Sequence it</span><span class="chip accent">D${sq.obj.split(".")[0]} · ${esc(sq.obj)}</span></div>
        <span class="mono small muted num">${a.di + 1} / ${a.drills.length}</span>
      </div>
      <h3>${esc(sq.title)}</h3>
      <p class="stem">${esc(sq.prompt)}</p>
      <ol class="seq">${slots.join("")}</ol>
      ${a.checked ? `
        <div class="verdict ${right === n ? "good" : "bad"}">${right === n ? "Perfect order" : `${right} of ${n} in the right place`}</div>
        ${right === n ? "" : `<div class="card stack-sm"><p class="eyebrow">Correct order</p><ol class="list-plain">${sq.steps.map((x) => `<li>${esc(x)}</li>`).join("")}</ol></div>`}
        <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(sq.note)}</p></div>`
        : left.length ? `<div class="pool">${left.map((i) => `<button type="button" data-act="seq-place" data-i="${i}">${esc(sq.steps[i])}</button>`).join("")}</div>
          <p class="small muted">Tap the steps in order. Tap a placed step to take it back.</p>` : ""}
    </div>
    <div class="actionbar"><div class="actionbar-inner">
      <button type="button" class="btn btn-quiet" data-act="arc-end">End</button><span class="grow"></span>
      ${a.checked
        ? `<button type="button" class="btn btn-primary" data-act="drill-next" style="min-width:150px">${a.di + 1 < a.drills.length ? "Next sequence" : "See results"}</button>`
        : `<button type="button" class="btn btn-primary" data-act="seq-check" style="min-width:150px" ${a.placed.length === n ? "" : "disabled"}>Check order</button>`}
    </div></div>`;
  }

  function seqCheck() {
    const a = S.arc;
    const sq = seqById(a.drills[a.di]);
    if (a.checked || a.placed.length !== sq.steps.length) return;
    a.checked = true;
    const right = Engine.orderScore(a.placed, sq.steps.map((_, i) => i));
    const perfect = right === sq.steps.length;
    a.results.push({ id: sq.id, right, n: sq.steps.length, perfect });
    const rec = S.game.seq[sq.id] || [0, 0];
    S.game.seq[sq.id] = [rec[0] + 1, rec[1] + (perfect ? 1 : 0)];
    const xp = perfect ? 30 : 10;
    a.xp += xp;
    if (perfect) a.score++;
    saveArc();
    reward(xp);
    render();
  }

  // ---- Match up
  function viewMatch() {
    const a = S.arc;
    const set = matchById(a.drills[a.di]);
    const n = set.pairs.length;
    const complete = a.matched.length === n;
    return `<div class="stack">
      <div class="qhead">
        <div class="row"><span class="chip ochre">Match up</span><span class="chip accent">D${set.obj.split(".")[0]} · ${esc(set.obj)}</span></div>
        <span class="mono small muted num">${a.di + 1} / ${a.drills.length} · ${a.mistakes} ${a.mistakes === 1 ? "miss" : "misses"}</span>
      </div>
      <h3>${esc(set.title)}</h3>
      <p class="small muted">${complete ? "All matched." : "Tap a term, then the definition that fits it."}</p>
      <div class="terms">${a.terms.map((i) => {
        const done = a.matched.includes(i);
        return `<button type="button" class="${done ? "done" : ""}" ${done ? "disabled" : `data-act="match-term" data-i="${i}"`} aria-pressed="${a.selTerm === i}">${esc(set.pairs[i][0])}</button>`;
      }).join("")}</div>
      <div class="defs">${a.defs.map((i) => {
        const done = a.matched.includes(i);
        return `<button type="button" class="${done ? "done" : a.miss === i ? "miss" : ""}" ${done ? "disabled" : `data-act="match-def" data-i="${i}"`} aria-pressed="${a.selDef === i}">${done ? `<span class="pairtag">${esc(set.pairs[i][0])}</span>` : ""}${esc(set.pairs[i][1])}</button>`;
      }).join("")}</div>
      ${complete ? `<div class="verdict ${a.mistakes ? "bad" : "good"}">${a.mistakes ? `Cleared with ${a.mistakes} ${a.mistakes === 1 ? "miss" : "misses"}` : "Clean sweep"}</div>` : ""}
    </div>
    <div class="actionbar"><div class="actionbar-inner">
      <button type="button" class="btn btn-quiet" data-act="arc-end">End</button><span class="grow"></span>
      <button type="button" class="btn btn-primary" data-act="drill-next" style="min-width:150px" ${complete ? "" : "disabled"}>${a.di + 1 < a.drills.length ? "Next set" : "See results"}</button>
    </div></div>`;
  }

  function matchTry() {
    const a = S.arc;
    if (a.selTerm == null || a.selDef == null) { render(); return; }
    const set = matchById(a.drills[a.di]);
    if (a.selTerm === a.selDef) {
      a.matched.push(a.selTerm);
      a.miss = null;
    } else {
      a.mistakes++;
      a.miss = a.selDef;
    }
    a.selTerm = null;
    a.selDef = null;
    if (a.matched.length === set.pairs.length) {
      const clean = a.mistakes === 0;
      a.results.push({ id: set.id, mistakes: a.mistakes, n: set.pairs.length });
      const rec = S.game.match[set.id] || [0, 0];
      S.game.match[set.id] = [rec[0] + 1, rec[1] + (clean ? 1 : 0)];
      const xp = Math.max(5, 5 * set.pairs.length - 3 * a.mistakes);
      a.xp += xp;
      if (clean) a.score++;
      saveArc();
      reward(xp);
    } else saveArc();
    render();
  }

  function drillNext() {
    const a = S.arc;
    if (a.di + 1 >= a.drills.length) { arcFinish(); return; }
    a.di += 1;
    Object.assign(a, a.mode === "seq" ? seqState(a.drills[a.di]) : matchState(a.drills[a.di]));
    saveArc();
    render();
    window.scrollTo(0, 0);
  }

  // ---- results
  function viewArcResult() {
    const a = S.arc;
    const g = S.game;
    const n = a.answers.length;
    const right = a.answers.filter((x) => x.correct).length;
    let head = "", sub = "";
    if (a.mode === "daily") {
      const rec = g.daily[a.date];
      head = `${right} of ${n}`;
      sub = rec ? `${squares(rec[2])} <span class="num">${n < a.items.length ? "Ended early. " : ""}A new set arrives tomorrow.</span>` : "";
    } else if (a.mode === "survival") {
      head = `Score ${a.score}`;
      sub = `${n} questions · best ${g.best.survival || 0}${a.score && a.score >= (g.best.survival || 0) ? " · a new best" : ""}`;
    } else if (a.mode === "pace") {
      const per = n ? Math.round(a.usedMs / 1000 / n) : 0;
      head = `${a.paceScore}`;
      sub = `${right} of ${a.items.length} right · ${fmtClock(a.usedMs)} used${n ? ` · ${per} s per question against the exam's 72 s` : ""}${a.reason === "time" ? " · time ran out" : ""}. Score: 100 per right answer, plus the seconds left if you finish.`;
    } else if (a.mode === "bets") {
      const byBet = [1, 2, 3].map((b) => { const xs = a.answers.filter((x) => x.bet === b); return [b, xs.length, xs.filter((x) => x.correct).length]; });
      head = `${a.score >= 0 ? "+" : ""}${a.score} points`;
      sub = `${right} of ${n} right · ${byBet.filter((x) => x[1]).map(([b, k, r]) => `${{ 1: "Guess", 2: "Likely", 3: "Sure" }[b]} ${r}/${k}`).join(" · ")}`;
    } else if (a.mode === "elim") {
      head = `${right} of ${n}`;
      sub = `${a.answers.filter((x) => x.clean).length} clean eliminations`;
    } else if (a.mode === "blind") {
      head = `${right} of ${n}`;
      sub = `${a.answers.filter((x) => x.recall && x.correct).length} known before the options appeared`;
    } else if (a.mode === "seq") {
      head = `${a.results.filter((x) => x.perfect).length} of ${a.results.length} perfect`;
      sub = `${DRILLS.sequences.filter((x) => (g.seq[x.id] || [0, 0])[1] > 0).length} of ${DRILLS.sequences.length} sequences solved so far`;
    } else if (a.mode === "match") {
      head = `${a.results.filter((x) => !x.mistakes).length} of ${a.results.length} clean`;
      sub = `${DRILLS.matches.filter((x) => (g.match[x.id] || [0, 0])[1] > 0).length} of ${DRILLS.matches.length} sets cleared so far`;
    }
    const review = n ? `<section class="stack">
        <h3>${a.mode === "pace" ? "Review your answers" : "Questions"}</h3>
        <div class="card">${a.answers.map((x) => {
          const q = byId(x.id);
          return q ? `<div class="kp"><div class="row"><span class="chip ${x.correct ? "good" : "bad"}">${x.correct ? "Right" : "Missed"}</span><span class="chip accent">D${q.d} · ${esc(q.obj)}</span>${x.bet ? `<span class="chip">${{ 1: "Guess", 2: "Likely", 3: "Sure" }[x.bet]}</span>` : ""}</div><p>${esc(q.k)}</p><button type="button" class="btn-quiet btn" style="justify-self:start" data-act="study" data-id="${q.id}">Review question</button></div>` : "";
        }).join("")}</div>
      </section>` : "";
    const drillRows = a.results && a.results.length ? `<div class="card">${a.results.map((x) => {
        const d = a.mode === "seq" ? seqById(x.id) : matchById(x.id);
        const ok = a.mode === "seq" ? x.perfect : !x.mistakes;
        return `<div class="kp"><div class="spread"><b>${esc(d.title)}</b><span class="chip ${ok ? "good" : "bad"}">${a.mode === "seq" ? `${x.right}/${x.n} placed` : `${x.mistakes} ${x.mistakes === 1 ? "miss" : "misses"}`}</span></div></div>`;
      }).join("")}</div>` : "";
    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">${esc(ARC[a.mode].name)} · finished</p>
        <p class="big-figure">${head}</p>
        <p class="muted">${sub}</p>
        <p class="small"><span class="chip ochre">+${a.xp} XP</span></p>
      </section>
      <div class="card">${levelCard()}</div>
      ${drillRows}
      ${review}
      <div class="row">
        <button type="button" class="btn btn-primary" data-act="arc-close">Back to Arcade</button>
        ${a.mode === "daily" ? "" : `<button type="button" class="btn" data-act="arc-start" data-mode="${a.mode}">Play again</button>`}
        ${n && a.answers.some((x) => !x.correct) ? `<button type="button" class="btn" data-act="arc-retry">Retry the misses</button>` : ""}
      </div>
    </div>`;
  }

  function viewArc() {
    const a = S.arc;
    if (a.done) return viewArcResult();
    if (a.mode === "seq") return viewSeq();
    if (a.mode === "match") return viewMatch();
    return viewArcQuestion();
  }

  const arcActions = {
    "practice-mode": (el) => { S.tool.mode = el.dataset.v; lsSet(LS + "mode", S.tool.mode); render(); },
    "open-arcade": () => { S.tool.mode = "arcade"; lsSet(LS + "mode", "arcade"); go("practice"); },
    "arc-start": (el) => startArc(el.dataset.mode),
    "arc-select": (el) => {
      const a = S.arc;
      if (!a || a.submitted) return;
      a.selected = Number(el.dataset.pos);
      // Pace runs and quick-answer users skip the confirmation step; bets always need the bet.
      if (a.mode !== "bets" && !S.profile.confirm) { arcSubmit(); return; }
      render();
    },
    "arc-submit": () => arcSubmit(),
    "arc-bet": (el) => arcSubmit({ bet: Number(el.dataset.bet) }),
    "arc-strike": (el) => {
      const a = S.arc;
      if (!a || a.phase !== "strike") return;
      const orig = a.orders[arcQ().id][Number(el.dataset.pos)];
      if (a.struck.includes(orig)) a.struck = a.struck.filter((x) => x !== orig);
      else if (a.struck.length < 2) a.struck.push(orig);
      render();
    },
    "arc-strike-go": () => {
      const a = S.arc;
      if (!a || a.struck.length !== 2) return;
      const q = arcQ();
      if (a.struck.includes(q.a)) { arcSubmit({ chosen: null, clean: false }); return; }
      a.phase = "pick";
      render();
    },
    "arc-reveal": () => { if (S.arc) { S.arc.phase = ""; S.arc.shownAt = Date.now(); render(); } },
    "arc-recall": (el) => {
      const a = S.arc;
      if (!a || a.recall !== undefined) return;
      const yes = el.dataset.v === "1";
      a.recall = yes;
      const ans = a.answers[a.answers.length - 1];
      ans.recall = yes;
      S.game.recall = [S.game.recall[0] + 1, S.game.recall[1] + (yes && ans.correct ? 1 : 0)];
      const bonus = yes && ans.correct ? 5 : 0;
      a.xp += bonus;
      saveArc();
      reward(bonus);
      render();
    },
    "arc-next": () => arcNext(),
    "arc-end": () => {
      const a = S.arc;
      if (!a) return;
      if (!a.answers.length && !(a.results && a.results.length)) { S.arc = null; saveArc(); render(); return; }
      arcFinish("ended");
    },
    "arc-close": () => { S.arc = null; saveArc(); S.tool.mode = "arcade"; render(); window.scrollTo(0, 0); },
    "arc-retry": () => {
      const ids = S.arc.answers.filter((x) => !x.correct).map((x) => x.id);
      S.arc = null;
      saveArc();
      startRun(Engine.shuffle(ids.map(byId).filter(Boolean)), "Arcade misses");
    },
    "seq-place": (el) => {
      const a = S.arc;
      const i = Number(el.dataset.i);
      if (!a || a.checked || a.placed.includes(i)) return;
      a.placed.push(i);
      saveArc();
      render();
    },
    "seq-unplace": (el) => {
      const a = S.arc;
      if (!a || a.checked) return;
      a.placed.splice(Number(el.dataset.i), 1);
      render();
    },
    "seq-check": () => seqCheck(),
    "drill-next": () => drillNext(),
    "match-term": (el) => {
      const a = S.arc;
      const i = Number(el.dataset.i);
      a.selTerm = a.selTerm === i ? null : i;
      a.miss = null;
      matchTry();
    },
    "match-def": (el) => {
      const a = S.arc;
      const i = Number(el.dataset.i);
      a.selDef = a.selDef === i ? null : i;
      a.miss = null;
      matchTry();
    },
  };

  // ---------------------------------------------------------------- Oracle
  // A tarot of the collective unconscious. Each of the 22 Major Arcana is an
  // archetype carrying a cluster of exam objectives, with a strange dream
  // vision whose images encode the facts (bizarre images are remembered far
  // better than plain ones). A card's state comes from your latest answers
  // on its objectives; a card you are failing is drawn upside down. Each day
  // brings a three-card reading, and your weakest card becomes your Shadow.
  const ARCANA = BANK.arcana || [];
  const SLOTS = ["Past", "Present", "Future"];
  const SLOT_NOTES = ["what you have integrated", "what is in motion", "what is coming for you"];
  const defaultOracle = () => ({ v: 1, readings: {}, shadows: { attempts: 0, wins: {} }, updatedAt: 0 });
  S.oracle = defaultOracle();
  S.orc = { view: "altar" };

  function saveOracle() {
    S.oracle.updatedAt = Date.now();
    Store.setDoc("me/oracle", S.oracle);
  }
  const saveOrc = () => lsSet(LS + "orc", S.orc);
  const cardByN = (n) => ARCANA.find((c) => c.n === n);
  const masteries = () => ARCANA.map((c) => Engine.cardMastery(c, CURATED, S.progress.p));
  const currentShadow = (ms = masteries()) => Engine.shadowCard(ms, todayKey());
  const STATE_LABEL = { veiled: "Veiled", upright: "Upright", wavering: "Wavering", reversed: "Reversed" };
  const STATE_NOTE = { veiled: "fewer than 3 answers on its objectives", upright: "75% or more right on your latest tries", wavering: "between 50% and 75% right", reversed: "under half right on your latest tries" };

  // Today's reading, drawn once and then fixed for the day.
  function todayReading(create = true) {
    const key = todayKey();
    let r = S.oracle.readings[key];
    if (!r && create && ARCANA.length === 22) {
      const ms = masteries();
      r = { cards: Engine.dailySpread(ms, key, currentShadow(ms)), flipped: [false, false, false], qids: [null, null, null], results: [null, null, null], oracle: null };
      S.oracle.readings[key] = r;
      saveOracle();
    }
    return r;
  }
  const readingDone = (r) => !!r && r.results.every((x) => x != null);
  const readingsCompleted = () => Object.values(S.oracle.readings).filter(readingDone).length;

  function cardArt(card, { state = "upright", uid = "", cls = "", gilded = false } = {}) {
    return `<span class="tarot-wrap ${cls} st-${state}">${Engine.cardSvg(card, { reversed: state === "reversed", gilded, uid })}</span>`;
  }

  // The Today screen's invitation.
  function todayOracle() {
    if (ARCANA.length !== 22) return "";
    const r = todayReading(false);
    const ms = masteries();
    const sh = currentShadow(ms);
    const shadow = sh != null ? cardByN(sh) : null;
    const right = r ? r.results.filter((x) => x === true).length : 0;
    const status = !r || !r.flipped.some(Boolean)
      ? "Three cards are waiting, drawn from your own answers."
      : readingDone(r) ? `Reading complete: ${right} of 3 prophecies held.` : `${r.results.filter((x) => x != null).length} of 3 prophecies answered.`;
    const minis = [0, 1, 2].map((i) => {
      const flipped = r && r.flipped[i];
      const card = flipped ? cardByN(r.cards[i]) : null;
      const st = flipped && r.results[i] === false ? "reversed" : "upright";
      return `<span class="mini">${flipped ? cardArt(card, { state: st, uid: "t" + i }) : cardArt(null, { uid: "tb" + i })}</span>`;
    }).join("");
    return `<section class="altar today-oracle stack-sm">
      <button type="button" class="oracle-link" data-act="tab" data-tab="oracle" aria-label="Open the Oracle">
        <span class="minis">${minis}</span>
        <span class="stack-sm grow">
          <span class="eyebrow">The Oracle · daily reading</span>
          <b>${esc(status)}</b>
          <span class="small">${shadow ? `Your Shadow: <b>${esc(shadow.name)}</b>, ${esc(shadow.concept.toLowerCase())}.` : "Your Shadow hides until you have answered 20 questions."}</span>
        </span>
        <span class="go" aria-hidden="true">›</span>
      </button>
    </section>`;
  }

  function viewOracle() {
    if (ARCANA.length !== 22) return `<div class="stack"><h2>The Oracle</h2><p class="muted">The deck is not complete in this build.</p></div>`;
    const v = S.orc.view;
    if (v === "card") return viewOracleCard();
    if (v === "prophecy" || v === "shadow") return viewOracleQuestion();
    return viewAltar();
  }

  function viewAltar() {
    const r = todayReading();
    const ms = masteries();
    const sh = currentShadow(ms);
    const shadow = sh != null ? cardByN(sh) : null;
    const shM = sh != null ? ms[sh] : null;
    const wins = S.oracle.shadows.wins || {};
    const right = r.results.filter((x) => x === true).length;
    // The card turned since the last render plays its turning animation once.
    const justFlipped = S.orc.justFlipped;
    S.orc.justFlipped = null;
    const slot = (i) => {
      const card = cardByN(r.cards[i]);
      const res = r.results[i];
      if (!r.flipped[i]) {
        return `<div class="slot"><p class="slot-label">${SLOTS[i]}</p>
          <button type="button" class="card-btn" data-act="orc-flip" data-i="${i}" aria-label="Turn over the ${SLOTS[i]} card">${cardArt(null, { uid: "b" + i, cls: "breathe" })}</button>
          <p class="slot-note">${SLOT_NOTES[i]}</p></div>`;
      }
      const st = res === false ? "reversed" : "upright";
      return `<div class="slot"><p class="slot-label">${SLOTS[i]}</p>
        <button type="button" class="card-btn" data-act="orc-read" data-i="${i}" aria-label="${esc(card.name)}: ${res == null ? "answer its prophecy" : res ? "prophecy held" : "reversed"}">${cardArt(card, { state: st, uid: "s" + i, cls: justFlipped === i ? "flip-in" : res == null ? "glow" : "" })}</button>
        <p class="slot-name">${esc(card.name)}</p>
        <p class="slot-note">${res == null ? `<span class="chip ochre">Answer its prophecy</span>` : res ? `<span class="chip good">Prophecy held</span>` : `<span class="chip bad">Reversed</span>`}</p></div>`;
    };
    const done = readingDone(r);
    const deck = ARCANA.map((c) => {
      const m = ms[c.n];
      const gilded = !!wins[c.n];
      return `<button type="button" class="deck-card" data-act="orc-card" data-n="${c.n}" aria-label="${esc(c.name)}, ${STATE_LABEL[m.state]}${gilded ? ", integrated Shadow" : ""}${c.n === sh ? ", your Shadow" : ""}">
        ${cardArt(c, { state: m.state, uid: "d", gilded, cls: c.n === sh ? "is-shadow" : "" })}
        <span class="deck-label">${esc(STATE_LABEL[m.state])}</span>
      </button>`;
    }).join("");
    const counts = ms.reduce((o, m) => ((o[m.state] = (o[m.state] || 0) + 1), o), {});
    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">The Oracle</p>
        <h2>${done ? `Today's reading: ${right} of 3 prophecies held` : "Today's reading"}</h2>
        <p class="muted measure">Twenty-two archetypes hold the whole exam. Today's three were drawn from your own answers: the Past from what you have mastered, the Present from what is in motion, the Future from what you are weakest on. Turn each card, read its dream, then answer its prophecy.</p>
      </section>
      <section class="altar">
        <div class="spread">${[0, 1, 2].map(slot).join("")}</div>
        ${done ? oraclePanel(r) : ""}
        ${done ? `<p class="small oracle-note">Tonight, sleep on it: read <a href="#" data-act="orc-card" data-n="${r.cards[2]}">${esc(cardByN(r.cards[2]).name)}</a>'s vision once more before bed. Memories settle while you sleep, and strange ones settle best.</p>` : ""}
      </section>
      <section class="stack">
        <h3>Your Shadow</h3>
        ${shadow ? `<div class="altar shadow-row">
            <button type="button" class="card-btn shadow-card" data-act="orc-card" data-n="${shadow.n}" aria-label="${esc(shadow.name)}, your Shadow">${cardArt(shadow, { state: shM.state, uid: "sh", cls: "is-shadow" })}</button>
            <div class="stack-sm">
              <p class="eyebrow">${esc(shadow.archetype)}</p>
              <p><b>${esc(shadow.name)}</b>: ${esc(shadow.concept)}</p>
              <p class="small">Your weakest card: <span class="num">${shM.seen ? `${Math.round(shM.rate * 100)}% right on your latest ${shM.seen} answers` : ""}</span>. In Jung's terms, the Shadow is what you avoid looking at. Face it: seven questions, and five right integrates it.</p>
              <div class="row"><button type="button" class="btn btn-primary" data-act="orc-shadow">Confront your Shadow</button></div>
              ${Object.keys(wins).length ? `<p class="small">Integrated so far: ${Object.keys(wins).map((n) => esc(cardByN(Number(n)).name)).join(", ")}.</p>` : ""}
            </div>
          </div>`
          : `<p class="note small">Your Shadow hides until you have answered 20 questions. It will be the card whose objectives you get wrong most often.</p>`}
      </section>
      <section class="stack">
        <div class="stack-sm"><h3>The deck</h3><p class="small muted num">${counts.upright || 0} upright · ${counts.wavering || 0} wavering · ${counts.reversed || 0} reversed · ${counts.veiled || 0} veiled</p></div>
        <div class="deck">${deck}</div>
        <p class="small muted">Upright: 75% or more right on your latest tries. Reversed, drawn upside down: under half. Veiled: fewer than three answers yet. A gold border marks a Shadow you have integrated. Tap any card to read it.</p>
      </section>
    </div>`;
  }

  function oraclePanel(r) {
    const o = r.oracle;
    const busy = S.orc.consulting;
    if (o) {
      return `<div class="oracle-says stack-sm">
        <p class="eyebrow">The Oracle speaks</p>
        <p class="prophecy">${esc(o.prophecy)}</p>
        ${o.ritual && o.ritual.length ? `<p class="eyebrow">Your ritual for the next day</p><ol class="list-plain">${o.ritual.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
        ${o.mantra ? `<p class="mantra">“${esc(o.mantra)}”</p>` : ""}
      </div>`;
    }
    if (!S.sample) return `<p class="small oracle-quiet oracle-note">The Oracle speaks when this page is opened in Claude and allowed to use it.</p>`;
    return `<div class="row oracle-note" style="justify-content:center"><button type="button" class="btn btn-gold" data-act="orc-consult" ${busy ? "disabled" : ""}>${busy ? "The Oracle is reading…" : "Ask the Oracle to read your spread"}</button></div>
      ${S.orc.consultErr ? `<p class="small oracle-quiet">${esc(S.orc.consultErr)}</p>` : ""}`;
  }

  async function consultOracle() {
    const r = todayReading(false);
    if (!S.sample || !r || S.orc.consulting) return;
    S.orc.consulting = true;
    S.orc.consultErr = "";
    render();
    const ms = masteries();
    const sh = currentShadow(ms);
    const stats = curatedStats();
    const left = daysLeft();
    const lines = r.cards.map((n, i) => {
      const c = cardByN(n);
      return `${SLOTS[i]}: ${c.name} (${c.concept}; objectives ${c.objectives.join(", ")}) - prophecy question answered ${r.results[i] ? "correctly" : "wrongly"}`;
    }).join("\n");
    const weak = weakObjectives(4).map((w) => `${w.obj} ${objName(w.obj)} (${w.right}/${w.seen})`).join("; ") || "not enough data yet";
    const prompt = `You are the Oracle in a CISSP study app's tarot mode: a deck of the 22 Major Arcana where each card is a Jungian archetype carrying a cluster of exam objectives (ISC2 CISSP outline, April 2024). Speak in a brief, archetypal, slightly uncanny voice, as the collective memory of every candidate who sat this exam before, but every sentence must carry concrete, correct CISSP advice. No fortune-telling beyond the study plan; no flattery.

The candidate's exam is ${left != null && left > 0 ? `in ${left} days` : "soon"}.
Today's spread:
${lines}
Their Shadow (weakest card): ${sh != null ? `${cardByN(sh).name} (${cardByN(sh).concept})` : "not yet revealed"}.
Weakest objectives (latest answers right/answered): ${weak}.
First-try accuracy by domain: ${stats.map((s) => `D${s.n} ${s.seen ? Math.round(s.firstRate * 100) + "%" : "unseen"}`).join(", ")}.

Return JSON only, in this shape:
{"prophecy": "three sentences reading the spread as the story of their preparation, naming the cards and what each means for them", "ritual": ["exactly three specific study actions for the next 24 hours, each under 22 words, naming objectives or topics"], "mantra": "one line of CISSP mindset, under 14 words"}`;
    try {
      const out = await S.sample.json(prompt, { cache: false });
      if (!out || typeof out.prophecy !== "string") throw { code: "invalid_json" };
      r.oracle = {
        prophecy: String(out.prophecy).slice(0, 700),
        ritual: (Array.isArray(out.ritual) ? out.ritual : []).slice(0, 3).map((x) => String(x).slice(0, 200)),
        mantra: String(out.mantra || "").slice(0, 140),
      };
      saveOracle();
      reward(10);
    } catch (e) {
      S.orc.consultErr = sampleError(e);
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
    }
    S.orc.consulting = false;
    render();
  }

  function viewOracleCard() {
    const card = cardByN(S.orc.card);
    const m = Engine.cardMastery(card, CURATED, S.progress.p);
    const gilded = !!(S.oracle.shadows.wins || {})[card.n];
    const objStats = card.objectives.map((o) => {
      let seen = 0, right = 0, total = 0;
      for (const q of CURATED) if (q.obj === o) { total++; const r = S.progress.p[q.id]; if (r) { seen++; right += r[3]; } }
      return `<li><span class="mono">${o}</span> ${esc(objName(o))} <span class="muted num">· ${seen ? `${right}/${seen} right` : `${total} questions, none answered`}</span></li>`;
    }).join("");
    return `<div class="stack-lg">
      <button type="button" class="btn btn-quiet" style="align-self:flex-start" data-act="orc-home">‹ The Oracle</button>
      <section class="altar card-hero">
        ${cardArt(card, { state: m.state, uid: "big", gilded, cls: "big" })}
        <div class="stack-sm hero-text">
          <p class="eyebrow">${esc(card.numeral)} · ${esc(card.archetype)}</p>
          <h2>${esc(card.name)}</h2>
          <p>${esc(card.concept)}</p>
          <p class="small"><span class="chip ${m.state === "upright" ? "good" : m.state === "reversed" ? "bad" : m.state === "wavering" ? "ochre" : ""}">${STATE_LABEL[m.state]}</span> <span class="oracle-quiet">${esc(STATE_NOTE[m.state])}</span></p>
        </div>
      </section>
      <section class="stack-sm">
        <p class="eyebrow">The vision</p>
        <p class="vision">${esc(card.vision)}</p>
      </section>
      <section class="stack-sm">
        <p class="eyebrow">Decoding the dream</p>
        <ul class="decode">${card.decode.map((d) => { const [img, fact] = d.split("→"); return `<li><b>${esc(img.trim())}</b><span>${esc((fact || "").trim())}</span></li>`; }).join("")}</ul>
      </section>
      <div class="meanings">
        <div class="card stack-sm"><p class="eyebrow">Upright</p><p>${esc(card.upright)}</p></div>
        <div class="card stack-sm"><p class="eyebrow">Reversed</p><p>${esc(card.reversed)}</p></div>
      </div>
      <section class="stack-sm">
        <p class="eyebrow">Three truths</p>
        <ol class="list-plain">${card.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ol>
      </section>
      <section class="collective">
        <p class="eyebrow">The collective remembers</p>
        <p>${esc(card.trap)}</p>
      </section>
      <section class="stack-sm">
        <p class="eyebrow">The objectives it carries</p>
        <ul class="list-plain small">${objStats}</ul>
      </section>
      <div class="row">
        <button type="button" class="btn btn-primary" data-act="orc-draw" data-n="${card.n}">Draw a prophecy</button>
        <button type="button" class="btn" data-act="orc-drill" data-n="${card.n}">Drill its objectives</button>
      </div>
    </div>`;
  }

  // ---- prophecies: one question tied to a card, from a reading, a single draw or the Shadow
  function startProphecy(ctx, cardN, slot = null) {
    const card = cardByN(cardN);
    const r = todayReading(false);
    let qid = null;
    if (ctx === "reading" && r) {
      qid = r.qids[slot];
      if (!qid || !byId(qid)) {
        const q = Engine.cardQuestion(card, CURATED, S.progress.p, `${todayKey()}:${slot}`, r.qids.filter(Boolean));
        qid = q && q.id;
        r.qids[slot] = qid;
        saveOracle();
      }
    } else {
      const used = ctx === "shadow" ? S.orc.shadow.used : [];
      const q = Engine.cardQuestion(card, CURATED, S.progress.p, `${uid()}`, used);
      qid = q && q.id;
    }
    if (!qid) { toast("No questions left for this card."); return; }
    Object.assign(S.orc, { view: ctx === "shadow" ? "shadow" : "prophecy", ctx, card: cardN, slot, qid, order: Engine.shuffle([0, 1, 2, 3]), selected: null, submitted: false, chosen: null, shownAt: Date.now() });
    if (ctx === "shadow") S.orc.shadow.used.push(qid);
    saveOrc();
    render();
    window.scrollTo(0, 0);
  }

  function orcSubmit() {
    const o = S.orc;
    if (o.submitted || o.selected == null) return;
    const q = byId(o.qid);
    const chosen = o.order[o.selected];
    const correct = chosen === q.a;
    o.submitted = true;
    o.chosen = chosen;
    o.correct = correct;
    S.progress.p[q.id] = Engine.record(S.progress.p[q.id], correct, Date.now());
    countAnswer(correct);
    saveProgress();
    let xp = Engine.xpFor(correct, q.diff);
    if (o.ctx === "reading") {
      const r = todayReading(false);
      r.results[o.slot] = correct;
      if (readingDone(r)) xp += 30;
      saveOracle();
    } else if (o.ctx === "shadow") {
      o.shadow.results.push(correct);
    }
    saveOrc();
    reward(xp);
    render();
  }

  function shadowFinished(sh) {
    return sh.results.length >= 7 || sh.results.filter((x) => !x).length > 2;
  }

  function orcNext() {
    const o = S.orc;
    if (o.ctx === "shadow") {
      const sh = o.shadow;
      if (!shadowFinished(sh)) { startProphecy("shadow", sh.card); return; }
      const right = sh.results.filter(Boolean).length;
      sh.done = true;
      sh.won = right >= 5;
      S.oracle.shadows.attempts = (S.oracle.shadows.attempts || 0) + 1;
      if (sh.won) S.oracle.shadows.wins[sh.card] = Date.now();
      saveOracle();
      o.view = "shadow";
      saveOrc();
      reward(sh.won ? 60 : 10);
      render();
      window.scrollTo(0, 0);
      return;
    }
    if (o.ctx === "reading") {
      const r = todayReading(false);
      const next = [0, 1, 2].find((i) => r.results[i] == null);
      o.view = "altar";
      if (next != null && !r.flipped[next]) { r.flipped[next] = true; o.justFlipped = next; saveOracle(); }
    } else o.view = o.ctx === "single" ? "card" : "altar";
    saveOrc();
    render();
    window.scrollTo(0, 0);
  }

  function viewOracleQuestion() {
    const o = S.orc;
    const card = cardByN(o.card);
    if (o.ctx === "shadow" && o.shadow && o.shadow.done) return viewShadowEnd();
    const q = byId(o.qid);
    if (!q) { o.view = "altar"; return viewAltar(); }
    const turned = o.submitted && !o.correct;
    const head = o.ctx === "shadow"
      ? `<div class="darkness" aria-label="${o.shadow.results.filter(Boolean).length} lights of 7">${Array.from({ length: 7 }, (_, i) => `<i class="${o.shadow.results[i] === true ? "lit" : o.shadow.results[i] === false ? "out" : ""}"></i>`).join("")}</div>`
      : `<span class="chip">${o.ctx === "reading" ? `${SLOTS[o.slot]} card` : "A single draw"}</span>`;
    return `<div class="stack">
      <section class="altar prophecy-head">
        ${cardArt(card, { state: turned ? "reversed" : "upright", uid: "q", cls: (o.ctx === "shadow" ? "is-shadow " : "") + (o.submitted ? (o.correct ? "glow" : "turn") : "") })}
        <div class="stack-sm">
          <p class="eyebrow">${o.ctx === "shadow" ? "Confronting your Shadow" : "The prophecy of"}</p>
          <h3>${esc(card.name)}</h3>
          ${head}
          ${o.ctx !== "shadow" && !o.submitted ? `<details class="small"><summary>Read the vision first</summary><p class="vision">${esc(card.vision)}</p></details>` : ""}
        </div>
      </section>
      <div class="row"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span>${diffDots(q.diff)}</div>
      <p class="stem">${esc(q.q)}</p>
      ${o.submitted ? `<div class="verdict ${o.correct ? "good" : "bad"}">${o.ctx === "shadow" ? (o.correct ? "A light in the dark" : "The dark gains ground") : o.correct ? "The prophecy holds" : "The card turns"}</div>` : ""}
      ${optionList(q, o.order, { selected: o.selected, submitted: o.submitted, chosenOrig: o.chosen, act: "orc-select" })}
      ${o.submitted ? `
        <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
        ${o.correct ? "" : `<section class="collective"><p class="eyebrow">The collective remembers</p><p>${esc(card.trap)}</p></section>`}
        ${flagNote(q.id)}` : ""}
    </div>
    <div class="actionbar"><div class="actionbar-inner">
      <button type="button" class="btn btn-quiet" data-act="orc-leave">${o.ctx === "shadow" ? "Flee" : "Back"}</button><span class="grow"></span>
      ${o.submitted
        ? `<button type="button" class="btn btn-primary" data-act="orc-next" style="min-width:150px">${o.ctx === "shadow" ? (shadowFinished(o.shadow) ? "See the outcome" : "Next question") : o.ctx === "reading" ? "Back to the spread" : "Back to the card"}</button>`
        : `<button type="button" class="btn btn-primary" data-act="orc-submit" style="min-width:150px" ${o.selected == null ? "disabled" : ""}>Answer</button>`}
    </div></div>`;
  }

  function viewShadowEnd() {
    const sh = S.orc.shadow;
    const card = cardByN(sh.card);
    const right = sh.results.filter(Boolean).length;
    return `<div class="stack-lg">
      <section class="altar card-hero">
        ${cardArt(card, { state: sh.won ? "upright" : "reversed", uid: "end", gilded: sh.won, cls: "big " + (sh.won ? "glow" : "is-shadow") })}
        <div class="stack-sm hero-text">
          <p class="eyebrow">${sh.won ? "Shadow integrated" : "The Shadow endures"}</p>
          <h2>${esc(card.name)}</h2>
          <p class="num">${right} of ${sh.results.length} right</p>
          <p class="small">${sh.won ? "What you avoided is now part of you. Its gold border stays in your deck. If it becomes your weakest card again, it will return." : "Three misses and the dark wins this round. Read the card's vision and its traps, drill its objectives, and face it again."}</p>
        </div>
      </section>
      <section class="collective"><p class="eyebrow">The collective remembers</p><p>${esc(card.trap)}</p></section>
      <div class="row">
        <button type="button" class="btn btn-primary" data-act="orc-home">Back to the Oracle</button>
        <button type="button" class="btn" data-act="orc-card" data-n="${card.n}">Read the card</button>
        ${sh.won ? "" : `<button type="button" class="btn" data-act="orc-drill" data-n="${card.n}">Drill its objectives</button>`}
      </div>
    </div>`;
  }

  const oracleActions = {
    "orc-flip": (el) => {
      const r = todayReading();
      const i = Number(el.dataset.i);
      // Cards turn in order: the Past first, then the Present, then the Future.
      const first = r.flipped.indexOf(false);
      if (i !== first) { toast(`Turn the ${SLOTS[first]} card first.`); return; }
      r.flipped[i] = true;
      S.orc.justFlipped = i;
      saveOracle();
      render();
    },
    "orc-read": (el) => {
      const r = todayReading();
      const i = Number(el.dataset.i);
      if (r.results[i] != null) { S.orc = { view: "card", card: r.cards[i], from: "altar" }; saveOrc(); render(); window.scrollTo(0, 0); return; }
      startProphecy("reading", r.cards[i], i);
    },
    "orc-card": (el) => { S.orc = { view: "card", card: Number(el.dataset.n) }; saveOrc(); render(); window.scrollTo(0, 0); },
    "orc-home": () => { S.orc = { view: "altar" }; saveOrc(); render(); window.scrollTo(0, 0); },
    "orc-draw": (el) => startProphecy("single", Number(el.dataset.n)),
    "orc-drill": (el) => {
      const card = cardByN(Number(el.dataset.n));
      const objs = new Set(card.objectives);
      const rank = (q) => { const r = S.progress.p[q.id]; return !r ? 1 : r[3] === 0 ? 0 : 2; };
      const items = CURATED.filter((q) => objs.has(q.obj)).sort((a, b) => rank(a) - rank(b) || Math.random() - 0.5).slice(0, 15);
      S.orc = { view: "card", card: card.n };
      saveOrc();
      startRun(Engine.shuffle(items), card.name);
    },
    "orc-shadow": () => {
      const sh = currentShadow();
      if (sh == null) return;
      S.orc = { view: "shadow", shadow: { card: sh, used: [], results: [], done: false } };
      startProphecy("shadow", sh);
    },
    "orc-select": (el) => {
      if (S.orc.submitted) return;
      S.orc.selected = Number(el.dataset.pos);
      if (!S.profile.confirm) { orcSubmit(); return; }
      render();
    },
    "orc-submit": () => orcSubmit(),
    "orc-next": () => orcNext(),
    "orc-leave": () => {
      const o = S.orc;
      S.orc = o.ctx === "single" ? { view: "card", card: o.card } : { view: "altar" };
      saveOrc();
      render();
      window.scrollTo(0, 0);
    },
    "orc-consult": () => consultOracle(),
  };

  // ---------------------------------------------------------------- flags
  function toggleFlag(id) {
    if (S.flags[id]) {
      delete S.flags[id];
      Store.remove("flags", id);
      toast("Flag removed");
    } else {
      const f = { id, note: "", ts: Date.now() };
      S.flags[id] = f;
      Store.put("flags", id, f);
      toast("Flagged. It will appear under Practice › Flagged.");
    }
    render();
  }

  // ---------------------------------------------------------------- events
  const actions = {
    ...arcActions,
    ...oracleActions,
    tab: (el) => go(el.dataset.tab),
    "start-smart": (el) => startSmart(Number(el.dataset.count) || 20),
    "start-review": () => startSmart(40, { reviewOnly: true }),
    "start-missed": () => {
      const items = Object.entries(S.progress.p).filter(([id, r]) => r[3] === 0 && byId(id)).map(([id]) => byId(id));
      startRun(Engine.shuffle(items).slice(0, 60), "Missed questions");
    },
    "start-flagged": () => startRun(Engine.shuffle(Object.keys(S.flags).map(byId).filter(Boolean)), "Flagged questions"),
    "start-generated": () => {
      const items = S.generated.slice().sort((a, b) => {
        const ra = S.progress.p[a.id], rb = S.progress.p[b.id];
        return (ra ? 1 : 0) - (rb ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0);
      });
      startRun(items.slice(0, 20), "Fresh questions");
    },
    "toggle-domain": (el) => {
      const n = Number(el.dataset.d);
      const t = S.tool;
      t.domains = t.domains.includes(n) ? t.domains.filter((x) => x !== n) : t.domains.concat(n).sort();
      render();
    },
    "set-count": (el) => { S.tool.count = Number(el.dataset.n); render(); },
    "start-domains": () => startSmart(S.tool.count || 20, { domains: S.tool.domains }),
    "domain-practice": (el) => startSmart(20, { domains: [Number(el.dataset.d)] }),
    "start-objective": (el) => {
      const obj = el.dataset.obj;
      const rank = (q) => {
        const r = S.progress.p[q.id];
        return !r ? 1 : r[3] === 0 ? 0 : 2;
      };
      const items = allQuestions().filter((q) => q.obj === obj).sort((a, b) => rank(a) - rank(b) || Math.random() - 0.5).slice(0, 15);
      startRun(Engine.shuffle(items), `Objective ${obj}`);
    },
    select: (el) => {
      if (!S.run || S.run.submitted) return;
      S.run.selected = Number(el.dataset.pos);
      if (!S.profile.confirm) { submitAnswer(); return; }
      render();
    },
    submit: () => submitAnswer(),
    next: () => nextQuestion(),
    "end-run": () => finishRun(),
    "close-run": () => { S.run = null; saveRun(); go("today"); },
    "retry-missed": () => {
      const ids = S.run.answers.filter((a) => !a.correct).map((a) => a.id);
      startRun(Engine.shuffle(ids.map(byId).filter(Boolean)), "Retry missed");
    },
    flag: (el) => toggleFlag(el.dataset.id),
    study: (el) => {
      const from = S.tab;
      S.tab = "library";
      S.sub = { qid: el.dataset.id, from, prev: S.sub };
      render();
      window.scrollTo(0, 0);
    },
    "lib-back": () => {
      const from = S.sub && S.sub.from;
      const prev = S.sub && S.sub.prev;
      if (from && from !== "library") { S.tab = from; S.sub = null; }
      else S.sub = prev || null;
      render();
    },
    lib: (el, ev) => {
      if (ev) ev.preventDefault();
      S.tab = "library";
      S.sub = el.dataset.sub ? { name: el.dataset.sub } : null;
      render();
      window.scrollTo(0, 0);
    },
    "lib-kp": (el) => { S.sub = { name: "keypoints", d: Number(el.dataset.d) }; render(); },
    "lib-browse": (el) => { S.sub = { name: "browse", d: Number(el.dataset.d) }; render(); },
    ask: (el) => askClaude(el.dataset.prompt),
    "ask-stop": () => { if (S.ask && S.ask.ctl) S.ask.ctl.abort(); },
    generate: () => generate(),
    "start-mock": (el) => startMock(el.dataset.form),
    "mock-select": (el) => { if (S.mock) { S.mock.selected = Number(el.dataset.pos); render(); } },
    "mock-next": () => mockAnswer(),
    "mock-pause": () => {
      const m = S.mock;
      if (!m) return;
      m.elapsed = mockElapsed(m);
      m.paused = true;
      m.savedAt = Date.now();
      saveMock();
      render();
    },
    "mock-resume": () => {
      const m = S.mock;
      if (!m) return;
      m.paused = false;
      m.resumedAt = Date.now();
      m.current.shownAt = Date.now();
      S.tool.armDiscard = false;
      saveMock();
      render();
    },
    "mock-finish-now": () => finishMock("early"),
    "mock-discard": () => {
      if (!S.tool.armDiscard) { S.tool.armDiscard = true; render(); return; }
      S.tool.armDiscard = false;
      S.mock = null;
      saveMock();
      render();
    },
    "mock-review-toggle": () => { S.sub = { review: !(S.sub && S.sub.review) }; render(); },
    "open-mock": (el) => { S.mockResult = S.sessions.find((s) => s.id === el.dataset.id) || null; S.sub = null; render(); window.scrollTo(0, 0); },
    "close-mock-result": () => { S.mockResult = null; S.sub = null; render(); },
    "practise-mock-misses": () => {
      const ids = S.mockResult.items.filter((x) => !x[1]).map((x) => x[0]);
      S.mockResult = null;
      startRun(Engine.shuffle(ids.map(byId).filter(Boolean)), "Mock exam misses");
    },
    rate: (el) => {
      const n = el.dataset.d, v = Number(el.dataset.v);
      S.profile.selfRatings[n] = Number(S.profile.selfRatings[n]) === v ? 0 : v;
      saveProfile();
      render();
    },
    "set-booked": (el) => { S.profile.examBooked = el.dataset.v === "1"; saveProfile(); render(); },
    "add-score": () => {
      const t = S.tool;
      const score = t.scoreValue === "" || t.scoreValue == null ? null : Math.max(0, Math.min(100, Math.round(Number(t.scoreValue))));
      if (!t.scoreSource && score == null) { toast("Add a source or a score."); return; }
      S.profile.scores.push({ id: uid(), date: t.scoreDate || todayKey(), source: (t.scoreSource || "").slice(0, 80), score, note: (t.scoreNote || "").slice(0, 200) });
      t.scoreSource = ""; t.scoreValue = ""; t.scoreNote = "";
      saveProfile();
      render();
    },
    "del-score": (el) => { S.profile.scores = S.profile.scores.filter((s) => s.id !== el.dataset.id); saveProfile(); render(); },
    "import-read": () => importRead(),
    "import-apply": () => importApply(),
    "import-cancel": () => { S.tool.importPreview = null; render(); },
    "copy-data": async () => {
      const data = JSON.stringify({ profile: S.profile, progress: S.progress, game: S.game, oracle: S.oracle, sessions: S.sessions, flags: S.flags, generated: S.generated }, null, 1);
      try {
        await navigator.clipboard.writeText(data);
        toast("Copied your data to the clipboard");
      } catch {
        toast("Copying isn't allowed here.");
      }
    },
    reset: () => {
      if (!S.tool.armReset) { S.tool.armReset = true; render(); return; }
      S.tool.armReset = false;
      S.progress = { p: {}, days: {}, updatedAt: Date.now() };
      saveProgress();
      for (const s of S.sessions) Store.remove("sessions", s.id);
      S.sessions = [];
      S.run = null;
      saveRun();
      S.game = { ...defaultGame(), resetAt: Date.now() };
      saveGame();
      S.arc = null;
      saveArc();
      S.oracle = { ...defaultOracle(), resetAt: Date.now() };
      saveOracle();
      S.orc = { view: "altar" };
      saveOrc();
      toast("Progress erased");
      render();
    },
  };

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (!fn) return;
    if (el.tagName === "A") ev.preventDefault();
    if (el.dataset.act !== "reset" && S.tool.armReset) S.tool.armReset = false;
    fn(el, ev);
  });

  let noteTimer = 0;
  document.addEventListener("input", (ev) => {
    const el = ev.target;
    const f = el.dataset && el.dataset.field;
    if (!f) return;
    if (f === "note") {
      S.profile.notes[el.dataset.d] = el.value;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(saveProfile, 700);
      return;
    }
    if (f === "confirm") { S.profile.confirm = el.checked; saveProfile(); return; }
    if (f === "flagNote") {
      const flag = S.flags[el.dataset.id];
      if (!flag) return;
      flag.note = el.value.slice(0, 300);
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => Store.put("flags", flag.id, flag), 700);
      return;
    }
    if (["examDate", "dailyGoal"].includes(f)) return; // saved on change
    S.tool[f] = el.value;
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    const f = el.dataset && el.dataset.field;
    if (!f) return;
    if (f === "examDate") { if (parseDate(el.value)) { S.profile.examDate = el.value; saveProfile(); render(); } return; }
    if (f === "dailyGoal") { const v = Math.max(5, Math.min(150, Math.round(Number(el.value) || 30))); S.profile.dailyGoal = v; saveProfile(); render(); return; }
    if (f === "genDomain") { S.tool.genDomain = Number(el.value); S.tool.genObj = ""; render(); return; }
    if (f === "genObj") { S.tool.genObj = el.value; return; }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest && ev.target.closest("input, textarea, select")) {
      if (ev.key === "Enter" && ev.target.id === "ask-input") { ev.preventDefault(); askClaude(); }
      return;
    }
    const k = ev.key.toLowerCase();
    const pos = ["a", "b", "c", "d"].indexOf(k) >= 0 ? ["a", "b", "c", "d"].indexOf(k) : ["1", "2", "3", "4"].indexOf(k);
    const a = S.arc;
    const o = S.orc;
    if (S.tab === "oracle" && (o.view === "prophecy" || o.view === "shadow") && o.qid && !(o.shadow && o.shadow.done)) {
      if (pos >= 0 && !o.submitted) actions["orc-select"]({ dataset: { pos } });
      else if (k === "enter") { if (o.submitted) orcNext(); else orcSubmit(); }
    } else if (S.tab === "practice" && a && !a.done && a.items.length) {
      const q = arcQ();
      if (a.phase === "recall") { if (k === "enter") actions["arc-reveal"](); }
      else if (a.phase === "strike") {
        if (pos >= 0) actions["arc-strike"]({ dataset: { pos } });
        else if (k === "enter") actions["arc-strike-go"]();
      } else if (!a.submitted) {
        if (pos >= 0 && !(a.phase === "pick" && a.struck.includes(a.orders[q.id][pos]))) actions["arc-select"]({ dataset: { pos } });
        else if (k === "enter" && a.mode !== "bets") arcSubmit();
      } else if (k === "enter") arcNext();
    } else if (S.tab === "practice" && !a && S.run && !S.run.done) {
      if (pos >= 0 && !S.run.submitted) { S.run.selected = pos; if (!S.profile.confirm) submitAnswer(); else render(); }
      else if (k === "enter") { if (S.run.submitted) nextQuestion(); else submitAnswer(); }
    } else if (S.tab === "mock" && S.mock && !S.mock.paused && !S.mockResult) {
      if (pos >= 0) { S.mock.selected = pos; render(); }
      else if (k === "enter") mockAnswer();
    }
  });

  // ---------------------------------------------------------------- start
  function boot(hotData) {
    // Instant first paint from this browser's copy.
    applyLoaded({
      profile: lsGet(LS + "me/profile", null),
      progress: lsGet(LS + "me/progress", null),
      mock: lsGet(LS + "me/mock", null),
      game: lsGet(LS + "me/game", null),
      oracle: lsGet(LS + "me/oracle", null),
      sessions: Object.values(lsGet(LS + "sessions", {})),
      flags: Object.values(lsGet(LS + "flags", {})),
      generated: Object.values(lsGet(LS + "gen", {})),
    });
    const run = lsGet(LS + "run", null);
    if (run && !run.done && Array.isArray(run.items) && run.items.every((id) => byId(id))) S.run = run;
    const arc = lsGet(LS + "arc", null);
    if (arc && arc.mode && !arc.done && (arc.items || []).every((id) => byId(id))) S.arc = arc;
    const orc = lsGet(LS + "orc", null);
    if (orc && orc.view && (orc.card == null || cardByN(orc.card)) && (!orc.qid || byId(orc.qid))) S.orc = orc;
    S.tool.mode = lsGet(LS + "mode", "classic");
    if (hotData && hotData.tab) S.tab = hotData.tab;
    else S.tab = lsGet(LS + "tab", "today");
    if (S.mock && !S.mock.paused) {
      // A reload mid-exam pauses the clock rather than running it down.
      S.mock.elapsed = mockElapsed(S.mock);
      S.mock.paused = true;
    }
    render();

    Store.connect().then(async (ok) => {
      if (!ok) return;
      const data = await loadAll();
      const hadLocal = Object.keys(S.progress.p).length > 0;
      const dbEmpty = !data.progress && !data.profile;
      const before = S.mock;
      applyLoaded(data, { fromDb: dbEmpty && hadLocal });
      if (S.mock && S.mock !== before && !S.mock.paused) { S.mock.elapsed = mockElapsed(S.mock); S.mock.paused = true; }
      render();
    });

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("sample").then((sample) => {
        if (sample) { S.sample = sample; render(); }
      }).catch(() => {});
    }
  }

  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
    try { window.claude.hot.snapshot(() => ({ tab: S.tab })); } catch { /* optional */ }
  }
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === "function") window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
