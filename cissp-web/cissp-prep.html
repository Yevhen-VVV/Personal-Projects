ic Codebook (ECB)","ECB provides weak confidentiality and no integrity."],["Cipher Block Chaining (CBC)","CBC provides confidentiality only and needs a separate MAC for integrity."],["Output Feedback (OFB)","OFB is a stream mode with no built-in integrity."]],"a":0,"k":"Authenticated encryption (AEAD) modes such as GCM give confidentiality and integrity together."},{"id":"D3-043","d":3,"obj":"3.6","diff":1,"q":"Why are random salts added to passwords before hashing them?","o":[["To make the hash function run faster","Salts do not speed up hashing."],["To allow passwords to be decrypted if a user forgets one","Hashes are one-way; salting does not make them reversible."],["To defeat precomputed attacks such as rainbow tables","Correct. A unique salt makes identical passwords hash differently, so precomputed tables are useless and each hash must be attacked separately."],["To shorten stored hashes","Salting makes stored values slightly longer, not shorter."]],"a":2,"k":"Salt every password with a unique random value and use a slow password hashing function."},{"id":"D3-044","d":3,"obj":"3.6","diff":1,"q":"Why does TLS use asymmetric cryptography to establish a session key and then symmetric encryption for the data?","o":[["Symmetric is faster; asymmetric solves key exchange","Correct. This hybrid approach combines asymmetric key establishment with fast symmetric bulk encryption."],["Asymmetric ciphers do not provide confidentiality","They do, but they are slow and limited in message size, so they protect keys rather than bulk data."],["Symmetric encryption provides nonrepudiation","Symmetric encryption does not provide nonrepudiation."],["Regulations require two different algorithm types in TLS","No regulation drives this design; performance and key distribution do."]],"a":0,"k":"Hybrid cryptography: asymmetric to agree or exchange keys, symmetric for bulk data."},{"id":"D3-045","d":3,"obj":"3.6","diff":3,"q":"A web server attaches a recent, CA-signed certificate status response to its TLS handshake. What does this OCSP stapling achieve?","o":[["It lets clients skip validating the certificate chain","Clients still validate the chain to a trusted root; stapling only supplies fresh revocation status."],["It replaces revocation lists with shorter-lived certificates","Stapling delivers revocation status; it does not change how long certificates last."],["It hides the certificate from passive observers","Certificates are public; stapling does not conceal them."],["Clients get fresh revocation data without contacting the CA","Correct. The server fetches and caches the signed OCSP response, so clients skip their own lookup: faster, and the CA does not learn which sites they visit."]],"a":3,"k":"Revocation checking: CRLs (periodic lists), OCSP (online queries), OCSP stapling (the server supplies the signed response)."},{"id":"D3-046","d":3,"obj":"3.6","diff":2,"q":"Copies of encryption keys are held by a trusted third party and released only under defined conditions, such as a court order. What is this?","o":[["Key stretching","Key stretching strengthens weak keys such as passwords."],["Key rotation","Rotation replaces keys on a schedule."],["Key escrow","Correct. Escrow places keys with a third party for recovery or lawful access under agreed conditions."],["Key clustering","Key clustering is a weakness where different keys produce the same ciphertext."]],"a":2,"k":"Key escrow keeps copies of keys with a trusted party; M-of-N control can protect recovery."},{"id":"D3-047","d":3,"obj":"3.6","diff":2,"q":"Why do organizations limit how long a single encryption key is used (its cryptoperiod)?","o":[["Keys automatically stop working after about a year","Keys do not expire on their own."],["Longer keys are slower, so shorter use periods save time","Cryptoperiod is about time in use, not key length."],["Regulations require a new key for each message","Regulations may set limits, but the reason is risk."],["To limit exposure if the key is compromised","Correct. Rotating keys bounds how much data a compromised key exposes and how much ciphertext is available for cryptanalysis."]],"a":3,"k":"Key management includes generation, distribution, storage, rotation, revocation and destruction."},{"id":"D3-048","d":3,"obj":"3.6","diff":2,"q":"Which cryptographic algorithms are MOST threatened by a large-scale quantum computer running Shor's algorithm?","o":[["RSA, Diffie-Hellman and ECC","Correct. Shor's algorithm efficiently solves the factoring and discrete logarithm problems these depend on."],["Symmetric ciphers such as AES-256 and ChaCha20","Symmetric ciphers face only Grover's algorithm, which roughly halves effective key strength."],["Hash functions such as SHA-256 and SHA-3","Shor's algorithm does not apply to hash functions; Grover's algorithm only weakens them somewhat."],["One-time pads used with truly random keys","A properly used one-time pad is information-theoretically secure."]],"a":0,"k":"Quantum threat: Shor breaks today's public-key cryptography; Grover only weakens symmetric keys and hashes."},{"id":"D3-049","d":3,"obj":"3.6","diff":3,"q":"A company wants its symmetric encryption to remain strong if large quantum computers arrive. What is the BEST action?","o":[["Replace AES with RSA-4096","RSA is the algorithm quantum computers would break."],["Use AES-256 rather than AES-128","Correct. Grover's algorithm roughly halves effective key strength, so AES-256 still offers about 128-bit security."],["Switch to 3DES with three keys","3DES is deprecated and weaker than AES."],["Double-encrypt with AES-128","Double encryption is vulnerable to meet-in-the-middle attacks and adds little over a longer key."]],"a":1,"k":"Against quantum attack: use 256-bit symmetric keys and migrate public-key algorithms to post-quantum ones."},{"id":"D3-050","d":3,"obj":"3.6","diff":3,"q":"Customer records must stay confidential for fifteen years. Analysts warn that adversaries may be recording today's encrypted traffic to decrypt later with quantum computers. What should the organization prioritize?","o":[["Longer RSA keys, such as 8,192 bits, for TLS key exchange","Longer RSA keys do not resist Shor's algorithm."],["Shorter certificate lifetimes for all public web servers","Short-lived certificates do not protect recorded traffic."],["Post-quantum or hybrid key establishment, such as ML-KEM","Correct. \"Harvest now, decrypt later\" targets key exchange, so moving it to ML-KEM (FIPS 203) or a hybrid scheme comes first; so long-lived secrets need quantum-resistant key establishment first."],["Rotating symmetric session keys more often","Frequent rekeying limits how much traffic one key protects, but if the key exchange is broken later, every recorded session key can be recovered."]],"a":2,"k":"Harvest now, decrypt later: migrate key establishment for long-lived data first. NIST FIPS 203 (ML-KEM), 204 (ML-DSA), 205 (SLH-DSA)."},{"id":"D3-051","d":3,"obj":"3.6","diff":3,"q":"What does quantum key distribution (QKD) provide?","o":[["Unbreakable encryption of the data itself","QKD distributes keys; the encryption algorithm used with those keys is separate."],["Post-quantum digital signatures for software updates","QKD provides no signatures and still needs separate authentication."],["Faster key exchange over existing internet routes","QKD needs special hardware and dedicated links and is distance-limited."],["Key exchange in which eavesdropping can be detected","Correct. Measuring quantum states changes them, so an interceptor reveals itself."]],"a":3,"k":"QKD detects eavesdropping during key exchange; it needs special links and authenticated channels, and is named in the 2024 outline."},{"id":"D3-052","d":3,"obj":"3.6","diff":1,"q":"Which hash function property means it is infeasible to find any two different inputs that produce the same output?","o":[["Preimage resistance","Preimage resistance means you cannot find an input that produces a given hash."],["Collision resistance","Correct. Collision resistance means you cannot find any pair of inputs with the same hash."],["The avalanche effect","The avalanche effect means a small change in input changes the output a lot."],["Determinism","Determinism means the same input always gives the same output."]],"a":1,"k":"Hash properties: preimage resistance, second-preimage resistance, collision resistance."},{"id":"D3-053","d":3,"obj":"3.6","diff":1,"q":"Why is elliptic curve cryptography popular for mobile and IoT devices?","o":[["It is a symmetric algorithm and therefore faster","ECC is asymmetric."],["It is immune to quantum computers","ECC is as vulnerable to Shor's algorithm as RSA."],["It provides comparable security with much shorter keys","Correct. A 256-bit ECC key offers security comparable to a roughly 3,072-bit RSA key, saving computation, power and bandwidth."],["It requires no key management","Every asymmetric system requires key management."]],"a":2,"k":"ECC: equivalent strength to RSA with far smaller keys, which suits constrained devices."},{"id":"D3-054","d":3,"obj":"3.7","diff":1,"q":"An attacker has several messages in both plaintext and encrypted form and uses them to work out the key. What type of attack is this?","o":[["Known plaintext","Correct. The attacker has matching plaintext and ciphertext pairs but did not choose them."],["Ciphertext only","In a ciphertext-only attack, the attacker has only encrypted messages."],["Chosen plaintext","In chosen plaintext, the attacker picks the plaintexts and gets them encrypted."],["Brute force","Brute force tries every possible key without exploiting known pairs."]],"a":0,"k":"Cryptanalysis attacks differ by what the attacker has: ciphertext only, known plaintext, chosen plaintext, chosen ciphertext."},{"id":"D3-055","d":3,"obj":"3.7","diff":2,"q":"An attacker can submit encrypted messages of their own making to a server and observe the decrypted results or error messages. What type of attack does this enable?","o":[["Known plaintext","In known plaintext, the attacker has pairs but cannot submit their own."],["Frequency analysis","Frequency analysis studies letter patterns in ciphertext."],["Birthday attack","Birthday attacks find hash collisions."],["Chosen ciphertext","Correct. Choosing ciphertexts and seeing the results, including padding oracle errors, is a chosen-ciphertext attack."]],"a":3,"k":"Chosen-ciphertext attacks exploit decryption oracles; uniform error handling and authenticated encryption defeat them."},{"id":"D3-056","d":3,"obj":"3.7","diff":1,"q":"A researcher measures how long a smart card takes to process different inputs and uses the differences to recover its private key. What type of attack is this?","o":[["A brute-force key search","The researcher is not trying every key."],["A timing (side-channel) attack","Correct. Side-channel attacks use physical effects such as time, power or radiation rather than the algorithm's math."],["A replay of captured card messages","Replay resends captured messages."],["A dictionary attack on the card PIN","Dictionary attacks guess passwords from word lists."]],"a":1,"k":"Side channels (timing, power, electromagnetic emissions) attack the implementation; use constant-time code and shielding."},{"id":"D3-057","d":3,"obj":"3.7","diff":2,"q":"An attacker captures a Windows administrator's NTLM password hash from memory and uses it to log on to other servers without ever cracking it. What is this attack?","o":[["Rainbow table attack","Rainbow tables recover the password from the hash; here the hash is used as is."],["Kerberoasting","Kerberoasting cracks service-ticket hashes offline."],["Pass the hash","Correct. NTLM accepts the hash itself as proof, so a stolen hash works like the password."],["Credential stuffing","Credential stuffing tries leaked username and password pairs on other sites."]],"a":2,"k":"Counter pass-the-hash: limit privileged logons, use unique local admin passwords, protect credentials in memory and reduce NTLM use."},{"id":"D3-058","d":3,"obj":"3.7","diff":3,"q":"Investigators find that attackers forged Kerberos ticket-granting tickets that are valid for any account in the domain. What must be done to invalidate the forged tickets?","o":[["Reset the passwords of all user accounts","User password resets do not invalidate TGTs signed with the KRBTGT key."],["Reboot all domain controllers","A reboot does not change the key used to sign tickets."],["Revoke and reissue the domain controllers' certificates","Golden tickets are encrypted and signed with the KRBTGT key, not with certificates, so reissuing certificates leaves them valid."],["Reset the KRBTGT account password twice","Correct. A golden ticket is signed with the KRBTGT key. Resetting it twice, allowing replication between resets, removes both the current and previous keys."]],"a":3,"k":"Golden ticket: forged TGTs using the KRBTGT hash. Remediate by resetting KRBTGT twice and finding how the attacker got domain admin."},{"id":"D3-059","d":3,"obj":"3.7","diff":2,"q":"Why does a birthday attack against a hash function succeed much faster than trying to match one specific hash?","o":[["Hash functions are reversible with enough computing power","Hash functions are one-way; the birthday attack does not reverse them."],["It uses precomputed rainbow tables of likely inputs","Rainbow tables speed up reversing unsalted password hashes; a birthday attack instead looks for any two inputs that collide."],["It exploits weak random number generators","The birthday paradox is about probability, not weak randomness."],["Any collision will do, needing roughly square-root effort","Correct. Finding any two inputs with the same hash is far easier than matching a given one: collisions appear after roughly 2^(n/2) attempts for an n-bit hash, so longer hashes are needed for collision resistance."]],"a":3,"k":"Birthday attacks target collision resistance; an n-bit hash gives about n/2 bits of collision security."},{"id":"D3-060","d":3,"obj":"3.7","diff":1,"q":"An analyst notices that the letter \"X\" appears in a ciphertext about as often as \"E\" appears in English text. Which technique is the analyst using?","o":[["Frequency analysis","Correct. Frequency analysis matches symbol frequencies in ciphertext to known patterns in the language, breaking simple substitution ciphers."],["Differential cryptanalysis","Differential cryptanalysis studies how input differences affect output differences in block ciphers."],["Fault injection","Fault injection induces errors in hardware to leak secrets."],["A meet-in-the-middle attack","That attack targets double encryption."]],"a":0,"k":"Frequency analysis defeats simple substitution ciphers; modern ciphers resist it through confusion and diffusion."},{"id":"D3-061","d":3,"obj":"3.8","diff":2,"q":"Landscaping is kept low and lighting is placed so that staff can easily see anyone approaching the building entrance. Which crime prevention through environmental design (CPTED) strategy is this?","o":[["Natural access control","Natural access control guides people toward entrances using design elements such as paths and planters."],["Natural surveillance","Correct. Natural surveillance makes intruders visible to legitimate occupants, which deters crime."],["Territorial reinforcement","Territorial reinforcement signals ownership of space, for example with fences or signs."],["Target hardening","Target hardening means adding locks and barriers, which is not the CPTED approach here."]],"a":1,"k":"CPTED: natural access control, natural surveillance, territorial reinforcement."},{"id":"D3-062","d":3,"obj":"3.8","diff":1,"q":"Where in a multi-story office building is the BEST place for a data center?","o":[["The basement, for natural cooling","Basements are prone to flooding."],["The top floor, away from foot traffic","Top floors are exposed to roof leaks, weather and fire spreading upward."],["Next to the main lobby, for easy deliveries","High-traffic areas increase exposure to unauthorized access."],["The core of a middle floor","Correct. The center of a middle floor avoids flooding, roof damage and exterior attack, and is easier to secure."]],"a":3,"k":"Locate data centers away from exterior walls, water and heavy foot traffic."},{"id":"D3-063","d":3,"obj":"3.8","diff":3,"q":"While designing a new facility, a team maps the relationships between mission-critical applications, processes and operations and every supporting element they depend on, such as power, cooling and network paths. What is this activity called?","o":[["Business impact analysis","A BIA measures the impact of disruption on business functions; it does not map supporting infrastructure."],["Critical path analysis","Correct. Critical path analysis identifies the dependencies that mission-critical functions need, guiding facility design."],["Site survey","A site survey assesses a location's physical characteristics."],["Fault tree analysis","Fault trees model combinations of failures that lead to an event."]],"a":1,"k":"Critical path analysis maps mission-critical functions to all supporting elements, including technology convergence points."},{"id":"D3-064","d":3,"obj":"3.9","diff":1,"q":"A fire breaks out in energized electrical equipment. Which suppression method is appropriate?","o":[["A pressurized water extinguisher","Water conducts electricity and risks electrocution."],["Soda acid","Soda acid is water-based and unsuitable for electrical fires."],["Carbon dioxide or a clean agent","Correct. Non-conductive agents such as CO2 or clean agents suppress electrical fires without conducting current."],["Dry powder for metals","Dry powder is meant for combustible metal fires."]],"a":2,"k":"Fire classes (U.S.): A common combustibles (water, foam), B flammable liquids (CO2, foam), C electrical (CO2, clean agent), D metals (dry powder), K cooking oils (wet chemical)."},{"id":"D3-065","d":3,"obj":"3.9","diff":2,"q":"Which water sprinkler system is generally BEST for a data center?","o":[["Wet pipe","Wet pipes are always full of water, so a damaged pipe or head floods equipment at once."],["Dry pipe","Dry pipe systems are meant for areas that freeze, and they still discharge after one trigger."],["Deluge","Deluge systems open all heads at once and dump large volumes of water."],["Pre-action","Correct. Pre-action fills the pipes only after an alarm and discharges only after a head also fuses, giving time to stop false discharges."]],"a":3,"k":"Pre-action sprinklers are preferred for data centers: two triggers before water flows."},{"id":"D3-066","d":3,"obj":"3.9","diff":1,"q":"The humidity in a server room has fallen well below the recommended range. What is the main risk?","o":[["Corrosion of components","Corrosion results from humidity that is too high."],["Static electricity discharges","Correct. Dry air allows static to build up, which can damage electronic components."],["Condensation on the equipment","Condensation occurs at high humidity or around the dew point."],["Faster drive wear","Drive wear is not the main effect of low humidity."]],"a":1,"k":"Keep humidity in range: too low causes static; too high causes condensation and corrosion."},{"id":"D3-067","d":3,"obj":"3.9","diff":2,"q":"A facility experiences a prolonged period of low voltage from the utility. What is this called?","o":[["Sag","A sag is a momentary low voltage."],["Fault","A fault is a momentary loss of power."],["Brownout","Correct. A brownout is prolonged low voltage."],["Surge","A surge is prolonged high voltage."]],"a":2,"k":"Power issues: fault (brief loss), blackout (long loss), sag (brief low), brownout (long low), spike (brief high), surge (long high)."},{"id":"D3-068","d":3,"obj":"3.9","diff":1,"q":"When the utility supply fails, what keeps servers running during the seconds it takes a backup generator to start?","o":[["A surge protector","Surge protectors block voltage spikes but supply no power."],["A redundant power supply in each server","Redundant supplies protect against a failed supply unit, not a lost feed."],["An uninterruptible power supply (UPS)","Correct. A UPS bridges the gap with battery power until the generator takes over."],["A power distribution unit","A PDU distributes power; it does not store it."]],"a":2,"k":"UPS for seconds to minutes; generators for long outages; together they keep the data center powered."},{"id":"D3-069","d":3,"obj":"3.9","diff":2,"q":"For convenience, the evidence storage room is open to every analyst in the security operations center. What is the main concern?","o":[["Analysts may need extra training in evidence handling","Training helps, but even trained staff with open access leave no reliable record of who handled each item."],["Evidence will be harder to find without a catalog","A catalog helps retrieval; the security problem is that open access weakens proof of the evidence's integrity."],["Broad access undermines the evidence's chain of custody","Correct. Evidence storage must be restricted and access-logged so the integrity of every item can be demonstrated in court."],["The room's fire suppression may damage evidence","Suppression should be appropriate, but the larger issue is access control."]],"a":2,"k":"Evidence storage: restricted, logged access and a documented chain of custody."},{"id":"D3-070","d":3,"obj":"3.9","diff":1,"q":"Which practice is MOST important for the security of wiring closets (intermediate distribution frames)?","o":[["Using them to store spare equipment so it is close at hand","Using closets as storerooms brings in more people and fire risk."],["Leaving the doors open for ventilation","Open doors let anyone tamper with network connections."],["Labeling them clearly for visitors","Clear external labeling helps attackers find them."],["Keeping them locked, with restricted and logged access","Correct. Wiring closets give direct access to the network and must be physically controlled."]],"a":3,"k":"Wiring closets and IDFs are often neglected; lock them, restrict and log access, and don't use them for storage."},{"id":"D3-071","d":3,"obj":"3.9","diff":2,"q":"A server room is protected by a clean-agent gas suppression system. Which feature protects the people who work in the room?","o":[["A manual override that prevents discharge entirely","Disabling suppression protects nobody from the fire."],["Fast discharge within one second of detection","Instant discharge leaves no time to evacuate."],["A pre-discharge alarm and delay to allow evacuation","Correct. Pre-discharge alarms and delays let people evacuate before the agent fills the room."],["A sign warning that the room is protected by gas","Signage helps, but an alarm and delay are what give people time to get out."]],"a":2,"k":"In gas-protected rooms, warning alarms and discharge delays protect people; life safety comes first."},{"id":"D3-072","d":3,"obj":"3.10","diff":2,"q":"Testing confirms that a new system meets its stakeholders' real needs in its intended environment. What is this activity called?","o":[["Verification","Verification confirms the system was built to its specification: built right."],["Certification","Certification evaluates security controls."],["Unit testing","Unit tests check individual components."],["Validation","Correct. Validation confirms it is the right system for its users and mission: the right thing was built."]],"a":3,"k":"Verification: built to spec. Validation: meets the stakeholders' actual needs."},{"id":"D3-073","d":3,"obj":"3.10","diff":1,"q":"When should security requirements FIRST be identified for a new information system?","o":[["At the concept stage, when stakeholder needs are defined","Correct. Security requirements belong with the other requirements, before architecture and design begin."],["During integration testing","By then the design is fixed, and changes are expensive."],["Before deployment, during the security review","A late review finds problems when they are costliest to fix."],["During operations, as threats appear","Security must be designed in, not bolted on."]],"a":0,"k":"Build security into the lifecycle from requirements onward; retrofitting costs more and works less well."},{"id":"D3-074","d":3,"obj":"3.10","diff":1,"q":"A system is being retired. Which activity is MOST important for security during this phase?","o":[["Recycling the hardware as quickly as possible to cut costs","Speed matters less than making sure no data leaves with the hardware."],["Turning off monitoring to save costs","Monitoring should continue until the system is fully decommissioned."],["Deleting all user accounts first","Accounts must be removed, but the data on the media is the larger risk."],["Archiving required data and sanitizing the media","Correct. Retirement must preserve what must be kept and destroy what must not leave."]],"a":3,"k":"Disposal: retain what is required, sanitize or destroy media, remove access, and update the inventory."},{"id":"D3-075","d":3,"obj":"3.1","diff":3,"q":"An architect requires the payments service to accept calls only from the order service, verify each call's signed token, and validate every input even though the order service already validates it. A developer calls the extra checks redundant. Which principle justifies them?","o":[["Keep it simple, since fewer checks are easier to maintain","Simplicity is a sound goal, but here it argues against the extra checks rather than for them."],["Defense in depth with zero trust between services","Correct. Each service verifies what it receives instead of relying on another component's checks, so one compromised or buggy service does not compromise the next."],["Separation of duties between the development teams","Separation of duties splits tasks among people; the question is how services treat each other's requests."],["Fail securely, so errors in the order service stop payments","Failing securely governs behavior when something breaks, not why each layer repeats validation."]],"a":1,"k":"Do not trust checks performed elsewhere: each component verifies its own inputs (defense in depth, zero trust)."},{"id":"D3-076","d":3,"obj":"3.6","diff":3,"q":"A company encrypts files in the cloud and must show regulators that the cloud provider can never decrypt them, even if a court orders the provider to. Which key arrangement meets this?","o":[["Provider-managed keys with automatic annual rotation","Rotation limits how much data each key protects, but the provider holds every key and can be compelled to use them."],["Customer-managed keys stored in the provider's KMS","The customer controls the policy, but the key material lives in the provider's service, which can be compelled."],["Keys kept in the customer's own HSM, outside the cloud","Correct. If the key material never reaches the provider (hold your own key), the provider cannot decrypt, whatever it is ordered to do."],["Server-side encryption with keys stored apart from the data","Separating keys from data helps against storage theft, but the provider still controls both."]],"a":2,"k":"Only keys that never leave the customer's control (hold your own key, external HSM) stop a provider from decrypting."},{"id":"D4-001","d":4,"obj":"4.1","diff":1,"q":"At which layer of the OSI model do routers forward packets based on logical (IP) addresses?","o":[["Network (Layer 3)","Correct. The network layer handles logical addressing and routing between networks."],["Data link (Layer 2)","The data link layer uses MAC addresses to move frames within one network segment."],["Transport (Layer 4)","The transport layer provides end-to-end delivery with ports, as in TCP and UDP."],["Session (Layer 5)","The session layer manages dialogues between applications."]],"a":0,"k":"OSI: 7 Application, 6 Presentation, 5 Session, 4 Transport, 3 Network, 2 Data link, 1 Physical."},{"id":"D4-002","d":4,"obj":"4.1","diff":1,"q":"What is the unit of data called at the transport layer when TCP is used?","o":[["Segment","Correct. TCP data units are segments; UDP's are usually called datagrams."],["Frame","Frames belong to the data link layer."],["Packet","Packets belong to the network layer."],["Bit stream","Bits are the physical layer's unit."]],"a":0,"k":"Encapsulation: data (layers 5–7) → segment (4) → packet (3) → frame (2) → bits (1)."},{"id":"D4-003","d":4,"obj":"4.1","diff":2,"q":"An attacker sends thousands of TCP SYN packets with spoofed source addresses and never completes the handshakes. Which control mitigates this attack on the server MOST directly?","o":[["SYN cookies","Correct. With SYN cookies the server keeps no state for half-open connections, so the backlog cannot be exhausted."],["A longer TCP keep-alive interval","Keep-alives apply to established connections, not half-open ones."],["Disabling ICMP on the server","Blocking ICMP stops ping-based floods, not a flood of half-open TCP connections."],["Increasing the TCP window size","The window size controls data flow on established connections."]],"a":0,"k":"SYN flood: exhausts the half-open connection backlog. Counter with SYN cookies, rate limiting and upstream filtering."},{"id":"D4-004","d":4,"obj":"4.1","diff":1,"q":"In the TCP three-way handshake, what does the server send in response to the client's SYN?","o":[["ACK","The client sends the final ACK, third in the sequence."],["SYN-ACK","Correct. The sequence is SYN, then SYN-ACK, then ACK."],["FIN","FIN closes a connection."],["RST","RST resets or refuses a connection."]],"a":1,"k":"TCP handshake: SYN → SYN-ACK → ACK."},{"id":"D4-005","d":4,"obj":"4.1","diff":2,"q":"In IPv6, which addressing method replaces IPv4 broadcast?","o":[["Anycast","Anycast delivers to the nearest member of a group, not to all members."],["Unicast","Unicast is one-to-one."],["Multicast","Correct. IPv6 has no broadcast; functions such as neighbor discovery use multicast instead."],["Link-local unicast","Link-local addresses are unicast addresses valid on one link."]],"a":2,"k":"IPv6: unicast, multicast and anycast; no broadcast."},{"id":"D4-006","d":4,"obj":"4.1","diff":2,"q":"Several DNS servers around the world share one IP address, and each client reaches the nearest of them. Which addressing method is this?","o":[["Anycast","Correct. Anycast routes traffic to the nearest node advertising the address, which improves performance and resilience, including against DDoS."],["Multicast","Multicast delivers one stream to every member of a group."],["Broadcast","Broadcast reaches every host on a local network."],["Network address translation","NAT rewrites addresses at a boundary; it does not choose the nearest server."]],"a":0,"k":"Anycast: one address, many locations, nearest one answers. Used by DNS root servers and CDNs."},{"id":"D4-007","d":4,"obj":"4.1","diff":2,"q":"A security team finds that workstations are using an IPv6-over-IPv4 tunneling feature that the perimeter firewall does not inspect. What is the main risk?","o":[["It exposes internal IPv4 addresses to the internet","The tunnel wraps IPv6 inside IPv4; the danger is not address exposure but traffic the firewall never inspects."],["It can bypass IPv4-only security controls","Correct. Traffic can bypass controls that only inspect IPv4: tunneled IPv6 carries it around filtering and monitoring that do not understand it."],["IPv6 addresses are too long for most log formats","Current logging tools record IPv6 addresses without difficulty."],["IPv6 traffic is incompatible with TLS","IPv6 supports IPsec and TLS like IPv4."]],"a":1,"k":"Disable or inspect unneeded IPv6 tunneling; unmanaged IPv6 can bypass IPv4-only controls."},{"id":"D4-008","d":4,"obj":"4.1","diff":2,"q":"Which IPsec protocol provides confidentiality for the data it protects?","o":[["Authentication Header (AH)","AH provides integrity and authentication only; it does not encrypt."],["Internet Key Exchange (IKE)","IKE negotiates security associations and keys; it does not protect the data itself."],["Encapsulating Security Payload (ESP)","Correct. ESP encrypts the payload and can also provide integrity and authentication."],["Security Parameter Index (SPI)","The SPI is an identifier for a security association, not a protocol."]],"a":2,"k":"IPsec: AH = integrity and authentication (no encryption, breaks with NAT); ESP = encryption plus integrity; IKE = key negotiation."},{"id":"D4-009","d":4,"obj":"4.1","diff":2,"q":"Two offices connect their networks through a site-to-site VPN between their gateways. Which IPsec mode is used?","o":[["Transport mode, which protects only the payload between end hosts","Transport mode suits host-to-host protection, leaving the original IP header visible."],["Tunnel mode, which encapsulates the entire original packet","Correct. Gateways wrap each whole packet in a new one, hiding internal addresses as traffic crosses the internet."],["Aggressive mode, which speeds up key exchange","Aggressive mode is an IKE phase 1 option, not an IPsec protection mode."],["Main mode, which hides identities during negotiation","Main mode is also an IKE phase 1 option."]],"a":1,"k":"IPsec tunnel mode: gateway-to-gateway VPNs. Transport mode: end host to end host."},{"id":"D4-010","d":4,"obj":"4.1","diff":3,"q":"A network team wants IPsec integrity protection that covers the IP header, but the traffic crosses a NAT device. Why does Authentication Header (AH) fail here?","o":[["AH runs over TCP, which NAT devices handle poorly","AH is its own IP protocol and does not depend on TCP or UDP."],["NAT devices drop encrypted traffic by default","AH does not encrypt anything."],["AH was designed for IPv6 and fails on IPv4","AH works with both IPv4 and IPv6."],["NAT's address changes break AH's integrity check","Correct. AH authenticates parts of the IP header, so NAT's address changes make the check fail. ESP with NAT traversal is used instead."]],"a":3,"k":"AH and NAT are incompatible; use ESP with NAT traversal (UDP 4500)."},{"id":"D4-011","d":4,"obj":"4.1","diff":1,"q":"Which protocol should replace Telnet for remote command-line administration?","o":[["SSH","Correct. SSH encrypts the session, including credentials, and authenticates the server."],["SNMPv2c","SNMPv2c is for monitoring and uses cleartext community strings."],["TFTP","TFTP is an unauthenticated file transfer protocol."],["rlogin","rlogin is as insecure as Telnet."]],"a":0,"k":"Replace cleartext protocols: Telnet → SSH, FTP → SFTP or FTPS, HTTP → HTTPS, SNMPv1/v2c → SNMPv3."},{"id":"D4-012","d":4,"obj":"4.1","diff":2,"q":"What does TLS 1.3 require that earlier versions allowed you to skip?","o":[["Client certificates for every connection","Client certificates remain optional."],["Forward secrecy through ephemeral key exchange","Correct. TLS 1.3 removed static RSA key exchange, so every session uses ephemeral Diffie-Hellman and a stolen server key cannot decrypt past traffic."],["Pre-shared keys configured on both sides","Pre-shared keys are optional in TLS 1.3."],["Using SHA-1 for signatures","TLS 1.3 removed SHA-1 from signatures."]],"a":1,"k":"TLS 1.3: forward secrecy mandatory, legacy ciphers removed, faster handshake."},{"id":"D4-013","d":4,"obj":"4.1","diff":3,"q":"An industrial protocol carries control commands inside ordinary TCP/IP traffic, and an attacker uses that wrapping to slip commands past a firewall that only checks ports. What does this illustrate?","o":[["A man-in-the-middle attack on the industrial protocol","Nothing is intercepted or altered in transit; the attacker hides commands inside allowed traffic."],["A failure of the firewall's stateful connection tracking","State tracking worked as designed; the firewall only looked at ports, so it never saw what the wrapped payload carried."],["Encapsulation hiding traffic from shallow inspection","Correct. This is a risk of multilayer protocols: their encapsulation can carry covert or unexpected content, so protocol-aware inspection and segmentation are needed."],["A design flaw in the TCP three-way handshake itself","The handshake works as designed here."]],"a":2,"k":"Multilayer and encapsulated protocols (DNP3, Modbus TCP, tunnels) need deep, protocol-aware inspection."},{"id":"D4-014","d":4,"obj":"4.1","diff":2,"q":"Which protocol carries SCSI storage commands over a standard IP network?","o":[["iSCSI","Correct. iSCSI is a converged protocol that sends block storage commands over TCP/IP."],["Fibre Channel over Ethernet (FCoE)","FCoE carries Fibre Channel directly over Ethernet frames, not over IP."],["Multiprotocol Label Switching (MPLS)","MPLS forwards traffic by labels rather than IP lookups."],["Session Initiation Protocol (SIP)","SIP sets up voice and video sessions."]],"a":0,"k":"Converged protocols run specialized traffic over common networks: iSCSI, FCoE, VoIP, MPLS, InfiniBand over Ethernet, CXL."},{"id":"D4-015","d":4,"obj":"4.1","diff":3,"q":"Which converged technology provides a cache-coherent, high-speed interconnect between processors, memory and accelerators over the PCIe physical layer?","o":[["InfiniBand over Ethernet","InfiniBand is a high-performance network fabric between servers, not a PCIe-based coherent memory interconnect."],["iSCSI over 10-gigabit Ethernet","iSCSI carries storage commands over IP."],["Compute Express Link (CXL)","Correct. CXL builds on PCIe to share memory coherently between CPUs and devices; it is named in the 2024 outline."],["Fibre Channel over Ethernet","Fibre Channel is a storage network technology."]],"a":2,"k":"CXL extends PCIe with coherent memory sharing; securing it means protecting high-speed interconnects inside and between systems."},{"id":"D4-016","d":4,"obj":"4.1","diff":2,"q":"In network architecture, which plane makes routing decisions, such as running routing protocols to build the forwarding table?","o":[["Data plane","The data plane forwards traffic according to the table the control plane builds."],["Control plane","Correct. The control plane decides where traffic should go."],["Management plane","The management plane is used to configure and monitor devices, for example over SSH or SNMP."],["User plane","In this context, the user plane is another name for the data plane."]],"a":1,"k":"Data plane forwards; control plane decides; management plane configures. Protect the control and management planes most."},{"id":"D4-017","d":4,"obj":"4.1","diff":2,"q":"A switch begins forwarding a frame as soon as it reads the destination MAC address, before the whole frame arrives. What is the trade-off of this cut-through approach?","o":[["It is slower but checks every frame for errors","That describes store-and-forward switching."],["It drops broadcast frames to save time","Switching method does not affect broadcast handling."],["It needs a router to check each frame","Cut-through is purely a switching technique."],["Lower latency, but corrupted frames may be forwarded","Correct. Cut-through does not wait to verify the frame check sequence, so damaged frames can propagate."]],"a":3,"k":"Cut-through: fast, no error check. Store-and-forward: receives and checks the whole frame first."},{"id":"D4-018","d":4,"obj":"4.1","diff":1,"q":"Voice calls over the corporate network sound choppy because packets arrive at uneven intervals. Which performance metric describes this variation?","o":[["Jitter","Correct. Jitter is the variation in packet delay, which harms real-time traffic such as voice and video."],["Throughput","Throughput is the amount of data actually delivered per unit of time."],["Bandwidth","Bandwidth is a link's maximum capacity."],["Signal-to-noise ratio","SNR compares signal strength to background noise on a medium."]],"a":0,"k":"Performance metrics: bandwidth (capacity), throughput (actual), latency (delay), jitter (delay variation), SNR (signal quality)."},{"id":"D4-019","d":4,"obj":"4.1","diff":2,"q":"After compromising one web server, an attacker moves to database servers in the same data center. Which kind of traffic should be monitored and controlled to catch this?","o":[["North-south traffic","North-south traffic enters or leaves the data center; this movement stays inside it."],["East-west traffic","Correct. East-west traffic flows laterally between internal systems, which is where lateral movement happens."],["Out-of-band traffic","Out-of-band refers to separate management networks."],["Multicast traffic","Multicast is an addressing method, not a direction of flow."]],"a":1,"k":"Perimeter controls watch north-south; microsegmentation and internal monitoring are needed for east-west."},{"id":"D4-020","d":4,"obj":"4.1","diff":2,"q":"Network devices are managed over a separate network that carries no production traffic. What is this called?","o":[["Out-of-band management","Correct. A dedicated management network keeps administrative access off the production network, where attackers could reach it."],["In-band management","In-band management uses the same network as production traffic."],["A demilitarized zone","A DMZ hosts internet-facing services."],["A virtual routing and forwarding instance","VRF separates routing tables logically on shared devices."]],"a":0,"k":"Physical segmentation options: in-band, out-of-band and air-gapped networks."},{"id":"D4-021","d":4,"obj":"4.1","diff":2,"q":"A service provider must keep several customers' networks isolated on the same physical router, even though their address ranges overlap. Which technology provides this?","o":[["VLANs with separate trunk links","VLANs separate Layer 2 broadcast domains, not routing tables."],["A VPN concentrator per customer","VPN concentrators terminate encrypted tunnels."],["Virtual routing and forwarding (VRF)","Correct. VRF creates multiple independent routing tables on one device, a form of logical segmentation."],["Network address translation (NAT)","NAT translates addresses; it does not separate routing tables."]],"a":2,"k":"Logical segmentation: VLANs (Layer 2), VRFs (Layer 3 routing tables), VPNs, virtual domains."},{"id":"D4-022","d":4,"obj":"4.1","diff":2,"q":"A company wants each workload to be allowed to talk only to the specific workloads it needs, even within the same subnet. Which approach achieves this?","o":[["Larger VLANs, so traffic stays local","Larger broadcast domains widen access."],["A stronger perimeter firewall","The perimeter does not see traffic between workloads in the same subnet."],["Network address translation inside the data center","NAT does not enforce workload-to-workload policy."],["Microsegmentation with distributed firewalls","Correct. Microsegmentation applies fine-grained policy at each workload, a core zero trust technique."]],"a":3,"k":"Microsegmentation enforces least privilege between individual workloads, limiting lateral movement."},{"id":"D4-023","d":4,"obj":"4.1","diff":2,"q":"At its internet edge, a company drops inbound packets whose source address claims to be from the company's own internal address range. What is this control?","o":[["Ingress filtering of spoofed sources","Correct. Packets arriving from outside should never carry internal source addresses, so they are spoofed."],["Egress filtering of outbound traffic","Egress filtering checks traffic leaving the network."],["Port address translation at the edge","PAT maps many internal hosts to one public address."],["Rate limiting of inbound connections","Rate limiting caps traffic volume, not source address validity."]],"a":0,"k":"Ingress filtering drops spoofed inbound traffic; egress filtering keeps your network from sending spoofed or unauthorized traffic out."},{"id":"D4-024","d":4,"obj":"4.1","diff":2,"q":"Why should an organization filter outbound traffic so that only packets with its own source addresses leave its network?","o":[["To speed up outbound connections through the firewall","Filtering adds a check; it does not speed anything up."],["To hide internal addresses from the internet","That is NAT's role."],["To stop its hosts from sending spoofed attack traffic","Correct. Egress filtering (BCP 38) stops compromised hosts from sending traffic with forged sources, as used in reflection DDoS."],["To block all malware downloads","Downloads are inbound content; source-address filtering does not inspect it."]],"a":2,"k":"Egress filtering protects others from your network and also helps detect compromised internal hosts."},{"id":"D4-025","d":4,"obj":"4.1","diff":2,"q":"Which Wi-Fi security option resists offline dictionary attacks against a captured handshake when a shared passphrase is used?","o":[["WPA2-Personal (PSK)","A captured WPA2-PSK handshake can be attacked offline with a dictionary."],["WEP","WEP is broken entirely."],["WPA3-Personal with SAE","Correct. Simultaneous Authentication of Equals uses a password-authenticated key exchange, so each guess requires an online interaction."],["WPS PIN mode","WPS PIN mode is easily brute-forced."]],"a":2,"k":"WPA3-Personal (SAE) resists offline cracking and adds forward secrecy; use WPA3- or WPA2-Enterprise (802.1X) for organizations."},{"id":"D4-026","d":4,"obj":"4.1","diff":2,"q":"In 802.1X port-based access control, what role does the wireless access point or switch play?","o":[["Authenticator","Correct. The authenticator relays credentials between the client and the authentication server and opens the port only on success."],["Supplicant","The supplicant is the client device seeking access."],["Authentication server","The authentication server, usually RADIUS, makes the decision."],["Certificate authority","A CA issues certificates and has no role in relaying 802.1X exchanges."]],"a":0,"k":"802.1X roles: supplicant (client), authenticator (switch or AP), authentication server (RADIUS)."},{"id":"D4-027","d":4,"obj":"4.1","diff":2,"q":"Which EAP method provides the strongest authentication for enterprise Wi-Fi by requiring certificates on both the client and the server?","o":[["PEAP with MSCHAPv2","PEAP protects a password exchange inside a TLS tunnel; only the server needs a certificate."],["EAP-TLS","Correct. EAP-TLS uses mutual certificate authentication, so there are no passwords to steal or phish."],["LEAP","LEAP is a deprecated Cisco method that is vulnerable to dictionary attacks."],["EAP-MD5","EAP-MD5 provides no server authentication and is weak."]],"a":1,"k":"EAP-TLS (mutual certificates) is the gold standard; PEAP and EAP-TTLS tunnel weaker inner methods."},{"id":"D4-028","d":4,"obj":"4.1","diff":2,"q":"An attacker sets up an access point with the same network name as the corporate Wi-Fi to capture users' logins. What is this attack called?","o":[["Bluesnarfing","Bluesnarfing steals data over Bluetooth."],["War driving","War driving is searching for wireless networks while moving."],["Jamming","Jamming disrupts the radio signal."],["Evil twin","Correct. An evil twin imitates a legitimate access point to lure clients. Server certificate validation in 802.1X defends against it."]],"a":3,"k":"Evil twins are defeated when clients validate the authentication server's certificate."},{"id":"D4-029","d":4,"obj":"4.1","diff":2,"q":"An attacker connects to a phone over Bluetooth without permission and copies its contacts and messages. What is this attack?","o":[["Bluesnarfing","Correct. Bluesnarfing is unauthorized access to data on a Bluetooth device."],["Bluejacking","Bluejacking sends unsolicited messages; it does not steal data."],["Bluebugging","Bluebugging takes control of the device's functions, such as making calls."],["Bluesmacking","Bluesmacking is a denial-of-service attack using oversized packets."]],"a":0,"k":"Bluetooth attacks: bluejacking (spam messages), bluesnarfing (data theft), bluebugging (device control)."},{"id":"D4-030","d":4,"obj":"4.1","diff":2,"q":"Which wireless technology is a low-power, low-data-rate mesh protocol built on IEEE 802.15.4 and common in smart buildings and IoT sensors?","o":[["Wi-Fi 6","Wi-Fi 6 is a high-throughput WLAN standard, IEEE 802.11ax."],["5G","5G is a cellular technology."],["Zigbee","Correct. Zigbee suits battery-powered sensors in mesh networks; protecting its network keys is critical."],["Near-field communication","NFC works over a few centimeters, point to point."]],"a":2,"k":"Know the outline's wireless list: Bluetooth, Wi-Fi, Zigbee, satellite, and cellular (4G, 5G)."},{"id":"D4-031","d":4,"obj":"4.1","diff":3,"q":"Compared with 4G, how does 5G better protect subscribers against IMSI catchers (fake base stations)?","o":[["5G phones keep a list of trusted base stations and refuse others","Phones cannot know every legitimate base station in advance."],["5G encrypts the subscriber's permanent identifier before sending it over the air","Correct. 5G conceals the permanent identifier (SUPI) as the SUCI, using the home network's public key, so it is not exposed over the air."],["5G's millimeter-wave signals are too short-range to intercept","5G uses several bands, and radio signals can always be intercepted."],["5G no longer uses SIM cards","5G still uses SIMs or eSIMs."]],"a":1,"k":"5G improvements include identifier concealment (SUCI), stronger mutual authentication and network slicing."},{"id":"D4-032","d":4,"obj":"4.1","diff":2,"q":"A company's website suffers frequent volumetric DDoS attacks. Which architectural choice helps MOST?","o":[["A larger web server with more memory","A bigger server is quickly overwhelmed by a large botnet."],["A content distribution network (CDN)","Correct. A CDN spreads content and absorbs attack traffic across its many, distributed edge locations."],["A second internet connection from the same provider","Two links of similar size are still small compared to a large attack."],["Disabling ICMP on the firewall","Most volumetric attacks do not depend on ICMP."]],"a":1,"k":"CDNs improve performance and absorb DDoS at the edge; combine them with upstream scrubbing services."},{"id":"D4-033","d":4,"obj":"4.1","diff":2,"q":"In a software-defined network (SDN), which component is the MOST attractive target for an attacker?","o":[["An individual switch's data plane","Compromising one switch affects only that switch."],["The physical cabling","Cabling affects only local connections."],["The SDN controller","Correct. The controller centralizes the control plane, so whoever controls it controls forwarding across the network."],["Network time protocol servers","Time matters for logs, but the controller is the critical point."]],"a":2,"k":"SDN separates the control plane into a central controller; harden it and secure its APIs."},{"id":"D4-034","d":4,"obj":"4.1","diff":2,"q":"In a public cloud, which construct gives a customer a logically isolated network in which to define subnets, routing and security rules?","o":[["A virtual private cloud (VPC)","Correct. A VPC is the customer's isolated network inside the provider's infrastructure."],["A content distribution network","A CDN caches content at edge locations."],["A hardware security module","An HSM protects keys."],["A storage bucket","Buckets store objects; they are not networks."]],"a":0,"k":"VPCs provide network isolation in the cloud; their security groups and network ACLs act as firewalls."},{"id":"D4-035","d":4,"obj":"4.1","diff":2,"q":"The network team wants to know which hosts talked to which, when, and how much data moved, without capturing full packets. What should they collect?","o":[["Full packet captures on every link","Full capture gives detail but is expensive at scale and is more than they asked for."],["Flow records such as NetFlow or IPFIX","Correct. Flow records summarize conversations and support anomaly detection and capacity planning."],["SNMP traps","SNMP traps report device events, not conversations between hosts."],["Syslog from the web servers","Server logs show application events, not network-wide flows."]],"a":1,"k":"Network observability: flows for who-talked-to-whom, packet capture for deep forensics, SNMP for device health."},{"id":"D4-036","d":4,"obj":"4.1","diff":2,"q":"An attacker on the LAN sends forged ARP replies so that traffic for the default gateway goes to the attacker's machine. Which switch feature defends against this?","o":[["Spanning Tree Protocol","STP prevents switching loops."],["Port mirroring","Port mirroring copies traffic for analysis."],["VLAN trunking","Trunking carries several VLANs on one link."],["Dynamic ARP inspection","Correct. DAI validates ARP messages against trusted bindings, usually from DHCP snooping, and drops forged ones."]],"a":3,"k":"ARP poisoning enables on-path (man-in-the-middle) attacks; counter with dynamic ARP inspection and DHCP snooping."},{"id":"D4-037","d":4,"obj":"4.1","diff":3,"q":"An attacker on an access port sends frames with two 802.1Q tags to reach a VLAN they are not assigned to. Which configuration change defeats this?","o":[["Use an unused native VLAN and disable trunk negotiation","Correct. Double-tagging relies on the attacker's VLAN matching the trunk's native VLAN. An unused native VLAN, and no dynamic trunking, stop it."],["Enable port mirroring on all trunk links for monitoring","Mirroring copies traffic; it prevents nothing."],["Increase the size of the MAC address table","MAC table size relates to MAC flooding, not VLAN hopping."],["Put all user ports in the default VLAN 1 for consistency","Using VLAN 1 everywhere makes VLAN hopping easier."]],"a":0,"k":"VLAN hopping (switch spoofing, double tagging): disable DTP, set unused native VLANs, and don't use VLAN 1."},{"id":"D4-038","d":4,"obj":"4.1","diff":2,"q":"An attacker floods a switch with frames from thousands of fake MAC addresses until the switch starts sending all traffic out of every port. Which control prevents this?","o":[["DNSSEC on the internal resolvers","DNSSEC protects DNS data."],["Port security limiting MAC addresses per port","Correct. Limiting learned MAC addresses per port stops the table from filling up."],["Turning off Spanning Tree Protocol on access ports","Disabling STP risks loops and does nothing against flooding."],["A web application firewall in front of servers","A WAF protects web applications at Layer 7."]],"a":1,"k":"MAC flooding overflows the switch's address table and makes it act like a hub; port security prevents it."},{"id":"D4-039","d":4,"obj":"4.1","diff":2,"q":"What does DNSSEC provide?","o":[["Encryption of DNS queries from observers","DNSSEC does not encrypt; DNS over HTTPS or DNS over TLS do."],["Faster resolution through caching","Caching is ordinary DNS behavior."],["Origin authentication and integrity of DNS data","Correct. Digital signatures let resolvers verify that answers are authentic and unmodified, defeating cache poisoning."],["Protection against DDoS on authoritative servers","DNSSEC does not stop DDoS and can even increase response sizes."]],"a":2,"k":"DNSSEC = integrity and authenticity of DNS answers; DoH and DoT = confidentiality of queries."},{"id":"D4-040","d":4,"obj":"4.1","diff":1,"q":"An attacker sends ICMP echo requests to a network's broadcast address using the victim's address as the source, so every host replies to the victim. What is this attack?","o":[["Smurf","Correct. A Smurf attack amplifies ICMP traffic through broadcast replies."],["Fraggle","Fraggle is the UDP equivalent, using services such as echo and chargen."],["Teardrop","Teardrop sends overlapping IP fragments that crash vulnerable hosts."],["LAND","A LAND attack sends packets whose source and destination are both the victim."]],"a":0,"k":"Smurf (ICMP), Fraggle (UDP): broadcast amplification. Block directed broadcasts at routers."},{"id":"D4-041","d":4,"obj":"4.1","diff":3,"q":"A company connects branch offices with SD-WAN that sends some traffic directly to the internet from each branch. What is the MAIN security consideration?","o":[["SD-WAN degrades the quality of real-time voice and video","SD-WAN carries voice and often improves it."],["SD-WAN requires a separate router for each application","Policies are centralized; there are not separate routers per application."],["Branches will lose access to cloud services","Direct internet breakout usually improves access to cloud services."],["Each site now needs its own inspection and filtering","Correct. Local breakout bypasses headquarters' security stack, so inspection must move to the branch or the cloud, for example through SASE services."]],"a":3,"k":"SD-WAN local breakout moves the perimeter; pair it with cloud-delivered security such as SASE."},{"id":"D4-042","d":4,"obj":"4.1","diff":2,"q":"What is the main difference between network functions virtualization (NFV) and software-defined networking (SDN)?","o":[["NFV encrypts traffic between sites, while SDN does not","Neither is defined by encryption."],["NFV virtualizes network appliances; SDN centralizes control","Correct. NFV runs functions such as firewalls as software; SDN separates the control plane from forwarding. The two are complementary and are often used together."],["SDN is for cloud networks; NFV is for on-premises networks","Both can be used in either environment."],["They are two vendor names for the same underlying technology","They solve different problems."]],"a":1,"k":"NFV virtualizes network appliances; SDN centralizes control of forwarding. Both need hardened management interfaces."},{"id":"D4-043","d":4,"obj":"4.2","diff":1,"q":"Which transmission medium is immune to electromagnetic interference and the hardest to tap without detection?","o":[["Unshielded twisted pair","UTP is susceptible to interference and emanations."],["Shielded twisted pair","STP reduces interference but still carries electrical signals."],["Fiber-optic cable","Correct. Fiber carries light, so it neither emits nor picks up electromagnetic interference, and tapping it is difficult."],["Coaxial cable","Coax carries electrical signals and can be tapped."]],"a":2,"k":"Fiber resists EMI and tapping; copper is vulnerable to interference, crosstalk and emanations."},{"id":"D4-044","d":4,"obj":"4.2","diff":2,"q":"A company wants devices to pass a health check, such as current patches and running antivirus, before they get access to the corporate network. Which technology provides this?","o":[["A web application firewall","A WAF protects web applications."],["Network access control","Correct. NAC checks identity and device posture before admitting a device, and can quarantine or remediate it."],["A proxy server","Proxies mediate web traffic and do not check device posture before admission."],["Port address translation","PAT maps internal addresses to a public one."]],"a":1,"k":"NAC: authenticate the device and user, check posture, then admit, quarantine or remediate."},{"id":"D4-045","d":4,"obj":"4.2","diff":2,"q":"Which type of firewall tracks the state of each connection and allows return traffic only for sessions started from inside?","o":[["Static packet filter","Static filters inspect each packet alone, against fixed rules."],["Circuit-level gateway","Circuit-level gateways validate sessions at Layer 5 without inspecting packet contents."],["Stateful inspection firewall","Correct. Stateful firewalls keep a state table and match return packets to established connections."],["Application-level proxy","Proxies inspect application content by terminating and re-establishing connections."]],"a":2,"k":"Firewall types: packet filter (Layer 3/4), stateful (connection state), circuit-level (Layer 5), application proxy (Layer 7), NGFW."},{"id":"D4-046","d":4,"obj":"4.2","diff":1,"q":"Which network device forwards frames only out of the port where the destination MAC address is located?","o":[["Switch","Correct. Switches learn MAC addresses per port and forward frames only where needed."],["Hub","Hubs repeat every frame out of every port."],["Repeater","Repeaters only regenerate signals."],["Modem","Modems convert between digital and analog signals."]],"a":0,"k":"Hubs broadcast everything (easy sniffing); switches forward by MAC; routers forward by IP."},{"id":"D4-047","d":4,"obj":"4.2","diff":2,"q":"A core router has two power supplies on separate circuits and a 4-hour hardware replacement contract. Which aspect of the network does this address?","o":[["Network access control for devices joining the network","NAC controls who joins the network."],["Endpoint security on the router itself","Endpoint security protects hosts."],["Transmission media security","Media security concerns cables and wireless signals."],["Infrastructure operation: redundancy and support","Correct. Redundant power and support contracts keep network components available."]],"a":3,"k":"Availability of network components depends on redundant power, spares, warranty and support contracts."},{"id":"D4-048","d":4,"obj":"4.2","diff":2,"q":"Which control records detailed process, file and network activity on hosts and lets responders investigate and isolate a compromised machine?","o":[["A host-based firewall on each laptop","A host firewall filters traffic but does not record detailed activity for investigation."],["Endpoint detection and response (EDR)","Correct. EDR collects telemetry, detects suspicious behavior and supports response actions such as isolation."],["Full-disk encryption on every host","Disk encryption protects data at rest."],["An automated patch management agent","Patch agents install updates."]],"a":1,"k":"Endpoint security layers: hardening, host firewall, anti-malware, EDR, encryption, patching."},{"id":"D4-049","d":4,"obj":"4.2","diff":2,"q":"What is the main security risk of a network hub compared with a switch?","o":[["Hubs route traffic less efficiently between networks","Neither hubs nor switches route; that is the router's job."],["Hubs pass broadcast storms to every segment","Switches also flood broadcasts within a VLAN. The difference that matters is that a hub repeats every frame to every port."],["Every host can see all other hosts' traffic","Correct. Hubs repeat all traffic to all ports, which makes sniffing trivial."],["Hubs do not support IPv6","Hubs operate at Layer 1 and are unaware of IP versions."]],"a":2,"k":"Replace hubs with switches; a hub turns the whole segment into one shared, sniffable medium."},{"id":"D4-050","d":4,"obj":"4.3","diff":2,"q":"A company's VoIP calls must be protected against eavesdropping on the network. What should be used?","o":[["SRTP for the media, with SIP signaling over TLS","Correct. SRTP encrypts the voice stream, and TLS protects the call setup."],["A separate VLAN for phones, with no encryption","VLANs separate traffic but do not stop someone on that VLAN from listening."],["Caller ID verification on every call","Caller ID helps with spoofing, not eavesdropping."],["Higher-quality codecs","Codecs affect sound quality, not confidentiality."]],"a":0,"k":"Secure VoIP: SRTP for media, TLS for SIP, voice VLANs for quality and isolation, and toll-fraud controls."},{"id":"D4-051","d":4,"obj":"4.3","diff":2,"q":"Uninvited people keep joining the company's video meetings and disrupting them. Which control is MOST effective?","o":[["Recording every meeting for later review","Recording documents the disruption but does not prevent it."],["Switching the company to a different meeting tool","The problem is how meetings are configured."],["Passcodes and host-controlled waiting rooms","Correct. Requiring passcodes or authenticated users controls who can join, and admitting people deliberately, stops uninvited participants."],["Publishing meeting links only on the intranet","Links still leak and get forwarded."]],"a":2,"k":"Collaboration security: authenticated or passcode-protected meetings, waiting rooms, host controls and encryption."},{"id":"D4-052","d":4,"obj":"4.3","diff":2,"q":"Remote employees connect through a VPN configured for split tunneling. What is the main security concern?","o":[["The VPN will use far more bandwidth at headquarters","Split tunneling actually reduces headquarters bandwidth."],["Internet traffic bypasses corporate security controls","Correct. A device browsing the internet directly while on the VPN can become a bridge into the corporate network."],["Split tunneling disables encryption on the VPN tunnel","Corporate-bound traffic is still encrypted."],["Cloud applications become slower for remote users","Split tunneling usually makes cloud applications faster, not slower."]],"a":1,"k":"Split tunneling sends internet traffic around corporate controls; full tunneling or cloud security services address it."},{"id":"D4-053","d":4,"obj":"4.3","diff":2,"q":"Administrators currently connect over RDP directly from their laptops to production servers. What is the BEST way to secure administrative remote access?","o":[["Change RDP to a non-standard port","Obscurity is quickly defeated by scanning."],["Allow RDP from the internet but require long passwords","Exposing RDP to the internet invites brute-force and exploit attempts."],["Disable logging to reduce the attack surface","Logging is essential for accountability."],["Use a hardened jump host with MFA and session logging","Correct. A bastion or jump host concentrates, authenticates and records privileged access in one controlled place."]],"a":3,"k":"Remote administration: jump hosts or PAM, MFA, no direct exposure, and recorded sessions."},{"id":"D4-054","d":4,"obj":"4.3","diff":2,"q":"A hardware vendor needs remote access to maintain a storage array in your data center. What is the BEST approach?","o":[["Time-limited access you enable on request, with MFA and monitored sessions","Correct. Third-party connectivity should be granted just in time, authenticated strongly and recorded."],["A permanent VPN account shared by the vendor's engineers","Shared, standing access removes accountability and leaves a door open."],["A modem on the array so the vendor can dial in at any time","Unmanaged modems bypass network controls."],["Remote access only from the vendor's office IP addresses, without monitoring","IP restrictions help, but standing, unmonitored access is still risky."]],"a":0,"k":"Third-party access: individually authenticated, least privilege, time-bound and monitored."},{"id":"D4-055","d":4,"obj":"4.3","diff":2,"q":"Which email authentication mechanism tells receiving servers what to do with messages that fail SPF or DKIM checks, and sends reports back to the domain owner?","o":[["SPF","SPF lists the servers authorized to send mail for a domain."],["DKIM","DKIM signs messages so receivers can verify them."],["DMARC","Correct. DMARC sets a policy (none, quarantine or reject), requires alignment with the visible From domain, and provides reporting."],["S/MIME","S/MIME provides end-to-end signing and encryption of message content."]],"a":2,"k":"SPF (who may send), DKIM (signed messages), DMARC (policy, alignment, reports) work together against spoofing."},{"id":"D4-056","d":4,"obj":"4.3","diff":2,"q":"A remote site connects to headquarters over a geostationary satellite link. Which characteristic should the design account for?","o":[["Encryption overhead makes satellite links unusable","Encryption works over satellite; latency is the design constraint, not encryption."],["Satellite links are immune to interception from the ground","Satellite signals cover wide areas and can be intercepted."],["High latency and a signal exposed over a wide area","Correct. Geostationary links add significant delay and broadcast over a large footprint, so encryption is essential and protocols must tolerate latency."],["Satellite links need no redundancy","Weather and outages make backup paths important."]],"a":2,"k":"Data communications over satellite and backhaul links must be encrypted and designed for latency and availability."},{"id":"D4-057","d":4,"obj":"4.3","diff":3,"q":"A mobile operator wants to protect traffic on the backhaul links between its cell sites and core network, which pass through third-party fiber. What is the BEST control?","o":[["Rely on the fiber provider's physical security","You cannot verify a third party's physical controls along the whole path."],["Encrypt the backhaul links (IPsec or MACsec)","Correct. Link encryption protects traffic crossing infrastructure you do not control."],["Use unlisted fiber routes","Obscurity is not protection."],["Increase backhaul bandwidth","More bandwidth improves capacity, not confidentiality."]],"a":1,"k":"Encrypt traffic that crosses third-party or untrusted infrastructure, including backhaul links."},{"id":"D4-058","d":4,"obj":"4.3","diff":2,"q":"Employees use instant messaging and file sharing in a collaboration platform. Which control BEST prevents sensitive files from being shared with external guests?","o":[["Asking users to check guests' identities manually","Manual checks are inconsistent."],["Encrypting files at rest in the platform's storage","Encryption at rest protects stored media, but a user can still share a file with a guest, who then sees it decrypted."],["Requiring longer passwords for the platform","Password length does not control what is shared."],["Platform-enforced sharing policies, labels and DLP","Correct. External-sharing policy enforced by the platform, informed by sensitivity labels and DLP, prevents sensitive content leaving through collaboration channels."]],"a":3,"k":"Collaboration tools need governance: guest controls, sensitivity labels, DLP and retention policies."},{"id":"D4-059","d":4,"obj":"4.3","diff":3,"q":"Remote staff use a full-tunnel VPN. The CFO wants split tunneling so video calls go straight to the internet and stop dropping. What is the MAIN security trade-off to raise?","o":[["Split tunneling stops the VPN from encrypting corporate traffic","Corporate traffic stays inside the encrypted tunnel; only the excluded traffic goes direct."],["Direct traffic skips corporate inspection and logging","Correct. Whatever goes direct no longer passes the company's filtering and monitoring, so the endpoint's own controls must carry that load."],["Video calls become unencrypted once they leave the tunnel","Video services encrypt their own traffic; the loss is visibility, not encryption."],["Split tunneling requires users to have administrator rights","It is a client policy setting and needs no user privileges."]],"a":1,"k":"Split tunneling trades visibility for performance: direct traffic skips central inspection, so endpoint controls must compensate."},{"id":"D4-060","d":4,"obj":"4.2","diff":3,"q":"A hospital's infusion pumps cannot run endpoint agents and must stay connected to a drug library server. Which control reduces their exposure MOST?","o":[["Install antivirus on the drug library server","Protecting the server helps, but the pumps stay reachable from the rest of the network."],["Put the pumps in their own segment that allows only required flows","Correct. Segmentation with allow-listed flows limits who can reach devices that cannot protect themselves."],["Disconnect the pumps and load drug libraries manually by USB","The pumps must stay connected, and manual USB updates add their own clinical and malware risks."],["Require the pumps to authenticate with 802.1X before joining","Many embedded devices cannot do 802.1X, and admission alone does not limit what can reach an admitted device."]],"a":1,"k":"Devices that cannot run agents get compensating network controls: segmentation and allow-listed flows."},{"id":"D5-001","d":5,"obj":"5.1","diff":1,"q":"An employee holds the door open so a stranger can follow them into a secure area without badging. Which physical control is designed to prevent this?","o":[["An access control vestibule (mantrap)","Correct. A vestibule lets only one authenticated person through at a time, stopping tailgating and piggybacking."],["A badge reader with a longer read range","Read range does not stop a second person walking through behind the first."],["A security camera recording the door all day","Cameras deter and record tailgating but do not physically prevent it."],["A sign reminding staff not to hold the door for others","Signs raise awareness but enforce nothing."]],"a":0,"k":"Tailgating and piggybacking are stopped by vestibules, turnstiles and guards, and reinforced by awareness."},{"id":"D5-002","d":5,"obj":"5.1","diff":2,"q":"A company wants one place to control access to all its SaaS applications, so that disabling a user there removes their access to every app. What should it implement?","o":[["A central identity provider with single sign-on for each application","Correct. Centralizing authentication means access decisions and deprovisioning happen in one place for information, systems, applications and services."],["Separate local accounts in each application, reviewed every quarter","Local accounts multiply the places where a leaver keeps access."],["A shared administrator password for each application stored in a vault","Shared credentials remove individual accountability."],["A network firewall rule blocking each departing user's IP address","Users change IP addresses; network rules do not track identity."]],"a":0,"k":"Logical access control is strongest when identity is centralized and every application trusts it."},{"id":"D5-003","d":5,"obj":"5.1","diff":1,"q":"Which control protects an unattended, logged-in workstation from being used by a passer-by?","o":[["A cable lock attaching the computer to the desk","A cable lock prevents theft of the device, not use of the session."],["Automatic screen lock after inactivity","Correct. Session locks require reauthentication after inactivity."],["Full-disk encryption","Disk encryption protects data when the device is off, not an unlocked session."],["A privacy screen filter","Privacy filters limit viewing angles but do not stop someone sitting down at the keyboard."]],"a":1,"k":"Device access controls include screen locks, session timeouts and requiring reauthentication."},{"id":"D5-004","d":5,"obj":"5.1","diff":2,"q":"A data center uses badge readers at the entrance. Which addition would MOST improve assurance that the badge holder is the person it was issued to?","o":[["Making badges larger and easier to see","Visibility helps guards spot badges, not confirm the holder."],["Logging every badge swipe to the central SIEM","Logging records who used the badge, not who held it."],["A PIN or biometric along with the badge","Correct. Adding a second factor confirms the badge is being used by its owner, not someone who found or stole it."],["Replacing all badges with new ones every year","Rotation does not stop someone else using a valid badge today."]],"a":2,"k":"Physical access is strengthened by combining something you have (badge) with something you know or are."},{"id":"D5-005","d":5,"obj":"5.2","diff":1,"q":"A login requires a password and a security question answer. Why is this NOT multifactor authentication?","o":[["Security question answers are stored in clear text","Storage is a separate issue; the factor type is the problem."],["Two factors are needed, and this has three","There are only two items here, and both are the same type."],["Both are something you know","Correct. MFA requires factors of different types: know, have, are."],["Passwords are no longer considered a factor","Passwords remain a valid \"something you know\" factor."]],"a":2,"k":"MFA requires two or more different factor types; two knowledge factors are still single-factor authentication."},{"id":"D5-006","d":5,"obj":"5.2","diff":2,"q":"A biometric system's sensitivity is raised so that it rejects more impostors. What happens to its error rates?","o":[["The false acceptance rate falls and the false rejection rate rises","Correct. Stricter matching lets fewer impostors in (fewer Type II errors) but rejects more legitimate users (more Type I errors)."],["Both error rates fall together","Sensitivity trades one error for the other; both cannot fall together."],["The false rejection rate falls and the false acceptance rate rises","That is what happens when sensitivity is lowered."],["Neither rate changes, only the crossover error rate does","The CER is a property of the device; adjusting sensitivity moves both FAR and FRR."]],"a":0,"k":"FRR = Type I (false rejection); FAR = Type II (false acceptance). The CER (EER) compares devices: lower is better."},{"id":"D5-007","d":5,"obj":"5.2","diff":2,"q":"When comparing biometric devices, which measure indicates overall accuracy?","o":[["The false rejection rate alone","FRR alone ignores impostor acceptance."],["The time needed to enroll each user","Enrollment time affects acceptability, not accuracy."],["The throughput rate","Throughput is how many people per minute can be processed."],["The crossover error rate (CER)","Correct. The CER, also called the equal error rate, is where FAR equals FRR; a lower CER means a more accurate device."]],"a":3,"k":"Use the crossover error rate to compare biometric accuracy; a lower CER is better."},{"id":"D5-008","d":5,"obj":"5.2","diff":1,"q":"In biometrics, what is a Type II error?","o":[["A legitimate user is rejected","That is a Type I error, false rejection."],["An impostor is accepted","Correct. False acceptance is the more dangerous error for security."],["The sensor fails to capture a sample","That is a failure to capture, not a Type II error."],["The system fails to enroll a user","That is a failure to enroll."]],"a":1,"k":"Type I = false rejection (annoying); Type II = false acceptance (dangerous)."},{"id":"D5-009","d":5,"obj":"5.2","diff":2,"q":"Users keep approving MFA push notifications they did not request after attackers bombard them with prompts. Which change MOST directly counters this?","o":[["Sending prompts by SMS instead of push","SMS codes are phishable and can be intercepted by SIM swapping."],["Shortening the push notification timeout","A shorter timeout does not stop a user from approving the prompt."],["Number matching on the login screen","Correct. The user must type a code shown on the actual login screen to approve, so blind approvals of unsolicited prompts fail."],["Training users to approve only during working hours","Attackers can time their attempts to working hours."]],"a":2,"k":"MFA fatigue (prompt bombing) is countered by number matching, rate limits and phishing-resistant authenticators."},{"id":"D5-010","d":5,"obj":"5.2","diff":2,"q":"Which authentication method is MOST resistant to phishing?","o":[["One-time codes from an authenticator app","Users can be tricked into typing the code into a fake site that relays it."],["SMS one-time passcodes","SMS codes can be phished, intercepted or redirected through SIM swapping."],["Push notifications without number matching","Push approvals can be relayed or approved out of fatigue."],["FIDO2 passkeys or security keys","Correct. FIDO2 binds each credential to the real website's origin, so a look-alike site cannot use it."]],"a":3,"k":"Passwordless FIDO2/WebAuthn (passkeys, security keys) is phishing-resistant because credentials are bound to the origin."},{"id":"D5-011","d":5,"obj":"5.2","diff":2,"q":"Following NIST SP 800-63B, which password practice should an organization adopt?","o":[["Force all users to change passwords every 60 days","Routine forced changes lead to weaker, predictable passwords; change only on evidence of compromise."],["Check new passwords against lists of known breached passwords","Correct. Screening against compromised and common passwords blocks the passwords attackers try first."],["Require at least one uppercase letter, number and symbol","Composition rules add little strength and frustrate users; length matters more."],["Allow password hints visible to anyone at the login screen","Hints help attackers guess."]],"a":1,"k":"NIST 800-63B: favor length, screen against breached lists, allow paste and password managers, no forced periodic changes, no hints."},{"id":"D5-012","d":5,"obj":"5.2","diff":2,"q":"Before issuing credentials to a new remote contractor, the company verifies a government ID and confirms the person matches it on a live video call. What is this step called?","o":[["Authorization","Authorization decides what an authenticated identity may do."],["Accountability","Accountability ties actions to identities throu
