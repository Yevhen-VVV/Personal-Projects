<title>CISSP Prep</title>
<!-- Built by cissp-web/build.mjs from cissp-web/src and cissp-web/bank. Edit those files, not this one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
  /* Layout: one 720px column, built for a phone first. A fixed tab bar for the
     five sections; during a question the tab bar gives way to a sticky action bar. */
  :root {
    --bg: #edf1f0;
    --surface: #ffffff;
    --surface-2: #e2e9e8;
    --ink: #11201f;
    --muted: #556664;
    --line: #cad6d4;
    --accent: #135d6c;
    --accent-ink: #ffffff;
    --accent-soft: #d8e9ec;
    --ochre: #94570a;
    --ochre-soft: #f5e8d3;
    --good: #19753f;
    --good-soft: #dbf0e2;
    --bad: #ad3628;
    --bad-soft: #f8e0dc;
    --shadow: 0 1px 2px rgb(17 32 31 / 0.06), 0 4px 14px rgb(17 32 31 / 0.06);
    --font-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-read: "Literata", Georgia, "Times New Roman", serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 14px;
    --tabbar: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b1516;
      --surface: #122123;
      --surface-2: #1a2d30;
      --ink: #e2edeb;
      --muted: #91a6a3;
      --line: #27393c;
      --accent: #6ec4d4;
      --accent-ink: #0b1516;
      --accent-soft: #15393f;
      --ochre: #e3a64d;
      --ochre-soft: #3a2a12;
      --good: #5bcf8c;
      --good-soft: #12301f;
      --bad: #f28c7e;
      --bad-soft: #3b1c18;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b1516;
    --surface: #122123;
    --surface-2: #1a2d30;
    --ink: #e2edeb;
    --muted: #91a6a3;
    --line: #27393c;
    --accent: #6ec4d4;
    --accent-ink: #0b1516;
    --accent-soft: #15393f;
    --ochre: #e3a64d;
    --ochre-soft: #3a2a12;
    --good: #5bcf8c;
    --good-soft: #12301f;
    --bad: #f28c7e;
    --bad-soft: #3b1c18;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 var(--font-ui);
    padding-inline: 16px;
    padding-block: 0 calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px);
    -webkit-text-size-adjust: 100%;
  }
  body.focus-mode { padding-block-end: calc(96px + env(safe-area-inset-bottom, 0px)); }
  .app { max-width: 720px; margin-inline: auto; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h2 { font: 700 1.35rem/1.25 var(--font-ui); letter-spacing: -0.01em; }
  h3 { font: 700 1.05rem/1.3 var(--font-ui); }
  p { margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .mono { font-family: var(--font-mono); font-weight: 500; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; line-height: 1.45; }
  .num { font-variant-numeric: tabular-nums; }
  .measure { max-width: 64ch; }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .stack-sm { display: flex; flex-direction: column; gap: 8px; }
  .stack-lg { display: flex; flex-direction: column; gap: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }

  /* Masthead */
  .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 800 19px/1 var(--font-ui); letter-spacing: 0.02em; }
  .brand svg { color: var(--accent); flex: none; }
  .brand small { font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
  .countdown { font: 600 13px/1 var(--font-mono); color: var(--ochre); background: var(--ochre-soft); border-radius: 999px; padding: 7px 11px; white-space: nowrap; border: 0; cursor: pointer; }

  .eyebrow { font: 600 12px/1.3 var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .section-title { font: 700 12px/1.3 var(--font-ui); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-block: 8px -6px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card.raised { box-shadow: var(--shadow); }
  .card.quiet { background: transparent; }
  .note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .note.warn { background: var(--ochre-soft); }
  .note.bad { background: var(--bad-soft); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 46px; padding: 0 18px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font: 600 15px/1.2 var(--font-ui); cursor: pointer; text-decoration: none;
    transition: background-color 120ms ease, border-color 120ms ease, transform 80ms ease;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn svg { flex: none; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { filter: brightness(1.07); }
  .btn-quiet { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; min-height: 38px; }
  .btn-quiet:hover { border-color: transparent; text-decoration: underline; }
  .btn-danger { color: var(--bad); }
  .btn-danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
  .btn-wide { flex: 1 1 0; }
  .btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: 0.45; cursor: default; transform: none; }

  /* Chips */
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font-mono); padding: 5px 8px; border-radius: 7px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.ochre { background: var(--ochre-soft); color: var(--ochre); }
  .chip.good { background: var(--good-soft); color: var(--good); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dots i.on { background: var(--ochre); }

  /* Today: readiness */
  .ready { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
  .ready-figure { font: 800 3.1rem/1 var(--font-ui); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .ready-figure small { font-size: 1.2rem; font-weight: 700; }
  .meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: visible; }
  .meter > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
  .meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
  .meter-legend { display: flex; justify-content: space-between; font: 500 11px/1 var(--font-mono); color: var(--muted); margin-top: 6px; }

  .heat { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .heat button { display: flex; flex-direction: column; gap: 4px; align-items: stretch; padding: 8px 4px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; min-width: 0; }
  .heat .d { font: 700 12px/1 var(--font-mono); color: var(--muted); text-align: center; }
  .heat .v { font: 700 15px/1 var(--font-ui); text-align: center; font-variant-numeric: tabular-nums; }
  .heat .bar { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .heat .bar span { display: block; height: 100%; background: var(--muted); }
  .lvl-good .v { color: var(--good); } .lvl-good .bar span { background: var(--good); }
  .lvl-mid .v { color: var(--ochre); } .lvl-mid .bar span { background: var(--ochre); }
  .lvl-low .v { color: var(--bad); } .lvl-low .bar span { background: var(--bad); }
  .lvl-none .v { color: var(--muted); }
  @media (max-width: 480px) { .heat { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .goal { display: flex; gap: 14px; align-items: center; }
  .goal-ring { flex: none; }

  /* Menus */
  .menu { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .menu > button, .menu > a, .menu > .menu-row {
    display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; text-align: left;
    padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer; width: 100%; color: inherit; text-decoration: none;
  }
  .menu > :first-child { border-top: 0; }
  .menu > button:hover, .menu > a:hover { background: var(--surface-2); }
  .menu .title { font-weight: 650; }
  .menu .detail { grid-column: 1; font-size: 14px; color: var(--muted); }
  .menu .side { grid-row: 1 / span 2; grid-column: 2; color: var(--muted); font: 600 13px/1 var(--font-mono); }

  /* Form controls */
  .field { display: grid; gap: 6px; }
  .field label, .field .label { font-weight: 600; font-size: 14px; }
  input[type="text"], input[type="date"], input[type="number"], select, textarea {
    min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 16px; width: 100%;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { min-height: 34px; min-width: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; font: 600 14px/1 var(--font-ui); cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.14); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .check { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); font-size: 14px; font-weight: 600; }
  .check[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .switch-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; cursor: pointer; }
  .switch { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; cursor: pointer; margin: 0; transition: background-color 150ms ease; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgb(0 0 0 / 0.3); transition: transform 150ms ease; }
  .switch:checked { background: var(--accent); border-color: var(--accent); }
  .switch:checked::after { transform: translateX(20px); }

  /* The question */
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .progress-line { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
  .progress-line span { display: block; height: 100%; background: var(--accent); }
  .stem { font: 500 clamp(1.08rem, 1rem + 0.45vw, 1.24rem)/1.55 var(--font-read); white-space: pre-line; text-wrap: pretty; }
  .stem em { font-style: normal; font-weight: 700; }
  .options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .opt {
    width: 100%; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; text-align: left;
    padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
    font: 400 15.5px/1.45 var(--font-ui);
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .letter { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 14px/1 var(--font-mono); background: var(--surface-2); color: var(--muted); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-ink); }
  .opt:disabled { cursor: default; color: inherit; }
  .opt.is-right { border-color: var(--good); background: var(--good-soft); }
  .opt.is-right .letter { background: var(--good); color: var(--surface); }
  .opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.is-wrong .letter { background: var(--bad); color: var(--surface); }
  .opt.is-other { opacity: 0.92; }
  .opt .why { grid-column: 2; font-size: 14.5px; line-height: 1.5; color: var(--ink); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
  .opt .why b { font-weight: 700; }
  .opt .tagline { font: 700 11px/1 var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; margin-right: 6px; }
  .is-right .tagline { color: var(--good); }
  .is-wrong .tagline { color: var(--bad); }
  .is-other .tagline { color: var(--muted); }

  .verdict { display: flex; align-items: center; gap: 10px; font: 800 1.3rem/1.2 var(--font-ui); }
  .verdict.good { color: var(--good); }
  .verdict.bad { color: var(--bad); }
  .keypoint { border-left: 3px solid var(--ochre); padding: 4px 0 4px 14px; }
  .keypoint .eyebrow { color: var(--ochre); }
  .keypoint p { font: 500 15.5px/1.5 var(--font-read); }

  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .actionbar-inner { max-width: 720px; margin-inline: auto; display: flex; gap: 10px; align-items: center; }

  /* Ask Claude */
  .ask { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ask-out { font: 400 15px/1.55 var(--font-read); white-space: pre-wrap; }
  .ask-out.thinking { color: var(--muted); font-family: var(--font-ui); }
  .prompts { display: flex; flex-wrap: wrap; gap: 6px; }
  .prompts button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .prompts button:hover { border-color: var(--accent); }

  /* Mock exam */
  .examhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .clock { font: 700 18px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--bad); }
  .stamp { display: inline-block; font: 800 1.6rem/1 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 16px; border: 3px solid currentColor; border-radius: 8px; transform: rotate(-2deg); }
  .stamp.pass { color: var(--good); }
  .stamp.fail { color: var(--bad); }
  .scale { position: relative; height: 54px; }
  .scale .track { position: absolute; left: 0; right: 0; top: 22px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--bad-soft) 0 70%, var(--good-soft) 70% 100%); border: 1px solid var(--line); }
  .scale .cut { position: absolute; left: 70%; top: 14px; height: 26px; width: 2px; background: var(--ink); }
  .scale .you { position: absolute; top: 12px; width: 16px; height: 30px; margin-left: -8px; border-radius: 4px; background: var(--accent); border: 2px solid var(--surface); }
  .scale .ticks { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font: 500 11px/1 var(--font-mono); color: var(--muted); }
  .scale .cutlabel { position: absolute; left: 70%; top: 0; transform: translateX(-50%); font: 700 11px/1 var(--font-mono); }
  .prof { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; }
  .prof .lvl { font: 700 12px/1 var(--font-mono); padding: 5px 8px; border-radius: 6px; text-align: center; white-space: nowrap; }
  .lvl-above { background: var(--good-soft); color: var(--good); }
  .lvl-near { background: var(--ochre-soft); color: var(--ochre); }
  .lvl-below { background: var(--bad-soft); color: var(--bad); }
  .lvl-nodata { background: var(--surface-2); color: var(--muted); }

  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
  thead th { border-top: 0; font: 700 11px/1.2 var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .domain-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
  .dnum { font: 700 13px/1 var(--font-mono); color: var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 7px 8px; }
  .statline { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .statline b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font: 500 10px var(--font-mono); }

  .list-plain { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  .kp { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .kp:first-child { border-top: 0; }
  .kp p { font: 400 15px/1.5 var(--font-read); }

  /* Tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar-inner { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: repeat(6, 1fr); }
  .tabbar button {
    min-height: var(--tabbar); border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font: 600 11.5px/1 var(--font-ui); color: var(--muted);
  }
  .tabbar button[aria-current="page"] { color: var(--accent); }
  .tabbar button[aria-current="page"] svg { stroke-width: 2.3; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
  .toast.celebrate { background: var(--ochre-soft); color: var(--ochre); border: 1.5px solid var(--ochre); font-weight: 700; }

  /* Arcade */
  .level { display: flex; gap: 14px; align-items: center; }
  .lvl-badge { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font: 800 22px/1 var(--font-ui); background: var(--accent); color: var(--accent-ink); }
  .squares { display: inline-flex; gap: 4px; vertical-align: middle; }
  .squares i { width: 14px; height: 14px; border-radius: 3px; background: var(--surface-2); }
  .squares i.good { background: var(--good); }
  .squares i.bad { background: var(--bad); }
  .hearts { font: 700 17px/1 var(--font-ui); color: var(--bad); letter-spacing: 3px; }
  .opt.is-struck { opacity: 0.6; background: var(--surface); border-color: var(--bad); }
  .opt.is-struck > span:nth-child(2) { text-decoration: line-through; }
  .opt.is-struck .letter { background: var(--bad-soft); color: var(--bad); }
  .bets { display: flex; gap: 8px; flex: 1 1 auto; justify-content: flex-end; }
  .bets .btn { flex: 1 1 0; flex-direction: column; gap: 3px; min-height: 52px; padding: 4px 8px; max-width: 130px; }
  .bets .btn small { font: 500 11px/1 var(--font-mono); opacity: 0.85; }
  .cover { border: 1.5px dashed var(--line); border-radius: 12px; padding: 22px 16px; text-align: center; color: var(--muted); }

  .pool { display: flex; flex-wrap: wrap; gap: 8px; }

<script id="bank" type="application/json">{"outline":"CISSP exam outline effective April 15, 2024","domains":[{"n":1,"name":"Security and Risk Management","short":"Risk & governance","weight":16,"objectives":{"1.1":"Professional ethics","1.2":"Security concepts (CIA, authenticity, nonrepudiation)","1.3":"Security governance principles","1.4":"Legal, regulatory and compliance issues","1.5":"Investigation types","1.6":"Policies, standards, procedures and guidelines","1.7":"Business continuity requirements","1.8":"Personnel security","1.9":"Risk management concepts","1.10":"Threat modeling","1.11":"Supply chain risk management","1.12":"Security awareness, education and training"}},{"n":2,"name":"Asset Security","short":"Asset security","weight":10,"objectives":{"2.1":"Identify and classify information and assets","2.2":"Information and asset handling requirements","2.3":"Provision information and assets securely","2.4":"Data lifecycle","2.5":"Asset retention (EOL, EOS)","2.6":"Data security controls and compliance requirements"}},{"n":3,"name":"Security Architecture and Engineering","short":"Architecture & crypto","weight":13,"objectives":{"3.1":"Secure design principles","3.2":"Security models","3.3":"Select controls from system requirements","3.4":"Security capabilities of information systems","3.5":"Vulnerabilities of architectures and solution elements","3.6":"Cryptographic solutions","3.7":"Cryptanalytic attacks","3.8":"Site and facility design principles","3.9":"Site and facility security controls","3.10":"Information system lifecycle"}},{"n":4,"name":"Communication and Network Security","short":"Networks","weight":13,"objectives":{"4.1":"Secure network architecture design","4.2":"Secure network components","4.3":"Secure communication channels"}},{"n":5,"name":"Identity and Access Management","short":"Identity & access","weight":13,"objectives":{"5.1":"Physical and logical access to assets","5.2":"Identification and authentication strategy","5.3":"Federated identity with a third party","5.4":"Authorization mechanisms","5.5":"Identity and access provisioning lifecycle","5.6":"Authentication systems"}},{"n":6,"name":"Security Assessment and Testing","short":"Assessment & testing","weight":12,"objectives":{"6.1":"Assessment, test and audit strategies","6.2":"Security control testing","6.3":"Security process data","6.4":"Test output and reporting","6.5":"Security audits"}},{"n":7,"name":"Security Operations","short":"Security operations","weight":13,"objectives":{"7.1":"Investigations","7.2":"Logging and monitoring","7.3":"Configuration management","7.4":"Foundational security operations concepts","7.5":"Resource protection","7.6":"Incident management","7.7":"Detection and preventive measures","7.8":"Patch and vulnerability management","7.9":"Change management","7.10":"Recovery strategies","7.11":"Disaster recovery processes","7.12":"Testing disaster recovery plans","7.13":"Business continuity planning and exercises","7.14":"Physical security","7.15":"Personnel safety and security"}},{"n":8,"name":"Software Development Security","short":"Software security","weight":10,"objectives":{"8.1":"Security in the SDLC","8.2":"Controls in development ecosystems","8.3":"Effectiveness of software security","8.4":"Security impact of acquired software","8.5":"Secure coding guidelines and standards"}}],"questions":[{"id":"D1-001","d":1,"obj":"1.1","diff":2,"q":"A medical-device maker employs a CISSP who finds a flaw that can make an insulin pump deliver the wrong dose. A sales director tells the CISSP to keep the flaw out of a regulator filing until a fix ships next year. Under the ISC2 Code of Ethics, which canon should guide the CISSP's decision FIRST?","o":[["Provide diligent and competent service to principals","The employer is a principal, but service to principals is the third canon and gives way to the first two when they conflict."],["Advance and protect the profession","This is the fourth canon. It matters, but it is the lowest in precedence and does not address the danger to patients."],["Protect society, the common good, necessary public trust and confidence, and the infrastructure","Correct. The canons are applied in order, and the first one protects society. A safety flaw hidden from a regulator puts the public at risk, so this canon governs."],["Act honorably, honestly, justly, responsibly, and legally","Concealing the flaw would also be dishonest, but when canons conflict the first one, protecting society, takes precedence."]],"a":2,"k":"The ISC2 canons are applied in order: protect society, act honorably, serve principals, advance the profession. Public safety outranks the employer's wishes."},{"id":"D1-002","d":1,"obj":"1.1","diff":1,"q":"A candidate posts a list of questions remembered from a recent CISSP exam to an online forum. Which ISC2 Code of Ethics canon is MOST concerned with protecting the value of the credential itself?","o":[["Protect society, the common good, necessary public trust and confidence, and the infrastructure","This canon is about society at large and critical infrastructure, not the integrity of a professional credential."],["Advance and protect the profession","Correct. Leaking exam content devalues the certification for everyone who holds it, which is exactly what the fourth canon protects. It also breaches the exam NDA."],["Provide diligent and competent service to principals","Principals are employers and clients. Exam leaks do not primarily harm them."],["Act honorably, honestly, justly, responsibly, and legally","Leaking is dishonest, but the canon that specifically protects the credential and the profession is the fourth."]],"a":1,"k":"Canon 4, \"advance and protect the profession\", covers actions that undermine the credential, such as sharing exam content."},{"id":"D1-003","d":1,"obj":"1.1","diff":1,"q":"RFC 1087, \"Ethics and the Internet\", lists activities it considers unethical. Which of the following is NOT one of them?","o":[["Wasting resources such as people, capacity and computers","RFC 1087 explicitly lists wasting resources as unethical."],["Compromising the privacy of users","Compromising user privacy is on the RFC 1087 list."],["Disrupting the intended use of the internet","Disrupting intended use is on the RFC 1087 list."],["Authorized testing of your own systems","Correct. Authorized testing of your own systems is not on the list. RFC 1087 condemns unauthorized access, disruption, waste, destroying the integrity of information and compromising privacy."]],"a":3,"k":"RFC 1087 calls unethical: seeking unauthorized access, disrupting intended use, wasting resources, destroying integrity of information, and compromising privacy."},{"id":"D1-004","d":1,"obj":"1.1","diff":2,"q":"A security manager is drafting a code of ethics for the organization. Which step will do the MOST to make the code effective?","o":[["Publishing it on the intranet with a link in the employee handbook","Publication makes the code available but does nothing to show it matters or that it will be applied."],["Having senior leadership adopt it and visibly follow it themselves","Correct. A code of ethics works when leadership sponsors it and models it. Tone at the top is what turns a document into a culture."],["Copying the ISC2 Code of Ethics word for word so it carries professional authority","The ISC2 code is written for certified professionals. An organizational code must reflect the organization's own values and context."],["Assigning the security team to investigate every reported violation","Enforcement matters, but without leadership ownership the code is seen as a security-team rule rather than an organizational value."]],"a":1,"k":"Codes of ethics, like policies, succeed through senior management sponsorship and visible example."},{"id":"D1-005","d":1,"obj":"1.2","diff":1,"q":"A partner signs a purchase order with their private key and sends it to you. Which security objective does the digital signature NOT provide on its own?","o":[["Integrity","A signature covers a hash of the message, so any change is detected. It does provide integrity."],["Confidentiality","Correct. Anyone with the sender's public key can verify the signature, and the message itself is not encrypted. To keep it secret it must also be encrypted."],["Nonrepudiation","Only the holder of the private key could have produced the signature, so the sender cannot credibly deny it."],["Authenticity of the origin","Verifying with the sender's public key proves the message came from the private-key holder."]],"a":1,"k":"Digital signatures give integrity, authentication of origin and nonrepudiation, but not confidentiality."},{"id":"D1-006","d":1,"obj":"1.2","diff":2,"q":"An attacker registers a look-alike domain and sends an unaltered copy of a real invoice, changing only the sender address, so the payment goes to the attacker. The invoice text was never modified. Which security property did the victim fail to verify?","o":[["Integrity","The invoice content was not modified, so integrity was not the failure."],["Availability","Nothing was made unavailable. The systems worked as designed."],["Confidentiality","No secret data was disclosed in this scenario."],["Authenticity","Correct. Authenticity is assurance that the data comes from who it claims to come from. The content was genuine, but its source was not."]],"a":3,"k":"Authenticity is about the genuineness of the source; integrity is about whether the content changed. One can hold while the other fails."},{"id":"D1-007","d":1,"obj":"1.2","diff":1,"q":"Which control MOST directly supports availability?","o":[["Hashing stored files and checking the hashes weekly","Hash checks detect changes. That supports integrity."],["A load-balanced cluster spanning two sites","Correct. Redundancy and load balancing keep a service reachable when a component fails, which is availability."],["Encrypting the database at rest","Encryption at rest protects confidentiality."],["Recording every administrator command in an audit log","Audit logs support accountability and detection, not availability."]],"a":1,"k":"Availability controls include redundancy, fault tolerance, clustering, backups and capacity planning."},{"id":"D1-008","d":1,"obj":"1.2","diff":2,"q":"Two banks authenticate transfer messages with a message authentication code (MAC) computed with a shared secret key. A dispute arises over whether one bank actually sent a transfer. Why can't the MAC settle the dispute?","o":[["MACs do not detect changes to the message","A MAC does detect modification. That is its purpose."],["The MAC does not cover the transfer's timestamp","Which fields a MAC covers is a design detail; even a MAC over every field cannot show which key holder created it."],["Either bank holds the same key, so either could have produced the MAC","Correct. Nonrepudiation requires that only one party could have created the proof. With a shared symmetric key, both parties could compute the same MAC."],["The MAC algorithm reveals the key to anyone who sees the message","A properly designed MAC does not reveal its key."]],"a":2,"k":"Nonrepudiation needs asymmetric digital signatures. Symmetric MACs prove integrity and authenticity between the key holders, not to a third party."},{"id":"D1-009","d":1,"obj":"1.3","diff":1,"q":"A new CISO is building the information security strategy. From what should it be derived PRIMARILY?","o":[["The latest threat intelligence reports for the industry","Threat intelligence informs priorities, but strategy starts from what the business is trying to achieve."],["A widely used control framework such as ISO/IEC 27001","Frameworks help structure the program; they do not define its purpose."],["The regulatory requirements that apply to the organization","Compliance is one input. Strategy must serve the whole mission, not just legal obligations."],["The organization's mission, goals and business objectives","Correct. Security exists to support the business. The strategy aligns with its mission and objectives, and everything else is an input."]],"a":3,"k":"Security governance aligns the security function with business strategy, goals, mission and objectives."},{"id":"D1-010","d":1,"obj":"1.3","diff":2,"q":"Your company has agreed to acquire a smaller competitor, and its network is due to be connected to yours within 90 days. What should the security team do FIRST?","o":[["Establish a site-to-site VPN so integration can start early","Connecting before you understand the other environment imports unknown risk directly into your network."],["Assess the acquired company's security posture, policies and existing risks","Correct. Due diligence comes before integration: understand their controls, incidents, compliance gaps and liabilities, then plan how to connect safely."],["Replace all of the acquired company's systems with your standard builds","That may eventually happen, but it is expensive and premature before you know what they have."],["Require the acquired staff to sign your acceptable use policy","Useful later in onboarding, but it does not tell you what risk you are taking on."]],"a":1,"k":"In acquisitions and mergers, assess the other organization's security before connecting systems or sharing data."},{"id":"D1-011","d":1,"obj":"1.3","diff":2,"q":"A company is divesting a business unit, which will become a separate company. Which concern should the security team prioritize?","o":[["Extending the parent's security policies to the new company for a year","The new company will set its own policies; the urgent risk is access and data crossing the new boundary."],["Negotiating which of the two companies keeps the security operations staff","A staffing question. It does not protect information."],["Transferring the unit's software licenses on time","A legal and procurement task with little security impact."],["Revoking departing staff's access and separating each company's data","Correct. Divestitures create risk that people and systems leaving the organization keep access to, or copies of, data they should no longer have."]],"a":3,"k":"In divestitures, focus on separating data and revoking access so that nothing leaves with the departing unit that should not."},{"id":"D1-012","d":1,"obj":"1.3","diff":1,"q":"Who bears ultimate responsibility for protecting an organization's information assets?","o":[["The chief information security officer","The CISO runs the security program and advises, but accountability rests above that role."],["Senior management, such as the CEO and the board","Correct. Senior management is ultimately accountable for security and for the risk decisions the organization makes."],["The data custodians who operate the systems","Custodians implement controls day to day; they are not ultimately accountable."],["Each individual user","Users are responsible for following policy, but not for the organization's security as a whole."]],"a":1,"k":"Senior management holds ultimate responsibility for security; it can delegate tasks but not accountability."},{"id":"D1-013","d":1,"obj":"1.3","diff":2,"q":"Before signing with a cloud provider, an organization reviews the provider's SOC 2 Type II report, its incident history and its answers to a security questionnaire. What does this activity BEST demonstrate?","o":[["Due diligence","Correct. Investigating and verifying a provider before committing is due diligence: knowing what you are getting into."],["Due care","Due care is acting reasonably to protect assets, such as applying controls. Here the organization is researching, not yet acting."],["Risk transference","Transference shifts the financial impact of a risk, for example through insurance or contracts. Reviewing a report does not shift anything."],["Risk acceptance","Risk acceptance is a decision to live with a risk. Investigating a provider before signing is due diligence."]],"a":0,"k":"Due diligence is researching and verifying (knowing); due care is doing what a reasonable person would do (acting)."},{"id":"D1-014","d":1,"obj":"1.3","diff":2,"q":"A company applies a vendor's critical security patch to its internet-facing web servers within days of release, as a prudent organization in its position would. What does this BEST demonstrate?","o":[["Due diligence","Due diligence is the investigation and planning behind decisions. Applying the patch is the action itself."],["Defense in depth","Defense in depth means layering controls. A single patch does not illustrate it."],["Due care","Correct. Due care is taking the reasonable actions a prudent person would take to protect assets. Failing to do so is the basis of negligence."],["Risk avoidance","Avoidance means stopping the risky activity altogether, such as taking the servers offline for good."]],"a":2,"k":"Due care is doing the right thing; failing to exercise it can make an organization negligent."},{"id":"D1-015","d":1,"obj":"1.3","diff":1,"q":"Which framework is designed for the governance and management of enterprise IT, aligning IT with business goals through components such as processes, organizational structures and information flows?","o":[["PCI DSS","PCI DSS is an industry standard for protecting payment card data."],["SABSA","SABSA is a framework for enterprise security architecture, not IT governance as a whole."],["COBIT","Correct. COBIT, from ISACA, is a framework for governing and managing enterprise IT so that it delivers business value."],["NIST SP 800-53","SP 800-53 is a catalog of security and privacy controls, not an IT governance framework."]],"a":2,"k":"COBIT is the IT governance framework; ISO 27001 defines an ISMS; SABSA is security architecture; PCI DSS protects card data."},{"id":"D1-016","d":1,"obj":"1.3","diff":2,"q":"An organization wants an independent certification that its information security management system meets an international standard. Which standard will the auditor certify against?","o":[["ISO/IEC 27002","ISO 27002 is guidance on implementing controls. Organizations are not certified against it."],["ISO/IEC 27001","Correct. ISO 27001 sets out the requirements for an ISMS, and certification audits are performed against it."],["ISO 31000","ISO 31000 provides risk management guidelines. It is not a certifiable ISMS standard."],["ISO/IEC 27701","ISO 27701 covers privacy information management. Certification of an information security management system is against 27001."]],"a":1,"k":"ISO 27001 is the certifiable ISMS requirements standard; ISO 27002 is the companion code of practice for controls."},{"id":"D1-017","d":1,"obj":"1.3","diff":1,"q":"A software-as-a-service company wants to sell its platform to U.S. federal civilian agencies. Under which program will it most likely need a security authorization?","o":[["PCI DSS","PCI DSS applies to organizations handling payment card data."],["HITRUST","HITRUST is a certifiable framework common in healthcare, not the federal cloud program."],["SOC 2","A SOC 2 report is useful assurance, but federal agencies require a specific authorization for cloud services."],["FedRAMP","Correct. FedRAMP standardizes security assessment and authorization of cloud products and services used by U.S. federal agencies."]],"a":3,"k":"FedRAMP authorizes cloud services for U.S. federal use, building on NIST SP 800-53 controls."},{"id":"D1-018","d":1,"obj":"1.4","diff":1,"q":"Under the EU General Data Protection Regulation (GDPR), how quickly must a controller notify the supervisory authority of a personal data breach, where feasible, after becoming aware of it?","o":[["Within 24 hours","24 hours is not the GDPR deadline."],["Within 72 hours","Correct. GDPR Article 33 requires notification without undue delay and, where feasible, within 72 hours of becoming aware of the breach."],["Within 7 days","Seven days is too long under GDPR."],["Within 30 days","Thirty days is far beyond the GDPR requirement."]],"a":1,"k":"GDPR: notify the supervisory authority within 72 hours of becoming aware of a personal data breach, where feasible."},{"id":"D1-019","d":1,"obj":"1.4","diff":1,"q":"A payroll SaaS provider processes employees' personal data only on its customers' documented instructions. Under GDPR, what is the provider's role?","o":[["Data controller","The controller decides the purposes and means of processing. Here the customers decide."],["Data subject","Data subjects are the individuals the data is about: the employees."],["Data processor","Correct. A processor handles personal data on behalf of, and on the instructions of, the controller."],["Data protection officer","A DPO is a role within an organization that oversees GDPR compliance, not a party processing data for others."]],"a":2,"k":"Controllers decide why and how personal data is processed; processors act on the controller's instructions."},{"id":"D1-020","d":1,"obj":"1.4","diff":2,"q":"A U.S. company wants to transfer personal data about EU customers to its headquarters in the United States. Which option provides a recognized legal basis for the transfer?","o":[["Encrypting the data with AES-256 while it is transferred across the Atlantic","Encryption is a good safeguard, but it is not by itself a legal transfer mechanism under GDPR."],["Standard contractual clauses (SCCs) approved by the European Commission","Correct. SCCs, backed by a transfer risk assessment, are a recognized mechanism for international transfers. The EU–U.S. Data Privacy Framework is another option for self-certified U.S. organizations."],["Self-certifying under the EU–U.S. Privacy Shield program","Privacy Shield was invalidated by the Court of Justice of the EU in 2020 (Schrems II) and is no longer a valid basis."],["Holding an ISO/IEC 27001 certificate for the U.S. data center","Certification shows good security management but is not a legal basis for transborder transfers."]],"a":1,"k":"Transborder transfers of EU personal data need a legal mechanism such as an adequacy decision, the Data Privacy Framework, SCCs or binding corporate rules."},{"id":"D1-021","d":1,"obj":"1.4","diff":1,"q":"A beverage company wants to protect its recipe indefinitely without ever disclosing it publicly. Which form of intellectual property protection fits BEST?","o":[["Patent","A patent requires public disclosure and expires, typically 20 years after filing."],["Copyright","Copyright protects the expression of a work, not a formula or process."],["Trade secret","Correct. A trade secret is protected for as long as the owner keeps it secret through reasonable measures such as NDAs and access controls."],["Trademark","A trademark protects brand names and logos, not the recipe."]],"a":2,"k":"Trade secrets last as long as they stay secret; patents trade public disclosure for limited-term exclusivity."},{"id":"D1-022","d":1,"obj":"1.4","diff":1,"q":"Which form of intellectual property protection exists automatically as soon as an original work is fixed in a tangible form, without registration?","o":[["Copyright","Correct. Copyright arises on creation. Registration is optional, though in the U.S. it is needed before suing for infringement."],["Patent","Patents must be applied for and granted."],["Trademark","Trademark rights can arise from use, but registration is the norm, and a trademark protects brands rather than original works."],["Utility model","Utility models, available in some countries, must be registered."]],"a":0,"k":"Copyright is automatic on creation; patents and registered trademarks must be applied for."},{"id":"D1-023","d":1,"obj":"1.4","diff":2,"q":"A U.S. manufacturer plans to ship firewalls with strong encryption to customers in several countries. Which rules must it review before shipping?","o":[["The Health Insurance Portability and Accountability Act (HIPAA)","HIPAA governs protected health information, not product exports."],["The Export Administration Regulations (EAR)","Correct. The EAR, administered by the Commerce Department's Bureau of Industry and Security, controls exports of dual-use items, including many encryption products."],["The Gramm-Leach-Bliley Act (GLBA)","GLBA concerns financial institutions' handling of customer information."],["The Federal Information Security Modernization Act (FISMA)","FISMA governs security programs in U.S. federal agencies."]],"a":1,"k":"Encryption products are dual-use items subject to export controls such as the EAR; the Wassenaar Arrangement coordinates such controls internationally."},{"id":"D1-024","d":1,"obj":"1.4","diff":1,"q":"A retailer is opening stores in mainland China and will collect personal information from Chinese residents. Which law primarily governs that personal information?","o":[["POPIA","POPIA is South Africa's Protection of Personal Information Act."],["CCPA","The CCPA protects California residents."],["PIPEDA","PIPEDA is Canada's federal private-sector privacy law."],["PIPL","Correct. China's Personal Information Protection Law governs processing of personal information of individuals in China, including strict rules on cross-border transfers."]],"a":3,"k":"Know the main privacy laws named in the outline: GDPR (EU), CCPA (California), PIPL (China), POPIA (South Africa)."},{"id":"D1-025","d":1,"obj":"1.4","diff":1,"q":"Which U.S. federal law is the primary statute criminalizing unauthorized access to protected computers?","o":[["Electronic Communications Privacy Act","ECPA protects the privacy of electronic communications, such as against interception."],["Digital Millennium Copyright Act","The DMCA concerns copyright, including circumventing copy protection."],["Computer Fraud and Abuse Act","Correct. The CFAA criminalizes unauthorized access to protected computers and related offenses."],["Federal Information Security Modernization Act","FISMA requires federal agencies to run security programs. It does not define computer crimes."]],"a":2,"k":"The CFAA is the core U.S. computer crime law."},{"id":"D1-026","d":1,"obj":"1.4","diff":2,"q":"After a ransomware attack exposed files on a file server, legal counsel asks the CISO whether the company must notify anyone. What determines the answer MOST?","o":[["Whether the company decided to pay the ransom demand","Paying or not paying does not change notification obligations."],["Whether the attacker has already published the stolen data online","Many laws trigger on unauthorized access or acquisition, not public release."],["The data types, the affected people's locations, and contracts","Correct. Breach notification duties come from the laws of the jurisdictions where affected individuals reside, sector regulations, and contractual commitments, all of which depend on the data involved."],["Whether the attacker encrypted the files on the server","Encryption by the attacker is the attack, not a safe harbor. Safe harbors apply when the organization's own encryption kept data unreadable."]],"a":2,"k":"Breach notification depends on data type, jurisdiction of the affected individuals, sector regulation and contracts."},{"id":"D1-027","d":1,"obj":"1.4","diff":2,"q":"A merchant asks why it must comply with PCI DSS even though no national law names the standard. From what do PCI DSS obligations PRIMARILY arise?","o":[["A federal statute enforced by the Federal Trade Commission","PCI DSS is not a law, and no federal statute mandates it."],["Contracts with the card brands and acquiring banks","Correct. PCI DSS is an industry standard enforced through merchant and service-provider agreements. Some states reference it, but the obligation is fundamentally contractual."],["The organization's own information security policy","Internal policy may adopt PCI DSS, but the obligation comes from outside the organization."],["ISO/IEC 27001 certification requirements","ISO certification is voluntary and separate from PCI DSS."]],"a":1,"k":"Not every compliance requirement is law: PCI DSS is contractual, enforced by the payment card brands through acquirers."},{"id":"D1-028","d":1,"obj":"1.5","diff":1,"q":"A company sues a former contractor for breach of contract over a data leak. What standard of proof applies?","o":[["Beyond a reasonable doubt","That is the standard for criminal cases."],["Preponderance of the evidence","Correct. Civil cases are decided on the preponderance of the evidence: more likely than not."],["Clear and present danger","That phrase relates to free-speech law, not a standard of proof."],["Probable cause","Probable cause is the threshold for warrants and arrests, not for deciding a civil case."]],"a":1,"k":"Criminal: beyond a reasonable doubt. Civil: preponderance of the evidence."},{"id":"D1-029","d":1,"obj":"1.5","diff":2,"q":"During an internal administrative investigation into an employee's misuse of email, the investigator finds evidence that the employee also sold customer records to an outside party. What should the investigator do NEXT?","o":[["Finish the administrative investigation and issue a written warning","The matter may now be criminal. Continuing as a routine HR case risks mishandling evidence."],["Confront the employee to obtain a confession","Confronting the subject may prompt destruction of evidence and is not the investigator's call at this stage."],["Delete the copies of the records to limit further exposure","Destroying material is spoliation of evidence and could itself be unlawful."],["Pause, preserve the evidence and escalate to legal counsel and management","Correct. The investigation may become criminal or civil. Counsel decides on involving law enforcement, and evidence must be handled to court standards from now on."]],"a":3,"k":"An administrative investigation can turn criminal; when it does, preserve evidence and involve legal counsel before going further."},{"id":"D1-030","d":1,"obj":"1.5","diff":1,"q":"A government agency investigates whether a bank broke rules that the agency itself issues and enforces. What type of investigation is this?","o":[["Civil","Civil investigations support lawsuits between private parties."],["Administrative","Administrative investigations are internal to an organization, such as an HR or policy matter."],["Regulatory","Correct. Regulatory investigations are conducted by government bodies when an organization may have violated administrative law or regulations. The standard of proof varies."],["Criminal","Criminal investigations, by law enforcement, concern violations of criminal law."]],"a":2,"k":"Investigation types: administrative (internal), criminal, civil, regulatory, and industry-standards based."},{"id":"D1-031","d":1,"obj":"1.6","diff":1,"q":"A document states: \"All company laptops must use full-disk encryption with AES-256.\" What type of document is this?","o":[["Policy","A policy states high-level management intent, such as \"data on portable devices must be protected.\" It does not name an algorithm."],["Standard","Correct. Standards are mandatory, specific requirements, such as a particular technology or setting, that support a policy."],["Guideline","Guidelines are recommendations and are not mandatory. This statement says \"must\"."],["Procedure","A procedure gives step-by-step instructions for how to do something, such as how to enable encryption on a laptop."]],"a":1,"k":"Policy (why, mandatory, high level) → standard (what, mandatory, specific) → procedure (how, step by step); guidelines are optional advice."},{"id":"D1-032","d":1,"obj":"1.6","diff":1,"q":"Which type of security document is discretionary rather than mandatory?","o":[["Baseline","A baseline sets a mandatory minimum configuration."],["Procedure","Procedures are mandatory step-by-step instructions."],["Standard","Standards are mandatory."],["Guideline","Correct. Guidelines recommend how to meet a policy or standard when there is no specific requirement."]],"a":3,"k":"Guidelines are the only discretionary document in the policy framework."},{"id":"D1-033","d":1,"obj":"1.6","diff":1,"q":"The security team defines the minimum set of security settings that every Windows server must have before it can be connected to the production network. What is this called?","o":[["A baseline","Correct. A baseline is the minimum security level a system must meet, often expressed as a configuration build."],["A guideline","Guidelines are optional recommendations."],["A policy","Policies are high-level statements of intent, not configuration settings."],["A procedure","A procedure describes how to perform a task, such as how to apply the baseline."]],"a":0,"k":"A baseline is a mandatory minimum configuration; organizations often derive it from benchmarks such as CIS and then tailor it."},{"id":"D1-034","d":1,"obj":"1.6","diff":2,"q":"A new regulation changes how customer data must be retained. The organization's security documentation follows the usual policy framework. Which document should be updated FIRST?","o":[["The procedures that staff follow to archive records","Procedures implement standards and policy. Changing them first leaves the higher documents out of step."],["The data retention policy","Correct. Change flows top-down: management's policy sets the direction, then standards and procedures are updated to support it."],["The guidelines for choosing storage media","Guidelines are optional and sit at the bottom of the hierarchy."],["The configuration baselines for the archive servers","Baselines may need to change, but they follow from the policy and standards."]],"a":1,"k":"Documentation changes cascade from policy down to standards, baselines, procedures and guidelines."},{"id":"D1-035","d":1,"obj":"1.7","diff":1,"q":"What is the PRIMARY purpose of a business impact analysis (BIA)?","o":[["To choose the alternate site for disaster recovery","Choosing recovery strategies comes after the BIA and depends on its results."],["To test whether the business continuity plan works","Testing happens after the plan is written."],["To identify critical functions and the impact of losing them","Correct. The BIA identifies what matters most and how quickly loss of it hurts, producing values such as MTD, RTO and RPO that drive the rest of the plan."],["To calculate the annualized loss expectancy for every IT asset","Some BIAs use quantitative values, but the purpose is prioritizing business functions, not cataloguing ALE."]],"a":2,"k":"The BIA tells you what to recover first and how fast; strategy selection depends on it."},{"id":"D1-036","d":1,"obj":"1.7","diff":1,"q":"The business impact analysis sets the maximum tolerable downtime (MTD) for order processing at 24 hours. What must the recovery time objective (RTO) be?","o":[["Greater than 24 hours, to leave room for testing","An RTO longer than the MTD means the business fails before recovery completes."],["Exactly 48 hours, twice the MTD","Doubling the MTD guarantees recovery would be too late."],["Independent of the MTD, set by the IT department's capacity","The RTO is driven by the business tolerance in the MTD, not by IT convenience."],["Less than or equal to 24 hours","Correct. The RTO is the target for restoring the function and must not exceed the MTD."]],"a":3,"k":"RTO ≤ MTD. The MTD is the business's limit; the RTO is the recovery target set inside it."},{"id":"D1-037","d":1,"obj":"1.7","diff":1,"q":"The sales system can lose no more than 15 minutes of transactions in a disaster. Which metric does this define?","o":[["Recovery time objective","The RTO is how quickly the system must be back, not how much data can be lost."],["Recovery point objective","Correct. The RPO is the maximum acceptable data loss measured in time, and it drives backup and replication frequency."],["Mean time to repair","MTTR is the average time to fix a failed component."],["Maximum tolerable downtime","MTD is the longest the function can be unavailable before the damage is unacceptable."]],"a":1,"k":"RPO = how much data you can afford to lose (time since last good copy); RTO = how long you can be down."},{"id":"D1-038","d":1,"obj":"1.7","diff":3,"q":"Following the business impact analysis steps described in the CISSP Official Study Guide, the team has identified and ranked the organization's business priorities. What is the NEXT step?","o":[["Resource prioritization","Resource prioritization is the final BIA step, after impacts are assessed."],["Impact assessment","Impact assessment comes after you know the risks and how likely they are."],["Risk identification","Correct. The order is identify priorities, risk identification, likelihood assessment, impact assessment, then resource prioritization."],["Likelihood assessment","You must identify the risks before you can estimate how likely they are."]],"a":2,"k":"BIA steps (OSG): priorities → risk identification → likelihood → impact → resource prioritization."},{"id":"D1-039","d":1,"obj":"1.7","diff":2,"q":"The BIA shows that payroll, a critical process, depends entirely on a single SaaS provider. What should the business continuity team do?","o":[["Exclude the process from the plan because the provider is responsible for it","Outsourcing the service does not outsource the business's responsibility to keep paying staff."],["Review the provider's continuity commitments and plan for its failure","Correct. The provider is an external dependency, and those belong in BC requirements. Verify the provider's BC/DR capabilities and SLAs, and plan a workaround if it fails."],["Move payroll back in-house immediately","That may not be justified. The first step is to understand and manage the dependency."],["Buy cyber insurance to cover the outage","Insurance compensates for loss but does not keep payroll running."]],"a":1,"k":"BC requirements must include external dependencies such as suppliers, utilities and cloud services."},{"id":"D1-040","d":1,"obj":"1.7","diff":1,"q":"Which phase comes FIRST in the business continuity planning process described in the CISSP Official Study Guide?","o":[["Business impact analysis","The BIA is the second phase."],["Continuity planning","Continuity planning develops strategies after the BIA."],["Project scope and planning","Correct. It covers business organization analysis, selecting the BCP team, resource requirements and legal requirements, with senior management support."],["Approval and implementation","Approval and implementation is the final phase."]],"a":2,"k":"BCP phases: project scope and planning → BIA → continuity planning → approval and implementation."},{"id":"D1-041","d":1,"obj":"1.8","diff":1,"q":"Which control is MOST effective at preventing the hiring of someone with a history of financial fraud into a finance role?","o":[["Mandatory vacations for all finance staff","Mandatory vacations help detect fraud after hiring; they do not prevent the hire."],["Background checks before an offer is final","Correct. Pre-employment screening, within the law, is a preventive personnel control."],["Job rotation within the finance department","Rotation helps detect fraud by existing staff."],["Exit interviews when employees leave","Exit interviews happen at the end of employment."]],"a":1,"k":"Personnel security starts before hiring: job descriptions, screening and background checks."},{"id":"D1-042","d":1,"obj":"1.8","diff":1,"q":"A system administrator with privileged access is being terminated. When should the administrator's access be disabled?","o":[["At the end of the last working day after notification","That leaves a window in which an upset administrator could cause damage."],["After the exit interview is complete","The exit interview should happen with access already removed."],["At the moment they are told, or just before","Correct. Coordinate with HR so access is revoked as the termination is communicated, and have the person escorted."],["Within 30 days, per the standard account review","Waiting for a periodic review is far too slow for a privileged user."]],"a":2,"k":"Revoke a departing employee's access at the moment of notification, especially for privileged or involuntary terminations."},{"id":"D1-043","d":1,"obj":"1.8","diff":1,"q":"An analyst moves from the finance department to marketing. What should happen to the analyst's access?","o":[["Keep the finance access in case the analyst is asked to help","Retaining old rights leads to privilege creep."],["Freeze all access until a full background check is repeated","A transfer does not normally require a new background check, and freezing all access is disruptive."],["Add marketing access and review the finance access at the annual recertification","Waiting a year leaves unnecessary access in place."],["Remove the finance access and grant what the marketing role needs","Correct. A transfer should be handled like an exit from one role and an entry to another, which prevents privilege creep."]],"a":3,"k":"Transfers must remove old access as well as grant new access; otherwise privileges accumulate."},{"id":"D1-044","d":1,"obj":"1.8","diff":2,"q":"What is the BEST way to make sure an outside contractor follows your organization's security requirements?","o":[["Brief the contractor in person during the onboarding session","A briefing is useful but not enforceable."],["Rely on the contractor's ISO/IEC 27001 certificate","Certification shows the contractor runs an ISMS, not that it meets your specific requirements."],["Write the obligations and a right to audit into the contract","Correct. Contracts and SLAs make security requirements enforceable and give you a way to verify compliance."],["Email the contractor a copy of your security policies","Sending policies informs but does not bind the contractor."]],"a":2,"k":"Vendor, consultant and contractor controls belong in contracts: security requirements, NDAs, SLAs and the right to audit."},{"id":"D1-045","d":1,"obj":"1.8","diff":1,"q":"When should a new employee sign the acceptable use policy?","o":[["After the first performance review","Months of system access without agreeing to the rules is too long."],["Before being given access to systems and data","Correct. Users should acknowledge the rules before using the systems, which also supports later enforcement."],["Only if the employee will handle confidential data","Everyone with system access should agree to acceptable use."],["At the end of the probation period","Access usually starts on day one, so the agreement must come first."]],"a":1,"k":"Onboarding includes policy acknowledgments such as the AUP and NDA before access is granted."},{"id":"D1-046","d":1,"obj":"1.9","diff":2,"q":"A data center's equipment is valued at $200,000. A flood would destroy 40% of it, and floods are expected once every 20 years. What is the annualized loss expectancy (ALE)?","o":[["$80,000","$80,000 is the single loss expectancy (200,000 × 0.4), not the annualized figure."],["$4,000","Correct. SLE = AV × EF = $200,000 × 0.4 = $80,000. ARO = 1/20 = 0.05. ALE = SLE × ARO = $4,000."],["$10,000","$10,000 would be the asset value divided by 20, which ignores the exposure factor."],["$8,000","$8,000 multiplies the SLE by 0.1, which would mean a flood every 10 years."]],"a":1,"k":"SLE = AV × EF; ALE = SLE × ARO."},{"id":"D1-047","d":1,"obj":"1.9","diff":2,"q":"A risk has an ALE of $20,000 per year. A safeguard costing $12,000 per year would reduce the ALE to $5,000. What is the annual value of the safeguard to the organization?","o":[["$15,000","$15,000 is the reduction in ALE, but it ignores the safeguard's cost."],["$8,000","$8,000 subtracts the cost from the original ALE but ignores the remaining ALE."],["–$7,000","This compares the remaining ALE with the cost, which is not the formula."],["$3,000","Correct. Value = ALE before − ALE after − annual cost = $20,000 − $5,000 − $12,000 = $3,000. It is positive, so the safeguard is cost-justified."]],"a":3,"k":"Safeguard value = (ALE before − ALE after) − annual cost of the safeguard."},{"id":"D1-048","d":1,"obj":"1.9","diff":1,"q":"A company buys a cybersecurity insurance policy to cover losses from data breaches. Which risk response is this?","o":[["Risk avoidance","Avoidance stops the risky activity entirely."],["Risk mitigation","Mitigation reduces likelihood or impact with controls."],["Risk transference","Correct. Insurance transfers (shares) the financial impact of the risk to a third party."],["Risk acceptance","Acceptance means consciously bearing the risk without further action."]],"a":2,"k":"Risk responses: mitigate (reduce), transfer or share (insurance, contracts), avoid (stop the activity), accept. Ignoring risk is never acceptable."},{"id":"D1-049","d":1,"obj":"1.9","diff":2,"q":"A system owner wants to launch an application with a known medium-severity vulnerability, because the vendor's fix will take six months. What should the security professional do?","o":[["Block the launch until the vendor's fix is available and tested in staging","The security professional advises; the business decides. A blanket block ignores the business case."],["Approve the launch personally, since the severity is only medium","The security professional does not own the risk and should not be the one to accept it."],["Document it and get formal risk acceptance from the accountable manager","Correct. Risk acceptance is a documented management decision by the risk owner, ideally with compensating controls and a date to revisit it."],["Launch quietly and fix it when the patch arrives","Undocumented risk is unmanaged risk."]],"a":2,"k":"Security advises; the accountable manager or risk owner formally accepts residual risk."},{"id":"D1-050","d":1,"obj":"1.9","diff":2,"q":"A risk team collects anonymous opinions from experts in several rounds, sharing summarized results between rounds until the group converges. What is this approach called?","o":[["Monte Carlo simulation","Monte Carlo is a quantitative technique using repeated random sampling."],["The Delphi technique","Correct. Delphi gathers anonymous expert input over multiple rounds to reach consensus, avoiding groupthink. It is used in qualitative analysis."],["Fault tree analysis","Fault trees model combinations of failures that lead to an event."],["Annualized loss expectancy","ALE is a quantitative calculation, not a consensus technique."]],"a":1,"k":"The Delphi technique is an anonymous, iterative consensus method used in qualitative risk analysis."},{"id":"D1-051","d":1,"obj":"1.9","diff":1,"q":"A merchant cannot meet a PCI DSS requirement as written because of a legacy system, so it implements an alternative control that meets the intent of the requirement. What type of control is this?","o":[["Deterrent","Deterrent controls discourage violations, such as warning banners."],["Corrective","Corrective controls restore systems after an incident."],["Directive","Directive controls direct behavior, such as policies."],["Compensating","Correct. A compensating control provides an alternative way to meet a requirement when the primary control is not feasible."]],"a":3,"k":"Compensating controls substitute for a required control that cannot be implemented as specified."},{"id":"D1-052","d":1,"obj":"1.9","diff":2,"q":"In the NIST Risk Management Framework (SP 800-37), which step immediately follows Implement?","o":[["Authorize","Authorization comes after the controls have been assessed."],["Monitor","Monitoring is the last step, continuing after authorization."],["Assess","Correct. The steps are Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor."],["Select","Controls are selected before they are implemented."]],"a":2,"k":"NIST RMF: Prepare → Categorize → Select → Implement → Assess → Authorize → Monitor."},{"id":"D1-053","d":1,"obj":"1.9","diff":3,"q":"An organization's risk management processes are standardized and documented across all departments, but risk is not yet built into business decisions or measured with metrics. Using the risk maturity model described in the CISSP Official Study Guide, which level is this?","o":[["Preliminary","At the preliminary level, departments make loose, independent attempts at risk management."],["Integrated","At the integrated level, risk management is built into business processes and metrics are used."],["Defined","Correct. A common, standardized framework across the organization is the defined level."],["Optimized","Optimized focuses on achieving objectives and resilience through lessons learned."]],"a":2,"k":"Risk maturity levels: ad hoc → preliminary → defined → integrated → optimized."},{"id":"D1-054","d":1,"obj":"1.9","diff":1,"q":"Which statement BEST describes residual risk?","o":[["Risk that has been transferred to an insurer","Transferred risk is a treatment choice, not the definition of residual risk."],["Total risk before any safeguards","That is inherent (total) risk."],["Risk that management has refused to accept","Unaccepted risk must still be treated; that is not what residual means."],["The risk that remains after safeguards are applied","Correct. Residual risk is what is left after controls, and management must accept it or treat it further."]],"a":3,"k":"Residual risk = total risk − controls gap; management must accept or further treat it."},{"id":"D1-055","d":1,"obj":"1.9","diff":1,"q":"Which document records identified risks along with their owners, ratings and treatment status?","o":[["Security policy","The policy sets direction; it does not track individual risks."],["Risk register","Correct. A risk register is the central record of risks, owners, analysis results and responses."],["Business impact analysis","The BIA assesses impacts on business functions; it is not an ongoing risk tracker."],["System security plan","An SSP describes the controls for a specific system."]],"a":1,"k":"The risk register tracks each risk's owner, rating, response and status, and supports risk reporting."},{"id":"D1-056","d":1,"obj":"1.10","diff":1,"q":"An attacker intercepts an API request and changes the price field from 499.00 to 4.99 before it reaches the server. In the STRIDE model, which threat category is this?","o":[["Spoofing","Spoofing is pretending to be someone or something else."],["Tampering","Correct. Tampering is unauthorized modification of data, a threat to integrity."],["Repudiation","Repudiation is denying having performed an action."],["Information disclosure","Disclosure exposes data to unauthorized parties, a confidentiality threat."]],"a":1,"k":"STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege."},{"id":"D1-057","d":1,"obj":"1.10","diff":2,"q":"Which threat modeling methodology is a seven-stage, risk-centric process that starts from business objectives and ends with risk and impact analysis?","o":[["STRIDE","STRIDE is a threat categorization scheme developed at Microsoft, not a seven-stage process."],["DREAD","DREAD is a scheme for rating threats."],["VAST","VAST is designed to scale threat modeling across agile and DevOps environments."],["PASTA","Correct. PASTA (Process for Attack Simulation and Threat Analysis) has seven stages that tie business objectives to technical threats and impacts."]],"a":3,"k":"PASTA is a seven-stage, risk-centric methodology; STRIDE classifies threats; DREAD rates them."},{"id":"D1-058","d":1,"obj":"1.10","diff":1,"q":"When is threat modeling MOST effective in a system's life?","o":[["Early in design, and revisited as the design changes","Correct. Finding design-level threats before code is written is the cheapest time to fix them; the model is then updated as the system evolves."],["Just before the production release, as a final gate","Late threat modeling finds problems when they are most expensive to fix."],["After the first penetration test has reported findings","Penetration testing validates a built system; threat modeling should guide the design that comes before it."],["Only after a security incident has occurred","Waiting for an incident makes threat modeling reactive."]],"a":0,"k":"Threat model early and iteratively; it is a design activity, not an afterthought."},{"id":"D1-059","d":1,"obj":"1.10","diff":1,"q":"Which scheme rates threats by damage potential, reproducibility, exploitability, affected users and discoverability?","o":[["CVSS","CVSS scores vulnerabilities using base, temporal and environmental metrics."],["STRIDE","STRIDE categorizes threats but does not score them."],["DREAD","Correct. DREAD is named for the five factors it rates."],["OCTAVE","OCTAVE is a risk assessment methodology from Carnegie Mellon."]],"a":2,"k":"DREAD: Damage, Reproducibility, Exploitability, Affected users, Discoverability."},{"id":"D1-060","d":1,"obj":"1.11","diff":1,"q":"A critical vulnerability is announced in a widely used open-source logging library. Which artifact would tell you MOST quickly which of your purchased software products contain it?","o":[["Each vendor's SOC 2 report","SOC 2 reports describe controls, not the components inside a product."],["The vendors' license agreements","Licenses rarely list components and are not built for this purpose."],["A software bill of materials for each product","Correct. An SBOM lists a product's components and versions, so you can search for the affected library across your portfolio."],["Network vulnerability scans of each product","Scans may eventually find it, but more slowly and less completely."]],"a":2,"k":"An SBOM is an inventory of software components; it makes supply chain vulnerabilities searchable."},{"id":"D1-061","d":1,"obj":"1.11","diff":2,"q":"Which hardware feature uses tiny, uncontrollable manufacturing variations in a chip to produce a unique identity that is very hard to clone?","o":[["Trusted Platform Module","A TPM stores keys and measurements; its uniqueness comes from stored keys, not from physical variations."],["Hardware security module","An HSM is a dedicated device for key management and cryptographic operations."],["Secure enclave","An enclave isolates code and data during processing."],["Physically unclonable function","Correct. A PUF derives a device-unique response from physical variations, supporting authentication and anti-counterfeiting."]],"a":3,"k":"PUFs and silicon roots of trust are supply chain mitigations named in the 2024 outline."},{"id":"D1-062","d":1,"obj":"1.11","diff":2,"q":"A server vendor builds an immutable hardware component into the server board that verifies the firmware's signature before anything else runs, so tampered firmware will not boot. What is this component?","o":[["A software bill of materials","An SBOM is a list of components, not a boot-time verifier."],["A silicon root of trust","Correct. A hardware root of trust anchored in silicon starts the chain of trust by verifying firmware, defending against tampering in the supply chain."],["A code-signing certificate","Code signing produces the signature; the root of trust is what verifies it at boot."],["A secure boot policy in the operating system","The OS loads after firmware, which is too late to catch firmware tampering."]],"a":1,"k":"A silicon root of trust verifies firmware integrity from the first instruction, mitigating implants and tampering."},{"id":"D1-063","d":1,"obj":"1.11","diff":2,"q":"A procurement team is offered network switches at 40% below the usual price by an unfamiliar reseller. What is the BEST way to manage the supply chain risk?","o":[["Buy them and run a vulnerability scan before deployment","A scan will not reliably detect counterfeit hardware or implants."],["Buy them if the reseller signs a non-disclosure agreement","An NDA does nothing to establish the hardware's authenticity."],["Buy a sample first and compare its appearance with a genuine unit","Counterfeits can look identical; visual inspection is weak assurance."],["Buy only from authorized channels and verify units on delivery","Correct. Manufacturer-authorized channels reduce the risk of counterfeit or tampered equipment, and verification checks what arrives."]],"a":3,"k":"Counterfeits, tampering and implants are supply chain risks; mitigate with trusted sources, third-party assessment and verification."},{"id":"D1-064","d":1,"obj":"1.12","diff":2,"q":"Which measure BEST shows whether a security awareness program is changing behavior?","o":[["The percentage of staff who completed the annual training","Completion shows attendance, not changed behavior."],["The number of training hours delivered","Volume of training is an input, not an outcome."],["Satisfaction scores from the course survey","People can enjoy a course without changing how they act."],["Lower phishing-simulation click rates and more reports","Correct. Click rates falling and report rates rising over time are outcome metrics: they measure whether people now behave more securely."]],"a":3,"k":"Evaluate awareness programs by behavior change, not by attendance."},{"id":"D1-065","d":1,"obj":"1.12","diff":2,"q":"Help desk staff are taught a specific procedure for verifying a caller's identity before resetting a password. Which category does this fall under?","o":[["Awareness","Awareness makes people recognize security issues in general; it does not teach job procedures."],["Education","Education builds broad, deep understanding, such as a degree or certification."],["Training","Correct. Training teaches people to perform specific security tasks required by their role."],["Security champions","A champion program embeds advocates in teams; it is not a teaching category."]],"a":2,"k":"Awareness = recognize; training = do a specific job securely; education = understand deeply."},{"id":"D1-066","d":1,"obj":"1.12","diff":2,"q":"The security team finds that employees are pasting confidential source code into a public generative AI chatbot. What should be done FIRST?","o":[["Block all AI websites at the proxy without explanation","Blocking without a policy or explanation tends to drive the behavior underground to personal devices."],["Set an acceptable-use policy for AI tools and communicate it","Correct. Policy states management's direction; awareness then explains what is allowed and why. Technical con
