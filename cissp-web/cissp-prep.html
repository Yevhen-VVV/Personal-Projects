ysis","Continuity planning","Approval and implementation"],"note":"Scope and sponsorship first; the BIA sets priorities; strategies follow; senior management approves before roll-out."},{"id":"seq-bia","obj":"1.7","title":"Business impact analysis","prompt":"Order the steps of a business impact analysis.","steps":["Identify priorities","Risk identification","Likelihood assessment","Impact analysis","Resource prioritization"],"note":"What matters most comes first, then what threatens it, how likely and how damaging, and finally where to spend."},{"id":"seq-rmf","obj":"1.9","title":"NIST Risk Management Framework","prompt":"Order the steps of the NIST RMF (SP 800-37 Rev. 2).","steps":["Prepare","Categorize","Select","Implement","Assess","Authorize","Monitor"],"note":"Prepare was added in Rev. 2. A system is authorized only after its controls are assessed, then monitored continuously."},{"id":"seq-sdlc","obj":"8.1","title":"System development life cycle","prompt":"Order the phases of the system development life cycle.","steps":["Initiation","Development or acquisition","Implementation and assessment","Operations and maintenance","Disposal"],"note":"Security requirements are set at initiation and carried through every phase, including secure disposal."},{"id":"seq-forensics","obj":"7.1","title":"Forensic process","prompt":"Order the phases of the forensic process in NIST SP 800-86.","steps":["Collection","Examination","Analysis","Reporting"],"note":"Collect while preserving integrity, examine to extract relevant data, analyze it to draw conclusions, then report."},{"id":"seq-volatility","obj":"7.1","title":"Order of volatility","prompt":"Order evidence sources from most volatile (collect first) to least volatile (RFC 3227).","steps":["CPU registers and cache","Memory: routing and ARP tables, process list","Temporary file systems","Disk","Remote logging and monitoring data","Archival media"],"note":"Collect what disappears soonest first. Powering a system off loses everything above the disk."},{"id":"seq-drtests","obj":"7.12","title":"Disaster recovery tests","prompt":"Order disaster recovery test types from least to most disruptive.","steps":["Read-through (checklist)","Structured walk-through (tabletop)","Simulation","Parallel test","Full interruption"],"note":"A parallel test runs the recovery site alongside production; only a full interruption actually shuts production down."},{"id":"seq-change","obj":"7.9","title":"Change management","prompt":"Order the steps of the change management process.","steps":["Request the change","Review the change","Approve or reject the change","Test the change","Schedule and implement the change","Document the change"],"note":"Even emergency changes go through review and documentation, just after the fact."},{"id":"seq-kerberos","obj":"5.6","title":"Kerberos logon","prompt":"Order what happens when a Kerberos user reaches an application server.","steps":["The client authenticates to the authentication service","The authentication service issues a ticket-granting ticket","The client presents the TGT to the ticket-granting service","The ticket-granting service issues a service ticket","The client presents the service ticket to the application server"],"note":"The password never crosses the network. The TGT gets service tickets; the service ticket gets access."},{"id":"seq-osi","obj":"4.1","title":"OSI model","prompt":"Order the OSI layers from layer 1 to layer 7.","steps":["Physical","Data link","Network","Transport","Session","Presentation","Application"],"note":"Please Do Not Throw Sausage Pizza Away."},{"id":"seq-pentest","obj":"6.2","title":"Penetration test","prompt":"Order the phases of a penetration test.","steps":["Planning","Information gathering and discovery","Vulnerability scanning","Exploitation","Reporting"],"note":"Planning includes written authorization and rules of engagement; nothing starts without them."},{"id":"seq-datalife","obj":"2.4","title":"Data lifecycle","prompt":"Order the phases of the data lifecycle (Cloud Security Alliance model).","steps":["Create","Store","Use","Share","Archive","Destroy"],"note":"Classification happens at creation; destruction must fit the media and the data's sensitivity."},{"id":"seq-cmm","obj":"8.1","title":"Capability Maturity Model","prompt":"Order the Software Capability Maturity Model levels from 1 to 5.","steps":["Initial","Repeatable","Defined","Managed","Optimizing"],"note":"Repeatable brings basic project management; Managed adds quantitative measures; Optimizing improves continuously."},{"id":"seq-ideal","obj":"8.1","title":"IDEAL model","prompt":"Order the phases of the IDEAL software process improvement model.","steps":["Initiating","Diagnosing","Establishing","Acting","Learning"],"note":"The initials spell IDEAL."},{"id":"seq-killchain","obj":"7.2","title":"Cyber kill chain","prompt":"Order the stages of the Lockheed Martin cyber kill chain.","steps":["Reconnaissance","Weaponization","Delivery","Exploitation","Installation","Command and control","Actions on objectives"],"note":"Defenders aim to break the chain as early as possible; the earlier the stage, the cheaper the stop."},{"id":"seq-pasta","obj":"1.10","title":"PASTA threat modeling","prompt":"Order the seven stages of PASTA.","steps":["Definition of objectives","Definition of technical scope","Application decomposition and analysis","Threat analysis","Weakness and vulnerability analysis","Attack modeling and simulation","Risk analysis and management"],"note":"PASTA is risk-centric: it starts from business objectives and ends with risk decisions."},{"id":"seq-govclass","obj":"2.1","title":"Government classification","prompt":"Order U.S. government classification levels from lowest to highest.","steps":["Unclassified","Confidential","Secret","Top Secret"],"note":"Unauthorized disclosure causes damage (Confidential), serious damage (Secret) or exceptionally grave damage (Top Secret) to national security."}],"matches":[{"id":"match-models","obj":"3.2","title":"Security models","pairs":[["Bell-LaPadula","Confidentiality: no read up, no write down"],["Biba","Integrity: no read down, no write up"],["Clark-Wilson","Integrity through well-formed transactions and separation of duties"],["Brewer-Nash","Conflict-of-interest walls that shift with what you access"],["Graham-Denning","Rules for securely creating and deleting subjects and objects"]]},{"id":"match-backups","obj":"7.10","title":"Backup types","pairs":[["Full","Copies everything and clears the archive bits"],["Incremental","Copies changes since the last backup of any kind and clears the archive bits"],["Differential","Copies changes since the last full backup and leaves the archive bits set"],["Synthetic full","Builds a new full backup from an earlier full plus later incrementals"]]},{"id":"match-sites","obj":"7.10","title":"Recovery sites","pairs":[["Hot site","Equipped and loaded with near-current data; ready within hours"],["Warm site","Equipment in place, but data must be restored first"],["Cold site","Space, power and cooling only; weeks to bring up"],["Mobile site","Self-contained trailer or container moved where needed"],["Reciprocal agreement","Two organizations promise to host each other in a disaster"]]},{"id":"match-fire","obj":"3.9","title":"Fire classes (U.S.)","pairs":[["Class A","Ordinary combustibles such as paper and wood"],["Class B","Flammable liquids"],["Class C","Energized electrical equipment"],["Class D","Combustible metals"],["Class K","Cooking oils and fats"]]},{"id":"match-evidence","obj":"7.1","title":"Evidence","pairs":[["Real evidence","A physical object, such as a seized hard drive"],["Documentary evidence","Written items, including logs and records"],["Testimonial evidence","Statements made by witnesses"],["Best evidence rule","Originals are preferred over copies of documents"],["Parol evidence rule","A written agreement is assumed to contain all its terms"]]},{"id":"match-cloud","obj":"3.5","title":"Cloud service models","pairs":[["IaaS","You manage the operating system and everything above it"],["PaaS","You deploy code; the provider runs the runtime and operating system"],["SaaS","You configure and use the application; the provider runs the rest"],["FaaS (serverless)","You supply functions that run on events, with no servers to manage"]]},{"id":"match-crypto","obj":"3.6","title":"Cryptographic building blocks","pairs":[["AES","Symmetric block cipher with 128-bit blocks"],["RSA","Asymmetric algorithm based on factoring large numbers"],["ECC","Asymmetric algorithm with small keys, based on elliptic curves"],["SHA-256","Hash function with a 256-bit digest"],["HMAC","Keyed hash proving integrity and origin"],["Diffie-Hellman","Key agreement over an untrusted channel"]]},{"id":"match-tests","obj":"6.2","title":"Software testing","pairs":[["Fuzzing","Feeds random or malformed input to find crashes"],["SAST","Analyzes source code without running it"],["DAST","Probes a running application from outside"],["Regression testing","Checks that a change did not break what worked"],["Misuse case testing","Tests written from an attacker's point of view"]]},{"id":"match-adattacks","obj":"3.7","title":"Credential attacks","pairs":[["Pass the hash","Reusing a captured password hash to authenticate"],["Kerberoasting","Cracking service account passwords from requested service tickets"],["Golden ticket","A forged TGT signed with the KRBTGT key"],["Silver ticket","A forged service ticket for one service"],["Credential stuffing","Trying breached username and password pairs on other sites"]]},{"id":"match-authz","obj":"5.4","title":"Access control models","pairs":[["DAC","The owner decides who gets access"],["MAC","The system enforces labels and clearances"],["RBAC","Permissions follow job roles"],["ABAC","Policies evaluate attributes of the user, resource and context"],["Rule-based","Global rules apply to every subject, as in a firewall"]]},{"id":"match-dataroles","obj":"2.4","title":"Data roles","pairs":[["Data owner","Accountable for the data and its classification"],["Data custodian","Protects the data day to day, for example with backups"],["Data controller","Decides why and how personal data is processed"],["Data processor","Processes personal data on the controller's behalf"],["Data subject","The person the personal data is about"]]},{"id":"match-bcmetrics","obj":"1.7","title":"Continuity metrics","pairs":[["MTD","The longest outage before the damage becomes unacceptable"],["RTO","The target time to restore a function"],["RPO","The maximum tolerable data loss, measured in time"],["WRT","Time to verify systems and data after restoration"],["MTBF","Expected time between failures of a repairable device"],["MTTR","Average time to repair a failed device"]]},{"id":"match-devices","obj":"4.2","title":"Network devices","pairs":[["Hub","Layer 1: repeats signals to every port"],["Switch","Layer 2: forwards frames by MAC address"],["Router","Layer 3: forwards packets by IP address"],["Circuit-level gateway","Layer 5: relays sessions without inspecting content"],["Application proxy","Layer 7: inspects application content"]]},{"id":"match-cc","obj":"3.3","title":"Common Criteria","pairs":[["Protection Profile","Security requirements customers want for a class of product"],["Security Target","The vendor's security claims for its product"],["EAL1","Functionally tested"],["EAL4","Methodically designed, tested and reviewed"],["EAL7","Formally verified design and tested"]]},{"id":"match-laws","obj":"1.4","title":"Laws and standards","pairs":[["GDPR","EU personal data regulation with 72-hour breach notification"],["HIPAA","U.S. health information privacy and security"],["GLBA","U.S. financial institutions' customer information"],["SOX","U.S. public companies' financial reporting controls"],["PCI DSS","Payment card industry standard enforced by contract"],["COPPA","U.S. online data of children under 13"]]},{"id":"match-sdlcmodels","obj":"8.1","title":"Development models","pairs":[["Waterfall","Sequential phases, each finished before the next"],["Spiral","Repeated loops, each with its own risk analysis"],["Agile","Short iterations that deliver working software"],["DevOps","Development and operations share the pipeline and the responsibility"]]},{"id":"match-factors","obj":"5.2","title":"Authentication factors","pairs":[["Something you know","A password or PIN"],["Something you have","A smart card or hardware token"],["Something you are","A fingerprint or iris pattern"],["Somewhere you are","Geolocation or network location"],["Something you do","Typing rhythm or signature dynamics"]]},{"id":"match-biometrics","obj":"5.2","title":"Biometric accuracy","pairs":[["FRR (Type I error)","A valid user is rejected"],["FAR (Type II error)","An impostor is accepted"],["CER","The point where false rejections equal false acceptances"],["Throughput rate","How long one user takes to be processed"]]}]},"arcana":[{"n":0,"id":"fool","name":"The Fool","numeral":"0","archetype":"The Innocent","concept":"The user and security awareness","objectives":["1.12","1.8"],"hue":48,"upright":"A vetted, trained user who spots the lure, reports it and becomes the organization's first line of defense.","reversed":"Unvetted hires, unchecked insiders and one careless click: the human who opens the gate for every attacker.","vision":"A traveler in a patchwork coat strides toward a cliff edge, eyes on the sun. At the trailhead behind them, a gatekeeper who has read their whole past in the lines of their palm waves goodbye, and over their shoulder swings a bindle stuffed with signed promises. A cloud lowers a white rose on a fishhook. A small dog barks, and the traveler stops, one heel on the rim. Three signposts line the path: an eye that says look, a hand that says how, a book that says why. Every spring the traveler leaves their boots with a stranger for two weeks, and the stranger walks the same path, turning over every stone.","decode":["One heel on the cliff edge, eyes on the sun → the user: the weakest link and, once trained, the first line of defense.","A white rose on a fishhook, the barking dog → phishing: lures look harmless; simulated phishing trains the reflex to stop and report.","The gatekeeper reading the palm, the bindle of signed promises → background checks before hire; an NDA signed at onboarding that binds even after leaving.","Signposts of eye, hand and book → awareness changes what people notice; training teaches how to do the job; education builds the deeper why.","A stranger walks the path in the traveler's boots for two weeks → mandatory vacation: someone else does the work and can uncover fraud."],"facts":["Mandatory vacations (often one to two weeks) and job rotation are detective controls: a substitute doing the work can expose fraud and collusion.","At termination, disable access at the same time as, or just before, the person is told; then collect badges and keys and use the exit interview to restate the NDA.","Hiring starts with a job description that defines the role's access; screening and background checks follow, and the NDA is signed before access is granted."],"trap":"The collective keeps mistaking awareness for training. Posters and banners make people notice (awareness); teaching staff to do their jobs securely is training; education is deeper study for a security career.","glyph":"\u003ccircle cx=\"78\" cy=\"16\" r=\"4.5\"/>\u003ccircle cx=\"78\" cy=\"16\" r=\"9\" stroke-width=\"1.2\" stroke-dasharray=\"2 3.2\"/>\u003ccircle cx=\"46\" cy=\"24\" r=\"12\"/>\u003cpath d=\"M46 24 C46 21.5 49.5 21.5 49.5 24 C49.5 28 42.5 28 42.5 24 C42.5 18.5 52.5 18 53 24.5\" stroke-width=\"1.6\"/>\u003cpath d=\"M46 36 V60 C46 75 24 75 24 60 V50\"/>\u003cpath d=\"M24 50 L30 57\"/>\u003cpath d=\"M46 48 C51 41 58 42 61 44 C57 49 51 51 46 48 Z\"/>\u003cpath d=\"M12 82 H60 L65 86 L62 90 L67 94\"/>\u003cpath d=\"M20 87 L23 91 M34 87 L37 91 M48 87 L51 91\" stroke-width=\"1.4\"/>"},{"n":1,"id":"magician","name":"The Magician","numeral":"I","archetype":"The Magician","concept":"Cryptography","objectives":["3.6","3.7"],"hue":268,"upright":"Turning plaintext into protection: confidentiality, integrity, authenticity and nonrepudiation, with the keys kept secret.","reversed":"Homemade algorithms, reused keys and keys stored beside the data: a trick that fools only its maker.","vision":"A magician stands at a table holding four objects: a padlock, a sealed letter, a hand mirror and a signet ring. They drop a scroll into a box that anyone can snap shut but only they can open, then hand a key to a twin who holds its exact copy. A crow lets fall a single feather on the letter, and the whole wax seal cracks. Behind them a clock with a thousand hands ticks, and with each tick another lock on the wall springs open.","decode":["Padlock, sealed letter, mirror, signet ring → the four services: confidentiality, integrity, authentication, nonrepudiation.","A box anyone can shut but only the owner opens → asymmetric encryption: encrypt with the recipient's public key, decrypt with their private key.","The twin with the identical key → symmetric encryption: fast, but every pair needs a shared secret delivered safely.","One feather cracks the seal → hashing: the smallest change to the input changes the digest completely.","The clock of a thousand hands → brute force: every added key bit doubles the attacker's work."],"facts":["Symmetric ciphers such as AES are fast but need n(n−1)/2 keys for n people; asymmetric ciphers solve key distribution and are used to exchange symmetric keys.","A digital signature is a hash encrypted with the sender's private key. It gives integrity, authentication and nonrepudiation, but not confidentiality.","Encrypt for someone with their public key; sign with your own private key. Swapping the two is a classic wrong answer."],"trap":"The collective's favourite slip: reaching for encryption when the question asks for integrity or nonrepudiation. Encryption hides a message; only a signature proves who sent it and that it was not changed.","glyph":"\u003cpath d=\"M28 20 C28 10 44 10 50 20 C56 30 72 30 72 20 C72 10 56 10 50 20 C44 30 28 30 28 20 Z\"/>\u003ccircle cx=\"50\" cy=\"50\" r=\"11\"/>\u003ccircle cx=\"50\" cy=\"50\" r=\"4\"/>\u003cpath d=\"M50 61 V94 M50 82 H60 M50 90 H57\"/>\u003cpath d=\"M14 54 L26 54 M74 54 L86 54 M20 38 L28 44 M80 38 L72 44\" stroke-width=\"1.4\"/>"},{"n":2,"id":"high-priestess","name":"The High Priestess","numeral":"II","archetype":"The Keeper of Secrets","concept":"Classification and data protection","objectives":["2.1","2.2","2.3","2.6","3.2"],"hue":222,"upright":"Every asset known, owned and labeled by its value, and protected at rest, in transit and in use.","reversed":"No inventory, no labels and IT guessing at sensitivity: secrets leak because no one knew they were secrets.","vision":"Between a black pillar and a white one, a keeper sits before a veil sewn with pomegranates. The keeper counts every fruit, then ties a colored ribbon to each by its worth, and a temple servant only hangs them where told. From the black pillar, smoke rises and never sinks; from the white pillar, water falls and never climbs. A scroll lies half hidden in the keeper's lap: one end sleeps in a locked chest, the middle flies between the pillars as a paper bird, and the end being read glows bare. At the keeper's feet a crescent moon rocks like a cradle, catching every ribboned pomegranate that rolls toward the door.","decode":["Counting, then ribboning each fruit; the servant who only hangs them → inventory first; the owner classifies by value and sensitivity; the custodian protects.","The black pillar's rising smoke → Bell-LaPadula, confidentiality: no read up (simple), no write down (star); secrets only flow upward.","The white pillar's falling water → Biba, integrity: no read down (simple), no write up (star); purity flows downward and mud never climbs.","The scroll in chest, flight and hand → data at rest, in transit and in use; in use it sits decrypted in memory, the hardest state to protect.","The crescent moon catching ribboned fruit → DLP: it inspects labels and content to stop sensitive data leaving, so it depends on classification."],"facts":["In both models 'simple' is the read rule and 'star' (*) the write rule. Bell-LaPadula protects only confidentiality; Biba protects only integrity.","Clark-Wilson enforces integrity with the access triple: subjects reach constrained data only through approved programs, giving well-formed transactions and separation of duties.","Scoping selects the baseline controls that apply to a system; tailoring modifies them to fit the organization's mission. Scoping is part of tailoring."],"trap":"The collective's oldest wound: letting IT or the custodian classify data. The owner, a senior manager, decides the classification and is accountable; the custodian only carries out the protection.","glyph":"\u003crect x=\"14\" y=\"20\" width=\"12\" height=\"62\"/>\u003crect x=\"74\" y=\"20\" width=\"12\" height=\"62\" fill=\"currentColor\" fill-opacity=\"0.85\"/>\u003crect x=\"11\" y=\"14\" width=\"18\" height=\"6\"/>\u003crect x=\"71\" y=\"14\" width=\"18\" height=\"6\"/>\u003crect x=\"11\" y=\"82\" width=\"18\" height=\"6\"/>\u003crect x=\"71\" y=\"82\" width=\"18\" height=\"6\"/>\u003cpath d=\"M26 22 Q50 36 74 22\"/>\u003cpolyline points=\"33,64 38,59 43,64\"/>\u003cpolyline points=\"33,53 38,48 43,53\" opacity=\"0.7\"/>\u003cpolyline points=\"33,42 38,37 43,42\" opacity=\"0.4\"/>\u003cpolyline points=\"57,38 62,43 67,38\" opacity=\"0.4\"/>\u003cpolyline points=\"57,49 62,54 67,49\" opacity=\"0.7\"/>\u003cpolyline points=\"57,60 62,65 67,60\"/>\u003cpath d=\"M39 75 A11 11 0 0 0 61 75 A14 14 0 0 1 39 75 Z\" fill=\"currentColor\"/>"},{"n":3,"id":"empress","name":"The Empress","numeral":"III","archetype":"The Creator","concept":"The software development life cycle","objectives":["8.1","8.2"],"hue":120,"upright":"Security sown at requirements and grown through every phase, with the pipeline testing each build automatically.","reversed":"Security sprayed on at harvest: untested builds, unknown libraries and a password hard-coded in the pipeline.","vision":"In a ripening wheat field, a crowned figure sows seeds that each carry a tiny padlock, so the wheat grows locked from the root. A stream tumbles past in a waterfall that can climb back only one step, then curls into a spiral that leaves a scarecrow at every turn. Four herons wade in it: one reads seeds before they sprout, one pecks the grown stalks, one swims inside a stalk, one asks which farm each seed came from. The figure's crown of stars kindles in five rows, from a lone flicker to a self-tuning constellation. Every key lies under the heart-shaped shield; none is dropped in the stream.","decode":["Seeds sown with padlocks → security starts at requirements, before design; the later a flaw is found, the costlier the fix.","A waterfall that climbs back one step; a spiral of scarecrows → modified waterfall returns only to the prior phase; each spiral loop yields a new prototype.","Four herons → SAST reads source before it runs; DAST probes the running app; IAST instruments it from inside; SCA traces third-party components.","The crown kindling in five rows → CMM levels: initial, repeatable, defined, managed, optimizing; SAMM rates software security practices by maturity too.","Keys under the shield, none in the stream → secrets live in a vault, never hard-coded in code repositories or CI/CD pipelines."],"facts":["DevOps unites development, quality assurance and operations; DevSecOps builds security into the same automated pipeline, shifting it left instead of gating at the end.","The Agile Manifesto values individuals and interactions, working software, customer collaboration and responding to change over processes, documentation, contracts and plans.","Change management runs request control, change control and release control; software configuration management identifies, controls, accounts for and audits every version."],"trap":"The collective remembers bolting security on at testing. The right and cheapest moment is the start: set security requirements at initiation, then design, build and test against them.","glyph":"\u003cpath d=\"M50 88 C30 74 18 62 18 44 C18 32 28 24 38 24 C44 24 48 28 50 32 C52 28 56 24 62 24 C72 24 82 32 82 44 C82 62 70 74 50 88 Z\"/>\u003cpath d=\"M55 37.3 A10 10 0 1 1 45 37.3\"/>\u003cpolyline points=\"39.6,36.9 45,37.3 42.6,42.2\"/>\u003cpath d=\"M50 56 V76 M43 66 H57\"/>\u003ccircle cx=\"30\" cy=\"14\" r=\"1.6\" fill=\"currentColor\"/>\u003ccircle cx=\"40\" cy=\"10\" r=\"1.6\" fill=\"currentColor\"/>\u003ccircle cx=\"50\" cy=\"8.5\" r=\"1.6\" fill=\"currentColor\"/>\u003ccircle cx=\"60\" cy=\"10\" r=\"1.6\" fill=\"currentColor\"/>\u003ccircle cx=\"70\" cy=\"14\" r=\"1.6\" fill=\"currentColor\"/>"},{"n":4,"id":"emperor","name":"The Emperor","numeral":"IV","archetype":"The Ruler","concept":"Governance and policy","objectives":["1.3","1.6"],"hue":8,"upright":"Security steered from the top, aligned to business goals and written down from policy to procedure.","reversed":"A ruler who delegates the blame: shelfware policies, security for its own sake and no one accountable.","vision":"A ruler sits on a stone throne carved with two ram heads, wearing a crown that cannot be lifted off and handed to anyone else. The left ram studies a map of the realm; the right ram walks the road it shows. In one hand the ruler holds a golden orb that is really a compass, its needle fixed on the merchants' trade routes; the ankh scepter in the other hand swings wherever the needle points. Behind the throne, the barren mountains rise in five terraces: a single peak that speaks the law, ridges of exact rules, a level plateau no camp may sink below, meadows of optional signposts, and a staircase carved one step at a time.","decode":["The crown that cannot be handed off → senior management holds ultimate accountability; tasks can be delegated, accountability cannot.","The ram reading the map, the ram walking the road → due diligence is knowing and planning what to do; due care is doing it, as a prudent person would.","The orb compass on the trade routes, the scepter that follows it → governance is top-down and aligned to business strategy, goals and mission.","Five terraces → policy (mandatory, high level), standards (mandatory specifics), baselines (minimum configurations), guidelines (optional), procedures (step by step)."],"facts":["ISO/IEC 27001 sets the requirements for an ISMS and is certifiable; ISO/IEC 27002 is the supporting control guidance and is not certifiable.","A strategic plan looks about five years ahead, a tactical plan about one year, and operational plans are short term and highly detailed.","COBIT, from ISACA, governs enterprise IT; NIST CSF 2.0 groups outcomes into six functions: Govern, Identify, Protect, Detect, Respond, Recover."],"trap":"The collective keeps writing products into policy. A policy states broad, mandatory intent and rarely changes; specific technologies belong in standards, and guidelines are the only optional layer.","glyph":"\u003cpath d=\"M12 90 V84 H20 V78 H28 V72 H36 V66 H42 V60 H58 V66 H64 V72 H72 V78 H80 V84 H88 V90 Z\"/>\u003cpath d=\"M36 66 H64 M28 72 H72 M20 78 H80 M12 84 H88\" stroke-width=\"1.4\"/>\u003cpath d=\"M50 33 C42 26 42 12 50 12 C58 12 58 26 50 33 Z\"/>\u003cpath d=\"M38 37 H62 M50 33 V60\"/>\u003cpath d=\"M44 18 C36 10 24 14 24 24 C24 32 34 34 36 27 C37 23 33 21 31 24\"/>\u003cpath d=\"M56 18 C64 10 76 14 76 24 C76 32 66 34 64 27 C63 23 67 21 69 24\"/>"},{"n":5,"id":"hierophant","name":"The Hierophant","numeral":"V","archetype":"The Teacher","concept":"Ethics, law and compliance","objectives":["1.1","1.4"],"hue":32,"upright":"Doing right when no one is watching: the canons kept in order, the law obeyed, others' ideas respected.","reversed":"The paying client put before the public, borders and deadlines ignored: ethics bent until the law steps in.","vision":"A teacher in a triple crown raises a hand of blessing over two kneeling acolytes, counting four vows on it in one fixed order: the city, honor, the master, the guild. The crown's three tiers are courtrooms: a jailer, then a merchant weighing coins, then a clerk stamping permits. Two crossed keys hang at the teacher's belt: a gold one to a glass vault that shows an invention to all and guards it for twenty years, and an iron one to a recipe box that stays locked only while no one tells. One acolyte races a breach letter across the sea before a seventy-two-hour candle burns out; the other is stopped at the river with a crate of ciphers.","decode":["The hand counting four vows in order → the ISC2 canons: protect society and the infrastructure; act honorably and legally; serve principals; advance the profession.","The crown's three courtrooms → criminal law (prison, beyond reasonable doubt), civil law (damages, preponderance of evidence), administrative law (agency rules).","The gold key and the iron key → a patent is disclosed publicly and lasts 20 years from filing; a trade secret is never registered and lasts only while kept secret.","The breach letter and its seventy-two-hour candle → GDPR: notify the supervisory authority within 72 hours of becoming aware of a breach.","The acolyte stopped at the river with ciphers → export controls: encryption and defense technology cannot cross borders freely (ITAR, EAR, Wassenaar)."],"facts":["Copyright protects expression, not ideas, for the author's life plus 70 years; trademarks are registered in 10-year terms, renewable indefinitely.","Under GDPR, transfers of personal data outside the EU normally rely on an adequacy decision or safeguards such as standard contractual clauses or binding corporate rules.","ITAR (State Department) controls defense articles on the U.S. Munitions List; EAR (Commerce Department) controls commercial and dual-use items, including encryption."],"trap":"The collective remembers putting the employer first. The canons rank society, then honor and the law, then principals, then the profession: when duties collide, the public good outranks the paying client.","glyph":"\u003cg transform=\"rotate(45 50 52)\">\u003ccircle cx=\"50\" cy=\"97\" r=\"6\"/>\u003cpath d=\"M50 91 V71 M46 86 H54 M50 33 V7 M50 8 H59 V12 H55 V15 H59 V19 H50\"/>\u003c/g>\u003cg transform=\"rotate(-45 50 52)\">\u003ccircle cx=\"50\" cy=\"97\" r=\"6\"/>\u003cpath d=\"M50 91 V71 M46 86 H54 M50 33 V7 M50 8 H41 V12 H45 V15 H41 V19 H50\"/>\u003c/g>\u003cpath d=\"M50 23 V33 M46 27 H54\" stroke-width=\"1.8\"/>\u003cpath d=\"M34 64 C33 50 38 40 50 34 C62 40 67 50 66 64 Z\"/>\u003cpath d=\"M34 56 Q50 52 66 56 M36 47.5 Q50 43.5 64 47.5 M42 40 Q50 37.5 58 40\" stroke-width=\"1.6\"/>"},{"n":6,"id":"lovers","name":"The Lovers","numeral":"VI","archetype":"The Lover","concept":"Trust: federation and third parties","objectives":["5.3","1.11","8.4"],"hue":332,"upright":"Trust extended with care: one identity vouched for across many services, and every supplier vetted, contracted and audited.","reversed":"Blind trust: OAuth used as a login, vendors never vetted, no right to audit, and a poisoned library nobody listed.","vision":"Two strangers meet in a garden beneath an angel who works as a notary. The angel checks the first figure's face and stamps a glowing seal onto a scroll; at the sight of it the second figure opens the gate, never asking for a password. The first figure then lends a passing gardener a valet key that opens only the pantry, never the house; tie a tiny name tag to it and the key also says whose it is. Every fruit on the tree of knowledge wears an ingredient label, so the serpent curled inside one is found at once. An auditor with an hourglass watches the tree of flames burn for a whole year.","decode":["The angel's sealed scroll opens the gate → SAML: the identity provider signs an XML assertion; the service provider trusts it and never sees the password.","A valet key for the pantry only → OAuth 2.0: a scoped access token delegates authorization to a third party without handing over the password.","The name tag tied to the key → OpenID Connect adds authentication to OAuth 2.0: an ID token, a signed JWT, tells the app who the user is.","Labeled fruit, the serpent found at once → SBOM: a list of every component and version, so a poisoned or vulnerable dependency is found fast.","The auditor's hourglass by the tree of flames → SOC 2 Type II: controls tested as operating effectively over a period, not on a single day."],"facts":["SOC 2 Type II tests how controls operated over a period, usually 6 to 12 months; Type I covers their design at one point in time. SOC 1 concerns financial reporting.","Outsourcing to a vendor or SaaS provider transfers the work, never the accountability: the customer still answers for its data, its users and their access.","Minimum security requirements, breach notification and a right to audit go into the contract before signing; an SLA sets measurable service levels and penalties."],"trap":"The collective remembers logging in with OAuth and calling it authentication. OAuth 2.0 only delegates authorization; when the question asks who the user is, the answer is OpenID Connect or SAML.","glyph":"\u003ccircle cx=\"50\" cy=\"22\" r=\"6.5\"/>\u003cpath d=\"M44 28 C42 18 36 12 26 10 C20 9 15 9 10 11 C14 14 16 16 18 16 C14 18 13 20 14 22 C18 23 21 23 23 22 C20 25 19 27 20 29 C24 29.5 26 29 28 28 C27 31 27 33 28 35 C34 35 39 33 44 31\"/>\u003cpath d=\"M56 28 C58 18 64 12 74 10 C80 9 85 9 90 11 C86 14 84 16 82 16 C86 18 87 20 86 22 C82 23 79 23 77 22 C80 25 81 27 80 29 C76 29.5 74 29 72 28 C73 31 73 33 72 35 C66 35 61 33 56 31\"/>\u003cpath d=\"M50 30 V57\" stroke-dasharray=\"2 3.4\" stroke-width=\"1.6\"/>\u003cpolygon points=\"50,60 56,68 50,76 44,68\"/>\u003ccircle cx=\"28\" cy=\"57\" r=\"6\"/>\u003cpath d=\"M15 90 C15 75 21 67 28 67 C35 67 41 75 41 90\"/>\u003ccircle cx=\"72\" cy=\"57\" r=\"6\"/>\u003cpath d=\"M59 90 C59 75 65 67 72 67 C79 67 85 75 85 90\"/>"},{"n":7,"id":"chariot","name":"The Chariot","numeral":"VII","archetype":"The Hero","concept":"Incident management","objectives":["7.6"],"hue":196,"upright":"A rehearsed team that detects fast, contains without destroying evidence, recovers, fixes the root cause and learns.","reversed":"Panic in the chariot: no plan, the plug pulled on live evidence, no escalation, and the same breach back next month.","vision":"A charioteer races through the night with no reins, steering only by a map they drew before ever leaving the stable. A black sphinx strains toward a giant power switch on the city wall while a white sphinx pulls toward the open market; the charioteer drives both into a cage by the roadside. The starry canopy is made of glowing memory that one flick of that switch would erase, so the charioteer scoops each star into a jar first. Each wheel has seven spokes, and each spoke shouts its word as it passes the top: detect, respond, mitigate, report, recover, remediate, learn. At the finish line a scribe writes down every bump in the road.","decode":["No reins, only a map drawn in the stable → preparation: the plan, the CSIRT and its escalation and communication paths exist before the incident.","Both sphinxes driven into the cage → containment (ISC2: mitigation): isolate the system, neither switching it off nor leaving it on the network.","Stars of memory scooped into jars → collect volatile data such as RAM, processes and connections first, following the order of volatility.","Seven shouting spokes → the ISC2 steps, in order: detection, response, mitigation, reporting, recovery, remediation, lessons learned.","The scribe at the finish line → lessons learned (NIST: post-incident activity): review the response and feed improvements back into the plan."],"facts":["NIST SP 800-61 Rev. 2 has four phases: preparation; detection and analysis; containment, eradication and recovery; and post-incident activity.","In the ISC2 steps, mitigation contains the incident; remediation comes after recovery and finds the root cause so the incident cannot recur.","An event is any observable occurrence; an incident is an event that harms confidentiality, integrity or availability. Every incident is an event, not the reverse."],"trap":"The collective still flinches toward the power button. Pulling the plug wipes memory and destroys evidence; isolate the system from the network, capture volatile data, then follow the plan.","glyph":"\u003cpath d=\"M16 32 Q50 6 84 32\"/>\u003cpath d=\"M16 32 Q22.5 37 29 32 Q35.5 37 42 32 Q48.5 37 55 32 Q61.5 37 68 32 Q74.5 37 81 32\" stroke-width=\"1.6\"/>\u003ccircle cx=\"36\" cy=\"22\" r=\"1.6\" fill=\"currentColor\"/>\u003ccircle cx=\"50\" cy=\"18\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"64\" cy=\"22\" r=\"1.6\" fill=\"currentColor\"/>\u003cpath d=\"M20 34 V80 M80 34 V80\"/>\u003cpath d=\"M32 42 H68 V60 C68 73 59 80 50 84 C41 80 32 73 32 60 Z\"/>\u003cpath d=\"M36 59 H43 L46.5 50 L51.5 68 L55 57 H64\"/>\u003cpolygon points=\"9,80 20,73 20,87\" fill=\"currentColor\"/>\u003cpolygon points=\"91,80 80,73 80,87\"/>"},{"n":8,"id":"strength","name":"Strength","numeral":"VIII","archetype":"The Tamer","concept":"Secure coding","objectives":["8.5","8.3"],"hue":24,"upright":"Untrusted input tamed: validated on the server, encoded on output, bound into queries, with errors that reveal nothing.","reversed":"Raw input let loose: string-built SQL, unchecked buffers, stack traces shown to strangers and code changes nobody logged.","vision":"A calm figure in a white robe closes a lion's jaws with bare hands. The lion may roar only the words inked on the figure's own palm; the list on the lion's paw counts for nothing. A command the lion roars disguised as a name is pressed into a stone mold with fixed blanks, where it can only ever be a name. Thorns spat into the garland of flowers come out as harmless paintings of thorns. When a roar fails, the figure tells the crowd only that it failed, never why. Above their head the infinity sign has one loop marked check, one marked use, and a mouse slips through the crossing between them.","decode":["Jaws held shut; only the words on the figure's palm count → allow-list input validation enforced on the server; client-side checks are trivially bypassed.","The stone mold with fixed blanks → parameterized queries (prepared statements): input stays data and is never executed as SQL.","Thorns turned into paintings of thorns → output encoding: special characters are escaped, so the browser shows a script instead of running it (XSS).","Only that it failed, never why → secure error handling: a generic message for users, the details kept in protected server logs.","A mouse slipping between check and use → race condition (TOCTOU): an attacker changes the resource after it is checked but before it is used."],"facts":["Buffer overflows come from missing bounds checks: input longer than the buffer overwrites adjacent memory, such as a return address. Check every input's length.","XSS abuses a user's trust in a website; CSRF abuses a website's trust in the user's browser. Output encoding stops XSS; anti-CSRF tokens stop CSRF.","Maintenance hooks are developer backdoors that bypass access controls; they must be removed before code reaches production."],"trap":"The collective once trusted the validation running in the browser. Attackers bypass the browser entirely, so validate on the server with an allow-list and bind input with parameterized queries.","glyph":"\u003cpath d=\"M50 24 A7 7 0 0 1 63 27 A7 7 0 0 1 73.5 35.3 A7 7 0 0 1 79.2 47.3 A7 7 0 0 1 79.2 60.7 A7 7 0 0 1 73.5 72.7 A7 7 0 0 1 63 81 A7 7 0 0 1 50 84 A7 7 0 0 1 37 81 A7 7 0 0 1 26.5 72.7 A7 7 0 0 1 20.8 60.7 A7 7 0 0 1 20.8 47.3 A7 7 0 0 1 26.5 35.3 A7 7 0 0 1 37 27 A7 7 0 0 1 50 24\"/>\u003cpath d=\"M36 40 C36 34 42 32 50 32 C58 32 64 34 64 40 L66 56 C66 67 58 75 50 75 C42 75 34 67 34 56 Z\"/>\u003cpath d=\"M37 39 C33 33 35 28 41 30 M63 39 C67 33 65 28 59 30\"/>\u003ccircle cx=\"43\" cy=\"45\" r=\"1.9\" fill=\"currentColor\"/>\u003ccircle cx=\"57\" cy=\"45\" r=\"1.9\" fill=\"currentColor\"/>\u003cpolygon points=\"46.5,51 53.5,51 50,55\" fill=\"currentColor\" stroke-width=\"1.4\"/>\u003cpath d=\"M45 59.5 L39.5 64.5 L45 69.5 M55 59.5 L60.5 64.5 L55 69.5 M53 58.5 L47 70.5\" stroke-width=\"1.9\"/>"},{"n":9,"id":"hermit","name":"The Hermit","numeral":"IX","archetype":"The Wise Recluse","concept":"Network segmentation and isolation","objectives":["4.1","4.2"],"hue":206,"upright":"Networks divided by need: segments, screened subnets and air gaps that keep a breach in one room and verify every visitor.","reversed":"One flat network where the printer, the plant controller and the payroll server all trust anyone already inside.","vision":"The hermit stands alone on a peak with no road, no rope and no bridge to any other mountain. Inside the lantern burns a six-pointed star, and each point lights only its own sealed chamber, never its neighbors. At the cave mouth a guard inspects every traveler's boots for mud before letting them in, then demands their name again at every inner door, even from old friends. The staff bears seven notches, and every message is carved at the top notch and slides down to the bottom before it leaves. Far below, a lonely courtyard sits between two walls, the only place strangers may trade.","decode":["A peak with no road, rope or bridge → air gap: no network connection at all, the strongest isolation for critical OT and ICS systems.","Each star point lighting only its own chamber → segmentation and micro-segmentation: VLANs and per-workload rules keep a breach from spreading.","Boots inspected, names asked at every door → NAC checks device posture before admission; zero trust verifies every request, whatever its location.","Seven notches, message sliding top to bottom → OSI encapsulation: data passes down from application (7) to physical (1) before it is sent.","The courtyard between two walls → screened subnet (DMZ): public-facing servers sit between the external and internal firewalls."],"facts":["IPsec AH gives integrity and authentication but no encryption; ESP adds confidentiality. Tunnel mode protects the whole packet, transport mode only the payload.","Packet filters read headers at layer 3; stateful firewalls track sessions; circuit-level gateways work at layer 5; application-level gateways inspect layer 7.","SDN separates the control plane, which decides, from the data plane, which forwards, so a central controller can program segmentation in software."],"trap":"The collective once trusted everything inside the firewall. Zero trust assumes the breach: no user or device is trusted for its network location, and every request is authenticated and authorized.","glyph":"\u003cpath d=\"M24 10 V87\"/>\u003ccircle cx=\"24\" cy=\"10\" r=\"2\" fill=\"currentColor\"/>\u003ccircle cx=\"58\" cy=\"8\" r=\"3\"/>\u003cpolygon points=\"46,18 70,18 64,11 52,11\"/>\u003crect x=\"40\" y=\"18\" width=\"36\" height=\"42\" rx=\"2\"/>\u003cpolygon points=\"37,60 79,60 74,66 42,66\"/>\u003cpolygon points=\"61.2,33.9 64.4,39.5 61.2,45.1 54.8,45.1 51.6,39.5 54.8,33.9\" stroke-width=\"1.4\"/>\u003cpolygon points=\"58,25.1 54.8,30.7 61.2,30.7\" stroke-width=\"1.4\"/>\u003cpolygon points=\"70.5,32.3 64,32.3 67.2,37.9\" stroke-width=\"1.4\"/>\u003cpolygon points=\"70.5,46.7 67.2,41.1 64,46.7\" stroke-width=\"1.4\"/>\u003cpolygon points=\"58,53.9 61.2,48.3 54.8,48.3\" stroke-width=\"1.4\"/>\u003cpolygon points=\"45.5,46.7 52,46.7 48.8,41.1\" stroke-width=\"1.4\"/>\u003cpolygon points=\"45.5,32.3 48.8,37.9 52,32.3\" stroke-width=\"1.4\"/>\u003cpath d=\"M12 92 L30 83 L40 86 L58 74 L70 82 L78 80 L90 92\" stroke-width=\"1.8\"/>\u003cpath d=\"M53 77.5 L56 79.5 L58.5 77.5 L61 79.5 L63.5 77.5\" stroke-width=\"1.3\"/>\u003cpath d=\"M82 30 L88 27 M82 39.5 H89 M82 49 L88 52\" stroke-width=\"1.6\"/>"},{"n":10,"id":"wheel","name":"Wheel of Fortune","numeral":"X","archetype":"Fate","concept":"Risk and threat modeling","objectives":["1.9","1.10"],"hue":290,"upright":"Risk weighed in numbers and judgment, then deliberately mitigated, transferred, avoided or accepted within the appetite.","reversed":"Spinning blind: risks ignored, controls that cost more than the losses they prevent, and no one owning what remains.","vision":"A great wheel turns in the clouds, and on each turn it shaves a slice from a golden statue; a clerk multiplies the slice by the turns in a year. The serpent sliding down the left side can bite only where the rim is cracked. On the right a jackal-headed figure rises, fanning four cards: a shield, an insurance slip, an exit door and a signed shrug. A fifth card, a blindfold, bursts into flame in their hand. The sphinx on top holds a cup with a painted line, catching whatever drips past the shield. In the corners four winged creatures read books of six and seven chapters.","decode":["A slice of the golden statue, times the turns in a year → SLE = asset value × exposure factor; ALE = SLE × annualized rate of occurrence.","The serpent bites only where the rim is cracked → risk needs a threat that can exploit a vulnerability; risk = likelihood × impact.","Shield, insurance slip, exit door, signed shrug; the blindfold burns → mitigate, transfer, avoid, accept. Ignoring or rejecting risk is never acceptable.","The sphinx's cup with a painted line → residual risk, what is left after controls, must stay within the risk appetite senior management sets.","Books of six and seven chapters → STRIDE: spoofing, tampering, repudiation, information disclosure, DoS, elevation of privilege; PASTA's seven stages."],"facts":["Safeguard value = ALE before − ALE after − the safeguard's annual cost. If the result is negative, the control costs more than the risk it removes.","Quantitative analysis assigns money values (SLE, ALE); qualitative analysis ranks risks with scenarios and scales such as high, medium and low, often via the Delphi technique.","Total risk = threats × vulnerabilities × asset value; residual risk = total risk − controls gap. Senior management decides whether to accept it."],"trap":"The collective's costliest arithmetic: an event expected once every 20 years has an ARO of 0.05, not 20. Multiply SLE by that fraction, and never pay more for a control than the loss it removes.","glyph":"\u003ccircle cx=\"50\" cy=\"52\" r=\"28\"/>\u003ccircle cx=\"50\" cy=\"52\" r=\"21\" stroke-width=\"1.4\"/>\u003ccircle cx=\"50\" cy=\"52\" r=\"4\"/>\u003cpath d=\"M50 48 V31 M50 56 V73 M46 52 H29 M54 52 H71 M47.2 49.2 L35.2 37.2 M52.8 54.8 L64.8 66.8 M52.8 49.2 L64.8 37.2 M47.2 54.8 L35.2 66.8\" stroke-width=\"1.6\"/>\u003cpath d=\"M50 52 L50 31 A21 21 0 0 1 64.85 37.15 Z\" fill=\"currentColor\" fill-opacity=\"0.45\" stroke-width=\"1.4\"/>\u003cpath d=\"M17 28 C9 36 23 42 15 50 C7 58 21 64 13 72\" stroke-width=\"2\"/>\u003cpath d=\"M10 68 L13 73 L18 70\" stroke-width=\"1.8\"/>\u003cpath d=\"M86 78 V32 M81 38 L86 32 L91 38\"/>\u003cpath d=\"M8 10 L16 8 L24 10 V19 L16 17 L8 19 Z M16 8 V17\" stroke-width=\"1.3\"/>\u003cpath d=\"M76 10 L84 8 L92 10 V19 L84 17 L76 19 Z M84 8 V17\" stroke-width=\"1.3\"/>\u003cpath d=\"M8 86 L16 84 L24 86 V95 L16 93 L8 95 Z M16 84 V93\" stroke-width=\"1.3\"/>\u003cpath d=\"M76 86 L84 84 L92 86 V95 L84 93 L76 95 Z M84 84 V93\" stroke-width=\"1.3\"/>"},{"n":11,"id":"justice","name":"Justice","numeral":"XI","archetype":"The Judge","concept":"Investigations and evidence","objectives":["1.5","7.1"],"hue":180,"upright":"Evidence by the rules: volatile data captured first, imaged and hashed, logged in an unbroken chain, weighed to the right standard.","reversed":"A broken chain of custody, an original altered by its own examiner, and damning evidence the court must throw out.","vision":"A judge sits before a purple veil, raising a sword with three edges; every exhibit must survive all three before it reaches the scales. Whoever brushes the veil leaves a thread in it and walks away dusted purple. A neighbors' quarrel tips the scales with one grain of sand, but a prisoner's fate tips only when the pan strikes the floor and casts no shadow. Each exhibit arrives wrapped in a chain whose every link bears a thumbprint and an hour; where one link is missing, the exhibit turns to smoke. A clerk catches the soap bubbles first, then the snowflakes, and leaves the stone tablets for last.","decode":["A sword with three edges every exhibit must survive → admissible evidence must be relevant, material and competent (legally obtained).","Brushing the veil leaves a thread and takes purple dust → Locard's exchange principle: every contact leaves a trace and carries one away.","One grain tips the quarrel; the prisoner's pan must strike the floor and cast no shadow → civil: preponderance of the evidence; criminal: beyond a reasonable doubt.","A chain of thumbprints and hours; one missing link turns the exhibit to smoke → chain of custody logs every handler and transfer, or integrity cannot be proven.","Soap bubbles, then snowflakes, then stone → order of volatility: registers, cache and RAM first, then temporary files, then disk, with archives last."],"facts":["Evidence is real (objects, such as a seized drive), documentary (writings, including logs) or testimonial (witnesses). The best evidence rule demands original documents.","Investigation types: administrative (internal), criminal, civil, regulatory (an agency enforcing its own rules) and industry standards. Internal cases can turn criminal.","E-discovery follows the EDRM: identify, preserve, collect, process, review, analyze, produce, present. A legal hold halts routine deletion once a suit is reasonably expected."],"trap":"The collective's oldest sin: examining the original drive. Capture RAM before any shutdown, image the disk bit for bit through a write blocker, hash both, and work only on the copy.","glyph":"\u003cpolygon points=\"50,7 54.5,15 54.5,62 45.5,62 45.5,15\"/>\u003cpath d=\"M50 18 V57\" stroke-width=\"1.2\"/>\u003cpath d=\"M37 64 H63\"/>\u003crect x=\"47\" y=\"66\" width=\"6\" height=\"13\" rx=\"2\"/>\u003ccircle cx=\"50\" cy=\"83\" r=\"3.5\"/>\u003cpath d=\"M22 24 H45.5 M54.5 24 H78\"/>\u003cpath d=\"M22 24 L12 54 M22 24 L32 54 M78 24 L68 54 M78 24 L88 54\" stroke-width=\"1.4\"/>\u003cpath d=\"M10 54 A12 9 0 0 0 34 54 Z\"/>\u003cpath d=\"M66 54 A12 9 0 0 0 90 54 Z\"/>\u003cellipse cx=\"22\" cy=\"38.5\" rx=\"2.4\" ry=\"3.6\" stroke-width=\"1.6\"/>\u003cpath d=\"M22 41 V47.5\" stroke-width=\"1.6\"/>\u003cellipse cx=\"22\" cy=\"50\" rx=\"2.4\" ry=\"3.6\" stroke-width=\"1.6\"/>\u003cpath d=\"M76 38 V51 M80.5 38 V51 M73 42.5 H83.5 M72.5 47 H83\" stroke-width=\"1.6\"/>"},{"n":12,"id":"hanged-man","name":"The Hanged Man","numeral":"XII","archetype":"The One Who Waits","concept":"Change, configuration and patching","objectives":["7.3","7.8","7.9"],"hue":160,"upright":"Change made deliberately: hardened baselines, and every change requested, reviewed, approved, tested and documented.","reversed":"Untested patches rushed into production, settings drifting unseen, and emergency fixes no one ever writes down.","vision":"A calm figure hangs upside down by one foot from a living T-shaped tree. Every branch is grown from cuttings of one blessed mother branch. At dawn a gardener traces the tree in chalk and snips any twig that strays past the line, though no one asked it to grow. A council of crows on the crossbar must hear, debate and vote on the smallest twitch of the figure's toe, rehearse it on a straw dummy, choose an hour and write it in a ledger. When lightning splits a branch, the figure splints it alone; at sunrise the crows still inspect and record the splint. The halo sweeps the bark, lighting every crack fresh sap has not sealed.","decode":["Every branch grown from cuttings of one mother branch → imaging: systems built from one hardened, approved golden image start from the same secure baseline.","The chalk outline; stray twigs nobody asked for, snipped → drift detection: a setting changed with no change request is unauthorized; flag it and restore the baseline.","The council of crows that hears, votes, rehearses, picks an hour and writes it down → the CAB: request, review, approve or reject, test, schedule and implement, document.","The splint made alone, inspected and recorded at sunrise → an emergency change may skip prior approval, but it is still reviewed and documented afterward.","The halo lighting every unsealed crack → vulnerability scans find missing patches and misconfigurations; credentialed scans see far more than uncredentialed ones."],"facts":["Patch management order: evaluate, test, approve, deploy, verify. Test on systems that mirror production; verification proves each patch actually landed.","When an actively exploited zero-day has no patch, apply compensating controls: disable or isolate the service, block the attack vector and watch it closely.","Configuration management sets and records baselines; change management controls every later modification, and each approved change updates the documented baseline."],"trap":"The collective's oldest scar: an urgent patch pushed straight into production that caused the very outage it was meant to prevent. Urgency shortens the queue; it never skips the test.","glyph":"\u003cpath d=\"M14 14 H86\"/>\u003cpath d=\"M20 14 V88 M80 14 V88\"/>\u003cpath d=\"M20 34 L13 28 M80 52 L87 46\" stroke-width=\"1.6\"/>\u003cellipse cx=\"33\" cy=\"10\" rx=\"4\" ry=\"1.8\" transform=\"rotate(-25 33 10)\" fill=\"currentColor\"/>\u003cellipse cx=\"67\" cy=\"10\" rx=\"4\" ry=\"1.8\" transform=\"rotate(25 67 10)\" fill=\"currentColor\"/>\u003cpath d=\"M50 14 V22\"/>\u003cpath d=\"M50 22 V42\"/>\u003cpolyline points=\"50,41 60,33 47,28\"/>\u003cpath d=\"M50 42 V62\"/>\u003cpolyline points=\"45.5,61 40,53 50,48.5 60,53 54.5,61\"/>\u003ccircle cx=\"50\" cy=\"69\" r=\"5.5\"/>\u003cpath d=\"M55.9 59 A12.5 12.5 0 0 1 55.9 81 M58.1 77.4 L55.9 81 L60.1 81.1\" stroke-width=\"1.8\"/>\u003cpath d=\"M44.1 81 A12.5 12.5 0 0 1 44.1 59 M41.9 62.6 L44.1 59 L39.9 58.9\" stroke-width=\"1.8\"/>"},{"n":13,"id":"death","name":"Death","numeral":"XIII","archetype":"The Transformer","concept":"Endings: retention, sanitization and deprovisioning","objectives":["2.4","2.5","5.5","7.5"],"hue":0,"upright":"Every ending planned: data kept as long as law and business require, then destroyed beyond recovery; access cut on the last day.","reversed":"Records hoarded forever, wiped drives that still whisper, end-of-support servers left running, ex-staff who can still log in.","vision":"An armored skeleton rides a white horse through the archive, ending everything on schedule. Its black banner bears a white rose with a date inked on every stem; the rider cuts no stem a day early or a day late. A bishop waves a magnet over a glass chip, and the chip only laughs. Disks the rider has already wiped still whisper names when held to the ear. At the gate the rider takes a departing knight's badge before the knight finishes saying goodbye. The sun rises between two towers: one has stopped selling bread, the other has barred its doors for good. On the river, a locked chest becomes driftwood the moment its only key sinks.","decode":["The rider cuts each rose stem on its inked date → retention: keep data as long as law, regulation and business need require, then destroy it on schedule.","The chip that laughs at the magnet; wiped disks still whispering → degaussing cannot erase SSDs, and data remanence survives deletion: purge or destroy instead.","The badge taken before goodbye → deprovisioning: disable every account the moment employment ends; ex-staff accounts left active are a classic audit finding.","Two towers, one stops selling, one bars its doors → EOL: the vendor stops selling the product; EOS: patches and support end, so isolate or replace it.","The chest lost when its only key sinks → cryptographic erasure: destroy the encryption keys and the data is unreadable; ideal for SEDs and cloud storage."],"facts":["NIST SP 800-88: clear (overwrite; stops simple recovery), purge (degauss, block or crypto erase; stops lab recovery), destroy. Media leaving your control needs purge.","Privilege creep is access piling up as people change roles. On every transfer, remove old rights as new ones are added; access reviews catch what slips through.","Owners classify data and set its protection; custodians carry it out day to day (backups, restores); administrators grant access by the owner's rules."],"trap":"The collective once kept everything forever, just in case. Data held past its retention period is pure liability, discoverable in lawsuits and exposed in breaches; destroy it on schedule unless a legal hold applies.","glyph":"\u003ccircle cx=\"22\" cy=\"10\" r=\"2.2\" fill=\"currentColor\"/>\u003cpath d=\"M22 13 V90\"/>\u003cpath d=\"M22 16 H62 M22 56 H62\"/>\u003cpath d=\"M62 16 Q71 14 80 17 M62 22.7 Q68 21 74 23.5 M62 29.3 Q73 27.5 84 30 M62 36 Q69 34.5 77 37 M62 42.7 Q72 41 82 43.5 M62 49.3 Q67 48 72 50 M62 56 Q70 54.5 79 57\" stroke-width=\"1.8\"/>\u003cpath d=\"M42 27.5 A5.4 5.4 0 1 1 50.1 33.4 A5.4 5.4 0 1 1 47 42.9 A5.4 5.4 0 1 1 37 42.9 A5.4 5.4 0 1 1 33.9 33.4 A5.4 5.4 0 1 1 42 27.5 Z\"/>\u003ccircle cx=\"42\" cy=\"36\" r=\"3\"/>\u003cpath d=\"M38 88 V70 L42 66 L46 70 V88 M70 88 V70 L74 66 L78 70 V88\"/>\u003cpath d=\"M52 82 A6 6 0 0 1 64 82 M58 72 V69 M51 75 L49 73 M65 75 L67 73\" stroke-width=\"1.6\"/>\u003cpath d=\"M32 88 H86\" stroke-width=\"1.6\"/>"},{"n":14,"id":"temperance","name":"Temperance","numeral":"XIV","archetype":"The Alchemist","concept":"Least privilege and separation of duties","objectives":["5.4","7.4"],"hue":140,"upright":"Only what the task needs, only for as long as it needs it, and no single person holding every step of a sensitive process.","reversed":"Standing admin rights for everyone, one clerk who orders, approves and pays, and roles that silently pile up power.","vision":"An angel pours water between two cups, but only a single sip ever leaves the upper cup. The angel who fills a cup may never drink from it, and the jug tips only when a second angel grips its other handle. Wings sprout for each pour and molt the instant it ends. One foot stands on land, one in the river, and every spring a stranger borrows both and learns both shores. Up the path to a distant crown wait five gates: one opened by its owner's whim, one reading the label sewn in your collar, one admitting your uniform, one obeying the sign on its post, one weighing everything about you.","decode":["Only a sip leaves the cup → least privilege: grant only the rights the task needs; need to know limits data access even for someone fully cleared.","The filler never drinks; two hands on one jug → separation of duties splits a task so fraud needs collusion; two-person control needs both present at once.","Wings that sprout for each pour and molt after → just-in-time privileged access: elevation granted for one task, then revoked automatically.","A stranger borrows both feet each spring → job rotation: cross-trained backups, and a successor who may uncover fraud the last holder concealed.","Owner's whim, collar label, uniform, posted sign, everything → DAC (owner), MAC (labels, clearances), RBAC (role), rule-based (global rules), ABAC (attributes)."],"facts":["MAC compares labels: access needs a clearance that dominates the object's classification, plus need to know for its compartment. Users cannot change labels.","Every model except DAC is nondiscretionary: central policy, not the object's owner, decides access. DAC lets owners grant rights, usually through ACLs.","Privileged accounts: keep admin accounts separate from daily ones, vault and rotate their passwords, require MFA, record sessions and review every use."],"trap":"The collective keeps reading RBAC as rule-based. Role-based access follows your job role; rule-based applies global rules to every subject alike, such as a firewall's hours; ABAC weighs many attributes.","glyph":"\u003cg transform=\"translate(29 30) rotate(35)\">\u003cpath d=\"M-11 0 H11 C11 11 6 16 0 16 C-6 16 -11 11 -11 0 Z\"/>\u003cpath d=\"M0 16 V23 M-6 24.5 Q0 21.5 6 24.5\"/>\u003ccircle cx=\"0\" cy=\"5.5\" r=\"2\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003cpolygon points=\"-1.3,6.5 1.3,6.5 2,11 -2,11\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003c/g>\u003cg transform=\"translate(69 57)\">\u003cpath d=\"M-11 0 H11 C11 11 6 16 0 16 C-6 16 -11 11 -11 0 Z\"/>\u003cpath d=\"M0 16 V23 M-6 24.5 Q0 21.5 6 24.5\"/>\u003ccircle cx=\"0\" cy=\"5.5\" r=\"2\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003cpolygon points=\"-1.3,6.5 1.3,6.5 2,11 -2,11\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003c/g>\u003cpath d=\"M37.5 32 C50 30 62 38 66 53\" stroke-dasharray=\"0.1 5\" stroke-width=\"2.6\"/>\u003cpolyline points=\"64,24 64,14 69,18.5 74,11 79,18.5 84,14 84,24 Z\"/>\u003cpath d=\"M12 88 H40 M44 88 Q48 85 52 88 T60 88 T68 88 T76 88 T84 88\" stroke-width=\"1.6\"/>"},{"n":15,"id":"devil","name":"The Devil","numeral":"XV","archetype":"The Shadow","concept":"Identity and authentication attacks","objectives":["5.1","5.2","5.6"],"hue":350,"upright":"Identity proven with the right factors: phishing-resistant MFA, tickets bound to synced clocks, sessions that expire on time.","reversed":"Reused passwords, prompts approved just to stop the buzzing, stolen hashes replayed and sessions that never end.","vision":"A horned figure squats on a pedestal, collecting three gifts at the door: a whispered word, a carried coin and a fingerprint; three whispered words buy nothing. Below, two chained figures tap yes on a box that buzzes all night, never noticing that their chains are loose enough to lift. The horned one tries one stolen key on a thousand doors and opens others with only a wax print of a key. At the back gate a three-headed dog stamps tickets with the hour and burns any five minutes off; a thief who stole its seal prints golden tickets. The inverted torch drips two flames: one shuts out friends, one admits strangers.","decode":["Word, coin, fingerprint; three words buy nothing → MFA mixes factor types: something you know, have, are. A password plus a security question is still one factor.","Tapping yes on a box that buzzes all night; chains loose enough to lift → MFA fatigue: push prompts spammed until one is approved. Number matching breaks the spell.","One stolen key on a thousand doors; a wax print of a key → credential stuffing replays breached passwords on other sites; pass-the-hash replays the hash itself.","The dog stamping tickets with the hour; golden tickets → Kerberos tickets need clocks within 5 minutes; a stolen KRBTGT hash lets an attacker forge any TGT.","Two flames of the inverted torch → type I errors (FRR) shut out valid users; type II (FAR) admit impostors. Where the rates cross is the CER: lower is better."],"facts":["Kerberos uses symmetric keys, not PKI: the KDC holds every principal's secret key, so it is a single point of failure. The password itself never crosses the network.","Kerberoasting: any domain user requests service tickets for accounts with SPNs and cracks them offline; long random or managed service-account passwords defeat it.","Sessions need random IDs sent only over TLS, renewed at login, with idle and absolute timeouts; a stolen session cookie walks straight past MFA."],"trap":"The collective believed any MFA stops phishing. A fake page can relay passwords and one-time codes in real time; only origin-bound FIDO2/WebAuthn keys refuse to answer the wrong site.","glyph":"\u003cpath d=\"M37 44 C30 34 22 26 24 11 C30 23 40 30 45 44\"/>\u003cpath d=\"M63 44 C70 34 78 26 76 11 C70 23 60 30 55 44\"/>\u003crect x=\"30\" y=\"44\" width=\"40\" height=\"30\" rx=\"4\"/>\u003ccircle cx=\"50\" cy=\"55\" r=\"3.6\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003cpolygon points=\"48.2,57 51.8,57 53,66 47,66\" fill=\"currentColor\" stroke-width=\"0.6\"/>\u003crect x=\"40\" y=\"74\" width=\"20\" height=\"5\" rx=\"1\"/>\u003cellipse cx=\"33\" cy=\"80\" rx=\"4\" ry=\"2.4\" transform=\"rotate(30 33 80)\" stroke-width=\"1.6\"/>\u003cellipse cx=\"25\" cy=\"84.5\" rx=\"4\" ry=\"2.4\" transform=\"rotate(30 25 84.5)\" stroke-width=\"1.6\"/>\u003cpath d=\"M18.5 86 A4 2.4 30 1 1 15 90\" stroke-width=\"1.6\"/>\u003cellipse cx=\"67\" cy=\"80\" rx=\"4\" ry=\"2.4\" transform=\"rotate(-30 67 80)\" stroke-width=\"1.6\"/>\u003cellipse cx=\"75\" cy=\"84.5\" rx=\"4\" ry=\"2.4\" transform=\"rotate(-30 75 84.5)\" stroke-width=\"1.6\"/>\u003cpath d=\"M81.5 86 A4 2.4 -30 1 0 85 90\" stroke-width=\"1.6\"/>"},{"n":16,"id":"tower","name":"The Tower","numeral":"XVI","archetype":"The Upheaval","concept":"Physical security and safety","objectives":["3.8","3.9","7.14","7.15"],"hue":16,"upright":"Life safety first, then property: layered zones, controlled entry, clean power, steady climate and suppression matched to the fire.","reversed":"Exits that lock people in, water on electrical fires, a single power feed: the walls fall on the people they were built to shelter.","vision":"Lightning in three prongs, heat, fuel and air, strikes a tower of humming server racks. The crown topples, but the guards let it fall and catch the two tumbling figures first. Flames lean from the windows; someone hurls a bucket at a sparking fuse box, and the water leaps back as more lightning. Along the walls, empty pipes wait for the smoke bell, fill when it rings, and spray only where a glass bulb bursts in the heat. As the lights die, the front door swings open for the fleeing while the vault bolts itself shut. At the gate, a guard gripped by a stranger whistles a nursery tune, and help comes running.","decode":["Guards let the crown fall and catch the figures → life safety is always the first priority: people before data, equipment or the building.","Three-pronged lightning; the bucket's water leaping back → the fire triangle: remove heat, fuel or oxygen. Never use water on class C (electrical) fires.","Empty pipes that fill at the smoke bell and spray where a bulb bursts → pre-action sprinklers: two triggers, the best water choice for computer rooms.","Front door opens, vault bolts shut as the lights die → fail-safe unlocks on power loss to protect people; fail-secure stays locked to protect assets.","The guard's nursery tune → a duress code: an innocent-sounding word or signal that warns others the speaker is under coercion."],"facts":["Wet pipe is always charged and fastest; dry pipe holds air for freezing spaces; pre-action fills on detection and sprays when a head opens; deluge floods via open heads.","Fault and blackout are momentary and prolonged power loss; sag and brownout, low voltage; spike and surge, high voltage. A UPS bridges short gaps; generators carry long ones.","CPTED designs out crime with natural access control, natural surveillance and territorial reinforcement: low shrubs, good lighting and clear sightlines."],"trap":"The collective remembers the server room that locked its people in. When human life is weighed against data or equipment, life safety wins every time: exit doors fail safe; only vaults fail secure.","glyph":"\u003cpath d=\"M16 92 L30 87 H72 L86 92\"/>\u003cpath d=\"M38 87 L41 37 H63 L66 87 Z\"/>\u003cpath d=\"M40 37 V29 H45 V33 H49.5 V29 H54.5 V33 H59 V29 H64 V37\"/>\u003crect x=\"45\" y=\"43\" width=\"14\" height=\"8\" rx=\"1\"/>\u003crect x=\"45\" y=\"56\" width=\"14\" height=\"8\" rx=\"1\"/>\u003cpath d=\"M48 47 H52 M48 60 H52\" stroke-width=\"1.6\"/>\u003ccircle cx=\"56\" cy=\"47\" r=\"1.3\" fill=\"currentColor\"/>\u003ccircle cx=\"56\" cy=\"60\" r=\"1.3\" fill=\"currentColor\"/>\u003cpath d=\"M48 87 V78 A4 4 0 0 1 56 78 V87\"/>\u003cpath d=\"M64 52 C71 50 73 44 70 39 C69 43 67 44 66 43 C67 39 65 36 62 34\" stroke-width=\"1.8\"/>\u003cpolygon points=\"12,8 32,17 26,19 44,28 21,21 27,18.5\" fill=\"currentColor\" fill-opacity=\"0.35\" stroke-width=\"1.6\"/>\u003cpolygon points=\"-7,4 -8,-5 -3.5,-1 0,-7 3.5,-1 8,-5 7,4\" transform=\"translate(78 20) rotate(28)\"/>\u003ccircle cx=\"23\" cy=\"70\" r=\"3.2\"/>\u003cpath d=\"M24 66.8 L27 57 M27 57 L23 50 M27 57 L32 51 M25.5 62 L19 60 M25.5 62 L31 64\" stroke-width=\"1.6\"/>\u003ccircle cx=\"80\" cy=\"74\" r=\"3.2\"/>\u003cpath d=\"M79 70.8 L76 61 M76 61 L80 54 M76 61 L71 55 M77.5 66 L84 64 M77.5 66 L72 68\" stroke-width=\"1.6\"/>"},{"n":17,"id":"star","name":"The Star","numeral":"XVII","archetype":"The Healer","concept":"Continuity and recovery","objectives":["1.7","7.10","7.11","7.12","7.13"],"hue":212,"upright":"A BIA that knows what must return first and how fast, backups that truly restore, and a plan rehearsed until it works.","reversed":"A plan never tested, backups never restored, an RTO longer than the business can survive: hope mistaken for recovery.","vision":"A kneeling figure keeps one foot on land and one in a pool. From one jug they refill the pool, and a tide mark on the stone shows the most water that may ever be lost. From the other jug they water the land while two hourglasses run end to end, racing a sundial's shadow toward a red line. Five streams fan across the land, each wider than the last: the first only dampens a written page, the last drowns the old riverbed. Overhead, seven small stars copy the great one, the first whole, each after only the light that changed. In the tree an ibis keeps three nests: warm eggs, straw, bare twigs.","decode":["The tide mark on the stone → RPO: the most data you can afford to lose, measured in time; it sets how often you back up.","Two hourglasses racing the sundial's red line → RTO plus WRT must fit inside the MTD; a recovery slower than the MTD fails the business.","Five streams, from a dampened page to a drowned riverbed → DR tests from least to most disruptive: read-through, walk-through, simulation, parallel, full interruption.","Seven small stars, the first whole, the rest only changed light → a full backup plus incrementals: a restore needs the full and every incremental since, in order.","Nests of warm eggs, straw and bare twigs → hot site (ready, current data), warm site (equipment but no current data), cold site (space and power only)."],"facts":["Differential backups copy everything changed since the last full and leave the archive bit set, so a restore needs only the full plus the latest differential.","Return from the alternate site with the least critical functions first, so the repaired primary site proves itself before critical work moves back.","RAID and clustering are fault tolerance, not backup: RAID 1 mirrors; RAID 5 stripes with parity across at least three disks and survives one disk failure."],"trap":"The collective keeps swapping RTO and RPO. RTO is how fast a system must be back, and it must be shorter than the MTD; RPO is how much data may be lost, counted back to the last good backup.","glyph":"\u003cpolygon points=\"50,16 52.1,25.9 60.6,20.4 55.1,28.9 65,31 55.1,33.1 60.6,41.6 52.1,36.1 50,46 47.9,36.1 39.4,41.6 44.9,33.1 35,31 44.9,28.9 39.4,20.4 47.9,25.9\"/>\u003ccircle cx=\"50\" cy=\"31\" r=\"2.5\" fill=\"currentColor\"/>\u003ccircle cx=\"50\" cy=\"9\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"31\" cy=\"13\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"69\" cy=\"13\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"20\" cy=\"25\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"80\" cy=\"25\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"17\" cy=\"40\" r=\"1.8\" fill=\"currentColor\"/>\u003ccircle cx=\"83\" cy=\"40\" r=\"1.8\" fill=\"currentColor\"/>\u003cg transform=\"translate(22 60) rotate(55)\">\u003cpath d=\"M-3.5 -9 V-6 C-9 -3 -9 7 -4 9 H4 C9 7 9 -3 3.5 -6 V-9 Z\"/>\u003cpath d=\"M-5 -9 H5\"/>\u003c/g>\u003cg transform=\"translate(78 60) rotate(-55)\">\u003cpath d=\"M-3.5 -9 V-6 C-9 -3 -9 7 -4 9 H4 C9 7 9 -3 3.5 -6 V-9 Z\"/>\u003cpath d=\"M-5 -9 H5\"/>\u003c/g>\u003cpath d=\"M30 58 C36 60 38 64 40 70\" stroke-width=\"1.6\"/>\u003cpath d=\"M70 58 C64 60 62 64 60 70\" stroke-width=\"1.6\"/>\u003cellipse cx=\"50\" cy=\"72\" rx=\"15\" ry=\"4.5\"/>\u003cpath d=\"M35 72 V86 A15 4.5 0 0 0 65 86 V72 M35 79 A15 4.5 0 0 0 65 79\"/>"},{"n":18,"id":"moon","name":"The Moon","numeral":"XVIII","archetype":"The Trickster","concept":"Deception: network attacks and detection","objectives":["4.3","7.7"],"hue":250,"upright":"Seeing through disguises: decoys that study intruders, sensors tuned to the known and the strange, tunnels no eavesdropper can read.","reversed":"Believing every reply: forged ARP and DNS answers, a sensor nobody watches, and plaintext crossing hostile ground.","vision":"A painted moon hangs low, a lamp the guards lit on purpose; it glows for prowlers already on the road but never calls to anyone asleep. A dog howls at faces it knows from wanted posters; a wolf howls at anything that walks strangely, and sometimes at the wind. From the pool a hundred crayfish crawl to the tower door, each knocking once and scuttling off before it opens, until real travelers cannot get in. Between the two towers the path runs inside a sealed glass pipe, each traveler wrapped whole in a dark cloak. A shadow on the path whispers to each tower that it is the other.","decode":["The moon lamp lit on purpose → honeypot: a decoy with no real users, so any visitor is suspect. It may entice the willing but must never entrap.","Dog of wanted posters, wolf howling at odd gaits and wind → signature detection catches known attacks; anomaly detection finds new ones, with more false positives.","Crayfish that knock once and never return → SYN flood: half-open handshakes fill the server's connection queue; SYN cookies blunt it.","The path sealed in glass, travelers cloaked whole → IPsec tunnel mode wraps the entire original packet, as gateway VPNs do; transport mode guards only the payload.","The shadow telling each tower it is the other → man-in-the-middle, often by ARP poisoning: forged replies map the attacker's MAC to another host's IP."],"facts":["An IDS is passive: it detects and alerts. An IPS sits inline and blocks, so an IPS false positive stops legitimate traffic instead of just raising an alarm.","A honeynet links several honeypots; a padded cell quietly moves a detected intruder into a simulated environment; pseudo flaws are fake vulnerabilities planted as bait.","ARP poisoning works only on the local segment; DNS poisoning plants false name-to-address records to send users to fake sites, and DNSSEC counters it by signing records."],"trap":"The collective still blurs enticement and entrapment. A honeypot that waits for an intruder already intent on attack is legal enticement; inducing someone who would not have attacked is entrapment.","glyph":"\u003ccircle cx=\"50\" cy=\"28\" r=\"16\"/>\u003cpath d=\"M52 15 A13 13 0 1 0 52 41 A10.5 10.5 0 0 1 52 15 Z\" fill=\"currentColor\" fill-opacity=\"0.35\"/>\u003cpath d=\"M50 6 V9 M50 47 V50 M28 28 H31 M69 28 H72 M34.4 12.4 L36.6 14.6 M63.4 41.4 L65.6 43.6 M65.6 12.4 L63.4 14.6 M36.6 41.4 L34.4 43.6\" stroke-width=\"1.6\"/>\u003cpath d=\"M41 52 C39 55 38 57 38 58.5 A3 3 0 0 0 44 58.5 C44 57 43 55 41 52 Z\" fill=\"currentColor\" fill-opacity=\"0.5\" stroke-width=\"1.4\"/>\u003cpath d=\"M59 52 C57 55 56 57 56 58.5 A3 3 0 0 0 62 58.5 C62 57 61 55 59 52 Z\" fill=\"currentColor\" fill-opacity=\"0.5\" stroke-width=\"1.4\"/>\u003cpath d=\"M50 58 C48 61 47 63 47 64.5 A3 3 0 0 0 53 64.5 C53 63 52 61 50 58 Z\" fill=\"currentColor\" fill-opacity=\"0.5\" stroke-width=\"1.4\"/>\u003cpath d=\"M14 90 V58 H16.5 V54 H20 V58 H22.5 V54 H26 V58 H28 V90\"/>\u003cpath d=\"M72 90 V58 H74.5 V54 H78 V58 H80.5 V54 H84 V58 H86 V90\"/>\u003cpath d=\"M38 92 C40 84 58 82 56 76 C55 72 46 72 48 68 M62 92 C62 86 70 82 66 76\" stroke-width=\"1.6\"/>"},{"n":19,"id":"sun","name":"The Sun","numeral":"XIX","archetype":"The Illuminator","concept":"Logging, monitoring and metrics","objectives":["7.2","6.3"],"hue":42,"upright":"Every event recorded, gathered in one place, stamped by one clock and actually read; progress measured and rising risk foreseen.","reversed":"Logs no one reads, clocks that disagree, and an intruder free to rewrite the record of their own visit.","vision":"A radiant sun with a face looks down on a walled garden where every stone keeps a diary. The sun reads all the diaries at once and notices three stones writing about the same stranger. Each page is sealed in wax the moment it is written, and one bell sets every sundial to the same hour. A child on a white horse rides along the wall, ignoring single stumbles but turning back at the fifth. Sunflowers lean over the wall to watch what leaves the garden, not what enters. The red banner carries two tallies: last season's harvest and the storm clouds gathering.","decode":["The sun reading every stone's diary at once → SIEM: gathers logs from many sources and correlates related events into one meaningful alert.","Pages sealed in wax; one bell for every sundial → log integrity (central, write-once, hashed) and NTP time sync, so events line up across systems.","Ignoring single stumbles, turning at the fifth → clipping level: a threshold that filters routine errors and flags only repeats, such as failed logons.","Sunflowers watching what leaves → egress monitoring and DLP: inspect outbound traffic to catch exfiltration of sensitive data.","The banner's two tallies → KPIs measure how well things have performed; KRIs are leading indicators that warn a risk is rising."],"facts":["UEBA baselines normal behavior for users and devices, then flags deviations, such as an account downloading far more than usual or signing in at odd hours.","Threat hunting assumes the attacker is already inside and searches proactively for indicators of compromise, rather than waiting for an alert to fire.","Backup verification data comes from actual test restores; a 'job completed' message proves nothing about whether the data can be recovered."],"trap":"The collective once kept logs on the very server the intruder had seized. An attacker with admin rights rewrites local logs; send them at once to a separate, access-controlled store and hash them.","glyph":"\u003ccircle cx=\"50\" cy=\"30\" r=\"12\"/>\u003ccircle cx=\"45.5\" cy=\"28\" r=\"1.4\" fill=\"currentColor\"/>\u003ccircle cx=\"54.5\" cy=\"28\" r=\"1.4\" fill=\"currentColor\"/>\u003cpath d=\"M45 34 Q50 38 55 34\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(0)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(30)\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(60)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(90)\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(120)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(150)\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(180)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(210)\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(240)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(270)\" stroke-width=\"1.6\"/>\u003cpath d=\"M0 -16 V-23\" transform=\"translate(50 30) rotate(300)\"/>\u003cpath d=\"M0 -16 C2.5 -18 -2.5 -20 0 -23\" transform=\"translate(50 30) rotate(330)\" stroke-width=\"1.6\"/>\u003crect x=\"19.5\" y=\"68\" width=\"5\" height=\"6\" rx=\"1\"/>\u003ccircle cx=\"22\" cy=\"64\" r=\"2.4\" fill=\"currentColor\"/>\u003ccircle cx=\"22\" cy=\"64\" r=\"5\" stroke-width=\"1.4\" stroke-dasharray=\"1.6 1.6\"/>\u003crect x=\"33.5\" y=\"64\" width=\"5\" height=\"10\" rx=\"1\"/>\u003ccircle cx=\"36\" cy=\"60\" r=\"2.4\" fill=\"currentColor\"/>\u003ccircle cx=\"36\" cy=\"60\" r=\"5\" stroke-width=\"1.4\" stroke-dasharray=\"1.6 1.6\"/>\u003crect x=\"61.5\" y=\"68\" width=\"5\" height=\"6\" rx=\"1\"/>\u003ccircle cx=\"64\" cy=\"64\" r=\
