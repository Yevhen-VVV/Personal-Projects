gh logging."],["Credential rotation","Rotation replaces existing credentials."],["Identity proofing","Correct. Proofing establishes that a person is who they claim to be before an identity is registered."]],"a":3,"k":"Registration starts with identity proofing; NIST defines identity assurance levels (IAL) for how strong it must be."},{"id":"D5-013","d":5,"obj":"5.2","diff":2,"q":"What is the main security risk of single sign-on?","o":[["One compromised credential can unlock many systems","Correct. SSO concentrates risk in one credential, so it must be paired with strong MFA and monitoring."],["Users must remember more passwords","SSO reduces the number of passwords."],["Applications can no longer log user activity","Applications still log activity under the SSO identity."],["SSO works poorly with cloud applications","SSO is widely used with cloud applications."]],"a":0,"k":"SSO improves usability and centralizes control, but makes the primary credential a high-value target."},{"id":"D5-014","d":5,"obj":"5.2","diff":2,"q":"An administrator receives elevated rights only after requesting them for a specific task, and the rights expire automatically after two hours. What is this approach called?","o":[["Role-based access control","RBAC assigns standing permissions by role."],["Just-in-time access","Correct. JIT access grants privileges only when needed and for a limited time, reducing standing privilege."],["Discretionary access control","DAC lets owners grant access at their discretion."],["Federated identity","Federation shares identities across organizations."]],"a":1,"k":"Just-in-time access removes standing privileges; combine it with approval workflows and logging."},{"id":"D5-015","d":5,"obj":"5.2","diff":1,"q":"Which tool helps users keep long, unique passwords for every site without having to remember them?","o":[["A shared spreadsheet on the team drive","Shared spreadsheets expose every password to everyone who can open them."],["Writing passwords in a notebook kept in a desk","Physical notes are easily lost or seen."],["A password manager (credential vault)","Correct. Password managers generate and store strong, unique credentials protected by a master secret and ideally MFA."],["Reusing one strong password everywhere","Reuse means one breach exposes every account."]],"a":2,"k":"Credential management systems (password vaults) make unique, strong passwords practical."},{"id":"D5-016","d":5,"obj":"5.2","diff":2,"q":"A web application keeps users logged in indefinitely with a session cookie that never expires. Which change BEST improves session management?","o":[["Store the session ID in the URL instead of a cookie","URLs leak through logs, browser history and referrer headers."],["Use the user's email address as the session ID","Predictable session IDs can be guessed."],["Allow a session to be used from any IP address worldwide","That makes stolen session tokens easier to use."],["Idle and absolute timeouts with secure cookie flags","Correct. Timeouts limit how long a stolen token is useful, and the Secure and HttpOnly flags protect the cookie in transit and from scripts."]],"a":3,"k":"Session management: random IDs, idle and absolute timeouts, Secure/HttpOnly/SameSite cookies, and invalidation at logout."},{"id":"D5-017","d":5,"obj":"5.2","diff":2,"q":"What distinguishes a TOTP code from an HOTP code?","o":[["TOTP uses time; HOTP uses a counter","Correct. TOTP codes expire after a short window, typically 30 seconds; HOTP codes stay valid until used."],["TOTP codes are longer than HOTP codes","Code length is configurable and is not the difference."],["HOTP requires a smartphone, TOTP does not","Both can be generated by apps or hardware tokens."],["HOTP is phishing-resistant and TOTP is not","Neither one-time password type is phishing-resistant."]],"a":0,"k":"TOTP = time-based, short-lived; HOTP = counter-based, valid until used."},{"id":"D5-018","d":5,"obj":"5.2","diff":2,"q":"A user authenticates with a fingerprint and a smart card. Which factor types are these?","o":[["Something you know and something you have","A fingerprint is not something you know."],["Something you have and somewhere you are","Location is not involved."],["Something you are and something you have","Correct. The fingerprint is inherence (Type 3) and the smart card is possession (Type 2)."],["Something you do and something you are","A smart card is a possession factor, not a behavior."]],"a":2,"k":"Factor types: know (Type 1), have (Type 2), are (Type 3); also location and behavior as context."},{"id":"D5-019","d":5,"obj":"5.2","diff":3,"q":"A bank detects a login from a new device in a new country at 3 a.m. and requires an extra verification step, while a login from the usual device and location needs only one factor. What is this?","o":[["Rule-based access control","Static rules do not weigh multiple contextual signals into a risk score."],["Mandatory access control","MAC uses labels and clearances, not login context."],["Risk-based (adaptive) authentication","Correct. The system scores context such as device, location and time, and steps up authentication when risk is high."],["Discretionary access control","DAC concerns owner-granted permissions."]],"a":2,"k":"Risk-based or adaptive authentication steps up requirements as contextual risk rises."},{"id":"D5-020","d":5,"obj":"5.2","diff":3,"q":"A company issues smart cards with certificates for logon. A user loses a card. What should happen FIRST?","o":[["Issue a new card and leave the old one active in case it is found","An active lost card can be used by whoever finds it, if the PIN is guessed or observed."],["Revoke the lost card's certificate","Correct. Revocation stops the credential working everywhere that checks certificate status."],["Ask the user to change their account password","The card's certificate, not the password, is the credential at risk."],["Wait 24 hours to see whether the card turns up","Delay leaves a working credential in unknown hands."]],"a":1,"k":"Credential lifecycle: revoke lost or compromised credentials immediately, then reissue."},{"id":"D5-021","d":5,"obj":"5.3","diff":2,"q":"In a SAML-based federation, which party authenticates the user and issues assertions about them?","o":[["The identity provider","Correct. The IdP authenticates the principal and sends signed assertions to the service provider."],["The service provider","The SP consumes assertions and grants access to its application."],["The user agent (browser)","The browser only carries messages between the IdP and SP."],["The certificate authority","A CA may issue the signing certificates but plays no part in each login."]],"a":0,"k":"SAML roles: principal (user), identity provider (authenticates, asserts), service provider (relies on assertions)."},{"id":"D5-022","d":5,"obj":"5.3","diff":2,"q":"A company runs an on-premises directory and wants users to sign in to cloud applications with the same accounts. Which model is this?","o":[["Cloud-only identity","Cloud-only means identities live only in the cloud provider."],["On-premises-only identity","That would not extend sign-in to cloud applications."],["Hybrid identity","Correct. The on-premises directory is synchronized or federated to a cloud identity service, so users have one identity everywhere."],["Discretionary identity","This is not an identity model."]],"a":2,"k":"Federated identity can be on-premises, cloud or hybrid; hybrid links the on-premises directory to cloud services."},{"id":"D5-023","d":5,"obj":"5.3","diff":2,"q":"When an employee is disabled in the company's directory, their accounts in federated SaaS applications should be removed automatically too. Which standard is designed for this cross-domain provisioning?","o":[["SAML","SAML handles authentication assertions, not account provisioning and deprovisioning."],["Kerberos","Kerberos is for authentication within a realm."],["LDAP","LDAP queries directories; it is not a cross-domain provisioning protocol for SaaS."],["SCIM","Correct. The System for Cross-domain Identity Management automates creating, updating and removing accounts in other systems."]],"a":3,"k":"SAML/OIDC handle sign-in; SCIM handles provisioning and deprovisioning across domains."},{"id":"D5-024","d":5,"obj":"5.3","diff":3,"q":"Your company accepts logins from a partner's identity provider. What is the MAIN risk you are accepting?","o":[["Your users will need to remember more passwords","Federation reduces passwords."],["Your applications will stop logging access","Applications still log access by the federated identity."],["Reliance on the partner's account management","Correct. You depend on the partner's identity proofing and account management: if it fails to disable a leaver or proofs identities poorly, your systems inherit the weakness."],["Your encryption keys must be shared with the partner","Federation uses signed assertions; you do not share your encryption keys."]],"a":2,"k":"Federation is a trust relationship; define it in agreements covering proofing, deprovisioning and incident notification."},{"id":"D5-025","d":5,"obj":"5.3","diff":2,"q":"A user signs in to a new SaaS application through the corporate identity provider, and the application creates the user's account during that first login. What is this called?","o":[["Just-in-time provisioning","Correct. The account is created from the assertion's attributes at first sign-in."],["Manual provisioning","Nobody created the account by hand here."],["Account recertification","Recertification reviews existing access."],["Privilege escalation","Escalation is gaining extra rights."]],"a":0,"k":"JIT provisioning creates accounts at first federated login; it still needs a deprovisioning path such as SCIM."},{"id":"D5-026","d":5,"obj":"5.4","diff":1,"q":"In which access control model can the owner of a file decide who else may access it?","o":[["Discretionary access control (DAC)","Correct. DAC leaves access decisions to the data owner, typically through ACLs."],["Mandatory access control (MAC)","In MAC the system enforces labels and clearances; owners cannot change access."],["Role-based access control (RBAC)","RBAC grants access through roles defined centrally."],["Rule-based access control","Rule-based access applies global rules, such as firewall rules, to all users."]],"a":0,"k":"DAC: owner decides. MAC: labels decide. RBAC: roles decide. ABAC: attributes decide."},{"id":"D5-027","d":5,"obj":"5.4","diff":2,"q":"A military system grants access only when a user's clearance dominates the data's classification label and the user belongs to the right compartment. Which model is this?","o":[["Role-based access control","Roles do not compare clearances with labels."],["Mandatory access control","Correct. MAC uses labels set by the system or administrators, which users cannot override."],["Discretionary access control","In DAC, owners decide access."],["Risk-based access control","Risk-based access weighs context in real time."]],"a":1,"k":"MAC is nondiscretionary and label-based, often lattice-based with compartments for need to know."},{"id":"D5-028","d":5,"obj":"5.4","diff":2,"q":"A hospital lets nurses access patient records only for patients on their ward, during their shift, from hospital devices. Which model can express all of these conditions?","o":[["Role-based access control","A role alone cannot express ward, time and device conditions."],["Discretionary access control","Owner-granted permissions do not handle dynamic conditions."],["Attribute-based access control","Correct. ABAC evaluates attributes of the user, resource, action and environment in policies."],["Mandatory access control","MAC uses classification labels, not shift times or devices."]],"a":2,"k":"ABAC handles fine-grained, context-rich policies that RBAC cannot express without role explosion."},{"id":"D5-029","d":5,"obj":"5.4","diff":2,"q":"A company assigns permissions to job functions such as \"Accounts Payable Clerk\", and users get permissions by being placed in those functions. Which model is this?","o":[["Discretionary access control","DAC is owner-driven, not job-function-driven."],["Rule-based access control","Rule-based access applies the same rules to everyone."],["Attribute-based access control","ABAC uses policies over many attributes."],["Role-based access control","Correct. RBAC maps permissions to roles and users to roles, which simplifies administration."]],"a":3,"k":"RBAC suits stable job functions; watch for privilege creep as people change roles."},{"id":"D5-030","d":5,"obj":"5.4","diff":2,"q":"A firewall allows remote desktop connections to a server only between 8 a.m. and 6 p.m. for everyone. Which model does this best represent?","o":[["Rule-based access control","Correct. Global rules applied equally to all subjects are rule-based access control."],["Role-based access control","Roles are not involved; the rule applies to everyone."],["Discretionary access control","No owner is granting access."],["Mandatory access control","No labels or clearances are compared."]],"a":0,"k":"Rule-based access control applies the same rules to all subjects, as in firewalls and time restrictions."},{"id":"D5-031","d":5,"obj":"5.4","diff":2,"q":"In an access control architecture, which component evaluates requests against policy and decides whether to allow them?","o":[["The policy enforcement point","The PEP intercepts requests and enforces the decision it receives."],["The policy information point","The PIP supplies attribute values used in decisions."],["The policy decision point","Correct. The PDP evaluates policy and returns permit or deny to the PEP."],["The policy administration point","The PAP is where policies are written and managed."]],"a":2,"k":"PEP enforces, PDP decides, PIP supplies attributes, PAP manages policies (as in XACML and zero trust)."},{"id":"D5-032","d":5,"obj":"5.4","diff":3,"q":"An access control system stores, for each user, a list of the objects they may access and their rights on each. What is this structure?","o":[["An access control list","An ACL is attached to an object and lists the subjects that may access it."],["A capability table","Correct. Capability tables are subject-centric: each row is one subject's rights."],["A clearance label","A label is a classification marking, not a list of rights."],["A constrained interface","Constrained interfaces limit what users can see or do in an application."]],"a":1,"k":"ACLs are object-centric (columns of the access matrix); capability tables are subject-centric (rows)."},{"id":"D5-033","d":5,"obj":"5.4","diff":2,"q":"A database view shows managers only the rows for employees who report to them. Which type of access control is this?","o":[["Content-dependent access control","Correct. Access depends on the data itself, here whether the employee reports to the viewer."],["Context-dependent access control","Context-dependent access depends on circumstances such as time or location."],["Rule-based access control","Rule-based access applies global rules regardless of data content."],["Mandatory access control","MAC compares labels with clearances."]],"a":0,"k":"Content-dependent: what the data says. Context-dependent: when, where or how the request is made."},{"id":"D5-034","d":5,"obj":"5.4","diff":2,"q":"An ATM menu shows a customer only the functions they are allowed to use and greys out the rest. What is this control?","o":[["Rule-based access control","The menu is not applying global network rules."],["Separation of duties","No task is split between people."],["A constrained interface","Correct. Constrained (restricted) interfaces limit the actions available to a user based on their privileges."],["Mandatory access control","No classification labels are compared."]],"a":2,"k":"Constrained interfaces hide or disable functions a user is not authorized for."},{"id":"D5-035","d":5,"obj":"5.4","diff":3,"q":"A cloud application must enforce the same authorization rules across dozens of microservices written by different teams. Which design is BEST?","o":[["Let each team write its own authorization logic","Duplicated logic drifts and becomes inconsistent."],["Grant every authenticated user full access and audit later","That abandons least privilege."],["Put all permissions in each user's JWT and let services trust them indefinitely","Long-lived, bloated tokens become stale and cannot reflect revoked access promptly."],["Externalize decisions to a central policy decision point that every service queries","Correct. Central policy with local enforcement keeps authorization consistent and auditable."]],"a":3,"k":"Externalized authorization (central PDP, local PEPs) keeps policy consistent across distributed systems."},{"id":"D5-036","d":5,"obj":"5.4","diff":2,"q":"Which of the following is a nondiscretionary access control model?","o":[["Discretionary access control","By definition, DAC is discretionary."],["User-directed access control","User-directed access control is a form of DAC: users decide who may access what they own."],["Identity-based access control with owner-set ACLs","Identity-based access with owner-managed ACLs is the most common form of DAC."],["Role-based access control","Correct. In RBAC, central administrators define access through roles; users cannot pass on their permissions at will."]],"a":3,"k":"Nondiscretionary models (RBAC, rule-based, ABAC, MAC) are centrally administered."},{"id":"D5-037","d":5,"obj":"5.5","diff":1,"q":"An employee who has worked in four departments over ten years still has access from every previous role. What is this called?","o":[["Privilege creep","Correct. Access accumulates when transfers add rights without removing the old ones."],["Privilege escalation","Escalation is gaining higher rights through an exploit or misuse, not accumulation."],["Least privilege","Least privilege is the principle being violated here."],["Separation of duties","SoD splits tasks; it does not describe accumulated access."]],"a":0,"k":"Prevent privilege creep with access reviews and by removing old access at every transfer."},{"id":"D5-038","d":5,"obj":"5.5","diff":2,"q":"What is the PRIMARY purpose of periodic user access reviews (recertifications)?","o":[["To find accounts with weak or reused passwords","Password audits are a separate control; a recertification asks whether each person still needs each entitlement."],["To measure system performance","Performance is not part of access review."],["To confirm access is still appropriate","Correct. Managers or data owners attest to each user's access and remove what is not needed, catching privilege creep and orphaned accounts."],["To train users on the acceptable use policy","Training is a separate activity."]],"a":2,"k":"Access reviews verify that access still matches need; they find privilege creep, orphaned accounts and SoD conflicts."},{"id":"D5-039","d":5,"obj":"5.5","diff":2,"q":"An access review finds dozens of active accounts belonging to people who left the company months ago. Which process failed?","o":[["Identity proofing","Proofing happens when an identity is first registered."],["Deprovisioning","Correct. Accounts should be disabled or removed promptly when people leave, triggered by HR events."],["Authentication","The accounts authenticate correctly; the problem is that they still exist."],["Account lockout","Lockout limits password guessing; it does nothing about valid accounts that were never disabled."]],"a":1,"k":"Orphaned accounts come from weak deprovisioning; tie account removal to HR offboarding."},{"id":"D5-040","d":5,"obj":"5.5","diff":2,"q":"How should administrators' use of elevated privileges on Linux servers be managed?","o":[["Share the root password among the admin team","Shared root access destroys accountability."],["Individual accounts with logged sudo rules","Correct. Individual accounts, with sudo rules for specific commands and every use logged, give accountability with limited, audited elevation."],["Allow every administrator to log in directly as root over SSH","Direct root logins hide who did what and expose a high-value account."],["Disable logging of sudo to reduce noise","Logging privileged use is essential for accountability and detection."]],"a":1,"k":"Privilege escalation should be limited, individual and audited; sudo logs must be reviewed."},{"id":"D5-041","d":5,"obj":"5.5","diff":2,"q":"A service account used by a nightly batch job has a password that has never changed and is known to several former developers. What is the BEST improvement?","o":[["Allow interactive logon so the account can be tested easily","Interactive logon widens the attack surface of a non-human account."],["Add the account to the domain administrators group to avoid failures","That violates least privilege."],["Document the password in the team wiki for continuity","That spreads the secret further."],["Vault and rotate it, cut its rights, block interactive logon","Correct. Service accounts need an owner, least privilege, vaulted and rotated secrets, and no interactive use."]],"a":3,"k":"Service accounts: an owner, least privilege, no interactive logon, managed secrets and regular review."},{"id":"D5-042","d":5,"obj":"5.5","diff":2,"q":"A manager approves an employee's transfer to a new team. What should the access process do?","o":[["Keep the old access for 90 days in case the employee is needed back","Lingering access creates privilege creep."],["Grant access for the new role and remove access no longer needed","Correct. Role transitions are handled as a change of role definition, not an addition."],["Disable all access until the employee completes training","That disrupts work without reducing risk."],["Let the employee decide which old permissions to keep","Users should not decide their own entitlements."]],"a":1,"k":"Role transitions: add what the new role needs, remove what the old role had."},{"id":"D5-043","d":5,"obj":"5.5","diff":3,"q":"Access reviews keep finding that managers rubber-stamp approvals without looking at them. What is the BEST improvement?","o":[["Run the reviews more often","More frequent rubber-stamping does not help."],["Show risk-ranked data and require justifications","Correct. Reviews work when reviewers see risk-ranked, role-relative data that highlights what is unusual, and must justify high-risk entitlements."],["Have the security team approve all access instead of managers","Security staff lack the business context to judge need to know."],["Stop the reviews, since they add no value","Reviews are a key control; the fix is to make them meaningful."]],"a":1,"k":"Make access reviews effective: highlight outliers and risky entitlements, require justification, and track revocations."},{"id":"D5-044","d":5,"obj":"5.5","diff":2,"q":"Which account type is MOST important to include in access reviews?","o":[["Guest Wi-Fi accounts that expire daily","These are low risk and short-lived."],["Disabled accounts awaiting deletion","Disabled accounts matter less than active privileged ones."],["Read-only accounts on public websites","Low risk."],["Privileged and service accounts","Correct. They have the most power, are often shared or forgotten, and attackers target them."]],"a":3,"k":"Review privileged and service accounts most often and most rigorously."},{"id":"D5-045","d":5,"obj":"5.5","diff":1,"q":"When should a new employee's accounts be created?","o":[["After HR confirms the hire","Correct. Provisioning follows an authoritative HR trigger and grants role-based access."],["As soon as a candidate accepts an interview","Candidates are not employees; that creates unused accounts."],["On request from any team member","Requests must come through an authorized process."],["After the employee has worked for 30 days","Employees need appropriate access to do their jobs from the start."]],"a":0,"k":"Provisioning is driven by authoritative sources (HR) and role definitions, with approvals."},{"id":"D5-046","d":5,"obj":"5.6","diff":2,"q":"What does OAuth 2.0 provide on its own?","o":[["Authentication of users to applications","OAuth alone does not define how to authenticate a user; that is OpenID Connect's role."],["Delegated authorization for apps","Correct. An app gets limited access to resources on a user's behalf: OAuth issues access tokens with scopes, without sharing the user's password."],["Transport encryption that replaces TLS","OAuth relies on TLS to protect its tokens in transit; it does not replace it."],["Network-level access control","OAuth works at the application layer."]],"a":1,"k":"OAuth 2.0 = authorization (access tokens). OpenID Connect = authentication layered on OAuth (ID tokens)."},{"id":"D5-047","d":5,"obj":"5.6","diff":2,"q":"A mobile app wants to sign users in with their existing account at a large identity provider and receive a verified identity token. Which protocol is designed for this?","o":[["RADIUS","RADIUS is for network access authentication."],["Kerberos","Kerberos is for authentication within an enterprise realm."],["OpenID Connect","Correct. OIDC adds an ID token (a signed JWT) describing the authenticated user on top of OAuth 2.0."],["TACACS+","TACACS+ is for device administration."]],"a":2,"k":"OIDC: modern web and mobile sign-in with ID tokens; SAML: XML assertions, common in enterprise web SSO."},{"id":"D5-048","d":5,"obj":"5.6","diff":2,"q":"A public mobile app uses the OAuth authorization code flow. Which addition protects the authorization code from being intercepted and redeemed by a malicious app?","o":[["Storing the client secret inside the app","Secrets embedded in public apps can be extracted."],["Using the implicit flow instead","The implicit flow is deprecated because it exposes tokens."],["Making access tokens never expire","Long-lived tokens increase the impact of theft."],["Proof Key for Code Exchange (PKCE)","Correct. PKCE binds the code to a secret the app created, so an intercepted code is useless to anyone else."]],"a":3,"k":"Public OAuth clients use the authorization code flow with PKCE; avoid the implicit flow."},{"id":"D5-049","d":5,"obj":"5.6","diff":2,"q":"In Kerberos, what does a client present to the ticket-granting service to obtain a ticket for a specific application server?","o":[["Its password, encrypted with the server's key","Kerberos never sends passwords over the network."],["Its ticket-granting ticket (TGT) and an authenticator","Correct. The TGT, issued by the authentication service, lets the client request service tickets without re-entering credentials."],["A service ticket issued by the application server","Application servers do not issue tickets; the ticket-granting service issues the service ticket in exchange for the TGT."],["A one-time password from a token","OTPs are not part of the standard Kerberos exchange."]],"a":1,"k":"Kerberos: authenticate to the AS to get a TGT; present the TGT to the TGS for service tickets; present those to services."},{"id":"D5-050","d":5,"obj":"5.6","diff":2,"q":"Users suddenly cannot authenticate with Kerberos, and the domain controller logs show \"clock skew too great\". What is the cause?","o":[["The users' passwords have expired","Expired passwords produce different errors."],["The KDC certificate has been revoked","Classic Kerberos does not rely on certificates."],["Clients and the KDC disagree on the time","Correct. Kerberos uses timestamps to prevent replay, so clocks must be synchronized, typically within five minutes."],["Port 88 is blocked","A blocked port would cause connection failures, not clock skew errors."]],"a":2,"k":"Kerberos depends on synchronized time (NTP) and an available KDC, which is a single point of failure."},{"id":"D5-051","d":5,"obj":"5.6","diff":2,"q":"Which AAA protocol uses TCP, encrypts the entire packet body, and separates authentication, authorization and accounting?","o":[["RADIUS","RADIUS uses UDP, encrypts only the password, and combines authentication with authorization."],["TACACS+","Correct. TACACS+ runs over TCP port 49, encrypts the whole payload and handles each A separately, which suits device administration."],["Diameter","Diameter is RADIUS's successor, used mainly in mobile networks."],["Kerberos","Kerberos is a ticket-based authentication protocol, not an AAA protocol for network devices."]],"a":1,"k":"RADIUS: UDP, password-only encryption, network access. TACACS+: TCP 49, full encryption, separate AAA, device admin."},{"id":"D5-052","d":5,"obj":"5.6","diff":2,"q":"An organization uses RADIUS to authenticate VPN and Wi-Fi users. Which weakness should it compensate for?","o":[["RADIUS is incompatible with MFA tokens","RADIUS can carry MFA exchanges."],["RADIUS requires TCP, which is slow","RADIUS uses UDP."],["RADIUS has no accounting function","Accounting is one of RADIUS's three functions."],["Only the password is encrypted","Correct. Everything except the password attribute travels in the clear, so protect RADIUS traffic, for example with EAP-TLS inside, IPsec, or RADIUS over TLS (RadSec)."]],"a":3,"k":"RADIUS encrypts only the password attribute; protect its transport on untrusted networks."},{"id":"D5-053","d":5,"obj":"5.6","diff":3,"q":"An attacker with any domain account requests service tickets for accounts that have service principal names, then cracks them offline to recover service account passwords. What is this attack?","o":[["Kerberoasting","Correct. Service tickets are encrypted with the service account's key, so weak service account passwords can be cracked offline."],["Golden ticket","A golden ticket forges TGTs with the KRBTGT key."],["Pass the hash","Pass the hash reuses NTLM hashes without cracking them."],["Replay attack","Replay resends captured authentication messages."]],"a":0,"k":"Counter Kerberoasting with long random service account passwords or managed service accounts, AES-only tickets and monitoring."},{"id":"D5-054","d":5,"obj":"5.6","diff":2,"q":"In SAML, what does the service provider receive to prove the user authenticated at the identity provider?","o":[["The user's password, encrypted","SAML never passes passwords to the service provider."],["A Kerberos ticket","Kerberos tickets are a different technology."],["A digitally signed XML assertion","Correct. The SP validates the IdP's signature on the assertion, then trusts its statements about the user."],["An OAuth refresh token","Refresh tokens belong to OAuth."]],"a":2,"k":"SAML assertions are signed XML statements about authentication, attributes and authorization."},{"id":"D5-055","d":5,"obj":"5.6","diff":3,"q":"A SAML service provider accepts assertions without checking that they were issued for it and within their validity window. What attack does this enable?","o":[["XML signature wrapping","Signature wrapping abuses flawed signature validation. The missing checks here are audience and time, which let a captured, validly signed assertion be reused."],["Session fixation","Session fixation plants a known session ID on a victim; here a genuine assertion is captured and presented again or to another service."],["A birthday attack on the signature","The weakness is in validation, not the hash function."],["Replay of assertions","Correct. Assertions captured or intended for other services can be replayed. SPs must check the signature, audience, recipient, validity period and one-time use of each assertion."]],"a":3,"k":"Validate SAML assertions fully: signature, issuer, audience, recipient, time window and replay."},{"id":"D5-056","d":5,"obj":"5.6","diff":1,"q":"Which TCP/UDP port does Kerberos use?","o":[["389","389 is LDAP."],["88","Correct. Kerberos uses port 88."],["1812","1812 is RADIUS authentication."],["49","49 is TACACS+."]],"a":1,"k":"Ports to know: Kerberos 88, LDAP 389, LDAPS 636, RADIUS 1812/1813, TACACS+ 49."},{"id":"D5-057","d":5,"obj":"5.2","diff":3,"q":"Attackers phished users' passwords and one-time codes through a fake login page that relayed them to the real site in real time. Which change defeats this attack?","o":[["Shorten the one-time code lifetime to 30 seconds","A real-time relay uses the code within seconds, well inside any practical lifetime."],["Send one-time codes by SMS instead of an app","SMS codes can be relayed just as easily, and they add SIM-swap risk."],["Adopt FIDO2 passkeys bound to the site's origin","Correct. The authenticator signs a challenge tied to the real site's origin, so a look-alike domain cannot obtain a usable response."],["Add a security question after the one-time code","A fake page relays the answer as easily as the code."]],"a":2,"k":"Phishing-resistant MFA (FIDO2/WebAuthn) binds authentication to the origin, which defeats real-time relay attacks."},{"id":"D5-058","d":5,"obj":"5.5","diff":3,"q":"An employee who moved from finance to marketing six months ago still has full access to the payment system. Access reviews run yearly. Which process change would have prevented this MOST directly?","o":[["Stronger password rules for finance accounts","Password rules do not remove entitlements a person no longer needs."],["Removing old access in every role-change workflow","Correct. A transfer should trigger removal of the old role's entitlements, which prevents privilege creep instead of waiting for the next review."],["Running the access review every six months instead of yearly","More frequent reviews shorten the window but still let the excess access exist until the next one."],["Logging activity on the payment system for review","Logging may reveal misuse later, but it does not remove the excess access."]],"a":1,"k":"Privilege creep is prevented at transfer time: the role-change workflow removes the old role's access."},{"id":"D6-001","d":6,"obj":"6.1","diff":2,"q":"A company's customers want assurance about its security controls from someone other than the company's own staff. Which option gives them the MOST independent view?","o":[["An audit by an outside audit firm","Correct. External auditors are outside the organization's control and have no stake in the result, so customers and regulators can rely on their findings."],["An internal audit by the company's own audit team","Internal auditors can be independent of the areas they audit, but they are still the company's employees."],["A self-assessment questionnaire completed by IT","Self-assessment is the least independent option of all."],["A review by the developers who built the system","Builders reviewing their own work have an obvious conflict of interest."]],"a":0,"k":"Internal audits use the organization's own staff; external audits use an outside firm; third-party audits are performed by or for another organization, such as a customer or regulator."},{"id":"D6-002","d":6,"obj":"6.1","diff":2,"q":"Before a penetration test begins, what MUST be in place?","o":[["A list of the vulnerabilities the testers are expected to find","Testers discover vulnerabilities; they do not start with a list of expected findings."],["Written authorization and agreed rules of engagement","Correct. Signed permission from someone with authority, plus scope, timing, methods and contacts, separates a test from an attack."],["Full administrator credentials for every system","Credentials depend on the test type; many tests start with none."],["A press release announcing the test","Tests are usually kept to a small group to avoid tipping off staff or attackers."]],"a":1,"k":"Never test without written authorization and rules of engagement that define scope, methods, timing and contacts."},{"id":"D6-003","d":6,"obj":"6.1","diff":2,"q":"A company wants to penetration-test its application running on a major public cloud platform. What should it check FIRST?","o":[["Whether its own firewall allows outbound scans","Outbound rules matter less than whether testing is permitted at all."],["Whether the testers have cloud certifications","Tester qualifications matter, but permission comes first."],["The provider's rules on customer testing","Correct. The cloud provider's testing policy sets what customers may test, and testing their shared infrastructure without permission can breach the contract or the law."],["Whether the test can be run during business hours","Timing is part of planning, after confirming the test is permitted."]],"a":2,"k":"Location matters: on-premises, cloud and hybrid environments have different ownership, permissions and responsibilities for testing."},{"id":"D6-004","d":6,"obj":"6.1","diff":2,"q":"How should an organization decide which systems to assess most often?","o":[["Alphabetically, so every system gets its turn","An arbitrary order ignores risk."],["By whichever system administrators volunteer","Volunteering does not reflect risk."],["Equally, with every system assessed every quarter","Equal frequency wastes effort on low-risk systems and under-tests critical ones."],["By risk to the business","Correct. Weigh criticality, data sensitivity, exposure and regulatory requirements, and focus effort where the risk is highest."]],"a":3,"k":"Design assessment strategies around risk, compliance obligations and change; validate that they cover what matters."},{"id":"D6-005","d":6,"obj":"6.1","diff":3,"q":"A company's application runs partly in its own data center and partly on a SaaS platform. How should its assessment strategy cover the SaaS portion?","o":[["Use the provider's attestations and test its own configuration","Correct. In a hybrid environment you rely on independent attestations, such as SOC 2 Type II, for the provider's controls, and test what you control yourself: configuration and integrations."],["Run an unannounced penetration test against the SaaS provider's infrastructure","Testing a provider without permission may be illegal and breaches its terms."],["Exclude it, because the SaaS provider is responsible for security","Shared responsibility leaves the customer accountable for its data, identities and configuration."],["Ask the provider to send its internal vulnerability scan results each week","Providers rarely share raw internal results; independent attestations are the normal route."]],"a":0,"k":"For cloud and hybrid systems: rely on provider attestations for their side, and test your own configuration, identities and integrations."},{"id":"D6-006","d":6,"obj":"6.1","diff":2,"q":"Which statement BEST distinguishes an audit from an assessment?","o":[["An audit is performed by the organization's own security team","Audits can be internal or external."],["An assessment ends with a formal certification","Assessments are usually advisory and lead to recommendations."],["Audits test against criteria; assessments evaluate and advise","Correct. An audit checks compliance against defined criteria and is formally reported; an assessment evaluates risk and recommends improvements."],["There is no difference; the terms are interchangeable","They differ in purpose, rigor and reporting."]],"a":2,"k":"Audits measure against criteria with formal attestation; assessments evaluate and advise."},{"id":"D6-007","d":6,"obj":"6.1","diff":2,"q":"A new regulation requires annual independent testing of security controls. Which design element ensures the testing strategy remains valid as the environment changes?","o":[["Using the same test plan every year without changes","A static plan misses new systems and threats."],["Testing only the systems that failed last year","That ignores new and changed systems."],["Letting the test vendor decide the scope each year","The organization must own the scope based on its risk."],["Updating the scope as systems and threats change","Correct. Strategies must be validated and refreshed so testing keeps covering the real environment."]],"a":3,"k":"Validate assessment strategies regularly: scope, methods and frequency must follow changes in systems, threats and requirements."},{"id":"D6-008","d":6,"obj":"6.2","diff":1,"q":"What is the main difference between a vulnerability assessment and a penetration test?","o":[["Pen tests exploit weaknesses; assessments find them","Correct. Exploitation shows real impact and attack paths; vulnerability assessments find and rank potential weaknesses."],["Vulnerability assessments are performed by hand","Most vulnerability assessments rely heavily on automated scanners."],["Penetration tests need less authorization than scans","Penetration tests need at least as much authorization, usually more, because they exploit systems."],["A vulnerability assessment is more intrusive","Penetration testing is the more intrusive of the two."]],"a":0,"k":"Vulnerability assessment: find and prioritize. Penetration test: exploit to demonstrate impact."},{"id":"D6-009","d":6,"obj":"6.2","diff":2,"q":"Why are credentialed (authenticated) vulnerability scans usually more accurate than uncredentialed ones?","o":[["They run faster across the network","Speed is not why they are more accurate."],["The scanner can check software and settings directly","Correct. Logging in lets the scanner read configuration and versions instead of guessing from the outside, reducing false positives and negatives."],["They do not require written authorization from owners","All scans require authorization."],["They focus on zero-day vulnerabilities","Scanners look mostly for known vulnerabilities."]],"a":1,"k":"Credentialed scans see inside the host; uncredentialed scans show the attacker's external view. Both are useful."},{"id":"D6-010","d":6,"obj":"6.2","diff":2,"q":"A scanner reports a critical vulnerability, but investigation shows the affected software is not installed on the host. What is this result?","o":[["A false negative","A false negative is a missed real vulnerability."],["A true positive","A true positive is a real vulnerability that was correctly reported."],["A false positive","Correct. The scanner reported a vulnerability that does not exist."],["A true negative","A true negative is correctly reporting that no vulnerability exists."]],"a":2,"k":"False positives waste effort; false negatives leave real risk hidden. Tune scanners and validate findings."},{"id":"D6-011","d":6,"obj":"6.2","diff":2,"q":"During a penetration test, the testers are given network diagrams, source code and credentials in advance. What type of test is this?","o":[["Black box","Black-box testers start with no knowledge, like an outside attacker."],["Gray box","Gray-box testers get partial knowledge, such as user credentials."],["Blind test","In a blind test, the testers know little about the target."],["White box","Correct. White-box (crystal box) testers get full knowledge, allowing thorough coverage in less time."]],"a":3,"k":"Black box: no knowledge. Gray box: partial. White box: full knowledge."},{"id":"D6-012","d":6,"obj":"6.2","diff":2,"q":"In which exercise do attackers and defenders work together in real time, sharing what they see so the defenders can improve detection?","o":[["Red team exercise","A red team emulates adversaries, usually without telling the defenders."],["Purple team exercise","Correct. Purple teaming combines the red and blue teams collaboratively to improve detection and response."],["Blue team exercise","The blue team defends; on its own it does not emulate attacks."],["Tabletop exercise","Tabletops discuss scenarios verbally without live attack activity."]],"a":1,"k":"Red attacks, blue defends, purple collaborates to turn findings into better detection."},{"id":"D6-013","d":6,"obj":"6.2","diff":2,"q":"In a double-blind penetration test, who knows the test is taking place?","o":[["Everyone in the IT, security and operations teams","If everyone knows, the test is not blind at all."],["Only the testers","Someone with authority must always know and authorize the test."],["Testers and the senior managers who authorized it","Correct. The defenders are not told, so the test measures real detection and response."],["Only the system administrators","Administrators are typically among those not told."]],"a":2,"k":"Blind: testers have little information. Double-blind: defenders are not told either, which tests detection and response."},{"id":"D6-014","d":6,"obj":"6.2","diff":2,"q":"A monitoring tool runs a scripted login and purchase on the e-commerce site every five minutes from several locations. What is this?","o":[["Synthetic transactions","Correct. Scripted, simulated transactions check availability and function proactively, even when no real users are active."],["Real user monitoring (RUM)","RUM passively records real users' sessions."],["Fuzz testing of the checkout","Fuzzing feeds malformed input to find crashes."],["Static analysis of site code","Static analysis examines code without running it."]],"a":0,"k":"Synthetic transactions are proactive and scripted; real user monitoring is passive and based on actual traffic."},{"id":"D6-015","d":6,"obj":"6.2","diff":2,"q":"A security team wants to find flaws in source code before it is compiled or run. Which technique should it use?","o":[["Dynamic application security testing","DAST tests the running application from outside."],["Static application security testing","Correct. SAST analyzes source code or binaries without executing them."],["Penetration testing","Penetration testing attacks a running system."],["Real user monitoring","RUM observes production traffic."]],"a":1,"k":"SAST: code at rest (early, white box). DAST: running app (black box). IAST: instrumented runtime. SCA: third-party components."},{"id":"D6-016","d":6,"obj":"6.2","diff":2,"q":"A tester feeds a file parser thousands of randomly modified versions of valid input files to find crashes. What is this technique?","o":[["Generational fuzzing","Generational fuzzing builds inputs from a model of the format rather than changing samples."],["Regression testing","Regression tests check that old functionality still works after a change."],["Mutation (dumb) fuzzing","Correct. Mutation fuzzing alters existing valid inputs to create test cases."],["Misuse case testing","Misuse cases test scenarios of abuse defined by people, not random changes."]],"a":2,"k":"Fuzzing: mutation alters samples; generational builds inputs from a specification. Both find input-handling flaws."},{"id":"D6-017","d":6,"obj":"6.2","diff":2,"q":"A team writes test scenarios describing how an attacker might abuse the application, such as entering negative quantities to get refunds, and tests that the application resists them. What is this?","o":[["Unit testing","Unit tests check individual components against their expected behavior."],["Synthetic transaction testing","Synthetic transactions simulate normal user activity."],["Load testing","Load testing checks performance under volume."],["Misuse case testing","Correct. Misuse (abuse) cases model how the system could be attacked and verify the defenses."]],"a":3,"k":"Misuse case testing turns attacker behavior into test cases alongside normal use cases."},{"id":"D6-018","d":6,"obj":"6.2","diff":3,"q":"Testing executed every line of code, but not every true/false outcome of each decision. Which coverage measure is still incomplete?","o":[["Function coverage","Functions were all called if every line ran."],["Statement coverage","Executing every line achieves full statement coverage."],["Branch coverage","Correct. Branch coverage requires each decision to take both its true and false paths, which line coverage does not guarantee."],["Loop coverage","Loop coverage is a different measure, concerning loop iterations."]],"a":2,"k":"Coverage analysis: statement, branch, condition, function and loop coverage measure how thoroughly tests exercise code."},{"id":"D6-019","d":6,"obj":"6.2","diff":2,"q":"Testers send malformed and unexpected requests directly to an application's REST API, bypassing the web front end. What type of testing is this?","o":[["Interface testing","Correct. Interface testing checks how components behave at their boundaries: user interfaces, network interfaces and APIs."],["User acceptance testing","UAT confirms the system meets business needs."],["Regression testing","Regression testing checks that changes did not break existing functions."],["Code review","Code review reads code; it does not send requests."]],"a":0,"k":"Test every interface, especially APIs, which often lack the validation the user interface performs."},{"id":"D6-020","d":6,"obj":"6.2","diff":2,"q":"A company runs a platform that continuously runs safe versions of known adversary techniques against its environment to check whether its controls detect and block them. What is this?","o":[["A tabletop exercise for responders","Tabletops are discussions, not technical simulations."],["A configuration compliance check","Compliance checks verify configurations against requirements."],["Breach and attack simulation","Correct. BAS tools automate safe attack scenarios, often mapped to MITRE ATT&CK, to validate controls continuously."],["Fuzz testing","Fuzzing targets input handling in software."]],"a":2,"k":"Breach and attack simulation continuously validates whether controls detect and stop real techniques."},{"id":"D6-021","d":6,"obj":"6.2","diff":2,"q":"Which code review method is the most formal, with defined roles, preparation, a moderated review meeting, rework and follow-up?","o":[["Pair programming","Pairing reviews code informally as it is written."],["Over-the-shoulder review","An informal walkthrough at a developer's desk."],["Tool-assisted review in a pull request","Lightweight and common, but not the formal inspection process."],["Fagan inspection","Correct. Fagan inspections follow planning, overview, preparation, inspection, rework and follow-up."]],"a":3,"k":"Fagan inspection is the most formal code review; lighter methods include pull-request review and pair programming."},{"id":"D6-022","d":6,"obj":"6.2","diff":1,"q":"Why are log reviews valuable as a security control test?","o":[["They show whether controls are working and reveal suspicious activity","Correct. Reviewing logs verifies that controls operate as intended and catches anomalies, such as failed logins or policy violations."],["They replace the need for vulnerability scanning","Logs and scans answer different questions."],["They prevent attacks from occurring","Log review is detective, not preventive."],["They mainly satisfy compliance requirements","Logs are a primary source of security evidence."]],"a":0,"k":"Log reviews are a detective test of controls; they need synchronized time and protected logs to be trustworthy."},{"id":"D6-023","d":6,"obj":"6.2","diff":2,"q":"After a patch is applied, testers re-run earlier test cases to confirm that nothing that worked before is now broken. What is this?","o":[["Acceptance testing","Acceptance testing confirms the system meets requirements before go-live."],["Regression testing","Correct. Regression testing checks that changes have not reintroduced old defects or broken existing functions."],["Fuzz testing","Fuzzing uses malformed inputs."],["Penetration testing","Penetration testing attempts to exploit weaknesses."]],"a":1,"k":"Regression testing protects against changes that break what already worked."},{"id":"D6-024","d":6,"obj":"6.2","diff":2,"q":"An automated tool compares server configurations with the organization's hardening standard and reports deviations. What type of test is this?","o":[["Penetration testing","Nothing is being exploited."],["Misuse case testing","No abuse scenarios are being exercised."],["A compliance check","Correct. Compliance checks verify that systems meet defined requirements and baselines."],["Real user monitoring","RUM observes user traffic."]],"a":2,"k":"Compliance checks compare actual configurations with required baselines and policies."},{"id":"D6-025","d":6,"obj":"6.2","diff":3,"q":"A penetration tester gains access to a database server and finds customer data. The rules of engagement do not mention data handling. What should the tester do?","o":[["Download a sample of records to prove impact in the report","Copying real customer data creates a data breach of its own."],["Continue deeper into the network to see how far the access goes","Continuing beyond authorized scope or without guidance risks harm."],["Stop, record the access without copying data, and escalate","Correct. Testers minimize exposure of sensitive data and escalate unexpected situations to the client's designated contact."],["Delete the data to show it was not protected","Destroying data causes real damage."]],"a":2,"k":"Pen testers prove access with minimal evidence, never exfiltrate real sensitive data, and escalate unexpected findings."},{"id":"D6-026","d":6,"obj":"6.3","diff":2,"q":"Which metric is a key risk indicator (KRI) rather than a key performance indicator (KPI)?","o":[["Percentage of help desk tickets closed within SLA","That measures operational performance."],["Number of awareness courses delivered this quarter","That measures activity or performance."],["Average time to deploy a new server","That measures operational efficiency."],["Critical vulnerabilities open past their deadline","Correct. KRIs signal rising risk exposure, prompting action before it materializes into an incident."]],"a":3,"k":"KPIs measure how well processes perform; KRIs warn that risk is rising toward or beyond appetite."},{"id":"D6-027","d":6,"obj":"6.3","diff":2,"q":"Backup jobs have reported \"success\" every night for a year, but no one has ever restored from them. What security process data is missing?","o":[["Backup job completion logs","Those exist; they show only that jobs ran."],["Evidence from regular test restores","Correct. Only restore tests prove that backups are complete and usable."],["Storage capacity reports","Capacity data does not show whether backups can be restored."],["Checksums of each backup file at write time","Checksums show a file was stored as written, not that systems can be rebuilt from it. Only a test restore shows that."]],"a":1,"k":"Backup verification data comes from test restores, not just job success messages."},{"id":"D6-028","d":6,"obj":"6.3","diff":2,"q":"Which data BEST shows that account management processes are working?","o":[["The number of accounts in the directory","A count alone says nothing about correctness."],["The password complexity setting","A setting shows configuration, not process effectiveness."],["Accounts reconciled against HR records","Correct. Reconciling active accounts against authoritative HR records shows orphaned accounts and how long leavers take to be disabled."],["The number of failed logins recorded per day","Failed logins indicate attacks or user error, not account management quality."]],"a":2,"k":"Account management data: leaver deprovisioning times, orphaned accounts found, access review results."},{"id":"D6-029","d":6,"obj":"6.3","diff":2,"q":"Why should security process data be presented to management for review and approval?","o":[["To prove the security team is busy","Activity reports are not the purpose."],["Because auditors require a signature on every report","Audit requirements are a by-product, not the reason."],["So management can tune the technical configuration of controls","Technical tuning is the operational team's job."],["So the risk owners can make informed decisions","Correct. Those accountable for risk use the data to decide and allocate resources; management review closes the loop between measurement and governance."]],"a":3,"k":"Management review and approval turn security metrics into governance decisions."},{"id":"D6-030","d":6,"obj":"6.3","diff":2,"q":"Which measure of an awareness program is the MOST useful security process data?","o":[["The number of posters displayed in offices","Posters are an activity, not an outcome."],["Trends in phishing reports and clicks","Correct. The trend in reported phishing versus simulated-phishing clicks shows whether training is changing how people act."],["The training vendor's customer satisfaction score","Vendor satisfaction is not a security outcome."],["The length of the training videos","Length is not effectiveness."]],"a":1,"k":"Measure training by behavior: reporting rates, click rates and incident trends."},{"id":"D6-031","d":6,"obj":"6.3","diff":2,"q":"After a disaster recovery test, which data is MOST important to collect and report?","o":[["The number of people who attended the test","Attendance does not show whether recovery works."],["Whether every participant followed the script exactly","Adherence matters less than outcome: management needs to know whether recovery met its time and data-loss targets."],["Measured recovery against RTO and RPO","Correct. Comparing actual recovery times and data loss to the objectives shows whether the plan can meet business requirements."],["The names of the vendors involved","Vendor names do not measure recovery capability."]],"a":2,"k":"DR and BC data: measured recovery times and data loss against RTO and RPO, plus issues found and fixed."},{"id":"D6-032","d":6,"obj":"6.3","diff":3,"q":"Management asks for a single dashboard to judge whether the security program is effective. Which approach is BEST?","o":[["Show raw counts of firewall blocks and antivirus detections","Large numbers of blocked events are activity, not evidence of effectiveness, and are easily misread."],["Show only metrics that are currently green","Hiding bad news prevents informed decisions."],["Show every metric the tools can generate","Too many metrics bury the signal."],["A few business-aligned KPIs and KRIs, with trends","Correct. Metrics should be relevant, trended and tied to decisions management can make."]],"a":3,"k":"Good security metrics are few, business-aligned, trended and actionable."},{"id":"D6-033","d":6,"obj":"6.4","diff":2,"q":"A vulnerability scan finds hundreds of issues. How should remediation be prioritized?","o":[["In the order the scanner listed them","Scanner order does not reflect risk."],["By severity, asset value and exploitability","Correct. Risk-based prioritization uses CVSS together with context, such as internet exposure and known exploits."],["Fix the easiest ones first to reduce the count quickly","Quick wins may leave the most dangerous issues open."],["Fix everything at once in a single maintenance window","Rarely feasible and risky for stability."]],"a":1,"k":"Prioritize remediation by risk: severity, asset value, exposure and exploit availability."},{"id":"D6-034","d":6,"obj":"6.4","diff":2,"q":"A critical vulnerability cannot be patched for three months because the vendor has no fix. How should this be handled?","o":[["Mark the finding as resolved in the report with a note","That misrepresents the risk."],["Remove the system from future scans until a patch exists","Hiding the finding does not reduce the risk."],["Ignore it until the vendor releases a patch","Ignoring risk is never acceptable."],["A time-limited, approved risk exception","Correct. Document the exception with compensating controls, approval by the risk owner and an expiry date."]],"a":3,"k":"Exceptions must be documented, justified, approved by the risk owner, time-bound and reviewed."},{"id":"D6-035","d":6,"obj":"6.4","diff":2,"q":"A researcher finds a vulnerability in a vendor's product. Which approach follows coordinated (responsible) disclosure?","o":[["Publish full details immediately so users can protect themselves","Immediate full disclosure exposes users before a fix exists."],["Report it privately and agree a publication date","Correct. Reporting privately to the vendor with an agreed timeline gives it time to fix the flaw while committing to eventual publication."],["Sell the details to the highest bidder","Selling vulnerabilities to unknown buyers is unethical and may be illegal."],["Keep it confidential to avoid legal risk","Permanent silence leaves users exposed indefinitely."]],"a":1,"k":"Ethical disclosure: private report, reasonable deadline, coordinated publication."},{"id":"D6-036","d":6,"obj":"6.4","diff":2,"q":"A penetration test report will be read by the board and by system administrators. How should it be structured?","o":[["A single technical section written for every reader","Executives need business impact, not packet captures."],["Only an executive summary, with technical details withheld","Administrators need technical details to fix issues."],["Executive summary first, then technical findings","Correct. An executive summary of risk and impact serves leaders, who decide; detailed findings and remediation steps serve technical teams, who fix."],["A list of every command the testers ran","Logs belong in an appendix, not as the report."]],"a":2,"k":"Test reports: executive summary (risk, impact, priorities) plus technical findings with evidence and remediation."},{"id":"D6-037","d":6,"obj":"6.4","diff":2,"q":"After remediation, what should happen to the findings from a penetration test?","o":[["Close them as soon as the owners say they are fixed","Owner claims need verification."],["Archive them; the test is over","Unverified fixes may not work."],["Retest to confirm the fixes are effective","Correct. Verification testing confirms the vulnerabilities are actually closed and no new ones were introduced."],["Wait for the next annual test to check","A year is too long to leave fixes unverified."]],"a":2,"k":"Close the loop: remediate, retest, then close findings with evidence."},{"id":"D6-038","d":6,"obj":"6.4","diff":3,"q":"A penetration test finds a critical flaw that is being actively exploited elsewhere. The final report is due in two weeks. What should the testers do?","o":[["Tell the client's designated contact now","Correct. Critical, exploitable findings should be escalated as soon as they are found, as the rules of engagement typically require."],["Include it in the final report as planned","Waiting two weeks leaves the client exposed to an active threat."],["Fix the flaw themselves to save time","Testers should not change production systems outside their authority."],["Publish an advisory to warn other companies","Client findings are confidential."]],"a":0,"k":"Critical findings are reported immediately through agreed channels, not held for the final report."},{"id":"D6-039","d":6,"obj":"6.5","diff":1,"q":"A cloud provider's customers need assurance about the controls relevant to their financial reporting. Which report should the provider supply?","o":[["SOC 1","Correct. SOC 1 reports cover controls relevant to customers' internal control over financial reporting."],["SOC 2","SOC 2 covers the Trust Services Criteria: security, availability, processing integrity, confidentiality and privacy."],["SOC 3","SOC 3 is a general-use summary of a SOC 2 engagement."],["ISO 27001 certificate","ISO certification covers an ISMS, not financial reporting controls."]],"a":0,"k":"SOC 1: financial reporting controls. SOC 2: Trust Services Criteria, restricted use. SOC 3: public summary."},{"id":"D6-040","d":6,"obj":"6.5","diff":2,"q":"A customer wants evidence that a provider's security controls operated effectively over the past twelve months, not just that they were designed well. Which report should it ask for?","o":[["SOC 2 Type I","Type I reports on control design at a single point in time."],["SOC 2 Type II","Correct. Type II reports test whether controls operated effectively over a period, typically 6–12 months."],["SOC 3","SOC 3 is a high-level public report without detailed test results."],["A vendor self-assessment questionnaire","Self-assessment is not independent assurance."]],"a":1,"k":"Type I: design at a point in time. Type II: operating effectiveness over a period."},{"id":"D6-041","d":6,"obj":"6.5","diff":2,"q":"A company wants to publish a security assurance report on its website for prospective customers. Which report is designed for general use?","o":[["SOC 1 Type II","SOC 1 reports are restricted to customers and their auditors."],["SOC 2 Type II","SOC 2 reports are restricted-use and usually shared under NDA."],["SOC 3","Correct. SOC 3 is a general-use report suitable for public distribution."],["An internal audit report","Internal reports are not meant for public release."]],"a":2,"k":"SOC 3 is the public, general-use report; SOC 1 and SOC 2 are restricted."},{"id":"D6-042","d":6,"obj":"6.5","diff":2,"q":"Which attestation standard governs SOC reports in the United States?","o":[["ISO/IEC 27001","ISO 27001 is a management system standard, not an attestation standard for SOC reports."],["PCI DSS","PCI DSS is a payment card industry standard."],["NIST SP 800-53","SP 800-53 is a control catalog."],["SSAE 18","Correct. SOC reports are issued under the AICPA's SSAE 18; ISAE 3402 is the international counterpart."]],"a":3,"k":"SSAE 18 (U.S.) and ISAE 3402 (international) govern service organization control reports."},{"id":"D6-043","d":6,"obj":"6.5","diff":2,"q":"What is the MOST important characteristic of an internal audit function?","o":[["It reports to the IT department it audits","Reporting to the audited function undermines objectivity."],["Independence from the areas it audits","Correct. Auditors must be free from influence by the functions they assess, for example by reporting to the audit committee."],["It performs all security operations tasks","Auditors evaluate controls; they should not operate them."],["It only audits areas management asks it to","Auditors should be able to set scope based on risk."]],"a":1,"k":"Auditor independence is essential: internal audit typically reports to the board's audit committee."},{"id":"D6-044","d":6,"obj":"6.5","diff":2,"q":"A company outsources payroll to a provider. Which contract clause BEST supports the company's ability to verify the provider's security?","o":[["A clause requiring the provider to follow industry best practices","Too vague to verify or enforce."],["A warranty that the provider's systems are breach-proof","No provider can guarantee that, and a warranty gives you no way to verify controls."],["A clause requiring monthly invoices","Billing terms do not provide assurance."],["A right-to-audit or attestation clause","Correct. A right to audit, or a duty to supply independent attestations such as SOC 2 Type II, gives you evidence that controls work."]],"a":3,"k":"Third-party audits rely on contract terms: right to audit or regular independent attestations."},{"id":"D6-045","d":6,"obj":"6.5","diff":3,"q":"An external auditor reviewing a provider's SOC 2 Type II report notes several \"complementary user entity controls\". What do these mean for the customer?","o":[["They are optional suggestions with no effect on assurance","They are required for the provider's controls to achieve their objectives."],["They are controls the auditor tested at the customer's site","The auditor does not test the customer's controls in the provider's report."],["The customer must run some controls itself","Correct. The provider's controls are only effective if customers implement these controls themselves, such as managing their own user access, or the assurance does not hold."],["They are controls the provider failed to implement","Exceptions are reported separately from complementary user entity controls."]],"a":2,"k":"Read SOC reports fully: exceptions, scope, carve-outs and the complementary controls you must operate yourself."},{"id":"D6-046","d":6,"obj":"6.5","diff":2,"q":"The external auditor finds a control deficiency. Who should decide how it is addressed?","o":[["The auditor, who should then fix it","Auditors report findings; fixing them would compromise their independence."],["Management, as the risk owner","Correct. Management decides the response and remediation plan; auditors later verify it."],["The help desk","The help desk is not accountable for control design."],["The vendor who supplied the system","Vendors may help, but the organization owns its controls."]],"a":1,"k":"Auditors find and report; management owns remediation decisions."},{"id":"D6-047","d":6,"obj":"6.5","diff":2,"q":"Internal and external audits are both planned this year. Where do they differ MOST?","o":[["Internal audits examine controls; external ones examine finances","Both internal and external audits can examine security controls."],["External audits review documents but do not test controls","External audits test controls extensively."],["Internal audits result in certification","Certification comes from external assessments against a standard."],["Who performs them, and their independence","Correct. Internal auditors are employees; external auditors are hired from outside and provide greater independence."]],"a":3,"k":"Audit types differ by who performs them and by their independence: internal, external, third-party."},{"id":"D6-048","d":6,"obj":"6.5","diff":3,"q":"An external auditor finds that change management was bypassed for 12 of 40 sampled production changes. The IT manager says each was an urgent fix that worked. How should the finding be handled?","o":[["Close it, because the changes succeeded without incidents","Success does not show the control worked; unreviewed, unapproved changes are the risk the control exists to prevent."],["Draw a new sample until compliant changes outweigh the bypassed ones","Re-sampling to change the result undermines the audit's integrity."],["Report it, and have management define an emergency change path","Correct. A 30% bypass rate is a control failure to report; the remedy is a governed emergency process with review after the fact, not quiet acceptance."],["Discipline the engineers who made the changes","Blame does not fix the process that allowed or encouraged the bypass."]],"a":2,"k":"Report control failures even when outcomes were good; the fix is a governed process such as emergency change, not blame."},{"id":"D6-049","d":6,"obj":"6.2","diff":3,"q":"A penetration test of a web application finds no high-risk issues. A week later, a researcher reports an authorization flaw that lets one customer see another customer's invoices. What MOST likely explains the miss?","o":[["Scanners, not human testers, should have been used for such flaws","Scanners are weak at authorization logic; finding it needs tests designed around who should see what."],["The testers had only one customer login","Correct. Cross-customer flaws only show up when testers hold accounts for two customers and request one's data with the other's session."],["The researcher's probing introduced the flaw","Testing finds flaws in the code; it does not create them."],["A black-box test would have found the flaw","A black-box test with no accounts would see even less; authorization flaws need authenticated tests across roles and tenants."]],"a":1,"k":"Authorization flaws need testers holding multiple roles and tenants; scope and credentials decide what a test can find."},{"id":"D6-050","d":6,"obj":"6.3","diff":3,"q":"The board wants one measure showing whether the vulnerability management program is improving over time. Which metric serves this BEST?","o":[["The total number of vulnerabilities the scanners find each month","Raw counts rise when scanning coverage improves, so they can mislead in either direction."],["The on-time fix rate for critical findings","Correct. Remediation against an agreed deadline measures how well the program performs, whatever the number of findings."],["The number of scans run each month","Activity is not outcome; more scans do not mean less risk."],["The number of security tools deployed","Tool count says nothing about results."]],"a":1,"k":"Good security metrics measure outcomes against targets, such as fixes within the deadline, not raw activity or counts."},{"id":"D7-001","d":7,"obj":"7.1","diff":1,"q":"A server's hard drive is seized and presented in court as evidence. What type of evidence is the drive itself?","o":[["Real evidence","Correct. Real (object) evidence is a physical item brought into court."],["Testimonial evidence from the server administrator","Testimonial evidence is what a witness says, orally or in writing."],["Demonstrative evidence, such as a diagram of the network","Demonstrative evidence helps explain other evidence, such as charts and diagrams."],["Documentary evidence, such as printed log reports","Documentary evidence is written material, including printouts, brought in to prove a fact."]],"a":0,"k":"Evidence types: real (objects), documentary (writings and records), testimonial (witnesses), demonstrative (aids that explain)."},{"id":"D7-002","d":7,"obj":"7.1","diff":2,"q":"Which rule says that when a document is introduced as evidence, the original must be used unless a valid exception applies?","o":[["The parol evidence rule, which governs written agreements","The parol evidence rule says a written agreement is assumed to contain all its terms; oral side agreements cannot change it."],["The best evidence rule","Correct. The original document is preferred over copies or descriptions of it."],["The hearsay rule, which limits second-hand statements","Hearsay concerns statements made outside court by someone not testifying."],["The exclusionary rule for illegally obtained evidence","That rule excludes evidence obtained in violation of rights."]],"a":1,"k":"Best evidence: originals preferred. Parol evidence: written contracts stand alone. Hearsay: second-hand statements are limited."},{"id":"D7-003","d":7,"obj":"7.1","diff":2,"q":"Responders arrive at a running server that is suspected of compromise. According to the order of volatility, which data should they collect FIRST?","o":[["The contents of the hard disk","Disk data persists after power-off, so it can wait."],["Archived backup tapes stored offsite","Archives are the least volatile source."],["The contents of memory (RAM)","Correct. Registers, cache and memory disappear when the system is powered off, so they are captured first."],["The physical network topology diagrams","Topology changes slowly and can be documented later."]],"a":2,"k":"Order of volatility (RFC 3227): registers and cache → memory, routing and process tables → temporary files → disk → remote logs → archives."},{"id":"D7-004","d":7,"obj":"7.1","diff":2,"q":"How should an investigator create a forensic copy of a seized hard drive?","o":[["Copy the files with the operating system's file manager","File copies miss deleted data and slack space and change timestamps."],["Boot the suspect system and run a backup to an external drive","Booting the suspect system alters evidence."],["Take a photo of the drive label and keep the original in a drawer","That preserves nothing about the contents."],["Make a bit-for-bit image through a write blocker and hash both copies","Correct. A write blocker prevents changes to the original, and matching hashes prove the image is identical."]],"a":3,"k":"Forensic imaging: write blocker, bit-stream copy, hashes of original and image, analysis on the copy only."},{"id":"D7-005","d":7,"obj":"7.1","diff":1,"q":"What is the PRIMARY purpose of the chain of custody?","o":[["To prove evidence integrity from collection to court","Correct. It shows the evidence was controlled and unaltered by recording who handled it, when, where and why."],["To list the investigators who are qualified to testify","Qualifications matter, but they are not what the chain of custody records."],["To speed up the processing of evidence in the lab","Documentation adds steps; its purpose is integrity, not speed."],["To determine which law enforcement agency has jurisdiction","Jurisdiction is decided separately."]],"a":0,"k":"Chain of custody documents every transfer of evidence so its integrity can be proven."},{"id":"D7-006","d":7,"obj":"7.1","diff":2,"q":"A smartphone seized as evidence is still powered on. What should the investigator do to preserve it?","o":[["Power it off immediately to save the battery","Powering off may lose volatile data and can trigger encryption that locks the device."],["Browse its messages to decide whether it is relevant","Browsing changes data and may break evidence integrity."],["Isolate it from networks, for example in a Faraday bag","Correct. Isolation prevents remote wiping or new data arriving, while keeping the device's state."],["Reset it to factory settings so it can be examined safely","A reset destroys the evidence."]],"a":2,"k":"Mobile device artifacts: isolate from networks (Faraday bag), keep power, document state, use proper forensic tools."},{"id":"D7-007","d":7,"obj":"7.1","diff":3,"q":"A company receives a court request to produce all emails related to a contract dispute. Which framework describes the process of identifying, preserving, collecting and producing this information?","o":[["The NIST Cybersecurity Framework","The CSF organizes cybersecurity functions; it is not an eDiscovery process."],["The incident response lifecycle in NIST SP 800-61","That covers responding to security incidents."],["The Common Criteria evaluation process","Common Criteria evaluates product security."],["The Electronic Discovery Reference Model","Correct. The EDRM covers identification, preservation, collection, processing, review, analysis and production of electronically stored information."]],"a":3,"k":"eDiscovery follows the EDRM; good information governance and legal holds make it far easier."},{"id":"D7-008","d":7,"obj":"7.2","diff":2,"q":"Logs from firewalls, servers and applications are collected in one place and analyzed together to spot attacks that no single source would reveal. Which system does this?","o":[["A SIEM","Correct. A security information and event management system aggregates, normalizes and correlates events, then alerts."],["An intrusion prevention system on the perimeter","An IPS inspects traffic at one point; it does not correlate logs from many systems."],["A data loss prevention agent on each endpoint","DLP watches sensitive data, not event correlation across sources."],["A configuration management database","A CMDB records assets and their configurations."]],"a":0,"k":"SIEM: centralize, normalize, correlate and alert; SOAR then automates the response."},{"id":"D7-009","d":7,"obj":"7.2","diff":2,"q":"Investigators cannot reconstruct the order of an attack because each server's log timestamps disagree by several minutes. Which control would have prevented this?","o":[["Larger log storage capacity on each server","Storage size does not affect timestamp accuracy."],["Encrypting logs in transit","Encryption protects confidentiality, not time accuracy."],["Logging more event types","More events do not fix clock differences."],["Synchronized clocks (NTP)","Correct. Synchronizing every clock to a common time source is essential to correlate events across systems."]],"a":3,"k":"Synchronize clocks (NTP) so logs can be correlated and stand up as evidence."},{"id":"D7-010","d":7,"obj":"7.2","diff":2,"q":"How should an organization protect the integrity of its security logs against an attacker who gains administrator access to a server?","o":[["Store the logs on the same server in a hidden folder","An administrator on that server can still find and change them."],["Forward them in real time to a separate log store","Correct. Centralized, access-restricted, write-protected logging keeps evidence out of reach of an attacker on the source system."],["Delete logs older than a day to reduce what can be altered","Short retention destroys evidence."],["Make the log files read-only for administrators on the server","Administrators can change permissions back."]],"a":1,"k":"Protect logs: forward off-host promptly, restrict access, use write-once storage or hashing, and retain per policy."},{"id":"D7-011","d":7,"obj":"7.2","diff":2,"q":"Analysts start from the hypothesis that an attacker is using a specific technique in their network, then search proactively for evidence of it. What is this activity called?","o":[["Threat hunting","Correct. Threat hunting is proactive and hypothesis-driven, looking for threats that automated alerts have missed."],["Vulnerability scanning of all subnets","Scanning looks for weaknesses, not act
