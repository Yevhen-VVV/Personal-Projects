on."],["The server's warranty would be voided","Warranty is irrelevant."],["Volatile evidence in memory would be lost","Correct. Isolating the network while keeping power on can preserve memory evidence; the decision weighs evidence against further harm."],["The attacker would be alerted to the investigation","That may be a factor, but the key concern is losing volatile evidence."]],"a":2,"k":"Containment decisions balance stopping harm with preserving evidence; isolate the network before pulling power when possible."},{"id":"D7-035","d":7,"obj":"7.7","diff":2,"q":"What is the key difference between an IDS and an IPS?","o":[["An IDS can only examine encrypted traffic","Neither is limited that way; both need decryption to inspect encrypted content."],["An IPS sits inline and can block traffic; an IDS only alerts","Correct. An IPS can stop attacks in real time, at the risk of blocking legitimate traffic on a false positive."],["An IDS uses signatures and an IPS uses anomalies","Both can use signatures, anomaly detection or both."],["An IPS works only on hosts and an IDS only on networks","Both have network-based and host-based forms."]],"a":1,"k":"IDS: detect and alert (passive). IPS: detect and block (inline)."},{"id":"D7-036","d":7,"obj":"7.7","diff":2,"q":"Which detection method can recognize a new, previously unseen attack?","o":[["Signature-based detection using known patterns","Signatures match only attacks that are already known."],["Hash matching against a malware database","Hash matching catches only known files."],["A static access control list on the router","ACLs filter by rules, not by detecting attacks."],["Anomaly-based (behavioral) detection","Correct. Anomaly detection compares activity with a baseline of normal behavior, so it can flag novel attacks, at the cost of more false positives."]],"a":3,"k":"Signature: precise but blind to new attacks. Anomaly: catches the new, with more false positives."},{"id":"D7-037","d":7,"obj":"7.7","diff":2,"q":"A company wants to block SQL injection and cross-site scripting attempts against its public web application. Which control fits BEST?","o":[["A web application firewall","Correct. A WAF inspects HTTP requests and responses at Layer 7 for application attacks."],["A packet-filtering router","Packet filters see addresses and ports, not application content."],["A VPN concentrator","VPNs encrypt connections; they do not inspect web attacks."],["A network-based antivirus appliance","Antivirus looks for malware, not injection attacks."]],"a":0,"k":"WAFs protect web applications; they complement, not replace, secure coding."},{"id":"D7-038","d":7,"obj":"7.7","diff":2,"q":"On a set of kiosk machines, only approved applications should ever run. Which control is MOST effective?","o":[["Signature-based antivirus","Antivirus blocks known malware but lets any other program run."],["A block list of known bad applications","Block lists cannot keep up with new software."],["Application allow listing","Correct. Allow listing permits only approved software, which suits fixed-purpose systems."],["A host-based intrusion detection system","A HIDS detects but does not restrict what runs."]],"a":2,"k":"Allow listing (whitelisting) denies everything not approved; block listing (blacklisting) allows everything not denied."},{"id":"D7-039","d":7,"obj":"7.7","diff":2,"q":"Suspicious email attachments are opened in an isolated virtual environment and their behavior observed before they are delivered. What is this?","o":[["A honeypot on the perimeter","A honeypot is a decoy to attract attackers."],["Sandboxing","Correct. A sandbox executes untrusted code in isolation to see what it does."],["Data masking of attachments","Masking hides data values."],["A DMZ for mail servers","A DMZ is a network zone, not a behavioral analysis tool."]],"a":1,"k":"Sandboxing detonates suspicious files safely to detect unknown malware by behavior."},{"id":"D7-040","d":7,"obj":"7.7","diff":3,"q":"A company sets up a honeypot that advertises \"free movie downloads\" on its network and then prosecutes the visitors. What legal concern arises?","o":[["Honeypots are always illegal","Honeypots are legal and widely used for detection and research."],["The company may breach its software licenses","Licensing is not the issue here."],["Logging visitors breaches every privacy law","Monitoring one's own systems can be lawful with proper policy."],["It may amount to entrapment","Correct. Passive enticement is generally acceptable; actively luring people into an offense they would not otherwise commit may be entrapment."]],"a":3,"k":"Honeypots: enticement (an opportunity for someone already intent) is acceptable; entrapment (inducing a crime) is not."},{"id":"D7-041","d":7,"obj":"7.7","diff":2,"q":"The SOC adopts a machine-learning tool to detect malicious behavior. What is the MAIN operational concern?","o":[["Machine learning cannot analyze network traffic","ML is widely used on network data."],["Machine learning tools never produce false negatives","All detection tools produce false negatives."],["False positives, model drift and opaque reasoning","Correct. Models need tuning, retraining and human review, and their decisions can be hard to explain."],["Machine learning removes the need for analysts","ML assists analysts; it does not replace them."]],"a":2,"k":"AI and ML tools help detection but need validation, tuning, explainability and human oversight."},{"id":"D7-042","d":7,"obj":"7.7","diff":2,"q":"A small company outsources 24/7 monitoring to a managed security service provider. What must it still do?","o":[["Manage the provider and keep accountability","Correct. Define responsibilities, escalation and SLAs. Third-party services provide capability, but the organization remains accountable and must manage the relationship."],["Nothing; the provider takes full legal accountability","Accountability for security cannot be transferred."],["Give the provider unrestricted domain administrator access","Access should follow least privilege."],["Stop collecting any logs internally","The organization still needs the data the provider analyzes."]],"a":0,"k":"Third-party security services need clear contracts, SLAs, escalation paths and ongoing oversight."},{"id":"D7-043","d":7,"obj":"7.8","diff":2,"q":"A vendor releases a critical patch. What should be done before deploying it across production servers?","o":[["Wait six months to see if other companies have problems","That leaves a critical vulnerability open far too long."],["Test it in a non-production environment first","Correct. Testing catches compatibility problems before they cause outages; the change process then schedules deployment."],["Deploy it to all servers at once without testing","Untested patches can break production."],["Skip it if the servers are behind a firewall","Internal servers are still reachable by attackers already inside."]],"a":1,"k":"Patch management: evaluate, test, approve, deploy, verify, with an expedited path for emergencies."},{"id":"D7-044","d":7,"obj":"7.8","diff":3,"q":"A zero-day vulnerability with active exploitation is announced, and no patch exists. What should the organization do?","o":[["Wait for the vendor patch before taking any action","Waiting leaves systems exposed to active exploitation."],["Turn off all affected systems permanently","That may cause more harm than the risk itself."],["Ignore it because no CVE score is available yet","Active exploitation is reason enough to act."],["Mitigate and monitor until a patch exists","Correct. Vendor workarounds, configuration changes, virtual patching and focused monitoring reduce risk until a fix ships."]],"a":3,"k":"No patch? Mitigate (workarounds, WAF or IPS rules, isolation), monitor closely, then patch and verify."},{"id":"D7-045","d":7,"obj":"7.8","diff":2,"q":"How can an organization confirm that patches were actually applied across its estate?","o":[["By trusting the patch tool's \"deployment sent\" status","A sent deployment may have failed on the target."],["By asking each administrator in a survey","Self-reporting is unreliable."],["By rescanning to verify the vulnerabilities are gone","Correct. Verification closes the loop by measuring the actual state of systems."],["By checking the vendor's release notes","Release notes describe the patch, not your systems."]],"a":2,"k":"Verify patching with credentialed scans or compliance checks; report coverage as a metric."},{"id":"D7-046","d":7,"obj":"7.9","diff":2,"q":"In a formal change management process, what should happen BEFORE a change is implemented in production?","o":[["Users should be told only after it is complete","Communicating beforehand reduces disruption."],["Review, approval, testing and a rollback plan","Correct. A change is requested, reviewed for impact, approved, tested and scheduled with a way back."],["The change should be applied first and documented later","That is only acceptable for genuine emergencies, with documentation immediately after."],["Only the developer's approval is needed","Independent review prevents unsafe or unauthorized changes."]],"a":1,"k":"Change management: request → review and impact analysis → approve → test → implement → document, with rollback planned."},{"id":"D7-047","d":7,"obj":"7.9","diff":2,"q":"To stop an active attack, an administrator makes an emergency firewall change outside normal change approval. What must happen next?","o":[["Nothing; emergencies are exempt from change management","Emergency changes still require control."],["The change should be reversed once the attack stops","It may need to stay; reversal is a separate decision."],["The change is documented and reviewed retroactively","Correct. Emergency change procedures allow fast action, followed promptly by documentation and approval."],["The administrator should be disciplined for bypassing the process","Following the emergency procedure is not misconduct."]],"a":2,"k":"Emergency changes are allowed, but must be documented and reviewed after the fact."},{"id":"D7-048","d":7,"obj":"7.9","diff":2,"q":"A file integrity monitoring tool alerts that a production web server's configuration changed, but there is no matching change request. What does this MOST likely indicate?","o":[["The change process is working as intended","An unrecorded change means the process was bypassed."],["An unauthorized change that must be investigated","Correct. It could be a mistake or an attacker; either way, it needs investigation and possibly rollback."],["The monitoring tool is faulty and should be disabled","Disabling detection on the first alert is wrong."],["A routine automatic update that can be ignored","Approved automatic updates should still map to the change process."]],"a":1,"k":"Detect unauthorized changes (file integrity monitoring, drift detection) and reconcile against approved changes."},{"id":"D7-049","d":7,"obj":"7.10","diff":1,"q":"Which recovery site can take over operations within hours because it has current data and fully configured systems?","o":[["A hot site","Correct. Hot sites are fully equipped and kept in sync, offering the fastest recovery at the highest cost."],["A cold site with power and space only","Cold sites need equipment installed and data restored, which takes weeks."],["A warm site with equipment but no current data","Warm sites need data restored and configuration, which takes days."],["A reciprocal agreement with a partner company","Mutual assistance agreements are hard to enforce and rarely provide fast recovery."]],"a":0,"k":"Recovery sites: hot (hours, costly), warm (days), cold (weeks, cheapest); mobile and cloud options vary."},{"id":"D7-050","d":7,"obj":"7.10","diff":2,"q":"What is the main weakness of a mutual assistance (reciprocal) agreement as a recovery strategy?","o":[["It is always more expensive than a hot site","Reciprocal agreements are usually cheap."],["It requires a third-party vendor","It is between two organizations, not a vendor."],["It cannot be documented in writing","It can and should be written."],["Enforcement and partner capacity","Correct. It is hard to enforce, and a partner may be hit by the same disaster or be unable to absorb your workload, and confidentiality is a concern."]],"a":3,"k":"Mutual assistance agreements are cheap but weak: enforcement, capacity, confidentiality and shared disasters."},{"id":"D7-051","d":7,"obj":"7.10","diff":2,"q":"A company takes a full backup every Sunday night and a differential backup every Monday through Saturday night. The server fails on Thursday morning. Which backups are needed to restore it?","o":[["Sunday's full backup and every differential from Monday to Wednesday","Each differential contains all changes since the full backup, so only the latest is needed."],["Sunday's full backup and Wednesday's differential","Correct. The latest differential holds every change since the last full backup."],["Wednesday's differential alone","A differential needs the full backup it is based on."],["Sunday's full backup alone","That loses Monday to Wednesday's changes."]],"a":1,"k":"Restore = full + latest differential, or full + every incremental since the full."},{"id":"D7-052","d":7,"obj":"7.10","diff":2,"q":"Which RAID level stripes data with parity across at least three disks and survives the failure of one disk?","o":[["RAID 0","RAID 0 stripes without redundancy; one failure loses everything."],["RAID 1","RAID 1 mirrors data across two disks."],["RAID 5","Correct. RAID 5 stripes data with distributed parity and tolerates one disk failure."],["RAID 10 with two disks","RAID 10 needs at least four disks and combines mirroring with striping."]],"a":2,"k":"RAID 0 striping (no fault tolerance), 1 mirroring, 5 striping with parity, 6 double parity, 10 mirrored stripes."},{"id":"D7-053","d":7,"obj":"7.10","diff":3,"q":"What distinguishes fault tolerance from high availability?","o":[["High availability requires no redundant components","HA depends on redundancy and failover."],["Fault tolerance is only about software","Fault tolerance covers hardware too, such as redundant power supplies and RAID."],["They mean exactly the same thing","They differ in how failures affect service."],["Fault tolerance avoids any interruption","Correct. Fault-tolerant systems keep running through a failure; highly available systems recover quickly, minimizing downtime through failover."]],"a":3,"k":"Fault tolerance: no interruption. High availability: minimal interruption. QoS prioritizes critical traffic."},{"id":"D7-054","d":7,"obj":"7.11","diff":1,"q":"A fire breaks out in the data center during business hours. What is the FIRST priority?","o":[["Starting the backup tapes on their way to the recovery site","Data can be recovered; people cannot."],["Calling the insurance company","Insurance comes much later."],["The safety of personnel","Correct. Life safety always comes first in any disaster response."],["Shutting down the servers gracefully","Equipment is secondary to people's safety."]],"a":2,"k":"In every disaster, people first."},{"id":"D7-055","d":7,"obj":"7.11","diff":2,"q":"After a disaster, the organization moves operations to its recovery site. When the primary site is repaired, which functions should move back FIRST?","o":[["The most critical functions","Moving the most critical first risks them on a site that is not yet proven."],["The least critical functions","Correct. Least critical functions go first to prove the restored site before critical ones return."],["All functions at the same moment","A single cutover risks everything at once."],["Whichever functions the IT team prefers","Order should follow risk, not convenience."]],"a":1,"k":"Recover to the alternate site most-critical-first; return to the primary site least-critical-first."},{"id":"D7-056","d":7,"obj":"7.11","diff":2,"q":"Which DR process element ensures that employees, customers and regulators get accurate information during a disaster?","o":[["The backup schedule for critical data","Backups protect data, not communications."],["The hardware maintenance contract","Maintenance contracts cover equipment."],["The data classification policy","Classification governs handling, not crisis communication."],["A communications plan","Correct. The plan names spokespeople and methods: who communicates what, to whom, through which channels, including alternatives when normal systems are down."]],"a":3,"k":"DR processes include response, personnel, communications, assessment, restoration, training and lessons learned."},{"id":"D7-057","d":7,"obj":"7.12","diff":1,"q":"Team members meet in a conference room to walk through a disaster scenario and talk about their responses, without touching any systems. What type of test is this?","o":[["Structured walk-through (tabletop)","Correct. A tabletop has team members discuss their roles in a scenario."],["Parallel test at the recovery site","A parallel test runs systems at the recovery site."],["Full interruption test","A full interruption test shuts down the primary site."],["Simulation test with live systems","Simulations exercise the response to a scenario more realistically, often involving actual systems."]],"a":0,"k":"DR tests: checklist (read-through) → structured walk-through (tabletop) → simulation → parallel → full interruption."},{"id":"D7-058","d":7,"obj":"7.12","diff":2,"q":"Which DR test activates the recovery site and processes real data there, while the primary site keeps running normally?","o":[["Checklist test","A checklist test only has people review the plan."],["Structured walk-through","A walk-through is a discussion."],["Parallel test","Correct. A parallel test proves the recovery site works without disrupting operations at the primary site."],["Full interruption test","A full interruption test shuts down the primary site."]],"a":2,"k":"A parallel test proves recovery without risking operations; full interruption is the riskiest and rarest test."},{"id":"D7-059","d":7,"obj":"7.12","diff":3,"q":"Management proposes a full interruption test of the DR plan next month. What should the security professional advise?","o":[["It is the best test, so it should be run every month","Its risk makes frequent use unwise."],["It is useless compared with a checklist review","It is the most realistic test; the issue is its risk."],["Build up to it with lesser tests, and get approval","Correct. A full interruption test can cause a real outage, so succeed first at less disruptive tests; it carries real business risk and need careful planning and senior management approval."],["It should be done without telling management, to make it realistic","Senior management must approve such a test."]],"a":2,"k":"Full interruption tests are the most realistic and the most dangerous; build up to them and get senior approval."},{"id":"D7-060","d":7,"obj":"7.13","diff":2,"q":"Who should take part in business continuity exercises?","o":[["Only the IT department and its vendors","Continuity covers business processes, not just IT."],["Only the security team","Security is one participant among many."],["Only senior management","Leaders decide, but the people who perform recovery must practice it."],["Everyone with a role in the plan","Correct. Exercises involve business process owners, IT and support functions, including facilities, HR, communications and key suppliers."]],"a":3,"k":"BC exercises involve business owners, IT, support functions and key suppliers; plans are updated from what is learned."},{"id":"D7-061","d":7,"obj":"7.13","diff":2,"q":"The company reorganized, moved offices and replaced its ERP system last year, but the BCP has not changed in three years. What is the MOST likely problem?","o":[["The plan is too detailed","Detail is not the issue."],["It is out of date","Correct. The plan no longer reflects how the business works. BCPs must be maintained and retested when the business, technology or people change."],["The plan needs more pages","Length is irrelevant."],["The plan should be moved to the cloud","Storage location does not fix outdated content."]],"a":1,"k":"Maintain the BCP: review it regularly and after significant change, and retest it."},{"id":"D7-062","d":7,"obj":"7.14","diff":1,"q":"Which fence height is generally considered enough to deter a determined intruder?","o":[["3 to 4 feet","That deters casual trespassers only."],["6 to 7 feet","That is difficult to climb but not a deterrent to the determined."],["8 feet with barbed wire on top","Correct. Eight feet or higher, topped with barbed or razor wire, deters determined intruders."],["Fence height makes no difference to deterrence","Height is the main factor in how much a fence deters."]],"a":2,"k":"Fences: 3–4 ft deters casual trespassers, 6–7 ft is hard to climb, 8 ft plus wire deters determined intruders."},{"id":"D7-063","d":7,"obj":"7.14","diff":2,"q":"Which physical security control is the MOST flexible, able to use judgment and respond to unexpected situations?","o":[["Motion detectors","Detectors only sense and alert."],["Security guards","Correct. Guards can assess situations and adapt, though they are expensive and can make errors or be deceived."],["Bollards","Bollards stop vehicles but cannot adapt."],["Badge readers","Readers apply fixed rules."]],"a":1,"k":"Guards are the most adaptable control; dogs are a strong deterrent; technology provides consistency."},{"id":"D7-064","d":7,"obj":"7.14","diff":2,"q":"A company wants to stop vehicles being driven through the glass front of its lobby. Which control fits BEST?","o":[["Brighter lighting at the entrance","Lighting deters and aids surveillance but does not stop a vehicle."],["A receptionist at the front desk","People cannot stop a vehicle."],["More CCTV cameras outside","Cameras record but do not prevent."],["Bollards","Correct. Bollards are a perimeter control that prevents vehicles from approaching or ramming entrances."]],"a":3,"k":"Perimeter controls: fences, gates, bollards, lighting, CCTV, guards; internal controls: locks, badges, vestibules."},{"id":"D7-065","d":7,"obj":"7.15","diff":2,"q":"Executives are travelling to a country known for state-sponsored industrial espionage. What is the BEST practice for their devices?","o":[["Bring their usual laptops and phones for convenience","Full devices carry full access and data into a high-risk environment."],["Leave their devices in hotel safes when not in use","Hotel safes are easily opened by staff or authorities."],["Disable encryption to pass through customs faster","That exposes data if the device is inspected or stolen."],["Issue clean loaner devices and reimage them on return","Correct. Loaners hold minimal data, and reimaging removes anything implanted during the trip."]],"a":3,"k":"Travel security: loaner devices, minimal data, VPN, and wiping and inspecting devices on return."},{"id":"D7-066","d":7,"obj":"7.15","diff":2,"q":"An employee being forced at gunpoint to open the vault can enter a special code that opens it but silently alerts security. What is this?","o":[["A clipping level","Clipping levels are monitoring thresholds."],["Two-person control","Two-person control requires two people for an action."],["A duress code","Correct. Duress codes signal coercion covertly while appearing to comply, protecting the employee."],["An access control vestibule","Vestibules control entry one person at a time."]],"a":2,"k":"Duress systems protect people: comply visibly, alert covertly."},{"id":"D7-067","d":7,"obj":"7.15","diff":2,"q":"Which topic belongs in personnel security awareness training on social media?","o":[["Oversharing details that enable social engineering","Correct. Posts about travel, roles or projects help attackers craft pretexts and target people."],["How to configure the corporate firewall","That is technical training for administrators."],["The company's disaster recovery site location","That is sensitive and not general awareness material."],["Encryption algorithms used by the VPN","Not relevant to personal social media risk."]],"a":0,"k":"Personnel safety training covers social media exposure, insider threats, MFA fatigue and travel risk."},{"id":"D7-068","d":7,"obj":"7.15","diff":2,"q":"An employee notices a colleague copying large amounts of confidential data to a personal drive shortly after being denied a promotion. What should the employee do?","o":[["Confront the colleague directly","Confrontation can escalate the situation and tip them off."],["Ignore it to avoid getting involved","Ignoring possible insider activity lets it continue."],["Post about it on the team's internal chat channel","Public accusations harm the investigation and the person."],["Report it through the insider threat channel","Correct. Awareness programs should teach staff to recognize insider threat indicators and report them confidentially."]],"a":3,"k":"Insider threat programs rely on trained employees who report concerning behavior through confidential channels."},{"id":"D8-001","d":8,"obj":"8.1","diff":1,"q":"In which development methodology does each phase finish before the next begins, with little provision for going back?","o":[["Waterfall","Correct. Waterfall is sequential; changes discovered late are expensive."],["Agile with two-week sprints","Agile delivers in short iterations and expects change."],["The spiral model with repeated risk analysis","Spiral iterates through planning, risk analysis, engineering and evaluation."],["DevOps with continuous delivery","DevOps integrates development and operations for frequent, continuous releases."]],"a":0,"k":"Waterfall: sequential. Spiral: iterative and risk-driven. Agile: iterative and adaptive. DevOps: continuous delivery."},{"id":"D8-002","d":8,"obj":"8.1","diff":2,"q":"Which development model is built around repeated cycles, each starting with a risk analysis, which makes it suitable for large, high-risk projects?","o":[["Waterfall with a final security review","Waterfall does not repeat risk analysis in cycles."],["The spiral model","Correct. Each loop of the spiral includes risk analysis, and prototypes reduce uncertainty."],["Scrum with a product backlog","Scrum is an Agile framework built on sprints, not risk-analysis loops."],["Rapid application development with prototypes only","RAD emphasizes speed and prototyping, not formal risk analysis each cycle."]],"a":1,"k":"The spiral model puts risk analysis at the heart of every iteration."},{"id":"D8-003","d":8,"obj":"8.1","diff":2,"q":"A company moving to DevSecOps wants to \"shift left\". What does that mean?","o":[["Moving security reviews to just before release","That is shifting right, late in the pipeline."],["Letting operations own all security decisions","DevSecOps shares responsibility across teams."],["Building security in from the start","Correct. Security starts at the earliest stages: threat modeling, secure coding and automated testing happen early, when fixes are cheapest."],["Removing security testing to speed up delivery","DevSecOps automates security testing rather than removing it."]],"a":2,"k":"DevSecOps: security is everyone's job, automated in the pipeline, and starts at the beginning."},{"id":"D8-004","d":8,"obj":"8.1","diff":2,"q":"In the Capability Maturity Model, which level describes processes that are measured and controlled quantitatively?","o":[["Repeatable","Repeatable (level 2) means basic project management processes exist."],["Defined","Defined (level 3) means processes are documented and standardized."],["Managed","Correct. Managed (level 4) uses quantitative measures to control processes."],["Optimizing","Optimizing (level 5) focuses on continuous improvement."]],"a":2,"k":"CMM levels: 1 Initial, 2 Repeatable, 3 Defined, 4 Managed, 5 Optimizing."},{"id":"D8-005","d":8,"obj":"8.1","diff":2,"q":"Which maturity model is designed specifically to assess and improve an organization's software security practices across governance, design, implementation, verification and operations?","o":[["OWASP SAMM","Correct. The Software Assurance Maturity Model organizes software security practices into those five business functions."],["The IDEAL model","IDEAL is a general model for organizational improvement: initiating, diagnosing, establishing, acting, learning."],["ITIL service management","ITIL covers IT service management."],["The Common Criteria evaluation levels","Common Criteria evaluates products, not development organizations."]],"a":0,"k":"SAMM measures software security maturity; CMM measures process maturity in general."},{"id":"D8-006","d":8,"obj":"8.1","diff":2,"q":"In software change management, which stage makes sure that only tested and approved code reaches production?","o":[["Request control","Request control manages incoming change requests and their prioritization."],["Change control","Change control covers analyzing and developing the change."],["Configuration audit","Audits verify configurations; they do not gate releases."],["Release control","Correct. Release control approves releases, often including acceptance testing, before deployment."]],"a":3,"k":"Software change management: request control → change control → release control."},{"id":"D8-007","d":8,"obj":"8.1","diff":2,"q":"A program assembles a team of developers, security, operations, testers and business representatives who share responsibility for a product from the start. What is this?","o":[["A change advisory board","A CAB approves changes; it does not build the product."],["An integrated product team","Correct. An IPT brings all stakeholders, including security, together throughout development."],["A red team","A red team emulates attackers."],["A computer security incident response team","A CSIRT responds to incidents."]],"a":1,"k":"Integrated product teams (IPTs) build security and operations concerns in from the start."},{"id":"D8-008","d":8,"obj":"8.1","diff":1,"q":"When should security requirements be defined for a new application?","o":[["With the functional requirements, at the start","Correct. Security requirements belong in the requirements phase alongside functionality."],["After the first release, based on user feedback","Post-release security is reactive and costly."],["During penetration testing before go-live","Testing finds problems; it does not define requirements."],["Only if the customer requests them","Security is the organization's responsibility, whether asked or not."]],"a":0,"k":"Security requirements start at the beginning of the SDLC."},{"id":"D8-009","d":8,"obj":"8.1","diff":2,"q":"An application in production needs an urgent security fix. Which practice keeps operation and maintenance secure?","o":[["Developers patch production directly to save time","Direct changes bypass testing and approval."],["Skip testing because the fix is small","Small changes can still break things or introduce flaws."],["Use the change process, expedited if needed","Correct. O&M changes go through change management, including testing and documentation, with an expedited path for emergencies."],["Wait for the next major release","Delaying an urgent fix leaves the vulnerability open."]],"a":2,"k":"Operation and maintenance changes still follow change management; urgency changes speed, not control."},{"id":"D8-010","d":8,"obj":"8.1","diff":2,"q":"In Scrum, which artifact holds the prioritized list of work, including security requirements and user stories?","o":[["The sprint retrospective","A retrospective is a meeting to improve the process."],["The burndown chart","A burndown chart tracks remaining work over time."],["The product backlog","Correct. Security requirements and abuse cases should be in the product backlog so they are planned like any other work."],["The daily stand-up","The stand-up is a short coordination meeting."]],"a":2,"k":"In Agile, security work belongs in the backlog with definitions of done, not in a separate afterthought."},{"id":"D8-011","d":8,"obj":"8.1","diff":3,"q":"A large enterprise coordinates dozens of Agile teams with shared planning increments and portfolio governance. Which framework is this?","o":[["Waterfall with phase gates","Waterfall is not an Agile framework."],["Extreme Programming (XP)","XP is a team-level Agile practice focused on engineering."],["The spiral model with risk loops","Spiral is an iterative risk-driven model, not an enterprise Agile framework."],["Scaled Agile Framework (SAFe)","Correct. SAFe scales Agile across many teams with program increments and portfolio management."]],"a":3,"k":"The 2024 outline names SAFe alongside Agile, Waterfall, DevOps and DevSecOps."},{"id":"D8-012","d":8,"obj":"8.2","diff":2,"q":"Which tool identifies the open-source libraries an application uses and reports their known vulnerabilities and licenses?","o":[["Dynamic application security testing","DAST tests the running application from outside."],["Software composition analysis","Correct. SCA inventories third-party components and checks them against vulnerability and license databases."],["Static application security testing","SAST analyzes the organization's own code for flaws."],["Interactive application security testing","IAST instruments the running app to find flaws during testing."]],"a":1,"k":"SCA covers third-party components; SAST covers your code; DAST covers the running app; IAST instruments it."},{"id":"D8-013","d":8,"obj":"8.2","diff":2,"q":"Which testing approach instruments an application while it runs during functional tests, combining insight from inside the code with real execution?","o":[["Interactive application security testing","Correct. IAST agents observe code paths and data flows during testing, which reduces false positives."],["Static analysis of the source code","SAST does not run the code."],["Black-box dynamic scanning from outside","DAST has no visibility inside the application."],["Manual code review by peers","Code review is human reading, not instrumentation."]],"a":0,"k":"IAST combines SAST-like visibility with DAST-like execution."},{"id":"D8-014","d":8,"obj":"8.2","diff":2,"q":"A developer accidentally commits a cloud access key to a public code repository. What should be done FIRST?","o":[["Delete the commit from the repository history","Others may already have copied the key; deletion alone is not enough."],["Make the repository private","The key may already be harvested by automated scanners."],["Email the team to remind them about secrets","Awareness helps later but does nothing about the exposed key."],["Revoke and rotate the key","Correct. Assume compromise: invalidate the key immediately, then review its use and clean up the history."]],"a":3,"k":"Exposed secrets: revoke and rotate first, then investigate and prevent recurrence with secret scanning and vaults."},{"id":"D8-015","d":8,"obj":"8.2","diff":2,"q":"Which practice BEST secures a CI/CD pipeline?","o":[["Giving the pipeline service account global admin rights","Excessive pipeline permissions make it a powerful target."],["Least-privilege runners, vaulted secrets and signed artifacts","Correct. Pipelines are part of the attack surface: protect credentials, restrict permissions and verify build outputs."],["Allowing any developer to change pipeline definitions without review","Unreviewed pipeline changes can inject malicious steps."],["Storing credentials in plain text in the pipeline configuration","Plain-text secrets in configuration are easily exposed."]],"a":1,"k":"Secure the software supply chain: protected pipelines, vaulted secrets, reviewed changes, signed and verified artifacts."},{"id":"D8-016","d":8,"obj":"8.2","diff":2,"q":"Which programming language characteristic MOST reduces buffer overflow vulnerabilities?","o":[["Dynamic typing","Typing discipline is not what prevents overflows."],["Compilation directly to native machine code","Native compilation is common in languages prone to overflows."],["Memory safety with bounds checking","Correct. Memory-safe languages prevent out-of-bounds reads and writes that cause overflows."],["Support for inline assembly","Inline assembly bypasses language protections."]],"a":2,"k":"Memory-safe languages (Rust, Java, C#, Go) eliminate whole classes of memory corruption bugs."},{"id":"D8-017","d":8,"obj":"8.2","diff":2,"q":"How should source code repositories be protected?","o":[["Allow anonymous write access to speed up collaboration","Anonymous writes destroy accountability and integrity."],["Store production credentials in the repository for convenience","Secrets in repositories are a common breach source."],["Let anyone merge directly to the main branch","Unreviewed merges allow malicious or flawed code into releases."],["Strong authentication, branch protection and required reviews","Correct. Repositories hold the organization's code and must be protected for integrity and confidentiality."]],"a":3,"k":"Repository security: MFA, least privilege, branch protection, required reviews, signed commits and secret scanning."},{"id":"D8-018","d":8,"obj":"8.2","diff":2,"q":"In a development ecosystem, what is the role of software configuration management (SCM)?","o":[["Version control of code and configuration","Correct. SCM gives an auditable history of what changed, when and by whom, and lets teams rebuild any version."],["Scanning committed code for vulnerabilities","That is application security testing."],["Approving production changes at the CAB","The CAB is part of change management."],["Monitoring production servers for performance","That is operations monitoring."]],"a":0,"k":"SCM provides version control, baselines and auditability for code and configuration."},{"id":"D8-019","d":8,"obj":"8.2","diff":2,"q":"A security team wants a protection that runs inside the application and blocks attacks such as injection at run time. What is this?","o":[["A web application firewall at the network edge","A WAF filters traffic outside the application."],["Static analysis in the build pipeline","SAST runs before deployment."],["Software composition analysis","SCA examines components, not run-time attacks."],["Runtime application self-protection (RASP)","Correct. RASP instruments the runtime to detect and block attacks with the application's own context."]],"a":3,"k":"Runtime protections (RASP) complement secure coding and WAFs."},{"id":"D8-020","d":8,"obj":"8.2","diff":3,"q":"A developer installs an IDE plugin from an unknown publisher that requests access to the whole file system and network. What is the main risk?","o":[["The plugin may slow down compilation","Performance is not the security concern."],["Theft of source code or secrets","Correct. Development tools are part of the attack surface; malicious extensions can steal code and credentials."],["The plugin may conflict with other installed extensions","Compatibility problems are a nuisance, not the main security risk."],["The plugin may use too much disk space","Not a security concern."]],"a":1,"k":"Tool sets and IDEs are part of the supply chain: approve, vet and limit extensions."},{"id":"D8-021","d":8,"obj":"8.2","diff":2,"q":"Which platform automates security response workflows, such as enriching an alert and isolating a host, by running playbooks across many tools?","o":[["SIEM","A SIEM collects and correlates events; it does not mainly orchestrate responses."],["SCA","SCA analyzes software components."],["SOAR","Correct. Security orchestration, automation and response executes playbooks across integrated tools."],["SAST","SAST analyzes source code."]],"a":2,"k":"SOAR automates and orchestrates response; SIEM detects and correlates."},{"id":"D8-022","d":8,"obj":"8.3","diff":2,"q":"How can an organization show who changed a critical application's code and when?","o":[["By asking developers to remember their changes","Memory is unreliable and unverifiable."],["By checking the application's file timestamps","Timestamps can be changed and do not show who made changes."],["By reviewing the latest release notes only","Release notes summarize changes; they are not an audit trail."],["By auditing the version control history and change logs","Correct. Auditing and logging of changes, tied to individual identities, makes software changes accountable."]],"a":3,"k":"Assess software security effectiveness through audited, attributable change logs."},{"id":"D8-023","d":8,"obj":"8.3","diff":2,"q":"Which measure BEST shows whether a secure development program is effective?","o":[["Vulnerability trends per release","Correct. Trends in vulnerabilities found per release, and how fast they are fixed, show whether fewer flaws reach production and how quickly they are closed."],["The number of developers who attended secure coding training","Attendance is an input; it does not show whether fewer flaws reach production."],["The total lines of code written per month","Productivity is not a security outcome."],["How many tools the security team has bought","Tools are inputs, not outcomes."]],"a":0,"k":"Measure software security by outcomes: defect density, time to remediate, escaped vulnerabilities."},{"id":"D8-024","d":8,"obj":"8.3","diff":2,"q":"A risk analysis of a new feature finds that it could expose personal data through an API. What should happen next?","o":[["Ship it and monitor for complaints","Knowingly shipping an unmitigated risk ignores the analysis."],["Mitigate the risk, then verify","Correct. Risk analysis leads to mitigation, such as access controls and data minimization, and then testing that it works."],["Cancel the whole product","Cancellation may be unnecessary if the risk can be mitigated."],["Hide the API's documentation","Obscurity does not protect the data."]],"a":1,"k":"Risk analysis in development leads to mitigations that are verified before release."},{"id":"D8-025","d":8,"obj":"8.3","diff":2,"q":"Users need assurance that an installer really comes from the vendor and has not been altered. What should the vendor do?","o":[["Publish the installer on a popular download site","Distribution channels can be compromised."],["Compress the installer","Compression provides no authenticity."],["Rename the file to include the version number","Names prove nothing."],["Sign the code with the vendor's certificate","Correct. Code signing provides integrity and proves the publisher's identity."]],"a":3,"k":"Code signing proves authorship and integrity, but not that the code is safe."},{"id":"D8-026","d":8,"obj":"8.4","diff":2,"q":"Before buying a commercial off-the-shelf (COTS) application, what should the security team do?","o":[["Rely on the vendor's marketing claims","Marketing is not assurance."],["Assess the vendor's security with evidence","Correct. Assess acquired software through evidence: questionnaires, independent reports, testing and enforceable requirements."],["Reverse engineer the product to find its flaws","Licenses usually prohibit reverse engineering, and it is rarely practical."],["Buy it, then assess it after deployment","Assessment should inform the purchase decision."]],"a":1,"k":"Assess acquired software before purchase: vendor practices, attestations, testing, SBOM and contract terms."},{"id":"D8-027","d":8,"obj":"8.4","diff":2,"q":"A company depends on a small vendor's custom software. What protects the company if the vendor goes out of business?","o":[["Buying extra licenses in advance","Licenses do not help if no one can maintain the software."],["An extended warranty","Warranties end with the vendor."],["A source code escrow agreement","Correct. A third party holds the source code and releases it under defined conditions, such as vendor failure."],["A non-disclosure agreement","An NDA protects confidentiality, not continuity."]],"a":2,"k":"Software escrow protects customers against a vendor's failure to support critical software."},{"id":"D8-028","d":8,"obj":"8.4","diff":2,"q":"Developers want to use an open-source library in a commercial product. What should be checked BEFORE adopting it?","o":[["The number of stars it has on the hosting site","Popularity is not assurance."],["Whether its documentation is available in several languages","Good documentation is helpful, but it says nothing about legal or security risk."],["Whether the maintainer lives in the same country","Location is rarely the deciding factor."],["Its license, vulnerabilities and upkeep","Correct. Open-source components carry legal and security risk; check licenses, vulnerabilities and project health."]],"a":3,"k":"Open-source due diligence: license compatibility, vulnerability history, maintenance activity and provenance."},{"id":"D8-029","d":8,"obj":"8.4","diff":2,"q":"The company adopts a SaaS customer relationship management platform. Which security responsibility remains with the company?","o":[["Patching the SaaS application servers","The provider patches its platform."],["Physical security of the provider's data centers","That is the provider's job."],["Its users, access settings and data","Correct. Customers keep responsibility for identities, configuration and how their data is used and shared."],["Writing the SaaS application's code","The provider develops the application."]],"a":2,"k":"Acquired cloud services shift infrastructure duties but never data, identity and configuration responsibility."},{"id":"D8-030","d":8,"obj":"8.4","diff":3,"q":"A managed service provider will run the company's enterprise resource planning (ERP) system. Which is the MOST important security consideration in the contract?","o":[["The provider's office location and staff size","Location matters only through data residency requirements."],["The provider's preferred programming language","Not a contract security priority."],["The brand of server hardware the provider uses","Hardware choice is the provider's operational decision; the contract should focus on obligations and outcomes."],["Enforceable security and exit terms","Correct. Security requirements, breach notification, audit rights and exit terms: managed services need enforceable obligations and a way to verify them and leave safely."]],"a":3,"k":"Managed services: define security requirements, SLAs, incident notification, right to audit and data return at exit."},{"id":"D8-031","d":8,"obj":"8.4","diff":2,"q":"A vendor refuses to say which third-party components its product contains. Which request would MOST improve visibility of supply chain risk?","o":[["A software bill of materials","Correct. An SBOM lists components and versions so new vulnerabilities can be matched quickly."],["A list of the vendor's customers","Customer lists say nothing about components."],["The vendor's marketing roadmap","Roadmaps describe future features."],["The vendor's financial statements","Financial health matters but does not reveal components."]],"a":0,"k":"Ask suppliers for SBOMs to manage vulnerabilities in acquired software."},{"id":"D8-032","d":8,"obj":"8.5","diff":2,"q":"Which coding practice MOST effectively prevents SQL injection?","o":[["Escaping single quotes with a custom function","Custom escaping is error-prone and easy to bypass."],["Parameterized queries (prepared statements)","Correct. Parameters keep data separate from SQL code, so input cannot change the query's structure."],["Hiding database error messages from users","Hiding errors makes attacks harder to tune but does not prevent injection."],["Using a longer database password","Credential strength does not stop injection through the application."]],"a":1,"k":"Prevent injection with parameterized queries, least-privilege database accounts and input validation."},{"id":"D8-033","d":8,"obj":"8.5","diff":2,"q":"A forum displays users' posts without encoding them, so a posted script runs in every reader's browser. What is this vulnerability?","o":[["SQL injection","SQL injection targets the database."],["Cross-site request forgery","CSRF tricks a browser into sending unwanted requests."],["Stored cross-site scripting","Correct. Stored XSS saves malicious script on the server and serves it to other users."],["Server-side request forgery","SSRF makes the server send requests to places it should not."]],"a":2,"k":"XSS: reflected, stored or DOM-based. Prevent with output encoding, input validation and Content Security Policy."},{"id":"D8-034","d":8,"obj":"8.5","diff":2,"q":"A malicious site causes a logged-in user's browser to submit a funds transfer to their bank without their knowledge. Which defense addresses this?","o":[["Anti-CSRF tokens and SameSite cookies","Correct. Unpredictable per-request tokens and SameSite cookies stop forged cross-site requests."],["Output encoding of user input","Output encoding prevents XSS, not CSRF."],["Parameterized SQL queries","These prevent SQL injection."],["Longer session timeouts","Longer sessions make CSRF easier."]],"a":0,"k":"CSRF abuses the browser's automatic credentials; defend with tokens, SameSite cookies and reauthentication for sensitive actions."},{"id":"D8-035","d":8,"obj":"8.5","diff":3,"q":"An application fetches images from URLs that users supply. An attacker submits an internal address and retrieves the cloud provider's metadata service, including credentials. What is this vulnerability?","o":[["Cross-site scripting","XSS runs scripts in users' browsers."],["Directory traversal","Traversal accesses files outside the intended directory."],["Insecure direct object reference","IDOR accesses other users' objects by changing identifiers."],["Server-side request forgery","Correct. SSRF makes the server issue requests to internal resources; allow-list destinations and block metadata endpoints."]],"a":3,"k":"SSRF: validate and allow-list outbound destinations, block internal and metadata addresses, and segment the network."},{"id":"D8-036","d":8,"obj":"8.5","diff":2,"q":"Where must input validation be enforced to be effective?","o":[["Only in client-side JavaScript","Attackers bypass client-side checks easily."],["On the server, using allow lists","Correct. Server-side validation against expected formats cannot be bypassed by the client; client checks are for usability only."],["Only in the database","Validation should happen before data reaches the database."],["Nowhere, if a WAF is in place","WAFs are a supplement, not a replacement for validation."]],"a":1,"k":"Validate input on the server with allow lists; treat all client input as untrusted."},{"id":"D8-037","d":8,"obj":"8.5","diff":2,"q":"A program copies user input into a fixed-size buffer without checking its length, letting an attacker overwrite adjacent memory. What should developers do?","o":[["Increase the buffer size","A bigger buffer only raises the threshold for overflow."],["Run the program as administrator","Elevated privileges make exploitation worse."],["Check input length and use safe functions","Correct. Bounds checking and safe library functions prevent the overflow; compiler and OS protections add layers."],["Disable logging to save memory","Logging is unrelated."]],"a":2,"k":"Buffer overflows: bounds checking, safe functions, memory-safe languages, plus ASLR and DEP as extra layers."},{"id":"D8-038","d":8,"obj":"8.5","diff":3,"q":"A program checks that a file is safe, then opens it a moment later. An attacker swaps the file in between. What is this flaw?","o":[["An integer overflow","Integer overflows involve arithmetic exceeding a type's range."],["Cross-site scripting","XSS is a web output problem."],["Covert storage channel","Covert channels communicate information secretly."],["A TOCTOU race condition","Correct. Time-of-check to time-of-use flaws exploit the gap between a check and the use of what was checked."]],"a":3,"k":"TOCTOU race conditions: make check-and-use atomic, use file handles rather than names, and use locking."},{"id":"D8-039","d":8,"obj":"8.5","diff":2,"q":"A web application displays full stack traces and database errors to users when something fails. What should be done?","o":[["Keep them, because they help users report bugs","Detailed errors give attackers information about the system."],["Show generic messages and log details internally","Correct. Secure error handling reveals nothing useful to attackers while preserving details for developers."],["Disable all error logging","Developers and responders need the details."],["Show the details only to users who are logged in","Logged-in users can be attackers too; detailed errors should not reach any user."]],"a":1,"k":"Fail securely: generic messages to users, detailed logs internally."},{"id":"D8-040","d":8,"obj":"8.5","diff":2,"q":"An API returns any customer's records when a user simply changes the customer ID in the request. What is the flaw?","o":[["Missing rate limiting","Rate limiting slows abuse but is not the root cause."],["Weak TLS configuration","Transport security is not involved."],["Broken object-level authorization","Correct. The API must check that the caller is allowed to access each specific object, not just that they are logged in."],["Lack of input validation on the ID format","A well-formed ID for another customer would still be returned."]],"a":2,"k":"API security: authorize every object access, authenticate callers, rate-limit, validate input and log."},{"id":"D8-041","d":8,"obj":"8.5","diff":2,"q":"Developers left an undocumented command in production code that bypasses authentication \"for support purposes\". What is this called?","o":[["A logic bomb","A logic bomb triggers malicious action on a condition."],["A maintenance hook (backdoor)","Correct. Maintenance hooks bypass normal controls and must be removed before release."],["A covert timing channel","Covert channels leak information through timing or storage."],["A polymorphic virus","Polymorphic viruses change their code to evade detection."]],"a":1,"k":"Remove maintenance hooks and backdoors before release; code review and testing should look for them."},{"id":"D8-042","d":8,"obj":"8.5","diff":2,"q":"In object-oriented design, which combination is considered best for secure, maintainable code?","o":[["Low cohesion and high coupling","That is the worst combination: modules do many things and depend heavily on each other."],["High cohesion and high coupling","High coupling makes changes ripple and isolation difficult."],["High cohesion and low coupling","Correct. Modules that do one thing well and depend little on others are easier to secure and test."],["Low cohesion and low coupling","Low cohesion makes modules hard to understand."]],"a":2,"k":"Aim for high cohesion and low coupling; encapsulation hides internal details."},{"id":"D8-043","d":8,"obj":"8.5","diff":3,"q":"An application deserializes objects received from users without validation, allowing an attacker to run code on the server. What is the BEST mitigation?","o":[["Compress serialized data before sending it","Compression does not prevent malicious objects."],["Use longer session timeouts","Session length is unrelated."],["Move the server behind a corporate VPN","Internal attackers or compromised clients can still send payloads."],["Don't deserialize untrusted data","Correct. Avoid deserializing untrusted input; where unavoidable, use strict type allow lists and integrity checks to restrict what can be created."]],"a":3,"k":"Insecure deserialization: avoid native deserialization of untrusted data; prefer simple data formats with schema validation."},{"id":"D8-044","d":8,"obj":"8.5","diff":2,"q":"A cloud team defines firewall rules, encryption settings and access policies in code that is deployed and enforced automatically. What does the 2024 outline call this?","o":[["Security through obscurity","Nothing is hidden here."],["Static application security testing","SAST analyzes source code for flaws."],["Shadow IT","Shadow IT is unapproved technology."],["Software-defined security","Correct. Security controls defined and enforced through software and APIs can be versioned, reviewed and applied consistently."]],"a":3,"k":"Software-defined security treats controls as code: versioned, reviewed, tested and automatically enforced."},{"id":"D8-045","d":8,"obj":"8.5","diff":2,"q":"Where should an application store the database password it needs at run time?","o":[["Hard-coded in the source code","Hard-coded secrets end up in repositories and binaries."],["In a comment at the top of the configuration file","Anyone with file access can read it."],["In a secrets manager","Correct. The application retrieves it at run time; a secrets manager controls access, audits use and supports rotation without code changes."],["In the application's public README","Public documentation is the worst place for a secret."]],"a":2,"k":"Never hard-code secrets; use a secrets manager or vault, with rotation and least-privilege access."},{"id":"D8-046","d":8,"obj":"8.5","diff":3,"q":"Which security weakness at the source-code level is MOST likely to be found by static analysis but missed by a quick functional test?","o":[["A slow page load under heavy user traffic","Performance is found by load testing."],["Unvalidated input on a rarely used path","Correct. For example, input that reaches a SQL query unvalidated. SAST follows data flows through all code paths, including ones functional tests rarely exercise."],["A misconfigured TLS certificate on the server","Server configuration is found by scanning the running system."],["A missing HTTP security header on responses","Headers appear in every response, so dynamic scanning of the running site finds them easily."]],"a":1,"k":"Static analysis sees every path in the code; dynamic testing sees only what it exercises."}]}</script>
<script>
// The app's arithmetic, kept free of the page so it can be tested on its own:
// progress records, domain statistics, the review scheduler, the adaptive
// mock exam and the study plan. build.mjs inlines this file into the page;
// engine.test.mjs runs it under Node.
// Used by the page script that build.mjs inlines after this file.
// eslint-disable-next-line no-unused-vars
const Engine = (() => {
  const DAY = 86400000;

  // Leitner boxes. A correct answer moves a question up a box and pushes its
  // next review out; a miss sends it back to box 1 for tomorrow.
  const BOX_DAYS = [0, 1, 3, 7, 16, 35, 70];
  const MISS_DELAY = 20 * 3600 * 1000;

  // Per-question progress, stored compactly as an array so the whole record
  // for a few hundred questions stays well under one storage document:
  // [attempts, correct, firstCorrect (1/0), lastCorrect (1/0), lastTs, box, dueTs]
  function record(prev, correct, now) {
    const r = prev ? prev.slice() : [0, 0, correct ? 1 : 0, 0, 0, 0, 0];
    r[0] += 1;
    if (correct) r[1] += 1;
    r[3] = correct ? 1 : 0;
    r[4] = now;
    if (correct) {
      r[5] = Math.min(r[5] + 1, BOX_DAYS.length - 1);
      r[6] = now + BOX_DAYS[r[5]] * DAY;
    } else {
      r[5] = 1;
      r[6] = now + MISS_DELAY;
    }
    return r;
  }

  // First-try accuracy is the honest predictor: it is what you score on a
  // question you have never seen, which is every question on the real exam.
  // Small samples are pulled toward 60% so one lucky answer reads as "unknown".
  const PRIOR_RATE = 0.6;
  const PRIOR_WEIGHT = 4;

  function domainStats(bank, progress, domains) {
    return domains.map((d) => {
      const items = bank.filter((q) => q.d === d.n);
      let seen = 0, first = 0, last = 0, attempts = 0, correct = 0, due = 0;
      const now = Date.now();
      for (const q of items) {
        const r = progress[q.id];
        if (!r) continue;
        seen++;
        first += r[2];
        last += r[3];
        attempts += r[0];
        correct += r[1];
        if (r[6] <= now && r[3] === 0) due++;
      }
      const smoothed = (first + PRIOR_RATE * PRIOR_WEIGHT) / (seen + PRIOR_WEIGHT);
      return {
        n: d.n,
        weight: d.weight,
        total: items.length,
        seen,
        coverage: items.length ? seen / items.length : 0,
        firstRate: seen ? first / seen : null,
        lastRate: seen ? last / seen : null,
        smoothed,
        attempts,
        correct,
        dueMissed: due,
      };
    });
  }

  // A weighted average of first-try accuracy across the eight domains, using
  // the exam's own weights, so a weak heavy domain costs more than a weak light one.
  function readiness(stats) {
    let w = 0, sum = 0, seen = 0, total = 0;
    for (const s of stats) {
      w += s.weight;
      sum += s.weight * s.smoothed;
      seen += s.seen;
      total += s.total;
    }
    return { score: w ? sum / w : 0, coverage: total ? seen / total : 0, seen };
  }

  function shuffle(list, rnd = Math.random) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Domain priority for new material: the exam weight, scaled up where
  // first-try accuracy is low and where you have rated yourself weak.
  function domainPriority(stats, selfRatings = {}) {
    return stats.map((s) => {
      const gap = 1 - s.smoothed + 0.15;
      const rating = Number(selfRatings[s.n]) || 0; // 1..5, 0 = not rated
      const self = rating ? 1 + (3 - rating) * 0.15 : 1;
      return { n: s.n, p: s.weight * gap * self };
    });
  }

  function pickWeighted(entries, rnd) {
    const total = entries.reduce((t, e) => t + e.p, 0);
    if (total <= 0) return entries[0];
    let x = rnd() * total;
    for (const e of entries) {
      x -= e.p;
      if (x <= 0) return e;
    }
    return entries[entries.length - 1];
  }

  // The daily "smart" set: questions you missed that are due again come
  // first (up to 40% of the set), then new questions drawn toward your
  // weakest, heaviest domains, spreading across objectives.
  function smartSet(bank, progress, domains, count, opts = {}) {
    const rnd = opts.rnd || Math.random;
    const now = opts.now || Date.now();
    const only = opts.domains && opts.domains.length ? new Set(opts.domains) : null;
    const pool = only ? bank.filter((q) => only.has(q.d)) : bank;
    const chosen = [];
    const taken = new Set();

    const due = pool
      .filter((q) => progress[q.id] && progress[q.id][6] <= now)
      .sort((a, b) => progress[a.id][3] - progress[b.id][3] || progress[a.id][5] - progress[b.id][5] || progress[a.id][6] - progress[b.id][6]);
    const dueCap = opts.reviewOnly ? count : Math.ceil(count * 0.4);
    for (const q of due) {
      if (chosen.length >= dueCap) break;
      chosen.push(q);
      taken.add(q.id);
    }
    if (opts.reviewOnly) return shuffle(chosen, rnd);

    const stats = domainStats(pool, progress, domains.filter((d) => !only || only.has(d.n)));
    let priorities = domainPriority(stats, opts.selfRatings).filter((p) => pool.some((q) => q.d === p.n));
    const objSeen = {};
    for (const q of bank) if (progress[q.id]) objSeen[q.obj] = (objSeen[q.obj] || 0) + 1;

    let guard = 0;
    while (chosen.length < count && priorities.length && guard++ < count * 20) {
      const pick = pickWeighted(priorities, rnd);
      const fresh = pool.filter((q) => q.d === pick.n && !progress[q.id] && !taken.has(q.id));
      let candidates = fresh;
      if (!candidates.length) {
        // Nothing new left here: fall back to the least-settled questions not yet due.
        candidates = pool
          .filter((q) => q.d === pick.n && !taken.has(q.id))
          .sort((a, b) => (progress[a.id]?.[5] ?? 0) - (progress[b.id]?.[5] ?? 0) || (progress[a.id]?.[4] ?? 0) - (progress[b.id]?.[4] ?? 0))
          .slice(0, 6);
      }
      if (!candidates.length) {
        priorities = priorities.filter((p) => p.n !== pick.n);
        continue;
      }
      // Prefer the objective you have practised least.
      const least = Math.min(...candidates.map((q) => objSeen[q.obj] || 0));
      const spread = candidates.filter((q) => (objSeen[q.obj] || 0) === least);
      const q = spread[Math.floor(rnd() * spread.length)];
      chosen.push(q);
      taken.add(q.id);
      objSeen[q.obj] = (objSeen[q.obj] || 0) + 1;
    }
    return shuffle(chosen, rnd);
  }

  // ---------------------------------------------------------------------
  // The adaptive mock exam.
  //
  // The real English CISSP exam is computerized adaptive (CAT): 100 to 150
  // items in three hours, no going back, and it stops as soon as it is 95%
  // confident you are above or below the passing standard. This models each
  // question with a one-parameter (Rasch) curve whose difficulty comes from the
  // bank's 1-3 rating, estimates your ability after every answer, and applies
  // the same stopping rule. The passing line sits where you would answer about
  // 71% of medium questions correctly.
  const DIFFICULTY = { 1: -1.0, 2: 0.0, 3: 1.0 };
  const PASS_THETA = 0.9;

  const FORMS = {
    full: { label: "Full adaptive exam", min: 100, max: 150, minutes: 180 },
    half: { label: "Half-length adaptive exam", min: 50, max: 75, minutes: 90 },
  };

  const prob = (theta, b) => 1 / (1 + Math.exp(-(theta - b)));

  // Maximum a posteriori ability estimate with a standard normal prior.
  function estimate(responses) {
    let theta = 0;
    for (let k = 0; k < 40; k++) {
      let grad = -theta, info = 1;
      for (const r of responses) {
        const p = prob(theta, r.b);
        grad += (r.correct ? 1 : 0) - p;
        info += p * (1 - p);
      }
      const step = grad / info;
      theta += Math.max(-1, Math.min(1, step));
      if (Math.abs(step) < 1e-6) break;
    }
    let info = 1;
    for (const r of responses) {
      const p = prob(theta, r.b);
      info += p * (1 - p);
    }
    return { theta, se: 1 / Math.sqrt(info) };
  }

  function catDecision(responses, form) {
    const n = responses.length;
    const { theta, se } = estimate(responses);
    const lo = theta - 1.96 * se, hi = theta + 1.96 * se;
    if (n >= form.max) return { done: true, pass: theta >= PASS_THETA, theta, se, reason: "max" };
    if (n >= form.min && lo > PASS_THETA) return { done: true, pass: true, theta, se, reason: "confident" };
    if (n >= form.min && hi < PASS_THETA) return { done: true, pass: false, theta, se, reason: "confident" };
    return { done: false, theta, se };
  }

  // Next item: the domain furthest behind its exam weight, then the unused
  // question in that domain whose difficulty is closest to your current
  // ability, preferring questions you have never practised.
  function nextCatItem(bank, used, responses, domains, progress, rnd = Math.random) {
    const usedSet = new Set(used);
    const counts = {};
    for (const r of responses) counts[r.d] = (counts[r.d] || 0) + 1;
    const n = responses.length + 1;
    const theta = responses.length ? estimate(responses).theta : 0;
    const order = domains
      .map((d) => ({ n: d.n, deficit: (d.weight / 100) * n - (counts[d.n] || 0) + rnd() * 0.01 }))
      .sort((a, b) => b.deficit - a.deficit);
    for (const d of order) {
      const pool = bank.filter((q) => q.d === d.n && !usedSet.has(q.id));
      if (!pool.length) continue;
      const neverSeen = pool.filter((q) => !progress[q.id]);
      const candidates = neverSeen.length ? neverSeen : pool;
      const best = Math.min(...candidates.map((q) => Math.abs(DIFFICULTY[q.diff] - theta)));
      const closest = candidates.filter((q) => Math.abs(DIFFICULTY[q.diff] - theta) === best);
      return closest[Math.floor(rnd() * closest.length)];
    }
    return null;
  }

  // An estimate on the familiar 0-1000 scale, with 700 at the passing line.
  function scaledScore(theta) {
    const s = 700 + (theta - PASS_THETA) * 110;
    return Math.round(Math.max(0, Math.min(1000, s)) / 10) * 10;
  }

  // Per-domain proficiency in the language of the real score report.
  function domainProficiency(responses, domains) {
    return domains.map((d) => {
      const rs = responses.filter((r) => r.d === d.n);
      if (!rs.length) return { n: d.n, count: 0, correct: 0, level: "none" };
      const { theta } = estimate(rs);
      const correct = rs.filter((r) => r.correct).length;
      const level = theta >= PASS_THETA + 0.35 ? "above" : theta <= PASS_THETA - 0.35 ? "below" : "near";
      return { n: d.n, count: rs.length, correct, level, theta };
    });
  }

  // ---------------------------------------------------------------------
  // The study plan from today to the exam date.
  function studyPlan(examDate, stats, selfRatings, now = Date.now()) {
    const days = Math.ceil((examDate - now) / DAY);
    if (!(days > 0)) return { days: Math.max(days, 0), weeks: [] };
    const order = domainPriority(stats, selfRatings).sort((a, b) => b.p - a.p).map((p) => p.n);
    const weeks = [];
    const totalWeeks = Math.ceil(days / 7);
    const mockWeeks = totalWeeks >= 6 ? 3 : totalWeeks >= 3 ? 2 : 1;
    let k = 0;
    for (let w = 0; w < totalWeeks; w++) {
      const start = now + w * 7 * DAY;
      const remaining = totalWeeks - w;
      if (remaining <= mockWeeks) {
        weeks.push({
          start,
          phase: remaining === 1 ? "final" : "exam",
          focus: order.slice(0, 2),
          note: remaining === 1
            ? "Light review of missed questions and key points. No new material in the last two days; sleep well."
            : "Two full adaptive mocks this week. Review every miss, then drill the domains the score report marks below the line.",
        });
      } else {
        const focus = [order[k % order.length], order[(k + 1) % order.length]];
        k += 2;
        weeks.push({
          start,
          phase: "build",
          focus,
          note: "Read the focus domains, then practise them daily. Smart review keeps the rest from fading.",
        });
      }
    }
    return { days, weeks };
  }

  return {
    DAY, BOX_DAYS, DIFFICULTY, PASS_THETA, FORMS,
    record, domainStats, readiness, shuffle, domainPriority, smartSet,
    prob, estimate, catDecision, nextCatItem, scaledScore, domainProficiency, studyPlan,
  };
})();
</script>
<script>
"use strict";
(() => {
  const BANK = JSON.parse(document.getElementById("bank").textContent);
  const DOMAINS = BANK.domains;
  const CURATED = BANK.questions;
  const DEFAULT_EXAM_DATE = "2026-12-31";
  const READY_TARGET = 0.75;

  // ---------------------------------------------------------------- helpers
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (x) => (x == null ? "–" : Math.round(x * 100) + "%");
  const DAY = Engine.DAY;
  const todayKey = (t = Date.now()) => {
    const d = new Date(t);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const parseDate = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 9, 0, 0).getTime() : null;
  };
  const fmtDate = (t, opts = { month: "short", day: "numeric" }) => new Date(t).toLocaleDateString(undefined, opts);
  const fmtClock = (ms) => {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(sec).padStart(2, "0");
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const domainOf = (n) => DOMAINS[n - 1];
  const objName = (obj) => {
    const d = DOMAINS[Number(obj.split(".")[0]) - 1];
    return d ? d.objectives[obj] || "" : "";
  };
  const level = (rate, seen) => (!seen ? "none" : rate >= READY_TARGET ? "good" : rate >= 0.6 ? "mid" : "low");
  const lsGet = (k, fallback) => {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } };

  // Minimal formatting for Claude's answers: paragraphs, bullets and **bold**.
  function richText(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
  }

  let toastTimer = 0;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------------------------------------------------------------- storage
  // Progress lives in this artifact's private database when you open it
  // signed in as its owner, so the phone and the laptop share one record.
  // Anywhere else (signed out, someone you shared the link with) it falls
  // back to this browser. A copy is always kept in the browser for a fast start.
  const LS = "cissp-prep:";
  const Store = {
    mode: "local",
    db: null,
    queues: {},
    async connect() {
      if (!window.claude || typeof window.claude.use !== "function") return false;
      try {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db) return false;
        const owner = user ? await user.isOwner() : false;
        if (!owner) return false;
        this.db = db;
        this.mode = "db";
        return true;
      } catch {
        return false;
      }
    },
    async getDoc(path) {
      const local = lsGet(LS + path, null);
      if (this.mode !== "db") return local;
      try {
        const snap = await this.db.doc(path).get();
        return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      } catch {
        return local;
      }
    },
    // One write at a time per document; a burst collapses into the latest body.
    setDoc(path, body) {
      lsSet(LS + path, body);
      if (this.mode !== "db") return;
      const q = this.queues[path] || (this.queues[path] = { busy: false, next: null });
      q.next = body;
      if (q.busy) return;
      const run = async () => {
        q.busy = true;
        while (q.next) {
          const b = q.next;
          q.next = null;
          try {
            await this.db.doc(path).set(b);
          } catch (e) {
            if (e && e.code === "quota_exceeded") toast("Storage is full. Delete old sessions in Tracker.");
            else if (e && e.code === "unavailable") {
              await new Promise((r) => setTimeout(r, 800 + Math.random() * 800));
              if (!q.next) q.next = b;
            }
          }
        }
        q.busy = false;
      };
      run();
    },
    async list(collection) {
      const local = lsGet(LS + collection, {});
      if (this.mode !== "db") return Object.values(local);
      try {
        const snap = await this.db.collection(collection).limit(1000).get();
        return snap.docs.map((d) => JSON.parse(JSON.stringify(d.data())));
      } catch {
        return Object.values(local);
      }
    },
    put(collection, id, body) {
      const local = lsGet(LS + collection, {});
      local[id] = body;
      lsSet(LS + collection, local);
      if (this.mode === "db") this.setDoc(collection + "/" + id, body);
    },
    async remove(collection, id) {
      const local = lsGet(LS + collection, {});
      delete local[id];
      lsSet(LS + collection, local);
      if (this.mode === "db") {
        try { await this.db.doc(collection + "/" + id).delete(); } catch { /* best effort */ }
      }
    },
  };

  // ---------------------------------------------------------------- state
  const defaultProfile = () => ({
    v: 1,
    examDate: DEFAULT_EXAM_DATE,
    examBooked: false,
    dailyGoal: 30,
    selfRatings: {},
    notes: {},
    scores: [],
    confirm: true,
    trackerSummary: "",
    updatedAt: 0,
  });

  const S = {
    tab: "today",
    profile: defaultProfile(),
    progress: { p: {}, days: {}, updatedAt: 0 },
    sessions: [],
    flags: {},
    generated: [],
    mock: null,          // a mock exam in progress
    mockStamp: 0,        // when the mock record was last written
    run: null,           // a practice session in progress
    result: null,        // the last finished practice session, for its results screen
    mockResult: null,    // the last finished mock, for its score report
    sub: null,           // sub-view within a tab
    sample: null,        // Claude, when the viewer allows it
    ask: null,           // the Ask Claude panel's state
    tool: {},            // transient form state
  };

  const allQuestions = () => CURATED.concat(S.generated);
  const byId = (id) => QINDEX.get(id) || S.generated.find((q) => q.id === id);
  const QINDEX = new Map(CURATED.map((q) => [q.id, q]));

  function saveProfile() {
    S.profile.updatedAt = Date.now();
    Store.setDoc("me/profile", S.profile);
  }
  function saveProgress() {
    S.progress.updatedAt = Date.now();
    Store.setDoc("me/progress", S.progress);
  }
  function saveMock() {
    S.mockStamp = Date.now();
    Store.setDoc("me/mock", { state: S.mock, updatedAt: S.mockStamp });
  }
  function saveRun() {
    lsSet(LS + "run", S.run);
  }

  // Merge two progress records, keeping the more recent answer for each question.
  function mergeProgress(a, b) {
    const out = { p: { ...(a?.p || {}) }, days: { ...(a?.days || {}) }, updatedAt: Math.max(a?.updatedAt || 0, b?.updatedAt || 0) };
    for (const [id, r] of Object.entries(b?.p || {})) {
      if (!out.p[id] || (r[4] || 0) > (out.p[id][4] || 0)) out.p[id] = r;
    }
    for (const [day, v] of Object.entries(b?.days || {})) {
      const cur = out.days[day];
      if (!cur || v[0] > cur[0]) out.days[day] = v;
    }
    return out;
  }

  async function loadAll() {
    const [profile, progress, mock, sessions, flags, generated] = await Promise.all([
      Store.getDoc("me/profile"),
      Store.getDoc("me/progress"),
      Store.getDoc("me/mock"),
      Store.list("sessions"),
      Store.list("flags"),
      Store.list("gen"),
    ]);
    return { profile, progress, mock, sessions, flags, generated };
  }

  function applyLoaded(data, { fromDb = false } = {}) {
    if (data.profile && (data.profile.updatedAt || 0) >= (S.profile.updatedAt || 0)) {
      S.profile = { ...defaultProfile(), ...data.profile };
    }
    if (data.progress) S.progress = mergeProgress(S.progress, data.progress);
    // The newest mock record wins, including "no mock in progress" from another device.
    if (data.mock && (data.mock.updatedAt || 0) > (S.mockStamp || 0)) {
      S.mockStamp = data.mock.updatedAt || 0;
      const st = data.mock.state;
      S.mock = st && !st.finished ? st : null;
    }
    const sessionMap = new Map(S.sessions.map((s) => [s.id, s]));
    for (const s of data.sessions || []) if (s && s.id) sessionMap.set(s.id, s);
    S.sessions = [...sessionMap.values()].sort((a, b) => b.startedAt - a.startedAt);
    for (const f of data.flags || []) if (f && f.id) S.flags[f.id] = f;
    const genMap = new Map(S.generated.map((q) => [q.id, q]));
    for (const q of data.generated || []) if (q && q.id && validGenerated(q)) genMap.set(q.id, q);
    S.generated = [...genMap.values()];
    if (fromDb) {
      // First connection on a device that practised before: carry its local record up.
      saveProgress();
      saveProfile();
    }
  }

  // ---------------------------------------------------------------- stats
  const curatedStats = () => Engine.domainStats(CURATED, S.progress.p, DOMAINS);
  function examTime() { return parseDate(S.profile.examDate); }
  function daysLeft() {
    const t = examTime();
    return t ? Math.ceil((t - Date.now()) / DAY) : null;
  }
  function today() {
    return S.progress.days[todayKey()] || [0, 0];
  }
  function countAnswer(correct) {
    const k = todayKey();
    const v = S.progress.days[k] || [0, 0];
    S.progress.days[k] = [v[0] + 1, v[1] + (correct ? 1 : 0)];
  }
  function streak() {
    let n = 0;
    let t = Date.now();
    if (!S.progress.days[todayKey(t)]) t -= DAY;
