"2.4\" fill=\"currentColor\"/>\u003ccircle cx=\"64\" cy=\"64\" r=\"5\" stroke-width=\"1.4\" stroke-dasharray=\"1.6 1.6\"/>\u003crect x=\"75.5\" y=\"62\" width=\"5\" height=\"12\" rx=\"1\"/>\u003ccircle cx=\"78\" cy=\"58\" r=\"2.4\" fill=\"currentColor\"/>\u003ccircle cx=\"78\" cy=\"58\" r=\"5\" stroke-width=\"1.4\" stroke-dasharray=\"1.6 1.6\"/>\u003crect x=\"12\" y=\"74\" width=\"76\" height=\"16\" rx=\"1\"/>\u003cpath d=\"M12 82 H88 M24 74 V82 M44 74 V82 M64 74 V82 M34 82 V90 M54 82 V90 M74 82 V90\" stroke-width=\"1.4\"/>"},{"n":20,"id":"judgement","name":"Judgement","numeral":"XX","archetype":"The Reckoning","concept":"Audits, assessment and testing","objectives":["6.1","6.2","6.4","6.5"],"hue":300,"upright":"Independent eyes test the controls, findings rise into the light, and every exception is fixed, accepted or explained.","reversed":"Testing without permission, scans passed off as pen tests, findings buried instead of fixed: judgment deferred, not escaped.","vision":"An angel's trumpet sounds over a lake of open coffins, and three banners unfurl from its bell: a ledger page, a sealed letter handed only to those who ask, and a poster nailed up for the whole village. One rising figure is painted in a single instant; another must keep standing through a whole season of blasts. A clerk taps every coffin lid and notes the loose ones, while a masked figure holding a signed scroll pries them open. One figure climbs out through the coffin's floor. From the distant mountains a traveler spots a crack in the trumpet and whispers it to the angel alone, long before telling the crowd.","decode":["Ledger page, sealed letter, village poster → SOC 1 covers financial reporting controls; SOC 2, security controls for restricted readers; SOC 3, a public summary.","Painted in an instant vs standing a season → Type I judges control design at a point in time; Type II tests operating effectiveness over a period.","The clerk tapping lids; the masked figure with a signed scroll → vulnerability scans find weaknesses; pen tests exploit them, only with written authorization.","Climbing out through the coffin's floor → misuse case testing: test what an attacker would try, not just the intended path.","The traveler whispering the crack to the angel first → ethical disclosure: tell the vendor privately and allow time to fix before going public."],"facts":["Internal audits use the organization's own staff; external audits bring an outside firm's independence; third-party audits are run for another party, such as a customer.","Test coverage = use cases tested ÷ total use cases. It can be measured by branch, condition, function, loop or statement coverage.","Static testing analyzes code without running it; dynamic testing exercises it while it runs; fuzzing feeds malformed input to expose crashes and flaws."],"trap":"The collective once accepted a Type I report as proof the controls work. Type I shows design on a single day; only Type II tests operation over months. Need the detail? SOC 2, not the public SOC 3.","glyph":"\u003cg transform=\"translate(14 14) rotate(24)\">\u003cpath d=\"M0 0 H30\" stroke-width=\"3\"/>\u003cpath d=\"M30 -1.8 C36 -2.2 40 -5 45 -9 V9 C40 5 36 2.2 30 1.8\"/>\u003cellipse cx=\"45\" cy=\"0\" rx=\"2.2\" ry=\"9\"/>\u003cpath d=\"M51 -8 Q56 0 51 8 M56 -12 Q63 0 56 12\" stroke-width=\"1.6\"/>\u003c/g>\u003cpath d=\"M22 17.6 L36 23.9 V42 L22 35.7 Z\"/>\u003cpath d=\"M25 31 L28.5 34.5 L33 26.5\" stroke-width=\"2\"/>\u003ccircle cx=\"54\" cy=\"56\" r=\"4.5\"/>\u003cpath d=\"M54 61 V76 M54 65 L45 54 M54 65 L63 54\"/>\u003cpath d=\"M30 72 L34 88 H74 L78 72 Z\"/>\u003cpath d=\"M78 72 L88 62\" />\u003cpath d=\"M10 92 H90\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/>"},{"n":21,"id":"world","name":"The World","numeral":"XXI","archetype":"The Self","concept":"Secure architecture and design principles","objectives":["1.2","3.1","3.3","3.4","3.5","3.10"],"hue":170,"upright":"Confidentiality, integrity and availability designed in from the first requirement: least privilege, layered defense, failing closed.","reversed":"Security bolted on at the end: default passwords, flat trust, complexity nobody can review, a cloud nobody thought was theirs.","vision":"A dancer spins inside an oval wreath woven from many separate hedges; slip through one and the next still holds. They carry two wands, one to sign and one to pay, and may never raise both at once. When the music stops, every gate in the wreath swings shut. At the dancer's heart glows a sealed crystal that remembers each step since dawn and will shine in no other body. In the corners, the eagle mends only its half of a nest rented in the sky; the bull drags a plow no one may stop to repair; the lion wears a collar still set to its factory password; the angel has no body, only a voice.","decode":["A wreath of many separate hedges → defense in depth: layered, varied controls, so one failed layer does not mean a breach.","Two wands never raised together; gates that shut when the music stops → separation of duties; fail securely, defaulting to a closed state on failure.","A crystal heart that remembers every step and shines in no other body → TPM: a chip bound to one motherboard that stores keys and measures the boot.","The eagle mending half a rented nest; the bull's unstoppable plow → cloud shared responsibility; ICS puts availability first and is hard to patch.","The lion's factory-password collar; the bodiless angel → IoT ships with default credentials; serverless has no server to harden, but code and permissions stay yours."],"facts":["In IaaS the customer secures the OS, apps and data; in PaaS, apps and data; in SaaS, mainly data and access. The customer stays accountable for its data in all three.","VM escape lets code break out of a guest to the hypervisor and other guests; containers share the host kernel, so one kernel flaw can expose them all.","A TPM is a chip bound to one device for measured boot and disk keys; an HSM is a separate, tamper-resistant device that generates, stores and uses many keys at speed."],"trap":"The collective's oldest regret is bolting security on after the build. It belongs in the first requirements and every phase through retirement; a flaw fixed in design costs a fraction of one fixed in production.","glyph":"\u003cellipse cx=\"50\" cy=\"50\" rx=\"25\" ry=\"37\"/>\u003cellipse cx=\"50\" cy=\"50\" rx=\"20\" ry=\"31\" stroke-width=\"1.4\" stroke-dasharray=\"3 2.5\"/>\u003cpath d=\"M45 9 L55 17 M55 9 L45 17 M45 83 L55 91 M55 83 L45 91\" stroke-width=\"1.8\"/>\u003ccircle cx=\"50\" cy=\"31\" r=\"4\"/>\u003cpath d=\"M50 35 V56 M50 56 L44 72 M50 56 L56 64 L51 70\"/>\u003cpath d=\"M50 40 L41 36 M50 40 L59 44\"/>\u003cpath d=\"M40 28 V44 M60 36 V52\" stroke-width=\"2.6\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003ccircle cx=\"88\" cy=\"12\" r=\"4\"/>\u003ccircle cx=\"12\" cy=\"88\" r=\"4\"/>\u003ccircle cx=\"88\" cy=\"88\" r=\"4\"/>"}]}</script>
<script>
// The app's arithmetic, kept free of the page so it can be tested on its own:
// progress records, domain statistics, the review scheduler, the adaptive
// mock exam and the study plan. build.mjs inlines this file into the page;
// engine.test.mjs runs it under Node.
// Used by the page script that build.mjs inlines after this file.
// eslint-disable-next-line no-unused-vars
const Engine = (() => {
  const DAY = 86400000;

  // Leitner boxes. A correct answer moves a question up a box and pushes its
  // next review out; a miss sends it back to box 1 for tomorrow.
  const BOX_DAYS = [0, 1, 3, 7, 16, 35, 70];
  const MISS_DELAY = 20 * 3600 * 1000;

  // Per-question progress, stored compactly as an array so the whole record
  // for a few hundred questions stays well under one storage document:
  // [attempts, correct, firstCorrect (1/0), lastCorrect (1/0), lastTs, box, dueTs]
  function record(prev, correct, now) {
    const r = prev ? prev.slice() : [0, 0, correct ? 1 : 0, 0, 0, 0, 0];
    r[0] += 1;
    if (correct) r[1] += 1;
    r[3] = correct ? 1 : 0;
    r[4] = now;
    if (correct) {
      r[5] = Math.min(r[5] + 1, BOX_DAYS.length - 1);
      r[6] = now + BOX_DAYS[r[5]] * DAY;
    } else {
      r[5] = 1;
      r[6] = now + MISS_DELAY;
    }
    return r;
  }

  // First-try accuracy is the honest predictor: it is what you score on a
  // question you have never seen, which is every question on the real exam.
  // Small samples are pulled toward 60% so one lucky answer reads as "unknown".
  const PRIOR_RATE = 0.6;
  const PRIOR_WEIGHT = 4;

  function domainStats(bank, progress, domains) {
    return domains.map((d) => {
      const items = bank.filter((q) => q.d === d.n);
      let seen = 0, first = 0, last = 0, attempts = 0, correct = 0, due = 0;
      const now = Date.now();
      for (const q of items) {
        const r = progress[q.id];
        if (!r) continue;
        seen++;
        first += r[2];
        last += r[3];
        attempts += r[0];
        correct += r[1];
        if (r[6] <= now && r[3] === 0) due++;
      }
      const smoothed = (first + PRIOR_RATE * PRIOR_WEIGHT) / (seen + PRIOR_WEIGHT);
      return {
        n: d.n,
        weight: d.weight,
        total: items.length,
        seen,
        coverage: items.length ? seen / items.length : 0,
        firstRate: seen ? first / seen : null,
        lastRate: seen ? last / seen : null,
        smoothed,
        attempts,
        correct,
        dueMissed: due,
      };
    });
  }

  // A weighted average of first-try accuracy across the eight domains, using
  // the exam's own weights, so a weak heavy domain costs more than a weak light one.
  function readiness(stats) {
    let w = 0, sum = 0, seen = 0, total = 0;
    for (const s of stats) {
      w += s.weight;
      sum += s.weight * s.smoothed;
      seen += s.seen;
      total += s.total;
    }
    return { score: w ? sum / w : 0, coverage: total ? seen / total : 0, seen };
  }

  function shuffle(list, rnd = Math.random) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Domain priority for new material: the exam weight, scaled up where
  // first-try accuracy is low and where you have rated yourself weak.
  function domainPriority(stats, selfRatings = {}) {
    return stats.map((s) => {
      const gap = 1 - s.smoothed + 0.15;
      const rating = Number(selfRatings[s.n]) || 0; // 1..5, 0 = not rated
      const self = rating ? 1 + (3 - rating) * 0.15 : 1;
      return { n: s.n, p: s.weight * gap * self };
    });
  }

  function pickWeighted(entries, rnd) {
    const total = entries.reduce((t, e) => t + e.p, 0);
    if (total <= 0) return entries[0];
    let x = rnd() * total;
    for (const e of entries) {
      x -= e.p;
      if (x <= 0) return e;
    }
    return entries[entries.length - 1];
  }

  // The daily "smart" set: questions you missed that are due again come
  // first (up to 40% of the set), then new questions drawn toward your
  // weakest, heaviest domains, spreading across objectives.
  function smartSet(bank, progress, domains, count, opts = {}) {
    const rnd = opts.rnd || Math.random;
    const now = opts.now || Date.now();
    const only = opts.domains && opts.domains.length ? new Set(opts.domains) : null;
    const pool = only ? bank.filter((q) => only.has(q.d)) : bank;
    const chosen = [];
    const taken = new Set();

    const due = pool
      .filter((q) => progress[q.id] && progress[q.id][6] <= now)
      .sort((a, b) => progress[a.id][3] - progress[b.id][3] || progress[a.id][5] - progress[b.id][5] || progress[a.id][6] - progress[b.id][6]);
    const dueCap = opts.reviewOnly ? count : Math.ceil(count * 0.4);
    for (const q of due) {
      if (chosen.length >= dueCap) break;
      chosen.push(q);
      taken.add(q.id);
    }
    if (opts.reviewOnly) return shuffle(chosen, rnd);

    const stats = domainStats(pool, progress, domains.filter((d) => !only || only.has(d.n)));
    let priorities = domainPriority(stats, opts.selfRatings).filter((p) => pool.some((q) => q.d === p.n));
    const objSeen = {};
    for (const q of bank) if (progress[q.id]) objSeen[q.obj] = (objSeen[q.obj] || 0) + 1;

    let guard = 0;
    while (chosen.length < count && priorities.length && guard++ < count * 20) {
      const pick = pickWeighted(priorities, rnd);
      const fresh = pool.filter((q) => q.d === pick.n && !progress[q.id] && !taken.has(q.id));
      let candidates = fresh;
      if (!candidates.length) {
        // Nothing new left here: fall back to the least-settled questions not yet due.
        candidates = pool
          .filter((q) => q.d === pick.n && !taken.has(q.id))
          .sort((a, b) => (progress[a.id]?.[5] ?? 0) - (progress[b.id]?.[5] ?? 0) || (progress[a.id]?.[4] ?? 0) - (progress[b.id]?.[4] ?? 0))
          .slice(0, 6);
      }
      if (!candidates.length) {
        priorities = priorities.filter((p) => p.n !== pick.n);
        continue;
      }
      // Prefer the objective you have practised least.
      const least = Math.min(...candidates.map((q) => objSeen[q.obj] || 0));
      const spread = candidates.filter((q) => (objSeen[q.obj] || 0) === least);
      const q = spread[Math.floor(rnd() * spread.length)];
      chosen.push(q);
      taken.add(q.id);
      objSeen[q.obj] = (objSeen[q.obj] || 0) + 1;
    }
    return shuffle(chosen, rnd);
  }

  // ---------------------------------------------------------------------
  // The adaptive mock exam.
  //
  // The real English CISSP exam is computerized adaptive (CAT): 100 to 150
  // items in three hours, no going back, and it stops as soon as it is 95%
  // confident you are above or below the passing standard. This models each
  // question with a one-parameter (Rasch) curve whose difficulty comes from the
  // bank's 1-3 rating, estimates your ability after every answer, and applies
  // the same stopping rule. The passing line sits where you would answer about
  // 71% of medium questions correctly.
  const DIFFICULTY = { 1: -1.0, 2: 0.0, 3: 1.0 };
  const PASS_THETA = 0.9;

  const FORMS = {
    full: { label: "Full adaptive exam", min: 100, max: 150, minutes: 180 },
    half: { label: "Half-length adaptive exam", min: 50, max: 75, minutes: 90 },
  };

  const prob = (theta, b) => 1 / (1 + Math.exp(-(theta - b)));

  // Maximum a posteriori ability estimate with a standard normal prior.
  function estimate(responses) {
    let theta = 0;
    for (let k = 0; k < 40; k++) {
      let grad = -theta, info = 1;
      for (const r of responses) {
        const p = prob(theta, r.b);
        grad += (r.correct ? 1 : 0) - p;
        info += p * (1 - p);
      }
      const step = grad / info;
      theta += Math.max(-1, Math.min(1, step));
      if (Math.abs(step) < 1e-6) break;
    }
    let info = 1;
    for (const r of responses) {
      const p = prob(theta, r.b);
      info += p * (1 - p);
    }
    return { theta, se: 1 / Math.sqrt(info) };
  }

  function catDecision(responses, form) {
    const n = responses.length;
    const { theta, se } = estimate(responses);
    const lo = theta - 1.96 * se, hi = theta + 1.96 * se;
    if (n >= form.max) return { done: true, pass: theta >= PASS_THETA, theta, se, reason: "max" };
    if (n >= form.min && lo > PASS_THETA) return { done: true, pass: true, theta, se, reason: "confident" };
    if (n >= form.min && hi < PASS_THETA) return { done: true, pass: false, theta, se, reason: "confident" };
    return { done: false, theta, se };
  }

  // Next item: the domain furthest behind its exam weight, then the unused
  // question in that domain whose difficulty is closest to your current
  // ability, preferring questions you have never practised.
  function nextCatItem(bank, used, responses, domains, progress, rnd = Math.random) {
    const usedSet = new Set(used);
    const counts = {};
    for (const r of responses) counts[r.d] = (counts[r.d] || 0) + 1;
    const n = responses.length + 1;
    const theta = responses.length ? estimate(responses).theta : 0;
    const order = domains
      .map((d) => ({ n: d.n, deficit: (d.weight / 100) * n - (counts[d.n] || 0) + rnd() * 0.01 }))
      .sort((a, b) => b.deficit - a.deficit);
    for (const d of order) {
      const pool = bank.filter((q) => q.d === d.n && !usedSet.has(q.id));
      if (!pool.length) continue;
      const neverSeen = pool.filter((q) => !progress[q.id]);
      const candidates = neverSeen.length ? neverSeen : pool;
      const best = Math.min(...candidates.map((q) => Math.abs(DIFFICULTY[q.diff] - theta)));
      const closest = candidates.filter((q) => Math.abs(DIFFICULTY[q.diff] - theta) === best);
      return closest[Math.floor(rnd() * closest.length)];
    }
    return null;
  }

  // An estimate on the familiar 0-1000 scale, with 700 at the passing line.
  function scaledScore(theta) {
    const s = 700 + (theta - PASS_THETA) * 110;
    return Math.round(Math.max(0, Math.min(1000, s)) / 10) * 10;
  }

  // Per-domain proficiency in the language of the real score report.
  function domainProficiency(responses, domains) {
    return domains.map((d) => {
      const rs = responses.filter((r) => r.d === d.n);
      if (!rs.length) return { n: d.n, count: 0, correct: 0, level: "none" };
      const { theta } = estimate(rs);
      const correct = rs.filter((r) => r.correct).length;
      const level = theta >= PASS_THETA + 0.35 ? "above" : theta <= PASS_THETA - 0.35 ? "below" : "near";
      return { n: d.n, count: rs.length, correct, level, theta };
    });
  }

  // ---------------------------------------------------------------------
  // The study plan from today to the exam date.
  function studyPlan(examDate, stats, selfRatings, now = Date.now()) {
    const days = Math.ceil((examDate - now) / DAY);
    if (!(days > 0)) return { days: Math.max(days, 0), weeks: [] };
    const order = domainPriority(stats, selfRatings).sort((a, b) => b.p - a.p).map((p) => p.n);
    const weeks = [];
    const totalWeeks = Math.ceil(days / 7);
    const mockWeeks = totalWeeks >= 6 ? 3 : totalWeeks >= 3 ? 2 : 1;
    let k = 0;
    for (let w = 0; w < totalWeeks; w++) {
      const start = now + w * 7 * DAY;
      const remaining = totalWeeks - w;
      if (remaining <= mockWeeks) {
        weeks.push({
          start,
          phase: remaining === 1 ? "final" : "exam",
          focus: order.slice(0, 2),
          note: remaining === 1
            ? "Light review of missed questions and key points. No new material in the last two days; sleep well."
            : "Two full adaptive mocks this week. Review every miss, then drill the domains the score report marks below the line.",
        });
      } else {
        const focus = [order[k % order.length], order[(k + 1) % order.length]];
        k += 2;
        weeks.push({
          start,
          phase: "build",
          focus,
          note: "Read the focus domains, then practise them daily. Smart review keeps the rest from fading.",
        });
      }
    }
    return { days, weeks };
  }

  // ---------------------------------------------------------------------
  // The Arcade: seeded draws, the daily five, survival's difficulty ramp,
  // confidence bets, experience levels and the game record.

  // A seeded generator (a string hash feeding mulberry32), so every device
  // draws the same daily set and a question's study order never changes.
  function seeded(seed) {
    let h = 2166136261;
    for (const ch of String(seed)) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
    let a = h >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Five questions for the day, the same on every device: five different
  // domains drawn by exam weight, one medium or hard question from each.
  function dailyPick(bank, dateKey, domains, n = 5) {
    const rnd = seeded("daily:" + dateKey);
    let left = domains.map((d) => ({ n: d.n, p: d.weight }));
    const out = [];
    while (out.length < n && left.length) {
      const d = pickWeighted(left, rnd);
      left = left.filter((x) => x.n !== d.n);
      const pool = bank.filter((q) => q.d === d.n && q.diff >= 2);
      if (pool.length) out.push(pool[Math.floor(rnd() * pool.length)]);
    }
    return out;
  }

  // Survival gets harder the longer you last: easy and medium questions
  // first, then medium and hard, then hard only. Questions you have not yet
  // answered correctly come first.
  function survivalTiers(score) {
    return score < 4 ? [1, 2] : score < 10 ? [2, 3] : [3];
  }
  function survivalPick(bank, progress, used, score, rnd = Math.random) {
    const usedSet = new Set(used);
    const open = bank.filter((q) => !usedSet.has(q.id));
    if (!open.length) return null;
    const tiers = survivalTiers(score);
    const tiered = open.filter((q) => tiers.includes(q.diff));
    const pool = tiered.length ? tiered : open;
    const unsettled = pool.filter((q) => !progress[q.id] || progress[q.id][3] === 0);
    const from = unsettled.length ? unsettled : pool;
    return from[Math.floor(rnd() * from.length)];
  }

  // Confidence bets: [points if right, points if wrong]. The payoffs make an
  // honest bet the best bet: "Guess" pays most below 50% certainty, "Likely"
  // between 50% and 83%, and "Sure" only above 83%.
  const BETS = { 1: [1, 0], 2: [2, -1], 3: [3, -6] };
  const betPoints = (bet, correct) => (BETS[bet] || BETS[1])[correct ? 0 : 1];

  // calib holds [answered, right] for each bet level.
  function calibration(calib = {}) {
    const levels = [1, 2, 3].map((bet) => {
      const [n, right] = calib[bet] || [0, 0];
      return { bet, n, right, rate: n ? right / n : null };
    });
    const [guess, , sure] = levels;
    let verdict = "Bet on at least ten answers as Sure to see how well your confidence matches your accuracy.";
    if (sure.n >= 10) {
      if (sure.rate < 0.8) verdict = "Overconfident: too many of your Sure answers are wrong. On the exam, reread the questions that feel obvious.";
      else if (guess.n >= 8 && guess.rate > 0.6) verdict = "Underconfident: most of your guesses are right. Your first line of reasoning is better than you think.";
      else verdict = "Well calibrated: your confidence matches your accuracy.";
    }
    return { levels, verdict };
  }

  // Experience: 10 points for a right answer plus 5 per difficulty step, 2
  // for a miss. Level L starts at 50·L·(L−1) points, so each level needs 100
  // more than the last; a steady 30 questions a day reaches about level 20
  // in two months.
  const xpFor = (correct, diff = 2) => (correct ? 10 + 5 * (diff - 1) : 2);
  const levelFloor = (level) => 50 * level * (level - 1);
  const LEVEL_TITLES = [[1, "Intern"], [3, "Analyst"], [6, "Engineer"], [9, "Architect"], [12, "Manager"], [15, "Director"], [18, "CISO"], [22, "Board advisor"]];
  function levelFor(xp) {
    let level = 1;
    while (levelFloor(level + 1) <= xp) level++;
    const title = LEVEL_TITLES.filter(([l]) => l <= level).pop()[1];
    const floor = levelFloor(level), next = levelFloor(level + 1);
    return { level, title, floor, next, into: xp - floor, span: next - floor };
  }

  // How many steps of an ordering are in the right place.
  function orderScore(answer, correct) {
    return answer.reduce((n, x, i) => n + (x === correct[i] ? 1 : 0), 0);
  }

  // Two copies of the game record (two devices) merge by keeping the larger
  // of each figure: counts only ever grow. Pairs such as [answered, right]
  // keep the copy with more answered; a day's Daily 5 keeps the better score.
  function mergeGame(a, b) {
    if (a == null) return b;
    if (b == null) return a;
    if (typeof a === "number" && typeof b === "number") return Math.max(a, b);
    if (Array.isArray(a) && Array.isArray(b)) return (b[0] || 0) > (a[0] || 0) ? b : a;
    if (typeof a === "object" && typeof b === "object") {
      const out = { ...a };
      for (const k of Object.keys(b)) out[k] = mergeGame(a[k], b[k]);
      return out;
    }
    return b;
  }

  // ---------------------------------------------------------------------
  // The Oracle: a deck of 22 Major Arcana, each an archetype carrying one
  // cluster of exam objectives. A card's state comes from your latest answers
  // on its objectives; the daily spread and the Shadow are drawn from it.

  // seen: questions answered on the card's objectives; latest: share right on
  // the latest try; state: veiled (under 3 seen), upright, wavering, reversed.
  function cardMastery(card, bank, progress) {
    const objs = new Set(card.objectives);
    let total = 0, seen = 0, latest = 0, first = 0;
    for (const q of bank) {
      if (!objs.has(q.obj)) continue;
      total++;
      const r = progress[q.id];
      if (!r) continue;
      seen++;
      latest += r[3];
      first += r[2];
    }
    const rate = seen ? latest / seen : null;
    const smoothed = (first + PRIOR_RATE * PRIOR_WEIGHT) / (seen + PRIOR_WEIGHT);
    const state = seen < 3 ? "veiled" : rate >= 0.75 ? "upright" : rate < 0.5 ? "reversed" : "wavering";
    return { n: card.n, total, seen, rate, smoothed, state };
  }

  // The Shadow is the card you are weakest on, once there is enough evidence:
  // at least 20 answers in all and 3 on the card. Ties break by seeded draw.
  function shadowCard(masteries, dateKey = "") {
    const answered = masteries.reduce((n, m) => n + m.seen, 0);
    const known = masteries.filter((m) => m.seen >= 3);
    if (answered < 20 || !known.length) return null;
    const rnd = seeded("shadow:" + dateKey);
    const ranked = known.map((m) => ({ m, k: m.smoothed + rnd() * 1e-6 })).sort((a, b) => a.k - b.k);
    return ranked[0].m.n;
  }

  // Three cards a day, the same on every device: the Past is drawn from what
  // you have integrated (strongest), the Present from the middle, the Future
  // from what you are weakest on, skipping the Shadow. Without data, the
  // draw is simply seeded by the date.
  function dailySpread(masteries, dateKey, shadow = null) {
    const rnd = seeded("spread:" + dateKey);
    const pool = masteries.filter((m) => m.n !== shadow).map((m) => ({ n: m.n, k: (m.seen >= 3 ? m.smoothed : 0.6) + rnd() * 0.08 }));
    pool.sort((a, b) => a.k - b.k);
    const third = Math.max(1, Math.floor(pool.length / 3));
    const pick = (list) => list[Math.floor(rnd() * list.length)].n;
    const future = pick(pool.slice(0, third));
    const past = pick(pool.slice(-third).filter((x) => x.n !== future));
    const mid = pool.slice(third, -third).filter((x) => x.n !== future && x.n !== past);
    const present = pick(mid.length ? mid : pool.filter((x) => x.n !== future && x.n !== past));
    return [past, present, future];
  }

  // A question for a card: never seen first, then latest-wrong, then the
  // longest unseen; a seeded draw among the best candidates.
  function cardQuestion(card, bank, progress, seedKey, exclude = []) {
    const objs = new Set(card.objectives);
    const skip = new Set(exclude);
    const pool = bank.filter((q) => objs.has(q.obj) && !skip.has(q.id));
    if (!pool.length) return null;
    const rank = (q) => {
      const r = progress[q.id];
      return !r ? 0 : r[3] === 0 ? 1 : 2 + 1 / (1 + (r[4] || 0) / DAY);
    };
    const best = Math.min(...pool.map(rank));
    const top = pool.filter((q) => rank(q) === best);
    const rnd = seeded("q:" + seedKey);
    return top[Math.floor(rnd() * top.length)];
  }

  // Two copies of the Oracle record merge day by day, keeping the further
  // along of each day's reading; integrated Shadows are a union.
  function mergeOracle(a, b) {
    if (!a) return b;
    if (!b) return a;
    const progress = (r) => (r.results || []).filter((x) => x != null).length * 2 + (r.flipped || []).filter(Boolean).length + (r.oracle ? 10 : 0);
    const readings = { ...(a.readings || {}) };
    for (const [day, r] of Object.entries(b.readings || {})) if (!readings[day] || progress(r) > progress(readings[day])) readings[day] = r;
    const sa = a.shadows || {}, sb = b.shadows || {};
    return {
      ...a,
      readings,
      shadows: { attempts: Math.max(sa.attempts || 0, sb.attempts || 0), wins: { ...(sb.wins || {}), ...(sa.wins || {}) } },
      updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0),
    };
  }

  // The card face as an SVG string. The art is always a night sky, whatever
  // the page theme. A reversed card is drawn upside down, as in a real reading.
  const GOLD = "#dcb86c", PALE = "#f5ead0";
  function cardSvg(card, { reversed = false, back = false, gilded = false, uid = "" } = {}) {
    const id = `c${card ? card.n : "b"}${uid}`;
    const hue = back || !card ? 248 : card.hue;
    const rnd = seeded("stars:" + (back || !card ? "back" : card.id));
    let stars = "";
    for (let i = 0; i < 16; i++) {
      // Stars stay clear of the numeral and the name.
      const x = 16 + rnd() * 108, y = 38 + rnd() * 130, r = 0.35 + rnd() * 0.8;
      stars += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${PALE}" opacity="${(0.35 + rnd() * 0.5).toFixed(2)}"/>`;
    }
    const frame = `<defs><linearGradient id="${id}g" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="hsl(${hue} 46% 17%)"/><stop offset="1" stop-color="hsl(${(hue + 28) % 360} 52% 7%)"/></linearGradient>
      <radialGradient id="${id}h" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="hsl(${hue} 70% 70%)" stop-opacity="0.32"/><stop offset="1" stop-color="hsl(${hue} 70% 70%)" stop-opacity="0"/></radialGradient></defs>
      <rect x="0" y="0" width="140" height="230" rx="10" fill="url(#${id}g)"/>${stars}
      <rect x="5" y="5" width="130" height="220" rx="7" fill="none" stroke="${GOLD}" stroke-width="${gilded ? 2.6 : 1.1}"/>
      <rect x="10" y="10" width="120" height="210" rx="5" fill="none" stroke="${GOLD}" stroke-width="0.5" opacity="0.6"/>`;
    let body;
    if (back || !card) {
      body = `<circle cx="70" cy="115" r="54" fill="url(#${id}h)"/>
        <g fill="none" stroke="${GOLD}" stroke-width="1.4" stroke-linecap="round">
          <circle cx="70" cy="115" r="40" opacity="0.7"/><circle cx="70" cy="115" r="30" opacity="0.45"/>
          <path d="M38 115 Q70 88 102 115 Q70 142 38 115 Z"/><circle cx="70" cy="115" r="9"/><circle cx="70" cy="115" r="3" fill="${GOLD}"/>
          <path d="M70 61 V71 M70 159 V169 M16 115 H26 M114 115 H124"/></g>
        <text x="70" y="208" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="8" letter-spacing="3" fill="${GOLD}" opacity="0.8">ARCANA</text>`;
    } else {
      body = `<text x="70" y="29" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="13" letter-spacing="2" fill="${GOLD}">${card.numeral}</text>
        <circle cx="70" cy="100" r="50" fill="url(#${id}h)"/>
        <g transform="translate(20 50)" fill="none" stroke="${GOLD}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="${GOLD}">${card.glyph}</g>
        <text x="70" y="186" text-anchor="middle" font-family="Literata, Georgia, serif" font-size="${card.name.length > 15 ? 8.6 : card.name.length > 12 ? 10 : 11}" letter-spacing="1.1" fill="${PALE}">${card.name.toUpperCase()}</text>
        <line x1="44" y1="194" x2="96" y2="194" stroke="${GOLD}" stroke-width="0.5" opacity="0.6"/>
        <text x="70" y="207" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-size="6.6" letter-spacing="0.6" fill="${GOLD}" opacity="0.85">${card.archetype.toUpperCase()}</text>`;
    }
    const inner = reversed ? `<g transform="rotate(180 70 115)">${body}</g>` : body;
    return `<svg class="tarot" viewBox="0 0 140 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${back || !card ? "A face-down card" : `${card.name}${reversed ? ", reversed" : ""}`}">${frame}${inner}</svg>`;
  }

  return {
    DAY, BOX_DAYS, DIFFICULTY, PASS_THETA, FORMS, BETS,
    cardMastery, shadowCard, dailySpread, cardQuestion, cardSvg, mergeOracle,
    record, domainStats, readiness, shuffle, domainPriority, smartSet,
    prob, estimate, catDecision, nextCatItem, scaledScore, domainProficiency, studyPlan,
    seeded, dailyPick, survivalTiers, survivalPick, betPoints, calibration,
    xpFor, levelFor, orderScore, mergeGame,
  };
})();
</script>
<script>
"use strict";
(() => {
  const BANK = JSON.parse(document.getElementById("bank").textContent);
  const DOMAINS = BANK.domains;
  const CURATED = BANK.questions;
  const DEFAULT_EXAM_DATE = "2026-12-31";
  const READY_TARGET = 0.75;

  // ---------------------------------------------------------------- helpers
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (x) => (x == null ? "–" : Math.round(x * 100) + "%");
  const DAY = Engine.DAY;
  const todayKey = (t = Date.now()) => {
    const d = new Date(t);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  };
  const parseDate = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 9, 0, 0).getTime() : null;
  };
  const fmtDate = (t, opts = { month: "short", day: "numeric" }) => new Date(t).toLocaleDateString(undefined, opts);
  const fmtClock = (ms) => {
    const s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(sec).padStart(2, "0");
  };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const domainOf = (n) => DOMAINS[n - 1];
  const objName = (obj) => {
    const d = DOMAINS[Number(obj.split(".")[0]) - 1];
    return d ? d.objectives[obj] || "" : "";
  };
  const level = (rate, seen) => (!seen ? "none" : rate >= READY_TARGET ? "good" : rate >= 0.6 ? "mid" : "low");
  const lsGet = (k, fallback) => {
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } };

  // Minimal formatting for Claude's answers: paragraphs, bullets and **bold**.
  function richText(text) {
    return esc(text)
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/^#{1,4}\s*(.+)$/gm, "<b>$1</b>");
  }

  let toastTimer = 0;
  function toast(msg, kind = "") {
    const t = $("#toast");
    t.textContent = msg;
    t.className = "toast" + (kind ? " " + kind : "");
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, kind ? 4200 : 2600);
  }

  // ---------------------------------------------------------------- storage
  // Progress lives in this artifact's private database when you open it
  // signed in as its owner, so the phone and the laptop share one record.
  // Anywhere else (signed out, someone you shared the link with) it falls
  // back to this browser. A copy is always kept in the browser for a fast start.
  const LS = "cissp-prep:";
  const Store = {
    mode: "local",
    db: null,
    queues: {},
    async connect() {
      if (!window.claude || typeof window.claude.use !== "function") return false;
      try {
        const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        if (!db) return false;
        const owner = user ? await user.isOwner() : false;
        if (!owner) return false;
        this.db = db;
        this.mode = "db";
        return true;
      } catch {
        return false;
      }
    },
    async getDoc(path) {
      const local = lsGet(LS + path, null);
      if (this.mode !== "db") return local;
      try {
        const snap = await this.db.doc(path).get();
        return snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      } catch {
        return local;
      }
    },
    // One write at a time per document; a burst collapses into the latest body.
    setDoc(path, body) {
      lsSet(LS + path, body);
      if (this.mode !== "db") return;
      const q = this.queues[path] || (this.queues[path] = { busy: false, next: null });
      q.next = body;
      if (q.busy) return;
      const run = async () => {
        q.busy = true;
        while (q.next) {
          const b = q.next;
          q.next = null;
          try {
            await this.db.doc(path).set(b);
          } catch (e) {
            if (e && e.code === "quota_exceeded") toast("Storage is full. Delete old sessions in Tracker.");
            else if (e && e.code === "unavailable") {
              await new Promise((r) => setTimeout(r, 800 + Math.random() * 800));
              if (!q.next) q.next = b;
            }
          }
        }
        q.busy = false;
      };
      run();
    },
    async list(collection) {
      const local = lsGet(LS + collection, {});
      if (this.mode !== "db") return Object.values(local);
      try {
        const snap = await this.db.collection(collection).limit(1000).get();
        return snap.docs.map((d) => JSON.parse(JSON.stringify(d.data())));
      } catch {
        return Object.values(local);
      }
    },
    put(collection, id, body) {
      const local = lsGet(LS + collection, {});
      local[id] = body;
      lsSet(LS + collection, local);
      if (this.mode === "db") this.setDoc(collection + "/" + id, body);
    },
    async remove(collection, id) {
      const local = lsGet(LS + collection, {});
      delete local[id];
      lsSet(LS + collection, local);
      if (this.mode === "db") {
        try { await this.db.doc(collection + "/" + id).delete(); } catch { /* best effort */ }
      }
    },
  };

  // ---------------------------------------------------------------- state
  const defaultProfile = () => ({
    v: 1,
    examDate: DEFAULT_EXAM_DATE,
    examBooked: false,
    dailyGoal: 30,
    selfRatings: {},
    notes: {},
    scores: [],
    confirm: true,
    trackerSummary: "",
    updatedAt: 0,
  });

  const S = {
    tab: "today",
    profile: defaultProfile(),
    progress: { p: {}, days: {}, updatedAt: 0 },
    sessions: [],
    flags: {},
    generated: [],
    mock: null,          // a mock exam in progress
    mockStamp: 0,        // when the mock record was last written
    run: null,           // a practice session in progress
    arc: null,           // an Arcade game in progress, or its result screen
    game: null,          // XP, badges and Arcade records (set below)
    result: null,        // the last finished practice session, for its results screen
    mockResult: null,    // the last finished mock, for its score report
    sub: null,           // sub-view within a tab
    sample: null,        // Claude, when the viewer allows it
    ask: null,           // the Ask Claude panel's state
    tool: {},            // transient form state
  };

  const DRILLS = BANK.drills;
  const defaultGame = () => ({ v: 1, xp: 0, badges: {}, best: {}, daily: {}, calib: {}, recall: [0, 0], elim: [0, 0], seq: {}, match: {}, resetAt: 0, updatedAt: 0 });
  S.game = defaultGame();

  const allQuestions = () => CURATED.concat(S.generated);
  const byId = (id) => QINDEX.get(id) || S.generated.find((q) => q.id === id);
  const QINDEX = new Map(CURATED.map((q) => [q.id, q]));

  function saveProfile() {
    S.profile.updatedAt = Date.now();
    Store.setDoc("me/profile", S.profile);
  }
  function saveProgress() {
    S.progress.updatedAt = Date.now();
    Store.setDoc("me/progress", S.progress);
  }
  function saveMock() {
    S.mockStamp = Date.now();
    Store.setDoc("me/mock", { state: S.mock, updatedAt: S.mockStamp });
  }
  function saveRun() {
    lsSet(LS + "run", S.run);
  }
  function saveGame() {
    S.game.updatedAt = Date.now();
    Store.setDoc("me/game", S.game);
  }
  function saveArc() {
    lsSet(LS + "arc", S.arc);
  }

  // Merge two progress records, keeping the more recent answer for each question.
  function mergeProgress(a, b) {
    const out = { p: { ...(a?.p || {}) }, days: { ...(a?.days || {}) }, updatedAt: Math.max(a?.updatedAt || 0, b?.updatedAt || 0) };
    for (const [id, r] of Object.entries(b?.p || {})) {
      if (!out.p[id] || (r[4] || 0) > (out.p[id][4] || 0)) out.p[id] = r;
    }
    for (const [day, v] of Object.entries(b?.days || {})) {
      const cur = out.days[day];
      if (!cur || v[0] > cur[0]) out.days[day] = v;
    }
    return out;
  }

  async function loadAll() {
    const [profile, progress, mock, game, oracle, sessions, flags, generated] = await Promise.all([
      Store.getDoc("me/profile"),
      Store.getDoc("me/progress"),
      Store.getDoc("me/mock"),
      Store.getDoc("me/game"),
      Store.getDoc("me/oracle"),
      Store.list("sessions"),
      Store.list("flags"),
      Store.list("gen"),
    ]);
    return { profile, progress, mock, game, oracle, sessions, flags, generated };
  }

  function applyLoaded(data, { fromDb = false } = {}) {
    if (data.profile && (data.profile.updatedAt || 0) >= (S.profile.updatedAt || 0)) {
      S.profile = { ...defaultProfile(), ...data.profile };
    }
    if (data.progress) S.progress = mergeProgress(S.progress, data.progress);
    if (data.game) {
      // Figures only grow, so two copies merge by taking the larger of each,
      // unless one copy was reset after the other was last written.
      const cur = S.game, g = data.game;
      if ((g.resetAt || 0) > (cur.updatedAt || 0)) S.game = { ...defaultGame(), ...g };
      else if (!((cur.resetAt || 0) > (g.updatedAt || 0))) S.game = { ...defaultGame(), ...Engine.mergeGame(cur, g) };
    }
    if (data.oracle) {
      const cur = S.oracle, o = data.oracle;
      if ((o.resetAt || 0) > (cur.updatedAt || 0)) S.oracle = { ...defaultOracle(), ...o };
      else if (!((cur.resetAt || 0) > (o.updatedAt || 0))) S.oracle = { ...defaultOracle(), ...Engine.mergeOracle(cur, o) };
    }
    // The newest mock record wins, including "no mock in progress" from another device.
    if (data.mock && (data.mock.updatedAt || 0) > (S.mockStamp || 0)) {
      S.mockStamp = data.mock.updatedAt || 0;
      const st = data.mock.state;
      S.mock = st && !st.finished ? st : null;
    }
    const sessionMap = new Map(S.sessions.map((s) => [s.id, s]));
    for (const s of data.sessions || []) if (s && s.id) sessionMap.set(s.id, s);
    S.sessions = [...sessionMap.values()].sort((a, b) => b.startedAt - a.startedAt);
    for (const f of data.flags || []) if (f && f.id) S.flags[f.id] = f;
    const genMap = new Map(S.generated.map((q) => [q.id, q]));
    for (const q of data.generated || []) if (q && q.id && validGenerated(q)) genMap.set(q.id, q);
    S.generated = [...genMap.values()];
    if (fromDb) {
      // First connection on a device that practised before: carry its local record up.
      saveProgress();
      saveProfile();
      saveGame();
      saveOracle();
    }
  }

  // ---------------------------------------------------------------- stats
  const curatedStats = () => Engine.domainStats(CURATED, S.progress.p, DOMAINS);
  function examTime() { return parseDate(S.profile.examDate); }
  function daysLeft() {
    const t = examTime();
    return t ? Math.ceil((t - Date.now()) / DAY) : null;
  }
  function today() {
    return S.progress.days[todayKey()] || [0, 0];
  }
  function countAnswer(correct) {
    const k = todayKey();
    const v = S.progress.days[k] || [0, 0];
    S.progress.days[k] = [v[0] + 1, v[1] + (correct ? 1 : 0)];
  }
  function streak() {
    let n = 0;
    let t = Date.now();
    if (!S.progress.days[todayKey(t)]) t -= DAY;
    while (S.progress.days[todayKey(t)]) { n++; t -= DAY; }
    return n;
  }

  // Objectives where your latest answers are weakest, among those with at least two answered.
  function weakObjectives(limit = 6) {
    const by = {};
    for (const q of CURATED) {
      const r = S.progress.p[q.id];
      if (!r) continue;
      const v = by[q.obj] || (by[q.obj] = { obj: q.obj, seen: 0, right: 0 });
      v.seen++;
      v.right += r[3];
    }
    return Object.values(by)
      .filter((v) => v.seen >= 2 && v.right / v.seen < READY_TARGET)
      .sort((a, b) => a.right / a.seen - b.right / b.seen || b.seen - a.seen)
      .slice(0, limit);
  }

  function weakList(list) {
    return `<div class="menu">${list.map((v) => `<button type="button" data-act="start-objective" data-obj="${v.obj}">
      <span class="title"><span class="mono">${v.obj}</span> ${esc(objName(v.obj))}</span>
      <span class="detail num">${v.right} of ${v.seen} right on your latest try</span>
      <span class="side">Drill ›</span></button>`).join("")}</div>`;
  }

  // ---------------------------------------------------------------- render shell
  function render() {
    const view = $("#view");
    const focus = (S.tab === "practice" && ((S.arc && !S.arc.done) || (!S.arc && S.run && !S.run.done)))
      || (S.tab === "mock" && S.mock && !S.mock.finished && !S.mock.paused)
      || (S.tab === "oracle" && (S.orc.view === "prophecy" || (S.orc.view === "shadow" && !(S.orc.shadow && S.orc.shadow.done))));
    document.body.classList.toggle("focus-mode", !!focus);
    $("#tabbar").hidden = !!focus;
    document.querySelectorAll(".tabbar button").forEach((b) => {
      if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    const left = daysLeft();
    const cd = $("#countdown");
    if (left != null && left >= 0) {
      cd.hidden = false;
      cd.textContent = left === 0 ? "Exam day" : `${left} day${left === 1 ? "" : "s"} to exam`;
    } else cd.hidden = true;

    let html = "";
    if (S.tab === "today") html = viewToday();
    else if (S.tab === "practice") html = S.arc ? viewArc() : S.run ? (S.run.done ? viewResults() : viewQuestion()) : practiceMode() === "arcade" ? viewArcadeMenu() : viewPracticeMenu();
    else if (S.tab === "mock") html = S.mockResult ? viewMockResult() : S.mock ? (S.mock.paused ? viewMockPaused() : viewMockItem()) : viewMockMenu();
    else if (S.tab === "oracle") html = viewOracle();
    else if (S.tab === "tracker") html = viewTracker();
    else if (S.tab === "library") html = viewLibrary();
    view.innerHTML = html;
    afterRender();
  }

  function afterRender() {
    clearInterval(S.clockTimer);
    if (S.tab === "mock" && S.mock && !S.mock.paused && !S.mockResult) {
      S.clockTimer = setInterval(tickClock, 1000);
      tickClock();
    }
    if (S.tab === "practice" && S.arc && S.arc.mode === "pace" && !S.arc.done) {
      S.clockTimer = setInterval(tickArcClock, 1000);
      tickArcClock();
    }
  }

  function go(tab) {
    S.tab = tab;
    S.sub = null;
    S.ask = null;
    lsSet(LS + "tab", tab);
    render();
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- Today
  function ring(value, size = 64, stroke = 7) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const v = Math.max(0, Math.min(1, value));
    return `<svg class="goal-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>`;
  }

  function heatStrip(stats, act = "domain-practice") {
    return `<div class="heat">${stats.map((s) => {
      // One or two answers say little, so a tile shows a count until it has three.
      const lv = s.seen >= 3 ? level(s.firstRate, s.seen) : "none";
      return `<button type="button" class="lvl-${lv}" data-act="${act}" data-d="${s.n}" title="${esc(domainOf(s.n).name)}">
        <span class="d">D${s.n}</span>
        <span class="v">${s.seen >= 3 ? pct(s.firstRate) : s.seen ? `${Math.round(s.firstRate * s.seen)}/${s.seen}` : "–"}</span>
        <span class="bar"><span style="width:${Math.round(s.coverage * 100)}%"></span></span>
      </button>`;
    }).join("")}</div>`;
  }

  function viewToday() {
    const stats = curatedStats();
    const rd = Engine.readiness(stats);
    const t = today();
    const goal = S.profile.dailyGoal || 30;
    const due = Object.values(S.progress.p).filter((r) => r[6] <= Date.now()).length;
    const exam = examTime();
    const plan = exam ? Engine.studyPlan(exam, stats, S.profile.selfRatings) : null;
    const week = plan && plan.weeks[0];
    const lastMock = S.sessions.find((s) => s.kind === "mock");
    const started = rd.seen > 0;
    const left = daysLeft();
    const st = streak();

    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">${fmtDate(Date.now(), { weekday: "long", month: "long", day: "numeric" })}</p>
        <h2>${left == null ? "Set your exam date to get a plan." : left > 0 ? `${left} days until ${S.profile.examBooked ? "your exam" : "your end-of-year target"}` : left === 0 ? "Exam day. Read the questions twice, answer once." : "Your exam date has passed. Set the next one in Tracker."}</h2>
        ${week ? `<p class="muted">This week: ${week.focus.map((n) => `<b>D${n}</b> ${esc(domainOf(n).short)}`).join(" and ")}. ${esc(week.note)}</p>` : ""}
      </section>

      ${todayOracle()}

      <section class="card raised stack">
        <div class="goal">
          ${ring(t[0] / goal)}
          <div class="grow stack-sm">
            <h3>Today's practice</h3>
            <p class="muted small num">${t[0] >= goal ? `Goal met: ${t[0]} answered` : `${t[0]} of ${goal} answered`}${t[0] ? ` · ${pct(t[1] / t[0])} right` : ""}${due ? ` · ${due} due for review` : ""}${st > 1 ? ` · ${st}-day streak` : ""}</p>
          </div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary btn-wide" data-act="start-smart" data-count="${Math.max(10, Math.min(goal - t[0] > 0 ? goal - t[0] : 15, 50))}">
            Start smart session
          </button>
          <button type="button" class="btn" data-act="start-smart" data-count="10">Quick 10</button>
        </div>
        <p class="small muted">Smart sessions bring back what you missed, then lean on the domains where your first-try accuracy is lowest, weighted by how much each domain counts on the exam.</p>
      </section>

      <section class="stack">
        <div class="spread"><h3>Readiness</h3><button type="button" class="btn-quiet btn" data-act="tab" data-tab="tracker">Details</button></div>
        <div class="card ready">
          <div class="ready-figure">${started ? Math.round(rd.score * 100) : "–"}<small>${started ? "%" : ""}</small></div>
          <div class="stack-sm">
            <p class="small"><b>First-try accuracy</b>, weighted by the exam's domain weights. Aim for ${Math.round(READY_TARGET * 100)}% or better across every domain before you sit.</p>
            <div class="meter" aria-hidden="true"><span style="width:${started ? Math.round(rd.score * 100) : 0}%"></span><i class="mark" style="left:${READY_TARGET * 100}%"></i></div>
            <div class="meter-legend"><span>0</span><span>target ${Math.round(READY_TARGET * 100)}%</span><span>100</span></div>
            <p class="small muted num">${rd.seen} of ${CURATED.length} questions seen (${pct(rd.coverage)} of the bank)</p>
          </div>
        </div>
        ${heatStrip(stats)}
        <p class="small muted">Each tile is a domain's first-try accuracy; the thin bar under it is how much of that domain you have covered. Tap one to drill it.</p>
      </section>
      ${todayArcade()}
      ${(() => { const w = weakObjectives(3); return w.length ? `<section class="stack"><h3>Weakest objectives</h3>${weakList(w)}</section>` : ""; })()}

      <section class="stack">
        <h3>Mock exam</h3>
        ${lastMock ? `<div class="card spread">
            <div class="stack-sm"><p class="eyebrow">${fmtDate(lastMock.startedAt)} · ${lastMock.total} items</p>
            <p><span class="chip ${lastMock.pass ? "good" : "bad"}">${lastMock.pass ? "PASS" : "FAIL"} estimate</span> <b class="num">${lastMock.scaled}</b> <span class="muted">/ 1000</span></p></div>
            <button type="button" class="btn" data-act="tab" data-tab="mock">New mock</button>
          </div>`
          : `<div class="card stack-sm"><p>No mock yet. The adaptive mock behaves like the real exam: 100 to 150 items in 3 hours, no going back, and it stops once it is sure of the result.</p><div><button type="button" class="btn" data-act="tab" data-tab="mock">See mock options</button></div></div>`}
      </section>
      ${!started ? `<section class="note">New here? Read <a href="#" data-act="lib" data-sub="mindset">How to think like a CISSP</a> first, then start a smart session. If you kept a study tracker elsewhere, paste it into <a href="#" data-act="tab" data-tab="tracker">Tracker › Import</a>.</section>` : ""}
    </div>`;
  }

  // ---------------------------------------------------------------- Practice menu
  function viewPracticeMenu() {
    const t = S.tool;
    t.domains = t.domains || [];
    t.count = t.count || 20;
    const missed = Object.entries(S.progress.p).filter(([id, r]) => r[3] === 0 && byId(id)).length;
    const flagged = Object.keys(S.flags).filter((id) => byId(id)).length;
    const due = Object.values(S.progress.p).filter((r) => r[6] <= Date.now()).length;
    const stats = curatedStats();
    return `<div class="stack-lg">
      ${practiceHeader()}

      <div class="menu">
        <button type="button" data-act="start-smart" data-count="${S.profile.dailyGoal || 30}">
          <span class="title">Smart session</span><span class="detail">Due reviews first, then your weakest heavy domains</span><span class="side">${S.profile.dailyGoal || 30}</span>
        </button>
        <button type="button" data-act="start-review" ${due ? "" : "disabled"}>
          <span class="title">Due for review</span><span class="detail">Spaced repetition: questions whose interval has come round</span><span class="side">${due}</span>
        </button>
        <button type="button" data-act="start-missed" ${missed ? "" : "disabled"}>
          <span class="title">Missed last time</span><span class="detail">Every question your latest answer got wrong</span><span class="side">${missed}</span>
        </button>
        <button type="button" data-act="start-flagged" ${flagged ? "" : "disabled"}>
          <span class="title">Flagged</span><span class="detail">Questions you marked to revisit or dispute</span><span class="side">${flagged}</span>
        </button>
      </div>

      <section class="card stack">
        <h3>Choose domains</h3>
        <div class="checks">${DOMAINS.map((d) => `<button type="button" class="check" data-act="toggle-domain" data-d="${d.n}" aria-pressed="${t.domains.includes(d.n)}"><span class="mono">D${d.n}</span> ${esc(d.short)}</button>`).join("")}</div>
        <div class="spread">
          <div class="seg" role="group" aria-label="Number of questions">${[10, 20, 40, 60].map((n) => `<button type="button" data-act="set-count" data-n="${n}" aria-pressed="${t.count === n}">${n}</button>`).join("")}</div>
          <button type="button" class="btn btn-primary" data-act="start-domains" ${t.domains.length ? "" : "disabled"}>Start</button>
        </div>
        <p class="small muted">Questions you have not seen come first; the set spreads across each domain's objectives.</p>

  function freshPanel(stats) {
    const gen = S.generated.length;
    const weakest = stats.slice().sort((a, b) => a.smoothed - b.smoothed)[0];
    const t = S.tool;
    t.genDomain = t.genDomain || (weakest ? weakest.n : 1);
    const d = domainOf(t.genDomain);
    return `<section class="card stack" id="fresh">
      <div class="spread"><h3>Fresh questions from Claude</h3><span class="chip ochre">${gen} saved</span></div>
      <p class="small muted">Claude writes five new questions on a domain, aimed at the objectives you have practised least. They are marked as AI-written, kept out of mock exams, and you can flag any you disagree with.</p>
      ${S.sample ? `
        <div class="field"><label for="gen-domain">Domain</label>
          <select id="gen-domain" data-field="genDomain">${DOMAINS.map((x) => `<option value="${x.n}" ${x.n === t.genDomain ? "selected" : ""}>D${x.n} ${esc(x.name)}</option>`).join("")}</select>
        </div>
        <div class="field"><label for="gen-obj">Objective</label>
          <select id="gen-obj" data-field="genObj"><option value="">Least practised in ${esc(d.short)}</option>${Object.entries(d.objectives).map(([k, v]) => `<option value="${k}" ${t.genObj === k ? "selected" : ""}>${k} ${esc(v)}</option>`).join("")}</select>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" data-act="generate" ${t.generating ? "disabled" : ""}>${t.generating ? "Writing questions…" : "Write 5 questions"}</button>
          ${gen ? `<button type="button" class="btn" data-act="start-generated">Practise saved (${gen})</button>` : ""}
        </div>
        ${t.genMsg ? `<p class="small ${t.genErr ? "note bad" : "muted"}">${esc(t.genMsg)}</p>` : ""}
      ` : `<p class="note small">Available when you open this page in Claude and allow it to use Claude. ${gen ? `<button type="button" class="btn btn-sm" data-act="start-generated">Practise saved (${gen})</button>` : ""}</p>`}
    </section>`;
  }

  // ---------------------------------------------------------------- sessions
  function startRun(items, title) {
    if (!items.length) {
      toast("No questions match that selection yet.");
      return;
    }
    S.run = {
      id: uid(),
      title,
      items: items.map((q) => q.id),
      orders: Object.fromEntries(items.map((q) => [q.id, Engine.shuffle([0, 1, 2, 3])])),
      idx: 0,
      answers: [],
      selected: null,
      submitted: false,
      shownAt: Date.now(),
      startedAt: Date.now(),
      done: false,
    };
    S.ask = null;
    saveRun();
    go("practice");
  }

  function startSmart(count, opts = {}) {
    const items = Engine.smartSet(allQuestions(), S.progress.p, DOMAINS, count, { selfRatings: S.profile.selfRatings, ...opts });
    startRun(items, opts.reviewOnly ? "Review" : opts.domains ? "Domain practice" : "Smart session");
  }

  function currentQ() {
    const r = S.run;
    return r ? byId(r.items[r.idx]) : null;
  }

  function diffDots(n) {
    return `<span class="dots" title="${["", "Easier", "Medium", "Harder"][n]}">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  }

  function optionList(q, order, { selected, submitted, chosenOrig, interactive = true, act = "select", struck = [], lockStruck = false }) {
    return `<ol class="options">${order.map((orig, pos) => {
      const text = q.o[orig][0];
      // The tag already says which answer is correct, so the explanation's own "Correct." is dropped.
      const why = orig === q.a ? q.o[orig][1].replace(/^Correct\.\s*/, "") : q.o[orig][1];
      const letter = "ABCD"[pos];
      let cls = "", tag = "";
      const isStruck = struck.includes(orig);
      if (submitted) {
        if (orig === q.a) { cls = "is-right"; tag = orig === chosenOrig ? "Your answer · correct" : isStruck ? "Correct answer · you struck it" : "Correct answer"; }
        else if (orig === chosenOrig) { cls = "is-wrong"; tag = "Your answer"; }
        else { cls = "is-other"; tag = isStruck ? "Struck · rightly" : "Not the best"; }
      } else if (isStruck) cls = "is-struck";
      const live = !submitted && interactive && !(lockStruck && isStruck);
      return `<li><button type="button" class="opt ${cls}" ${live ? `data-act="${act}" data-pos="${pos}"` : "disabled"} aria-pressed="${!submitted && (selected === pos || (!lockStruck && isStruck))}">
        <span class="letter">${letter}</span>
        <span>${esc(text)}</span>
        ${submitted ? `<span class="why"><span class="tagline">${tag}</span>${esc(why)}</span>` : ""}
      </button></li>`;
    }).join("")}</ol>`;
  }

  function viewQuestion() {
    const r = S.run;
    const q = currentQ();
    if (!q) { S.run = null; return viewPracticeMenu(); }
    const order = r.orders[q.id];
    const ans = r.submitted ? r.answers[r.answers.length - 1] : null;
    const total = r.items.length;
    const correctSoFar = r.answers.filter((a) => a.correct).length;
    const d = domainOf(q.d);
    return `<div class="stack">
      <div class="qhead">
        <div class="row"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span>${q.gen ? `<span class="chip ochre">AI-written</span>` : ""}${diffDots(q.diff)}</div>
        <span class="mono muted small num">${r.idx + 1} / ${total} · ${correctSoFar} right</span>
      </div>
      <div class="progress-line"><span style="width:${(100 * (r.idx + (r.submitted ? 1 : 0))) / total}%"></span></div>
      <p class="eyebrow">${esc(d.name)} · ${esc(objName(q.obj))}</p>
      <p class="stem">${esc(q.q)}</p>
      ${r.submitted ? `<div class="verdict ${ans.correct ? "good" : "bad"}">${ans.correct ? "Correct" : `Not quite. The answer is ${"ABCD"[order.indexOf(q.a)]}.`}</div>` : ""}
      ${optionList(q, order, { selected: r.selected, submitted: r.submitted, chosenOrig: ans ? ans.chosen : null })}
      ${r.submitted ? `
        <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
        ${askPanel(q, order, ans)}
        ${flagNote(q.id)}
      ` : ""}
    </div>
    <div class="actionbar"><div class="actionbar-inner">
      <button type="button" class="btn btn-quiet" data-act="end-run">End</button>
      <span class="grow"></span>
      ${r.submitted
        ? `<button type="button" class="btn btn-primary" data-act="next" style="min-width:150px">${r.idx + 1 < total ? "Next question" : "See results"}</button>`
        : `<button type="button" class="btn btn-primary" data-act="submit" style="min-width:150px" ${r.selected == null ? "disabled" : ""}>Check answer</button>`}
    </div></div>`;
  }

  function askPanel(q, order, ans) {
    if (!S.sample) return "";
    const a = S.ask && S.ask.qid === q.id ? S.ask : null;
    return `<section class="ask" aria-label="Ask Claude about this question">
      <div class="spread"><h3>Ask Claude</h3>${a && a.busy ? `<button type="button" class="btn btn-sm" data-act="ask-stop">Stop</button>` : ""}</div>
      ${a && (a.out || a.busy) ? `<div class="ask-out ${a.busy && !a.out ? "thinking" : ""}" id="ask-out">${a.out ? richText(a.out) : "Thinking…"}</div>` : ""}
      ${a && a.err ? `<p class="small note bad">${esc(a.err)}</p>` : ""}
      <div class="prompts">
        ${(ans.correct
          ? ["Why are the others worse?", "Give me a memory hook", "How would the exam twist this?"]
          : ["Why is my answer wrong?", "Explain it like a risk advisor", "Give me a memory hook"])
          .map((p) => `<button type="button" data-act="ask" data-prompt="${esc(p)}" ${a && a.busy ? "disabled" : ""}>${esc(p)}</button>`).join("")}
      </div>
      <div class="row">
        <input type="text" id="ask-input" class="grow" placeholder="Your own question about this item" data-field="askText" value="${esc(S.tool.askText || "")}" style="flex:1 1 200px">
        <button type="button" class="btn btn-sm" data-act="ask" ${a && a.busy ? "disabled" : ""}>Ask</button>
      </div>
    </section>`;
  }

  function submitAnswer() {
    const r = S.run;
    if (!r || r.submitted || r.selected == null) return;
    const q = currentQ();
    const chosen = r.orders[q.id][r.selected];
    const correct = chosen === q.a;
    r.answers.push({ id: q.id, chosen, correct, ms: Date.now() - r.shownAt });
    r.submitted = true;
    S.progress.p[q.id] = Engine.record(S.progress.p[q.id], correct, Date.now());
    countAnswer(correct);
    saveProgress();
    saveRun();
    reward(Engine.xpFor(correct, q.diff));
    render();
  }

  function nextQuestion() {
    const r = S.run;
    if (!r) return;
    S.ask = null;
    S.tool.askText = "";
    if (r.idx + 1 >= r.items.length) {
      finishRun();
      return;
    }
    r.idx += 1;
    r.selected = null;
    r.submitted = false;
    r.shownAt = Date.now();
    saveRun();
    render();
    window.scrollTo(0, 0);
  }

  function finishRun() {
    const r = S.run;
    if (!r) return;
    r.done = true;
    if (r.answers.length) {
      const session = {
        id: r.id,
        kind: "practice",
        title: r.title,
        startedAt: r.startedAt,
        endedAt: Date.now(),
        total: r.answers.length,
        correct: r.answers.filter((a) => a.correct).length,
        items: r.answers.map((a) => [a.id, a.correct ? 1 : 0, a.chosen, Math.round(a.ms / 1000)]),
      };
      S.sessions.unshift(session);
      Store.put("sessions", session.id, session);
    }
    saveRun();
    render();
    window.scrollTo(0, 0);
  }

  function viewResults() {
    const r = S.run;
    const n = r.answers.length;
    const right = r.answers.filter((a) => a.correct).length;
    const byD = {};
    for (const a of r.answers) {
      const q = byId(a.id);
      if (!q) continue;
      const v = byD[q.d] || (byD[q.d] = [0, 0]);
      v[0]++;
      if (a.correct) v[1]++;
    }
    const missed = r.answers.filter((a) => !a.correct);
    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">${esc(r.title)} · finished</p>
        <h2 class="num">${n ? `${right} of ${n} right (${pct(right / n)})` : "No questions answered"}</h2>
        ${n ? `<p class="muted">${right / n >= READY_TARGET ? "That is at or above the 75% mark that suggests exam readiness on fresh questions." : "Missed questions come back tomorrow in your smart session."}</p>` : ""}
      </section>
      ${n ? `<div class="table-wrap"><table>
        <thead><tr><th>Domain</th><th class="n">Right</th><th class="n">%</th></tr></thead>
        <tbody>${Object.entries(byD).sort((a, b) => a[0] - b[0]).map(([d, v]) => `<tr><td><span class="mono">D${d}</span> ${esc(domainOf(Number(d)).short)}</td><td class="n">${v[1]} / ${v[0]}</td><td class="n">${pct(v[1] / v[0])}</td></tr>`).join("")}</tbody>
      </table></div>` : ""}
      ${missed.length ? `<section class="stack">
        <h3>Key points from your misses</h3>
        <div class="card">${missed.map((a) => {
          const q = byId(a.id);
          return q ? `<div class="kp"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span><p>${esc(q.k)}</p><button type="button" class="btn-quiet btn" style="justify-self:start" data-act="study" data-id="${q.id}">Review question</button></div>` : "";
        }).join("")}</div>
      </section>` : ""}
      <div class="row">
        <button type="button" class="btn btn-primary" data-act="close-run">Done</button>
        ${missed.length ? `<button type="button" class="btn" data-act="retry-missed">Retry the ${missed.length} missed</button>` : ""}
      </div>
    </div>`;
  }

  // A read-only look at a question with its answer and every explanation.
  function viewStudy(q, back) {
    return `<div class="stack">
      <button type="button" class="btn btn-quiet" style="align-self:flex-start" data-act="${back.act}" ${back.attrs || ""}>‹ ${esc(back.label)}</button>
      <div class="row"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span><span class="mono small muted">${esc(q.id)}</span>${diffDots(q.diff)}</div>
      <p class="eyebrow">${esc(objName(q.obj))}</p>
      <p class="stem">${esc(q.q)}</p>
      ${optionList(q, Engine.shuffle([0, 1, 2, 3], Engine.seeded(q.id)), { submitted: true, chosenOrig: null, interactive: false })}
      <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
      ${flagNote(q.id)}
    </div>`;
  }

  // Flagging, with an optional note on why: "answer looks wrong", "unclear wording", "review later".
  function flagNote(id) {
    const f = S.flags[id];
    return `<div class="stack-sm">
      <div class="row"><button type="button" class="btn btn-sm" data-act="flag" data-id="${esc(id)}">${f ? "Flagged ✓ (tap to remove)" : "Flag this question"}</button></div>
      ${f ? `<input type="text" data-field="flagNote" data-id="${esc(id)}" value="${esc(f.note || "")}" placeholder="Why? For example: the answer looks wrong, or review before the exam" aria-label="Reason for flagging">` : ""}
    </div>`;
  }

  // ---------------------------------------------------------------- Ask Claude
  function askPrompt(q, order, ans, userText) {
    const lines = order.map((orig, pos) => `${"ABCD"[pos]}) ${q.o[orig][0]}\n   Explanation: ${q.o[orig][1]}`).join("\n");
    const keyLetter = "ABCD"[order.indexOf(q.a)];
    const chosenLetter = "ABCD"[order.indexOf(ans.chosen)];
    return `You are a CISSP tutor helping a working security professional prepare for the ISC2 CISSP exam (2024 outline). Use ISC2 and Official Study Guide terminology. Think like a risk advisor to senior management, as the exam expects.

Practice question (${domainOf(q.d).name}, objective ${q.obj} ${objName(q.obj)}):
${q.q}

${lines}

Keyed answer: ${keyLetter}. The learner chose ${chosenLetter} (${ans.correct ? "correct" : "incorrect"}).
Key point: ${q.k}

The learner asks: ${userText}

Answer in at most 180 words of plain prose (short paragraphs or a few "- " bullets, no headings). Be concrete and exam-focused. If you believe the keyed answer is debatable, say so plainly and explain which answer ISC2 would most likely expect and why.`;
  }

  async function askClaude(text) {
    const q = currentQ() || (S.sub && S.sub.qid ? byId(S.sub.qid) : null);
    const r = S.run;
    if (!q || !S.sample || !r) return;
    const order = r.orders[q.id];
    const ans = r.answers[r.answers.length - 1];
    const prompt = (text || S.tool.askText || "").trim();
    if (!prompt) { toast("Type a question or pick one of the suggestions."); return; }
    if (S.ask && S.ask.ctl) S.ask.ctl.abort();
    const ctl = new AbortController();
    S.ask = { qid: q.id, busy: true, out: "", err: "", ctl };
    S.tool.askText = "";
    render();
    try {
      await S.sample(askPrompt(q, order, ans, prompt), {
        signal: ctl.signal,
        onText: ({ text: t }) => {
          if (S.ask && S.ask.ctl === ctl) {
            S.ask.out = t;
            const out = $("#ask-out");
            if (out) { out.classList.remove("thinking"); out.innerHTML = richText(t); }
          }
        },
      });
      if (S.ask && S.ask.ctl === ctl) S.ask.busy = false;
    } catch (e) {
      if (!S.ask || S.ask.ctl !== ctl) return;
      S.ask.busy = false;
      S.ask.out = e && e.text ? e.text : S.ask.out;
      S.ask.err = sampleError(e);
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
    }
    render();
  }

  function sampleError(e) {
    const code = e && e.code;
    if (code === "cancelled") return "";
    if (code === "rate_limited") return "Claude is busy or your usage limit was reached. Try again in a little while.";
    if (code === "session_expired") return "Your Claude session expired. Sign in again, then retry.";
    if (code === "refused") return "Claude declined that request. Try rephrasing it.";
    if (code === "invalid_json") return "Claude's reply could not be read as data. Try again.";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) return "Claude isn't available on this page right now.";
    return "Something went wrong reaching Claude. Try again.";
  }

  // ---------------------------------------------------------------- Fresh questions
  function validGenerated(q) {
    return q && typeof q.q === "string" && q.q.length > 20 && Array.isArray(q.o) && q.o.length === 4 &&
      q.o.every((o) => Array.isArray(o) && typeof o[0] === "string" && typeof o[1] === "string" && o[0] && o[1]) &&
      Number.isInteger(q.a) && q.a >= 0 && q.a < 4 && DOMAINS[q.d - 1] && DOMAINS[q.d - 1].objectives[q.obj] && typeof q.k === "string";
  }

  async function generate() {
    const t = S.tool;
    if (!S.sample || t.generating) return;
    const d = domainOf(Number(t.genDomain) || 1);
    let obj = t.genObj;
    if (!obj) {
      const seenBy = {};
      for (const q of allQuestions()) if (q.d === d.n && S.progress.p[q.id]) seenBy[q.obj] = (seenBy[q.obj] || 0) + 1;
      const objs = Object.keys(d.objectives);
      obj = objs.sort((a, b) => (seenBy[a] || 0) - (seenBy[b] || 0))[0];
    }
    const existing = allQuestions().filter((q) => q.obj === obj).map((q) => "- " + q.q.split("\n")[0].slice(0, 140)).slice(0, 40).join("\n");
    const prompt = `Write 5 original ISC2 CISSP practice questions for objective ${obj} "${d.objectives[obj]}" in Domain ${d.n} ${d.name} (CISSP exam outline effective April 15, 2024).

Requirements:
- Scenario-based where possible, at the depth of the real exam; use qualifiers like BEST, FIRST, MOST or PRIMARY where they fit, and think like a risk advisor to senior management.
- Exactly four options, one unambiguously best answer by ISC2 / Official Study Guide reasoning, plausible distractors, no "all/none of the above", options of similar length.
- Every option gets a one- or two-sentence explanation of why it is right or wrong.
- A one-sentence takeaway that states the rule to remember.
- Vary the position of the correct answer.
- Do not repeat these existing questions:
${existing || "(none)"}

Reply with only a JSON array of 5 objects shaped like:
{"q": "question stem", "options": [{"t": "option text", "why": "explanation"}, {"t": "...", "why": "..."}, {"t": "...", "why": "..."}, {"t": "...", "why": "..."}], "answer": 0, "difficulty": 2, "takeaway": "rule to remember"}
where "answer" is the 0-based index of the correct option and "difficulty" is 1 (easier), 2 or 3 (harder).`;
    t.generating = true;
    t.genMsg = "Claude is writing five questions. This usually takes under a minute.";
    t.genErr = false;
    render();
    try {
      const out = await S.sample.json(prompt, { modelTier: "complex", cache: false });
      const list = Array.isArray(out) ? out : Array.isArray(out && out.questions) ? out.questions : [];
      const made = [];
      for (const raw of list) {
        const q = {
          id: "G-" + uid(),
          gen: true,
          d: d.n,
          obj,
          diff: [1, 2, 3].includes(Number(raw && raw.difficulty)) ? Number(raw.difficulty) : 2,
          q: String((raw && raw.q) || "").trim(),
          o: Array.isArray(raw && raw.options) ? raw.options.map((o) => [String((o && o.t) || "").trim(), String((o && o.why) || "").trim()]) : [],
          a: Number(raw && raw.answer),
          k: String((raw && raw.takeaway) || "").trim(),
          createdAt: Date.now(),
        };
        if (validGenerated(q)) {
          made.push(q);
          S.generated.push(q);
          Store.put("gen", q.id, q);
        }
      }
      t.generating = false;
      if (made.length) {
        t.genMsg = `Saved ${made.length} new question${made.length === 1 ? "" : "s"} on ${obj}.`;
        startRun(made, `Fresh questions · ${obj}`);
        return;
      }
      t.genMsg = "Claude's reply didn't contain usable questions. Try again.";
      t.genErr = true;
    } catch (e) {
      t.generating = false;
      t.genMsg = sampleError(e) || "Stopped.";
      t.genErr = true;
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
    }
    render();
  }

  // ---------------------------------------------------------------- Mock exam
  function viewMockMenu() {
    const mocks = S.sessions.filter((s) => s.kind === "mock");
    return `<div class="stack-lg">
      <section class="stack-sm">
        <h2>Mock exam</h2>
        <p class="muted measure">An adaptive exam built like the real English CISSP: each answer sets the difficulty of the next item, there is no going back and no feedback until the end, and it stops once it is 95% sure whether you are above or below the passing line.</p>
      </section>
      <div class="menu">
        ${Object.entries(Engine.FORMS).map(([key, f]) => `<button type="button" data-act="start-mock" data-form="${key}">
          <span class="title">${esc(f.label)}</span><span class="detail">${f.min}–${f.max} items · ${f.minutes >= 60 ? f.minutes / 60 + " hours" : f.minutes + " minutes"}${key === "half" ? " · a lunch-break version" : " · the real exam's length"}</span><span class="side">${f.min}–${f.max}</span>
        </button>`).join("")}
      </div>
      <section class="note small stack-sm">
        <p><b>How the result is estimated.</b> Each question's difficulty rating places it on an ability scale, your ability estimate updates after every answer, and the score is shown on the 0–1000 scale with 700 as the pass mark. The line sits where you would get about 71% of medium questions right. It is a practice estimate, not ISC2's own scoring.</p>
        <p>Mock items are picked from questions you have not practised where possible, so a fresh mock is a fair test. Your answers also count toward your practice record.</p>
      </section>
      ${mocks.length ? `<section class="stack"><h3>Past mocks</h3>
        <div class="table-wrap"><table><thead><tr><th>Date</th><th>Form</th><th class="n">Items</th><th class="n">Score</th><th>Result</th></tr></thead><tbody>
        ${mocks.map((m) => `<tr><td>${fmtDate(m.startedAt)}</td><td>${esc(m.form === "half" ? "Half" : "Full")}</td><td class="n">${m.total}</td><td class="n">${m.scaled}</td><td><span class="chip ${m.pass ? "good" : "bad"}">${m.pass ? "PASS" : "FAIL"}</span> <button type="button" class="btn-quiet btn btn-sm" data-act="open-mock" data-id="${m.id}">Report</button></td></tr>`).join("")}
        </tbody></table></div></section>` : ""}
    </div>`;
  }

  function startMock(formKey) {
    const form = Engine.FORMS[formKey];
    S.mock = {
      id: uid(),
      form: formKey,
      startedAt: Date.now(),
      elapsed: 0,
      resumedAt: Date.now(),
      paused: false,
      used: [],
      responses: [],
      current: null,
      selected: null,
      finished: false,

  function mockElapsed(m) {

  }

  function nextMockItem() {
    const m = S.mock;
    const q = Engine.nextCatItem(CURATED, m.used, m.responses, DOMAINS, S.progress.p);

    m.used.push(q.id);
    m.current = { id: q.id, order: Engine.shuffle([0, 1, 2, 3]), shownAt: Date.now() };
    m.selected = null;
  }

  function viewMockItem() {
    const m = S.mock;

    const q = byId(m.current.id);
    const n = m.responses.length + 1;

      <div class="examhead">
        <span class="mono small"><b>Item ${n}</b> <span class="muted">of ${form.min}–${form.max}</span></span>

      ${optionList(q, m.current.order, { selected: m.selected, submitted: false, act: "mock-select" })}

    <div class="actionbar"><div class="actionbar-inner">

    </div></div>`;
