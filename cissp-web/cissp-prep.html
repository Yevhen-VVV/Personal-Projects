    while (S.progress.days[todayKey(t)]) { n++; t -= DAY; }
    return n;
  }

  // Objectives where your latest answers are weakest, among those with at least two answered.
  function weakObjectives(limit = 6) {
    const by = {};
    for (const q of CURATED) {
      const r = S.progress.p[q.id];
      if (!r) continue;
      const v = by[q.obj] || (by[q.obj] = { obj: q.obj, seen: 0, right: 0 });
      v.seen++;
      v.right += r[3];
    }
    return Object.values(by)
      .filter((v) => v.seen >= 2 && v.right / v.seen < READY_TARGET)
      .sort((a, b) => a.right / a.seen - b.right / b.seen || b.seen - a.seen)
      .slice(0, limit);
  }

  function weakList(list) {
    return `<div class="menu">${list.map((v) => `<button type="button" data-act="start-objective" data-obj="${v.obj}">
      <span class="title"><span class="mono">${v.obj}</span> ${esc(objName(v.obj))}</span>
      <span class="detail num">${v.right} of ${v.seen} right on your latest try</span>
      <span class="side">Drill ›</span></button>`).join("")}</div>`;
  }

  // ---------------------------------------------------------------- render shell
  const TAB_TITLES = { today: "Today", practice: "Practice", mock: "Mock exam", tracker: "Tracker", library: "Library" };

  function render() {
    const view = $("#view");
    const focus = (S.tab === "practice" && S.run && !S.run.done) || (S.tab === "mock" && S.mock && !S.mock.finished && !S.mock.paused);
    document.body.classList.toggle("focus-mode", !!focus);
    $("#tabbar").hidden = !!focus;
    document.querySelectorAll(".tabbar button").forEach((b) => {
      if (b.dataset.tab === S.tab) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    const left = daysLeft();
    const cd = $("#countdown");
    if (left != null && left >= 0) {
      cd.hidden = false;
      cd.textContent = left === 0 ? "Exam day" : `${left} day${left === 1 ? "" : "s"} to exam`;
    } else cd.hidden = true;

    let html = "";
    if (S.tab === "today") html = viewToday();
    else if (S.tab === "practice") html = S.run ? (S.run.done ? viewResults() : viewQuestion()) : viewPracticeMenu();
    else if (S.tab === "mock") html = S.mockResult ? viewMockResult() : S.mock ? (S.mock.paused ? viewMockPaused() : viewMockItem()) : viewMockMenu();
    else if (S.tab === "tracker") html = viewTracker();
    else if (S.tab === "library") html = viewLibrary();
    view.innerHTML = html;
    afterRender();
  }

  function afterRender() {
    clearInterval(S.clockTimer);
    if (S.tab === "mock" && S.mock && !S.mock.paused && !S.mockResult) {
      S.clockTimer = setInterval(tickClock, 1000);
      tickClock();
    }
  }

  function go(tab) {
    S.tab = tab;
    S.sub = null;
    S.ask = null;
    lsSet(LS + "tab", tab);
    render();
    window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- Today
  function ring(value, size = 64, stroke = 7) {
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const v = Math.max(0, Math.min(1, value));
    return `<svg class="goal-ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${(c * v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    </svg>`;
  }

  function heatStrip(stats, act = "domain-practice") {
    return `<div class="heat">${stats.map((s) => {
      const lv = level(s.firstRate, s.seen);
      return `<button type="button" class="lvl-${lv}" data-act="${act}" data-d="${s.n}" title="${esc(domainOf(s.n).name)}">
        <span class="d">D${s.n}</span>
        <span class="v">${s.seen ? pct(s.firstRate) : "–"}</span>
        <span class="bar"><span style="width:${Math.round(s.coverage * 100)}%"></span></span>
      </button>`;
    }).join("")}</div>`;
  }

  function viewToday() {
    const stats = curatedStats();
    const rd = Engine.readiness(stats);
    const t = today();
    const goal = S.profile.dailyGoal || 30;
    const due = Object.values(S.progress.p).filter((r) => r[6] <= Date.now()).length;

    const lastMock = S.sessions.find((s) => s.kind === "mock");
    const started = rd.seen > 0;
    const left = daysLeft();
    const st = streak();

    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">${fmtDate(Date.now(), { weekday: "long", month: "long", day: "numeric" })}</p>
        <h2>${left == null ? "Set your exam date to get a plan." : left > 0 ? `${left} days until ${S.profile.examBooked ? "your exam" : "your end-of-year target"}` : left === 0 ? "Exam day. Read the questions twice, answer once." : "Your exam date has passed. Set the next one in Tracker."}</h2>
        ${week ? `<p class="muted">This week: ${week.focus.map((n) => `<b>D${n}</b> ${esc(domainOf(n).short)}`).join(" and ")}. ${esc(week.note)}</p>` : ""}
      </section>

      <section class="card raised stack">
        <div class="goal">
          ${ring(t[0] / goal)}
          <div class="grow stack-sm">

          </div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary btn-wide" data-act="start-smart" data-count="${Math.max(10, Math.min(goal - t[0] > 0 ? goal - t[0] : 15, 50))}">
            Start smart session
          </button>
          <button type="button" class="btn" data-act="start-smart" data-count="10">Quick 10</button>
        </div>
        <p class="small muted">Smart sessions bring back what you missed, then lean on the domains where your first-try accuracy is lowest, weighted by how much each domain counts on the exam.</p>
      </section>

      <section class="stack">
        <div class="spread"><h3>Readiness</h3><button type="button" class="btn-quiet btn" data-act="tab" data-tab="tracker">Details</button></div>
        <div class="card ready">
          <div class="ready-figure">${started ? Math.round(rd.score * 100) : "–"}<small>${started ? "%" : ""}</small></div>
          <div class="stack-sm">
            <p class="small"><b>First-try accuracy</b>, weighted by the exam's domain weights. Aim for ${Math.round(READY_TARGET * 100)}% or better across every domain before you sit.</p>
            <div class="meter" aria-hidden="true"><span style="width:${started ? Math.round(rd.score * 100) : 0}%"></span><i class="mark" style="left:${READY_TARGET * 100}%"></i></div>
            <div class="meter-legend"><span>0</span><span>target ${Math.round(READY_TARGET * 100)}%</span><span>100</span></div>
            <p class="small muted num">${rd.seen} of ${CURATED.length} questions seen (${pct(rd.coverage)} of the bank)</p>
          </div>
        </div>
        ${heatStrip(stats)}
        <p class="small muted">Each tile is a domain's first-try accuracy; the thin bar under it is how much of that domain you have covered. Tap one to drill it.</p>
      </section>
      ${(() => { const w = weakObjectives(3); return w.length ? `<section class="stack"><h3>Weakest objectives</h3>${weakList(w)}</section>` : ""; })()}

      <section class="stack">
        <h3>Mock exam</h3>
        ${lastMock ? `<div class="card spread">
            <div class="stack-sm"><p class="eyebrow">${fmtDate(lastMock.startedAt)} · ${lastMock.total} items</p>
            <p><span class="chip ${lastMock.pass ? "good" : "bad"}">${lastMock.pass ? "PASS" : "FAIL"} estimate</span> <b class="num">${lastMock.scaled}</b> <span class="muted">/ 1000</span></p></div>
            <button type="button" class="btn" data-act="tab" data-tab="mock">New mock</button>
          </div>`
          : `<div class="card stack-sm"><p>No mock yet. The adaptive mock behaves like the real exam: 100 to 150 items in 3 hours, no going back, and it stops once it is sure of the result.</p><div><button type="button" class="btn" data-act="tab" data-tab="mock">See mock options</button></div></div>`}
      </section>
      ${!started ? `<section class="note">New here? Read <a href="#" data-act="lib" data-sub="mindset">How to think like a CISSP</a> first, then start a smart session. If you kept a study tracker elsewhere, paste it into <a href="#" data-act="tab" data-tab="tracker">Tracker › Import</a>.</section>` : ""}
    </div>`;
  }

  // ---------------------------------------------------------------- Practice menu
  function viewPracticeMenu() {
    const t = S.tool;
    t.domains = t.domains || [];
    t.count = t.count || 20;
    const missed = Object.entries(S.progress.p).filter(([id, r]) => r[3] === 0 && byId(id)).length;
    const flagged = Object.keys(S.flags).filter((id) => byId(id)).length;
    const due = Object.values(S.progress.p).filter((r) => r[6] <= Date.now()).length;
    const stats = curatedStats();
    return `<div class="stack-lg">
      <section class="stack-sm">
        <h2>Practice</h2>
        <p class="muted">Instant feedback. After each answer you see why every option is right or wrong.</p>
      </section>

      <div class="menu">
        <button type="button" data-act="start-smart" data-count="${S.profile.dailyGoal || 30}">
          <span class="title">Smart session</span><span class="detail">Due reviews first, then your weakest heavy domains</span><span class="side">${S.profile.dailyGoal || 30}</span>
        </button>
        <button type="button" data-act="start-review" ${due ? "" : "disabled"}>
          <span class="title">Due for review</span><span class="detail">Spaced repetition: questions whose interval has come round</span><span class="side">${due}</span>
        </button>
        <button type="button" data-act="start-missed" ${missed ? "" : "disabled"}>
          <span class="title">Missed last time</span><span class="detail">Every question your latest answer got wrong</span><span class="side">${missed}</span>
        </button>
        <button type="button" data-act="start-flagged" ${flagged ? "" : "disabled"}>
          <span class="title">Flagged</span><span class="detail">Questions you marked to revisit or dispute</span><span class="side">${flagged}</span>
        </button>
      </div>

      <section class="card stack">
        <h3>Choose domains</h3>
        <div class="checks">${DOMAINS.map((d) => `<button type="button" class="check" data-act="toggle-domain" data-d="${d.n}" aria-pressed="${t.domains.includes(d.n)}"><span class="mono">D${d.n}</span> ${esc(d.short)}</button>`).join("")}</div>
        <div class="spread">
          <div class="seg" role="group" aria-label="Number of questions">${[10, 20, 40, 60].map((n) => `<button type="button" data-act="set-count" data-n="${n}" aria-pressed="${t.count === n}">${n}</button>`).join("")}</div>
          <button type="button" class="btn btn-primary" data-act="start-domains" ${t.domains.length ? "" : "disabled"}>Start</button>
        </div>
        <p class="small muted">Questions you have not seen come first; the set spreads across each domain's objectives.</p>
      </section>

      ${freshPanel(stats)}
    </div>`;
  }

  function freshPanel(stats) {
    const gen = S.generated.length;
    const weakest = stats.slice().sort((a, b) => a.smoothed - b.smoothed)[0];
    const t = S.tool;
    t.genDomain = t.genDomain || (weakest ? weakest.n : 1);
    const d = domainOf(t.genDomain);
    return `<section class="card stack" id="fresh">
      <div class="spread"><h3>Fresh questions from Claude</h3><span class="chip ochre">${gen} saved</span></div>
      <p class="small muted">Claude writes five new questions on a domain, aimed at the objectives you have practised least. They are marked as AI-written, kept out of mock exams, and you can flag any you disagree with.</p>
      ${S.sample ? `
        <div class="field"><label for="gen-domain">Domain</label>
          <select id="gen-domain" data-field="genDomain">${DOMAINS.map((x) => `<option value="${x.n}" ${x.n === t.genDomain ? "selected" : ""}>D${x.n} ${esc(x.name)}</option>`).join("")}</select>
        </div>
        <div class="field"><label for="gen-obj">Objective</label>
          <select id="gen-obj" data-field="genObj"><option value="">Least practised in ${esc(d.short)}</option>${Object.entries(d.objectives).map(([k, v]) => `<option value="${k}" ${t.genObj === k ? "selected" : ""}>${k} ${esc(v)}</option>`).join("")}</select>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary" data-act="generate" ${t.generating ? "disabled" : ""}>${t.generating ? "Writing questions…" : "Write 5 questions"}</button>
          ${gen ? `<button type="button" class="btn" data-act="start-generated">Practise saved (${gen})</button>` : ""}
        </div>
        ${t.genMsg ? `<p class="small ${t.genErr ? "note bad" : "muted"}">${esc(t.genMsg)}</p>` : ""}
      ` : `<p class="note small">Available when you open this page in Claude and allow it to use Claude. ${gen ? `<button type="button" class="btn btn-sm" data-act="start-generated">Practise saved (${gen})</button>` : ""}</p>`}
    </section>`;
  }

  // ---------------------------------------------------------------- sessions
  function startRun(items, title) {
    if (!items.length) {
      toast("No questions match that selection yet.");
      return;
    }
    S.run = {
      id: uid(),
      title,
      items: items.map((q) => q.id),
      orders: Object.fromEntries(items.map((q) => [q.id, Engine.shuffle([0, 1, 2, 3])])),
      idx: 0,
      answers: [],
      selected: null,
      submitted: false,
      shownAt: Date.now(),
      startedAt: Date.now(),
      done: false,
    };
    S.ask = null;
    saveRun();
    go("practice");
  }

  function startSmart(count, opts = {}) {
    const items = Engine.smartSet(allQuestions(), S.progress.p, DOMAINS, count, { selfRatings: S.profile.selfRatings, ...opts });
    startRun(items, opts.reviewOnly ? "Review" : opts.domains ? "Domain practice" : "Smart session");
  }

  function currentQ() {
    const r = S.run;
    return r ? byId(r.items[r.idx]) : null;
  }

  function diffDots(n) {
    return `<span class="dots" title="${["", "Easier", "Medium", "Harder"][n]}">${[1, 2, 3].map((i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
  }

  function optionList(q, order, { selected, submitted, chosenOrig, interactive = true, act = "select" }) {
    return `<ol class="options">${order.map((orig, pos) => {
      const text = q.o[orig][0];
      // The tag already says which answer is correct, so the explanation's own "Correct." is dropped.
      const why = orig === q.a ? q.o[orig][1].replace(/^Correct\.\s*/, "") : q.o[orig][1];
      const letter = "ABCD"[pos];
      let cls = "", tag = "";
      if (submitted) {
        if (orig === q.a) { cls = "is-right"; tag = orig === chosenOrig ? "Your answer · correct" : "Correct answer"; }
        else if (orig === chosenOrig) { cls = "is-wrong"; tag = "Your answer"; }
        else { cls = "is-other"; tag = "Not the best"; }
      }
      return `<li><button type="button" class="opt ${cls}" ${submitted || !interactive ? "disabled" : `data-act="${act}" data-pos="${pos}"`} aria-pressed="${!submitted && selected === pos}">
        <span class="letter">${letter}</span>
        <span>${esc(text)}</span>
        ${submitted ? `<span class="why"><span class="tagline">${tag}</span>${esc(why)}</span>` : ""}
      </button></li>`;
    }).join("")}</ol>`;
  }

  function viewQuestion() {
    const r = S.run;
    const q = currentQ();
    if (!q) { S.run = null; return viewPracticeMenu(); }
    const order = r.orders[q.id];
    const ans = r.submitted ? r.answers[r.answers.length - 1] : null;
    const total = r.items.length;
    const correctSoFar = r.answers.filter((a) => a.correct).length;
    const d = domainOf(q.d);
    const flagged = !!S.flags[q.id];
    return `<div class="stack">
      <div class="qhead">
        <div class="row"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span>${q.gen ? `<span class="chip ochre">AI-written</span>` : ""}${diffDots(q.diff)}</div>
        <span class="mono muted small num">${r.idx + 1} / ${total} · ${correctSoFar} right</span>
      </div>
      <div class="progress-line"><span style="width:${(100 * (r.idx + (r.submitted ? 1 : 0))) / total}%"></span></div>
      <p class="eyebrow">${esc(d.name)} · ${esc(objName(q.obj))}</p>
      <p class="stem">${esc(q.q)}</p>
      ${r.submitted ? `<div class="verdict ${ans.correct ? "good" : "bad"}">${ans.correct ? "Correct" : `Not quite. The answer is ${"ABCD"[order.indexOf(q.a)]}.`}</div>` : ""}
      ${optionList(q, order, { selected: r.selected, submitted: r.submitted, chosenOrig: ans ? ans.chosen : null })}
      ${r.submitted ? `
        <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
        ${askPanel(q, order, ans)}
        ${flagNote(q.id)}
      ` : ""}
    </div>
    <div class="actionbar"><div class="actionbar-inner">
      <button type="button" class="btn btn-quiet" data-act="end-run">End</button>
      <span class="grow"></span>
      ${r.submitted
        ? `<button type="button" class="btn btn-primary" data-act="next" style="min-width:150px">${r.idx + 1 < total ? "Next question" : "See results"}</button>`
        : `<button type="button" class="btn btn-primary" data-act="submit" style="min-width:150px" ${r.selected == null ? "disabled" : ""}>Check answer</button>`}
    </div></div>`;
  }

  function askPanel(q, order, ans) {
    if (!S.sample) return "";
    const a = S.ask && S.ask.qid === q.id ? S.ask : null;
    return `<section class="ask" aria-label="Ask Claude about this question">
      <div class="spread"><h3>Ask Claude</h3>${a && a.busy ? `<button type="button" class="btn btn-sm" data-act="ask-stop">Stop</button>` : ""}</div>
      ${a && (a.out || a.busy) ? `<div class="ask-out ${a.busy && !a.out ? "thinking" : ""}" id="ask-out">${a.out ? richText(a.out) : "Thinking…"}</div>` : ""}
      ${a && a.err ? `<p class="small note bad">${esc(a.err)}</p>` : ""}
      <div class="prompts">
        ${(ans.correct
          ? ["Why are the others worse?", "Give me a memory hook", "How would the exam twist this?"]
          : ["Why is my answer wrong?", "Explain it like a risk advisor", "Give me a memory hook"])
          .map((p) => `<button type="button" data-act="ask" data-prompt="${esc(p)}" ${a && a.busy ? "disabled" : ""}>${esc(p)}</button>`).join("")}
      </div>
      <div class="row">
        <input type="text" id="ask-input" class="grow" placeholder="Your own question about this item" data-field="askText" value="${esc(S.tool.askText || "")}" style="flex:1 1 200px">
        <button type="button" class="btn btn-sm" data-act="ask" ${a && a.busy ? "disabled" : ""}>Ask</button>
      </div>
    </section>`;
  }

  function submitAnswer() {
    const r = S.run;
    if (!r || r.submitted || r.selected == null) return;
    const q = currentQ();
    const chosen = r.orders[q.id][r.selected];
    const correct = chosen === q.a;
    r.answers.push({ id: q.id, chosen, correct, ms: Date.now() - r.shownAt });
    r.submitted = true;
    S.progress.p[q.id] = Engine.record(S.progress.p[q.id], correct, Date.now());
    countAnswer(correct);
    saveProgress();
    saveRun();
    render();
  }

  function nextQuestion() {
    const r = S.run;
    if (!r) return;
    S.ask = null;
    S.tool.askText = "";
    if (r.idx + 1 >= r.items.length) {
      finishRun();
      return;
    }
    r.idx += 1;
    r.selected = null;
    r.submitted = false;
    r.shownAt = Date.now();
    saveRun();
    render();
    window.scrollTo(0, 0);
  }

  function finishRun() {
    const r = S.run;
    if (!r) return;
    r.done = true;
    if (r.answers.length) {
      const session = {
        id: r.id,
        kind: "practice",
        title: r.title,
        startedAt: r.startedAt,
        endedAt: Date.now(),
        total: r.answers.length,
        correct: r.answers.filter((a) => a.correct).length,
        items: r.answers.map((a) => [a.id, a.correct ? 1 : 0, a.chosen, Math.round(a.ms / 1000)]),
      };
      S.sessions.unshift(session);
      Store.put("sessions", session.id, session);
    }
    saveRun();
    render();
    window.scrollTo(0, 0);
  }

  function viewResults() {
    const r = S.run;
    const n = r.answers.length;
    const right = r.answers.filter((a) => a.correct).length;
    const byD = {};
    for (const a of r.answers) {
      const q = byId(a.id);
      if (!q) continue;
      const v = byD[q.d] || (byD[q.d] = [0, 0]);
      v[0]++;
      if (a.correct) v[1]++;
    }
    const missed = r.answers.filter((a) => !a.correct);
    return `<div class="stack-lg">
      <section class="stack-sm">
        <p class="eyebrow">${esc(r.title)} · finished</p>
        <h2 class="num">${n ? `${right} of ${n} right (${pct(right / n)})` : "No questions answered"}</h2>
        ${n ? `<p class="muted">${right / n >= READY_TARGET ? "That is at or above the 75% mark that suggests exam readiness on fresh questions." : "Missed questions come back tomorrow in your smart session."}</p>` : ""}
      </section>
      ${n ? `<div class="table-wrap"><table>
        <thead><tr><th>Domain</th><th class="n">Right</th><th class="n">%</th></tr></thead>
        <tbody>${Object.entries(byD).sort((a, b) => a[0] - b[0]).map(([d, v]) => `<tr><td><span class="mono">D${d}</span> ${esc(domainOf(Number(d)).short)}</td><td class="n">${v[1]} / ${v[0]}</td><td class="n">${pct(v[1] / v[0])}</td></tr>`).join("")}</tbody>
      </table></div>` : ""}
      ${missed.length ? `<section class="stack">
        <h3>Key points from your misses</h3>
        <div class="card">${missed.map((a) => {
          const q = byId(a.id);
          return q ? `<div class="kp"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span><p>${esc(q.k)}</p><button type="button" class="btn-quiet btn" style="justify-self:start" data-act="study" data-id="${q.id}">Review question</button></div>` : "";
        }).join("")}</div>
      </section>` : ""}
      <div class="row">
        <button type="button" class="btn btn-primary" data-act="close-run">Done</button>
        ${missed.length ? `<button type="button" class="btn" data-act="retry-missed">Retry the ${missed.length} missed</button>` : ""}
      </div>
    </div>`;
  }

  // A read-only look at a question with its answer and every explanation.
  function viewStudy(q, back) {
    return `<div class="stack">
      <button type="button" class="btn btn-quiet" style="align-self:flex-start" data-act="${back.act}" ${back.attrs || ""}>‹ ${esc(back.label)}</button>
      <div class="row"><span class="chip accent">D${q.d} · ${esc(q.obj)}</span><span class="mono small muted">${esc(q.id)}</span>${diffDots(q.diff)}</div>
      <p class="eyebrow">${esc(objName(q.obj))}</p>
      <p class="stem">${esc(q.q)}</p>
      ${optionList(q, [0, 1, 2, 3], { submitted: true, chosenOrig: null, interactive: false })}
      <div class="keypoint"><p class="eyebrow">Key point</p><p>${esc(q.k)}</p></div>
      ${flagNote(q.id)}
    </div>`;
  }

  // Flagging, with an optional note on why: "answer looks wrong", "unclear wording", "review later".
  function flagNote(id) {
    const f = S.flags[id];
    return `<div class="stack-sm">
      <div class="row"><button type="button" class="btn btn-sm" data-act="flag" data-id="${esc(id)}">${f ? "Flagged ✓ (tap to remove)" : "Flag this question"}</button></div>
      ${f ? `<input type="text" data-field="flagNote" data-id="${esc(id)}" value="${esc(f.note || "")}" placeholder="Why? For example: the answer looks wrong, or review before the exam" aria-label="Reason for flagging">` : ""}
    </div>`;
  }

  // ---------------------------------------------------------------- Ask Claude
  function askPrompt(q, order, ans, userText) {
    const lines = order.map((orig, pos) => `${"ABCD"[pos]}) ${q.o[orig][0]}\n   Explanation: ${q.o[orig][1]}`).join("\n");
    const keyLetter = "ABCD"[order.indexOf(q.a)];
    const chosenLetter = "ABCD"[order.indexOf(ans.chosen)];
    return `You are a CISSP tutor helping a working security professional prepare for the ISC2 CISSP exam (2024 outline). Use ISC2 and Official Study Guide terminology. Think like a risk advisor to senior management, as the exam expects.

Practice question (${domainOf(q.d).name}, objective ${q.obj} ${objName(q.obj)}):
${q.q}

${lines}

Keyed answer: ${keyLetter}. The learner chose ${chosenLetter} (${ans.correct ? "correct" : "incorrect"}).
Key point: ${q.k}

The learner asks: ${userText}

Answer in at most 180 words of plain prose (short paragraphs or a few "- " bullets, no headings). Be concrete and exam-focused. If you believe the keyed answer is debatable, say so plainly and explain which answer ISC2 would most likely expect and why.`;
  }

  async function askClaude(text) {
    const q = currentQ() || (S.sub && S.sub.qid ? byId(S.sub.qid) : null);
    const r = S.run;
    if (!q || !S.sample || !r) return;
    const order = r.orders[q.id];
    const ans = r.answers[r.answers.length - 1];
    const prompt = (text || S.tool.askText || "").trim();
    if (!prompt) { toast("Type a question or pick one of the suggestions."); return; }
    if (S.ask && S.ask.ctl) S.ask.ctl.abort();
    const ctl = new AbortController();
    S.ask = { qid: q.id, busy: true, out: "", err: "", ctl };
    S.tool.askText = "";
    render();
    try {
      await S.sample(askPrompt(q, order, ans, prompt), {
        signal: ctl.signal,
        onText: ({ text: t }) => {
          if (S.ask && S.ask.ctl === ctl) {
            S.ask.out = t;
            const out = $("#ask-out");
            if (out) { out.classList.remove("thinking"); out.innerHTML = richText(t); }
          }
        },
      });
      if (S.ask && S.ask.ctl === ctl) S.ask.busy = false;
    } catch (e) {
      if (!S.ask || S.ask.ctl !== ctl) return;
      S.ask.busy = false;
      S.ask.out = e && e.text ? e.text : S.ask.out;
      S.ask.err = sampleError(e);
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
    }
    render();
  }

  function sampleError(e) {
    const code = e && e.code;
    if (code === "cancelled") return "";
    if (code === "rate_limited") return "Claude is busy or your usage limit was reached. Try again in a little while.";
    if (code === "session_expired") return "Your Claude session expired. Sign in again, then retry.";
    if (code === "refused") return "Claude declined that request. Try rephrasing it.";
    if (code === "invalid_json") return "Claude's reply could not be read as data. Try again.";
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) return "Claude isn't available on this page right now.";
    return "Something went wrong reaching Claude. Try again.";
  }

  // ---------------------------------------------------------------- Fresh questions
  function validGenerated(q) {
    return q && typeof q.q === "string" && q.q.length > 20 && Array.isArray(q.o) && q.o.length === 4 &&
      q.o.every((o) => Array.isArray(o) && typeof o[0] === "string" && typeof o[1] === "string" && o[0] && o[1]) &&
      Number.isInteger(q.a) && q.a >= 0 && q.a < 4 && DOMAINS[q.d - 1] && DOMAINS[q.d - 1].objectives[q.obj] && typeof q.k === "string";
  }

  async function generate() {
    const t = S.tool;
    if (!S.sample || t.generating) return;
    const d = domainOf(Number(t.genDomain) || 1);
    let obj = t.genObj;
    if (!obj) {
      const seenBy = {};
      for (const q of allQuestions()) if (q.d === d.n && S.progress.p[q.id]) seenBy[q.obj] = (seenBy[q.obj] || 0) + 1;
      const objs = Object.keys(d.objectives);
      obj = objs.sort((a, b) => (seenBy[a] || 0) - (seenBy[b] || 0))[0];
    }
    const existing = allQuestions().filter((q) => q.obj === obj).map((q) => "- " + q.q.split("\n")[0].slice(0, 140)).slice(0, 40).join("\n");
    const prompt = `Write 5 original ISC2 CISSP practice questions for objective ${obj} "${d.objectives[obj]}" in Domain ${d.n} ${d.name} (CISSP exam outline effective April 15, 2024).

Requirements:
- Scenario-based where possible, at the depth of the real exam; use qualifiers like BEST, FIRST, MOST or PRIMARY where they fit, and think like a risk advisor to senior management.
- Exactly four options, one unambiguously best answer by ISC2 / Official Study Guide reasoning, plausible distractors, no "all/none of the above", options of similar length.
- Every option gets a one- or two-sentence explanation of why it is right or wrong.
- A one-sentence takeaway that states the rule to remember.
- Vary the position of the correct answer.
- Do not repeat these existing questions:
${existing || "(none)"}

Reply with only a JSON array of 5 objects shaped like:
{"q": "question stem", "options": [{"t": "option text", "why": "explanation"}, {"t": "...", "why": "..."}, {"t": "...", "why": "..."}, {"t": "...", "why": "..."}], "answer": 0, "difficulty": 2, "takeaway": "rule to remember"}
where "answer" is the 0-based index of the correct option and "difficulty" is 1 (easier), 2 or 3 (harder).`;
    t.generating = true;
    t.genMsg = "Claude is writing five questions. This usually takes under a minute.";
    t.genErr = false;
    render();
    try {
      const out = await S.sample.json(prompt, { modelTier: "complex", cache: false });
      const list = Array.isArray(out) ? out : Array.isArray(out && out.questions) ? out.questions : [];
      const made = [];
      for (const raw of list) {
        const q = {
          id: "G-" + uid(),
          gen: true,
          d: d.n,
          obj,
          diff: [1, 2, 3].includes(Number(raw && raw.difficulty)) ? Number(raw.difficulty) : 2,
          q: String((raw && raw.q) || "").trim(),
          o: Array.isArray(raw && raw.options) ? raw.options.map((o) => [String((o && o.t) || "").trim(), String((o && o.why) || "").trim()]) : [],
          a: Number(raw && raw.answer),
          k: String((raw && raw.takeaway) || "").trim(),
          createdAt: Date.now(),
        };
        if (validGenerated(q)) {
          made.push(q);
          S.generated.push(q);
          Store.put("gen", q.id, q);
        }
      }
      t.generating = false;
      if (made.length) {
        t.genMsg = `Saved ${made.length} new question${made.length === 1 ? "" : "s"} on ${obj}.`;
        startRun(made, `Fresh questions · ${obj}`);
        return;
      }
      t.genMsg = "Claude's reply didn't contain usable questions. Try again.";
      t.genErr = true;
    } catch (e) {
      t.generating = false;
      t.genMsg = sampleError(e) || "Stopped.";
      t.genErr = true;
      if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
    }
    render();
  }

  function tickClock() {
    const m = S.mock;
    const el = $("#clock");
    if (!m || !el) return;
    const left = Engine.FORMS[m.form].minutes * 60000 - mockElapsed(m);
    el.textContent = fmtClock(left);
    el.classList.toggle("low", left < 10 * 60000);
    if (left <= 0) finishMock("time");
  }

  function mockAnswer() {
    const m = S.mock;
    if (!m || m.selected == null) return;
    const q = byId(m.current.id);
    const chosen = m.current.order[m.selected];
    const correct = chosen === q.a;
    m.responses.push({ id: q.id, d: q.d, b: Engine.DIFFICULTY[q.diff], correct, chosen, ms: Date.now() - m.current.shownAt });
    S.progress.p[q.id] = Engine.record(S.progress.p[q.id], correct, Date.now());
    countAnswer(correct);
    saveProgress();
    const decision = Engine.catDecision(m.responses, Engine.FORMS[m.form]);
    if (decision.done) { finishMock(decision.reason); return; }
    nextMockItem();
    m.savedAt = Date.now();
    saveMock();
    render();
    window.scrollTo(0, 0);
  }

  function finishMock(reason) {
    const m = S.mock;
    if (!m || m.finished) return;
    const form = Engine.FORMS[m.form];
    m.finished = true;
    const est = Engine.estimate(m.responses);
    const elapsed = Math.min(mockElapsed(m), form.minutes * 60000);
    let pass = est.theta >= Engine.PASS_THETA;
    let why = "";
    if (reason === "time" && m.responses.length < form.min) {
      pass = false;
      why = `Time ran out before the minimum ${form.min} items. On the real exam that is a fail.`;
    } else if (reason === "confident") why = `Stopped at ${m.responses.length} items: 95% confident of the result.`;
    else if (reason === "max") why = `Reached the ${form.max}-item maximum; decided on the final ability estimate.`;
    else if (reason === "time") why = "Time ran out after the minimum; decided on the final ability estimate.";
    else if (reason === "early") why = "Ended early by you; scored on the items answered so far.";
    else if (reason === "bank") why = "The question bank ran out of unused items for this mock.";
    const session = {
      id: m.id,
      kind: "mock",
      form: m.form,
      title: form.label,
      startedAt: m.startedAt,
      endedAt: Date.now(),
      elapsedMs: elapsed,
      total: m.responses.length,
      correct: m.responses.filter((r) => r.correct).length,
      theta: Number(est.theta.toFixed(3)),
      se: Number(est.se.toFixed(3)),
      pass,
      scaled: Engine.scaledScore(est.theta),
      why,
      domains: Engine.domainProficiency(m.responses, DOMAINS).map((x) => ({ n: x.n, count: x.count, correct: x.correct, level: x.level })),
      items: m.responses.map((r) => [r.id, r.correct ? 1 : 0, r.chosen, Math.round(r.ms / 1000)]),
    };
    S.sessions.unshift(session);
    Store.put("sessions", session.id, session);
    S.mock = null;
    saveMock();
    S.mockResult = session;
    clearInterval(S.clockTimer);
    if (S.tab === "mock") { render(); window.scrollTo(0, 0); }
  }

  function chartHistory() {

  async function importRead() {
    const t = S.tool;
    const text = (t.importText || "").trim();
    if (!S.sample || !text) { toast("Paste your tracker first."); return; }
    t.importing = true;
    t.importMsg = "Claude is reading your tracker.";
    t.importErr = false;
    render();
    const prompt = `Extract a CISSP study tracker into structured data. Today is ${todayKey()}.
The 8 CISSP domains: ${DOMAINS.map((d) => `D${d.n} ${d.name}`).join("; ")}.

Reply with only one JSON object shaped like:
{"examDate": "YYYY-MM-DD or null", "examBooked": true or false, "domains": [{"n": 1, "rating": 1-5 or null, "note": "short note"}], "scores": [{"date": "YYYY-MM-DD or null", "source": "name of test", "score": percent number or null, "note": "short"}], "summary": "two sentences on the learner's status, materials used and weak areas"}

Rules: rating is the learner's confidence or status in that domain mapped to 1 (weak or not started) through 5 (strong); include only domains the tracker says something about; convert fractions to percents; keep notes under 140 characters; do not invent anything that is not in the text.

Tracker:
${text.slice(0, 60000)}`;
    try {
      const out = await S.sample.json(prompt, { cache: false });
      const pv = {
        examDate: typeof out.examDate === "string" && parseDate(out.examDate) ? out.examDate : null,
        examBooked: !!out.examBooked,
        domains: (Array.isArray(out.domains) ? out.domains : [])
          .map((d) => ({ n: Number(d.n), rating: [1, 2, 3, 4, 5].includes(Number(d.rating)) ? Number(d.rating) : null, note: String(d.note || "").slice(0, 300) }))
          .filter((d) => d.n >= 1 && d.n <= 8),
        scores: (Array.isArray(out.scores) ? out.scores : []).map((s) => ({
          id: uid(),
          date: typeof s.date === "string" ? s.date : "",
          source: String(s.source || "").slice(0, 80),
          score: s.score == null || isNaN(Number(s.score)) ? null : Math.round(Number(s.score)),
          note: String(s.note || "").slice(0, 200),
        })),
        summary: String(out.summary || "").slice(0, 600),
      };
      t.importPreview = pv;
      t.importMsg = "";
    } catch (e) {
      t.importMsg = sampleError(e) || "Stopped.";
      t.importErr = true;
    }
    t.importing = false;
    render();
  }

  function importApply() {
    const pv = S.tool.importPreview;
    if (!pv) return;
    const p = S.profile;
    if (pv.examDate) { p.examDate = pv.examDate; p.examBooked = pv.examBooked; }
    for (const d of pv.domains) {
      if (d.rating) p.selfRatings[d.n] = d.rating;
      if (d.note) p.notes[d.n] = p.notes[d.n] ? p.notes[d.n] + "\n" + d.note : d.note;
    }
    p.scores = p.scores.concat(pv.scores);
    if (pv.summary) p.trackerSummary = pv.summary;
    saveProfile();
    S.tool.importPreview = null;
    S.tool.importText = "";
    toast("Tracker imported");
    render();
  }

  function libKeypoints(dn) {
    const d = domainOf(dn);
    const qs = CURATED.filter((q) => q.d === dn).sort((a, b) => a.obj.localeCompare(b.obj, undefined, { numeric: true }));

    for (const q of qs) (groups[q.obj] || (groups[q.obj] = [])).push(q);
    return `<div class="stack">${backToLib}
      <h2>Key points</h2>
      ${domainTabs("lib-kp", dn)}
      <p class="eyebrow">D${d.n} · ${esc(d.name)} · ${d.weight}% of the exam</p>
      ${Object.entries(groups).map(([obj, list]) => `<section class="card stack-sm"><h3><span class="mono">${obj}</span> ${esc(d.objectives[obj])}</h3>
        <div>${list.map((q) => `<div class="kp"><p>${esc(q.k)}</p><button type="button" class="btn-quiet btn btn-sm" style="justify-self:start" data-act="study" data-id="${q.id}">See question ${esc(q.id)}</button></div>`).join("")}</div></section>`).join("")}
    </div>`;
  }

  function libBrowse(dn) {
    const d = domainOf(dn);
    const qs = CURATED.filter((q) => q.d === dn).sort((a, b) => a.obj.localeCompare(b.obj, undefined, { numeric: true }) || a.id.localeCompare(b.id));
    return `<div class="stack">${backToLib}
      <h2>Browse questions</h2>
      ${domainTabs("lib-browse", dn)}
      <p class="eyebrow">D${d.n} · ${esc(d.name)} · ${qs.length} questions</p>

  function toggleFlag(id) {
    if (S.flags[id]) {
      delete S.flags[id];
      Store.remove("flags", id);
      toast("Flag removed");

      const f = { id, note: "", ts: Date.now() };

      toast("Flagged. It will appear under Practice › Flagged.");

    render();

    tab: (el) => go(el.dataset.tab),

    "start-missed": () => {
      const items = Object.entries(S.progress.p).filter(([id, r]) => r[3] === 0 && byId(id)).map(([id]) => byId(id));
      startRun(Engine.shuffle(items).slice(0, 60), "Missed questions");

        const ra = S.progress.p[a.id], rb = S.progress.p[b.id];

      });

    "toggle-domain": (el) => {

    "start-objective": (el) => {
      const obj = el.dataset.obj;
      const rank = (q) => {
        const r = S.progress.p[q.id];
        return !r ? 1 : r[3] === 0 ? 0 : 2;
      };
      const items = allQuestions().filter((q) => q.obj === obj).sort((a, b) => rank(a) - rank(b) || Math.random() - 0.5).slice(0, 15);

    select: (el) => {

      S.run.selected = Number(el.dataset.pos);
      if (!S.profile.confirm) { submitAnswer(); return; }

    },
    submit: () => submitAnswer(),
    next: () => nextQuestion(),
    "end-run": () => finishRun(),
    "close-run": () => { S.run = null; saveRun(); go("today"); },
    "retry-missed": () => {
      const ids = S.run.answers.filter((a) => !a.correct).map((a) => a.id);
      startRun(Engine.shuffle(ids.map(byId).filter(Boolean)), "Retry missed");
    },

      render();

    },
    "lib-kp": (el) => { S.sub = { name: "keypoints", d: Number(el.dataset.d) }; render(); },
    "lib-browse": (el) => { S.sub = { name: "browse", d: Number(el.dataset.d) }; render(); },
    ask: (el) => askClaude(el.dataset.prompt),
    "ask-stop": () => { if (S.ask && S.ask.ctl) S.ask.ctl.abort(); },
    generate: () => generate(),
    "start-mock": (el) => startMock(el.dataset.form),
    "mock-select": (el) => { if (S.mock) { S.mock.selected = Number(el.dataset.pos); render(); } },
    "mock-next": () => mockAnswer(),
    "mock-pause": () => {
      const m = S.mock;
      if (!m) return;
      m.elapsed = mockElapsed(m);
      m.paused = true;
      m.savedAt = Date.now();
      saveMock();
      render();
    },
    "mock-resume": () => {
      const m = S.mock;
      if (!m) return;
      m.paused = false;
      m.resumedAt = Date.now();
      m.current.shownAt = Date.now();
      S.tool.armDiscard = false;
      saveMock();
      render();
    },
    "mock-finish-now": () => finishMock("early"),
    "mock-discard": () => {
      if (!S.tool.armDiscard) { S.tool.armDiscard = true; render(); return; }
      S.tool.armDiscard = false;
      S.mock = null;
      saveMock();
      render();
    },
    "mock-review-toggle": () => { S.sub = { review: !(S.sub && S.sub.review) }; render(); },
    "open-mock": (el) => { S.mockResult = S.sessions.find((s) => s.id === el.dataset.id) || null; S.sub = null; render(); window.scrollTo(0, 0); },
    "close-mock-result": () => { S.mockResult = null; S.sub = null; render(); },
    "practise-mock-misses": () => {
      const ids = S.mockResult.items.filter((x) => !x[1]).map((x) => x[0]);
      S.mockResult = null;
      startRun(Engine.shuffle(ids.map(byId).filter(Boolean)), "Mock exam misses");
    },
    rate: (el) => {
      const n = el.dataset.d, v = Number(el.dataset.v);
      S.profile.selfRatings[n] = Number(S.profile.selfRatings[n]) === v ? 0 : v;
      saveProfile();
      render();
    },
    "set-booked": (el) => { S.profile.examBooked = el.dataset.v === "1"; saveProfile(); render(); },
    "add-score": () => {
      const t = S.tool;
      const score = t.scoreValue === "" || t.scoreValue == null ? null : Math.max(0, Math.min(100, Math.round(Number(t.scoreValue))));
      if (!t.scoreSource && score == null) { toast("Add a source or a score."); return; }
      S.profile.scores.push({ id: uid(), date: t.scoreDate || todayKey(), source: (t.scoreSource || "").slice(0, 80), score, note: (t.scoreNote || "").slice(0, 200) });
      t.scoreSource = ""; t.scoreValue = ""; t.scoreNote = "";
      saveProfile();
      render();
    },
    "del-score": (el) => { S.profile.scores = S.profile.scores.filter((s) => s.id !== el.dataset.id); saveProfile(); render(); },
    "import-read": () => importRead(),
    "import-apply": () => importApply(),
    "import-cancel": () => { S.tool.importPreview = null; render(); },
    "copy-data": async () => {
      const data = JSON.stringify({ profile: S.profile, progress: S.progress, sessions: S.sessions, flags: S.flags, generated: S.generated }, null, 1);
      try {
        await navigator.clipboard.writeText(data);
        toast("Copied your data to the clipboard");
      } catch {
        toast("Copying isn't allowed here.");
      }
    },
    reset: () => {
      if (!S.tool.armReset) { S.tool.armReset = true; render(); return; }
      S.tool.armReset = false;
      S.progress = { p: {}, days: {}, updatedAt: Date.now() };
      saveProgress();
      for (const s of S.sessions) Store.remove("sessions", s.id);
      S.sessions = [];
      S.run = null;
      saveRun();
      toast("Progress erased");
      render();
    },
  };

  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (!fn) return;
    if (el.tagName === "A") ev.preventDefault();
    if (el.dataset.act !== "reset" && S.tool.armReset) S.tool.armReset = false;
    fn(el, ev);
  });

  let noteTimer = 0;
  document.addEventListener("input", (ev) => {
    const el = ev.target;
    const f = el.dataset && el.dataset.field;
    if (!f) return;
    if (f === "note") {
      S.profile.notes[el.dataset.d] = el.value;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(saveProfile, 700);
      return;
    }
    if (f === "confirm") { S.profile.confirm = el.checked; saveProfile(); return; }
    if (f === "flagNote") {
      const flag = S.flags[el.dataset.id];
      if (!flag) return;
      flag.note = el.value.slice(0, 300);
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => Store.put("flags", flag.id, flag), 700);
      return;
    }
    if (["examDate", "dailyGoal"].includes(f)) return; // saved on change
    S.tool[f] = el.value;
  });
  document.addEventListener("change", (ev) => {
    const el = ev.target;
    const f = el.dataset && el.dataset.field;
    if (!f) return;
    if (f === "examDate") { if (parseDate(el.value)) { S.profile.examDate = el.value; saveProfile(); render(); } return; }
    if (f === "dailyGoal") { const v = Math.max(5, Math.min(150, Math.round(Number(el.value) || 30))); S.profile.dailyGoal = v; saveProfile(); render(); return; }
    if (f === "genDomain") { S.tool.genDomain = Number(el.value); S.tool.genObj = ""; render(); return; }
    if (f === "genObj") { S.tool.genObj = el.value; return; }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.target.closest && ev.target.closest("input, textarea, select")) {
      if (ev.key === "Enter" && ev.target.id === "ask-input") { ev.preventDefault(); askClaude(); }
      return;
    }
    const k = ev.key.toLowerCase();
    const pos = ["a", "b", "c", "d"].indexOf(k) >= 0 ? ["a", "b", "c", "d"].indexOf(k) : ["1", "2", "3", "4"].indexOf(k);
    if (S.tab === "practice" && S.run && !S.run.done) {
      if (pos >= 0 && !S.run.submitted) { S.run.selected = pos; if (!S.profile.confirm) submitAnswer(); else render(); }
      else if (k === "enter") { S.run.submitted ? nextQuestion() : submitAnswer(); }
    } else if (S.tab === "mock" && S.mock && !S.mock.paused && !S.mockResult) {
      if (pos >= 0) { S.mock.selected = pos; render(); }
      else if (k === "enter") mockAnswer();
    }
  });

  // ---------------------------------------------------------------- start
  function boot(hotData) {
    // Instant first paint from this browser's copy.
    applyLoaded({
      profile: lsGet(LS + "me/profile", null),
      progress: lsGet(LS + "me/progress", null),
      mock: lsGet(LS + "me/mock", null),
      sessions: Object.values(lsGet(LS + "sessions", {})),
      flags: Object.values(lsGet(LS + "flags", {})),
      generated: Object.values(lsGet(LS + "gen", {})),
    });
    const run = lsGet(LS + "run", null);
    if (run && !run.done && Array.isArray(run.items) && run.items.every((id) => byId(id))) S.run = run;
    if (hotData && hotData.tab) S.tab = hotData.tab;
    else S.tab = lsGet(LS + "tab", "today");
    if (S.mock && !S.mock.paused) {
      // A reload mid-exam pauses the clock rather than running it down.
      S.mock.elapsed = mockElapsed(S.mock);
      S.mock.paused = true;
    }
    render();

    Store.connect().then(async (ok) => {
      if (!ok) return;
      const data = await loadAll();
      const hadLocal = Object.keys(S.progress.p).length > 0;
      const dbEmpty = !data.progress && !data.profile;
      const before = S.mock;
      applyLoaded(data, { fromDb: dbEmpty && hadLocal });
      if (S.mock && S.mock !== before && !S.mock.paused) { S.mock.elapsed = mockElapsed(S.mock); S.mock.paused = true; }
      render();
    });

    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("sample").then((sample) => {
        if (sample) { S.sample = sample; render(); }
      }).catch(() => {});
    }
  }

  if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === "function") {
    try { window.claude.hot.snapshot(() => ({ tab: S.tab })); } catch { /* optional */ }
  }
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === "function") window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
