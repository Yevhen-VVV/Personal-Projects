ive attackers."],["Log rotation and archiving","Rotation manages storage, not detection."],["Penetration testing by an outside firm","Penetration testing simulates attacks; it does not search for real ones."]],"a":0,"k":"Threat hunting assumes compromise and looks for it, guided by threat intelligence and hypotheses."},{"id":"D7-012","d":7,"obj":"7.2","diff":2,"q":"A tool learns each user's normal activity and alerts when an account suddenly downloads far more data than usual at an odd hour. What is this technology?","o":[["Signature-based network intrusion detection","Signatures match known attack patterns, not deviations from normal behavior."],["A web application firewall","A WAF filters web traffic."],["User and entity behavior analytics (UEBA)","Correct. UEBA models normal behavior for users and devices and flags anomalies, such as signs of an insider or a compromised account."],["Network address translation logging","NAT logs record address translations."]],"a":2,"k":"UEBA detects anomalies in user and entity behavior; it complements signature-based detection."},{"id":"D7-013","d":7,"obj":"7.2","diff":2,"q":"Which monitoring activity is MOST likely to detect data being exfiltrated from the network?","o":[["Monitoring inbound firewall denies","Inbound denies show attempted entry, not data leaving."],["Reviewing antivirus update logs","Update logs show whether signatures are current."],["Counting failed logins on the VPN","Failed logins indicate access attempts, not data theft."],["Egress monitoring of outbound traffic","Correct. Watching outbound flows, DNS and proxy traffic reveals unusual volumes and destinations."]],"a":3,"k":"Egress monitoring (outbound traffic, DLP, DNS) catches data leaving and command-and-control traffic."},{"id":"D7-014","d":7,"obj":"7.2","diff":2,"q":"The SOC wants to receive machine-readable threat intelligence from industry partners automatically. Which standards are designed for this?","o":[["STIX and TAXII","Correct. STIX describes threat intelligence in a structured format, and TAXII transports it between parties."],["SAML and OpenID Connect","These are identity federation standards."],["SNMP and syslog","These carry device management data and logs."],["SPF and DKIM","These authenticate email."]],"a":0,"k":"Threat intelligence sharing: STIX (format) over TAXII (transport); ISACs share sector-specific intelligence."},{"id":"D7-015","d":7,"obj":"7.2","diff":2,"q":"A system records failed logins but raises an alert only after five failures in ten minutes for the same account. What is this threshold called?","o":[["A baseline configuration","A baseline is a minimum security configuration."],["A clipping level","Correct. Clipping levels ignore routine errors below a threshold and flag activity above it."],["A recovery point objective","An RPO is a recovery measure."],["A service level agreement","An SLA defines service commitments."]],"a":1,"k":"Clipping levels reduce noise by alerting only when activity crosses a defined threshold."},{"id":"D7-016","d":7,"obj":"7.2","diff":3,"q":"The SIEM generates thousands of low-value alerts a day, and analysts are missing real incidents. What is the BEST response?","o":[["Disable alerting until analysts catch up","Turning off detection hides real attacks."],["Hire enough analysts to review every alert","Scaling people to noise is costly and unsustainable."],["Raise every threshold to the maximum","Blanket changes will suppress real detections too."],["Tune rules and prioritize by risk","Correct. Continuous monitoring includes tuning to the environment's context: remove false positives, enrich alerts and prioritize by asset and threat."]],"a":3,"k":"Monitoring needs continuous tuning; alert fatigue is a detection failure in its own right."},{"id":"D7-017","d":7,"obj":"7.3","diff":2,"q":"Servers are built from a hardened, approved image, and a tool alerts when a server's settings drift from it. What practice is this?","o":[["Configuration management with baselining","Correct. A secure baseline is applied consistently, and deviations are detected and corrected."],["Change management through the advisory board","Change management approves changes; baselining defines and enforces the approved state."],["Patch management for operating systems","Patching is one input to baselines, not the whole practice."],["Vulnerability scanning from outside","Scanning finds vulnerabilities rather than tracking configuration state."]],"a":0,"k":"Configuration management: define baselines, provision consistently (often automated), detect and correct drift."},{"id":"D7-018","d":7,"obj":"7.3","diff":2,"q":"Infrastructure is defined in code templates stored in version control and deployed automatically. What is the main security benefit?","o":[["No security reviews are needed any more","Code still needs review; the benefit is that reviews become possible and repeatable."],["Consistent, reviewable and repeatable configurations","Correct. Infrastructure as code lets teams review, test and reproduce configurations and spot unauthorized changes."],["Servers no longer need patching","Templates must still be updated to deploy patched images."],["Encryption is enabled automatically everywhere","Only if the templates specify it."]],"a":1,"k":"Automation and infrastructure as code make configuration consistent, auditable and recoverable."},{"id":"D7-019","d":7,"obj":"7.3","diff":1,"q":"Before a new server joins production, what should configuration management ensure?","o":[["That the administrator has customized it to their preferences","Personal customizations create inconsistency."],["That it uses the vendor's default settings","Defaults are often insecure."],["That it matches the approved secure baseline","Correct. Every system should start from the approved baseline and be recorded in the CMDB."],["That it has every available software package installed","Unnecessary software increases the attack surface."]],"a":2,"k":"Provision from approved baselines; record what you deploy."},{"id":"D7-020","d":7,"obj":"7.4","diff":2,"q":"An analyst has a Top Secret clearance but is denied a Top Secret report unrelated to their work. Which principle is being applied?","o":[["Separation of duties","SoD splits tasks; it does not limit access to particular information."],["Job rotation","Rotation moves people between roles."],["Least privilege","Least privilege limits rights and permissions; need to know specifically limits access to information."],["Need to know","Correct. Clearance makes someone eligible; need to know restricts access to information required for their duties."]],"a":3,"k":"Need to know restricts information access to what a job requires; least privilege restricts rights and permissions."},{"id":"D7-021","d":7,"obj":"7.4","diff":2,"q":"Why do separation of duties controls still leave some risk of fraud?","o":[["Because they rely on encryption","SoD does not depend on encryption."],["Two or more people can collude","Correct. SoD requires collusion to commit fraud, which makes it harder but not impossible; job rotation and audits help detect it."],["Because they slow down business processes","Slower processes are a cost of SoD, not the reason fraud remains possible."],["Because they replace the need for audits","SoD complements audits; it does not replace them, and that is not why fraud remains possible."]],"a":1,"k":"Separation of duties forces collusion; job rotation and mandatory vacations help uncover it."},{"id":"D7-022","d":7,"obj":"7.4","diff":2,"q":"A bank requires employees in sensitive roles to take two consecutive weeks of vacation each year. What is the PRIMARY purpose?","o":[["To improve morale and reduce burnout","That is a welcome side effect, not the security purpose."],["To reduce payroll costs","Vacation does not reduce payroll."],["To uncover ongoing fraud","Correct. Fraud often depends on the employee's continuous presence; someone else does the job meanwhile, so ongoing fraud or irregularities are likely to surface."],["To meet labor law requirements","Labor law is not the security reason."]],"a":2,"k":"Mandatory vacations and job rotation are detective controls against fraud."},{"id":"D7-023","d":7,"obj":"7.4","diff":2,"q":"Opening the vault holding the root CA's private key requires two authorized officers to be present together. What is this control?","o":[["Need to know","Need to know limits information access."],["Least privilege","Least privilege limits rights; it does not require two people."],["Job rotation","Rotation moves people between roles."],["Two-person control","Correct. Two-person (dual) control requires two people for a critical action, preventing one person acting alone."]],"a":3,"k":"Two-person control and split knowledge (M of N) protect the most critical operations."},{"id":"D7-024","d":7,"obj":"7.4","diff":2,"q":"Which practice BEST manages the risk of privileged administrator accounts?","o":[["Privileged access management with vaulting and monitoring","Correct. PAM vaults credentials, grants them just in time, records sessions and audits use."],["Giving every administrator the same domain admin account","Shared accounts remove accountability."],["Using privileged accounts for daily email and browsing","That exposes powerful credentials to phishing and malware."],["Never reviewing privileged access, to avoid disruption","Privileged access needs the most frequent review."]],"a":0,"k":"Privileged account management: separate admin accounts, vaulting, JIT elevation, session recording and review."},{"id":"D7-025","d":7,"obj":"7.4","diff":1,"q":"Which document defines what a provider commits to deliver, such as 99.9% uptime, and the remedies if it falls short?","o":[["A memorandum of understanding","An MOU records intentions, usually without enforceable penalties."],["A service level agreement","Correct. SLAs set measurable service levels and consequences for missing them."],["An interconnection security agreement","An ISA covers the security of connections between organizations."],["A non-disclosure agreement","An NDA protects confidential information."]],"a":1,"k":"SLAs define measurable commitments; OLAs cover internal teams; ISAs cover interconnections; MOUs record intent."},{"id":"D7-026","d":7,"obj":"7.5","diff":2,"q":"Backup tapes are rotated offsite. Which practice protects them throughout their life?","o":[["Reusing tapes indefinitely to save costs","Old media degrades and may fail during restore."],["Labeling tapes with only the date","Without a classification label, handlers cannot apply the right protection."],["Labeling, encryption and tracked custody","Correct. Media management covers marking, protection, tracking, storage and sanitization at end of life."],["Keeping the only copy in the server room","A single onsite copy is lost with the site."]],"a":2,"k":"Media management: label by classification, encrypt, track custody, store securely, retire and sanitize."},{"id":"D7-027","d":7,"obj":"7.5","diff":2,"q":"A company must keep backups of critical data protected even if an attacker gains administrator access to the backup system. Which technique helps MOST?","o":[["Storing backups on a file share mapped to every server","Mapped shares are easily reached and encrypted by ransomware."],["Immutable or offline backup copies","Correct. Write-once or air-gapped copies cannot be altered or deleted by an attacker with online access."],["Compressing backups to save space","Compression does not protect integrity or availability."],["Running backups more frequently on the same system","More copies in the same reachable place do not survive a targeted attack."]],"a":1,"k":"Protect backups from ransomware with immutability, offline or air-gapped copies and separate credentials."},{"id":"D7-028","d":7,"obj":"7.6","diff":1,"q":"Following the incident management steps in the CISSP Official Study Guide, what comes immediately after detection?","o":[["Mitigation","Mitigation (containment) follows response."],["Response","Correct. The order is detection, response, mitigation, reporting, recovery, remediation, lessons learned."],["Recovery","Recovery comes later, after mitigation and reporting."],["Lessons learned","Lessons learned is the final step."]],"a":1,"k":"OSG incident steps: detection → response → mitigation → reporting → recovery → remediation → lessons learned."},{"id":"D7-029","d":7,"obj":"7.6","diff":2,"q":"The SOC confirms that ransomware is spreading from one workstation to file servers. What should responders do FIRST?","o":[["Wipe and rebuild every affected server","Rebuilding is recovery; it comes after containment and evidence preservation."],["Contact the attackers to negotiate","Negotiation is a later business decision with legal input, not a first step."],["Isolate the affected systems","Correct. Containment by disconnecting affected systems from the network stops further spread and limits damage while the investigation continues."],["Publish a statement to customers","Communications follow the plan and legal guidance once the scope is understood."]],"a":2,"k":"Contain first to limit damage; then eradicate, recover and learn."},{"id":"D7-030","d":7,"obj":"7.6","diff":2,"q":"Which phase of the NIST SP 800-61 Rev. 2 incident response lifecycle includes building the team, tools and playbooks before any incident occurs?","o":[["Preparation","Correct. Preparation creates the capability to respond: people, processes, tools and communications."],["Detection and analysis","That phase begins when signs of an incident appear."],["Containment, eradication and recovery","That phase acts on an incident in progress."],["Post-incident activity","That phase captures lessons after an incident."]],"a":0,"k":"NIST 800-61 Rev. 2: preparation → detection and analysis → containment, eradication and recovery → post-incident activity. Rev. 3 (2025) maps response to the CSF 2.0 functions, but these phases remain common exam vocabulary."},{"id":"D7-031","d":7,"obj":"7.6","diff":2,"q":"During remediation after an incident, what is the MOST important activity?","o":[["Restoring systems from backup as fast as possible","Restoration is recovery; remediation fixes why the incident happened."],["Disciplining the employee who clicked the link","Blame does not fix the underlying weakness."],["Closing the ticket so metrics stay green","Closure without a fix invites repetition."],["Root cause analysis, then fixing the cause","Correct. Remediation identifies why the incident happened and corrects it to prevent recurrence."]],"a":3,"k":"Remediation = root cause analysis plus fixes; lessons learned improve the process itself."},{"id":"D7-032","d":7,"obj":"7.6","diff":2,"q":"A breach exposed customers' personal data. Who should decide what must be reported to regulators and customers, and when?","o":[["The SOC analyst who first detected the incident","Analysts detect and escalate; they do not make legal reporting decisions."],["Management, advised by legal counsel","Correct. Reporting obligations depend on law and contracts, so counsel advises and management decides."],["The IT help desk, using a standard template","The help desk lacks the authority and legal context."],["The affected customers themselves","Customers are recipients of notification, not the decision makers."]],"a":1,"k":"Incident reporting follows legal and contractual requirements; involve counsel and follow the communication plan."},{"id":"D7-033","d":7,"obj":"7.6","diff":2,"q":"What is the PRIMARY purpose of a lessons-learned meeting after an incident?","o":[["To identify the person to blame","A blame-focused review discourages honest reporting."],["To improve controls and the response process","Correct. The review captures what went well, what failed and what to change, feeding back into preparation."],["To close the incident ticket","Closing tickets is administrative."],["To estimate the cost of the incident for insurance","Costing may be part of the report, but improvement is the purpose."]],"a":1,"k":"Lessons learned should be blameless and lead to concrete improvements in controls, playbooks and training."},{"id":"D7-034","d":7,"obj":"7.6","diff":3,"q":"While containing an incident, a responder wants to power off a compromised server immediately. Why might the incident handler object?","o":[["Policy forbids powering off production servers","Policy rarely forbids it, and sometimes shutdown is the right call."],["Powering off would trigger an unplanned failover","Failover is an availability issue the handler can plan around; losing the memory contents cannot be undone."],["Volatile evidence in memory would be lost","Correct. Isolating the network while keeping power on can preserve memory evidence; the decision weighs evidence against further harm."],["The attacker would be alerted to the investigation","That may be a factor, but the key concern is losing volatile evidence."]],"a":2,"k":"Containment decisions balance stopping harm with preserving evidence; isolate the network before pulling power when possible."},{"id":"D7-035","d":7,"obj":"7.7","diff":2,"q":"What is the key difference between an IDS and an IPS?","o":[["An IDS inspects traffic; an IPS inspects logs","Both inspect traffic or host activity; the difference is whether they can block."],["An IPS sits inline and can block traffic; an IDS only alerts","Correct. An IPS can stop attacks in real time, at the risk of blocking legitimate traffic on a false positive."],["An IDS uses signatures and an IPS uses anomalies","Both can use signatures, anomaly detection or both."],["An IPS is host-based; an IDS is network-based","Both have network-based and host-based forms."]],"a":1,"k":"IDS: detect and alert (passive). IPS: detect and block (inline)."},{"id":"D7-036","d":7,"obj":"7.7","diff":2,"q":"Which detection method can recognize a new, previously unseen attack?","o":[["Signature-based detection using known patterns","Signatures match only attacks that are already known."],["Hash matching against a malware database","Hash matching catches only known files."],["A static access control list on the router","ACLs filter by rules, not by detecting attacks."],["Anomaly-based (behavioral) detection","Correct. Anomaly detection compares activity with a baseline of normal behavior, so it can flag novel attacks, at the cost of more false positives."]],"a":3,"k":"Signature: precise but blind to new attacks. Anomaly: catches the new, with more false positives."},{"id":"D7-037","d":7,"obj":"7.7","diff":2,"q":"A company wants to block SQL injection and cross-site scripting attempts against its public website. Which control fits BEST?","o":[["A web application firewall","Correct. A WAF inspects HTTP requests and responses at Layer 7 for application attacks."],["A packet-filtering router","Packet filters see addresses and ports, not application content."],["A VPN concentrator","VPNs encrypt connections; they do not inspect web attacks."],["A network-based antivirus appliance","Antivirus looks for malware, not injection attacks."]],"a":0,"k":"WAFs protect web applications; they complement, not replace, secure coding."},{"id":"D7-038","d":7,"obj":"7.7","diff":2,"q":"On a set of kiosk machines, only approved applications should ever run. Which control is MOST effective?","o":[["Signature-based antivirus","Antivirus blocks known malware but lets any other program run."],["A block list of known bad applications","Block lists cannot keep up with new software."],["Application allow listing","Correct. Allow listing permits only approved software, which suits fixed-purpose systems."],["A host-based intrusion detection system","A HIDS detects but does not restrict what runs."]],"a":2,"k":"Allow listing (whitelisting) denies everything not approved; block listing (blacklisting) allows everything not denied."},{"id":"D7-039","d":7,"obj":"7.7","diff":2,"q":"Suspicious email attachments are opened in an isolated virtual environment and their behavior observed before they are delivered. What is this?","o":[["A honeypot on the perimeter","A honeypot is a decoy to attract attackers."],["Sandboxing","Correct. A sandbox executes untrusted code in isolation to see what it does."],["Data masking of attachments","Masking hides data values."],["A DMZ for mail servers","A DMZ is a network zone, not a behavioral analysis tool."]],"a":1,"k":"Sandboxing detonates suspicious files safely to detect unknown malware by behavior."},{"id":"D7-040","d":7,"obj":"7.7","diff":3,"q":"A company sets up a honeypot that advertises \"free movie downloads\" on its network and then prosecutes the visitors. What legal concern arises?","o":[["Honeypots are illegal in most jurisdictions","Honeypots are legal and widely used for detection and research."],["The downloads could expose the company to copyright claims","A side issue at most; luring people into an offence and then prosecuting them is the core legal problem."],["Logging the visitors breaches privacy law","Monitoring one's own systems can be lawful with proper policy."],["It may amount to entrapment","Correct. Passive enticement is generally acceptable; actively luring people into an offense they would not otherwise commit may be entrapment."]],"a":3,"k":"Honeypots: enticement (an opportunity for someone already intent) is acceptable; entrapment (inducing a crime) is not."},{"id":"D7-041","d":7,"obj":"7.7","diff":2,"q":"The SOC adopts a machine-learning tool to detect malicious behavior. What is the MAIN operational concern?","o":[["Machine learning works poorly on network traffic","ML is widely used on network data."],["Its models need no tuning after deployment","Models need tuning and retraining as the environment changes; ignoring that is how ML tools fail."],["False positives, model drift and opaque reasoning","Correct. Models need tuning, retraining and human review, and their decisions can be hard to explain."],["Machine learning removes the need for analysts","ML assists analysts; it does not replace them."]],"a":2,"k":"AI and ML tools help detection but need validation, tuning, explainability and human oversight."},{"id":"D7-042","d":7,"obj":"7.7","diff":2,"q":"A small company outsources 24/7 monitoring to a managed security service provider. What must it still do?","o":[["Manage the provider and keep accountability","Correct. Define responsibilities, escalation and SLAs. Third-party services provide capability, but the organization remains accountable and must manage the relationship."],["Nothing; the provider takes full legal accountability","Accountability for security cannot be transferred."],["Give the provider unrestricted domain administrator access","Access should follow least privilege."],["Stop collecting any logs internally","The organization still needs the data the provider analyzes."]],"a":0,"k":"Third-party security services need clear contracts, SLAs, escalation paths and ongoing oversight."},{"id":"D7-043","d":7,"obj":"7.8","diff":2,"q":"A vendor releases a critical patch. What should be done before deploying it across production servers?","o":[["Wait six months to see if other companies have problems","That leaves a critical vulnerability open far too long."],["Test it in a non-production environment first","Correct. Testing catches compatibility problems before they cause outages; the change process then schedules deployment."],["Deploy it to all servers at once without testing","Untested patches can break production."],["Skip it if the servers are behind a firewall","Internal servers are still reachable by attackers already inside."]],"a":1,"k":"Patch management: evaluate, test, approve, deploy, verify, with an expedited path for emergencies."},{"id":"D7-044","d":7,"obj":"7.8","diff":3,"q":"A zero-day vulnerability with active exploitation is announced, and no patch exists. What should the organization do?","o":[["Wait for the vendor patch before taking any action","Waiting leaves systems exposed to active exploitation."],["Turn off all affected systems permanently","That may cause more harm than the risk itself."],["Ignore it because no CVE score is available yet","Active exploitation is reason enough to act."],["Apply mitigations and monitor until a fix ships","Correct. Vendor workarounds, configuration changes, virtual patching and focused monitoring reduce risk until a fix ships."]],"a":3,"k":"No patch? Mitigate (workarounds, WAF or IPS rules, isolation), monitor closely, then patch and verify."},{"id":"D7-045","d":7,"obj":"7.8","diff":2,"q":"How can an organization confirm that patches were actually applied across its estate?","o":[["By trusting the patch tool's \"deployment sent\" status","A sent deployment may have failed on the target."],["By asking each administrator in a survey","Self-reporting is unreliable."],["By rescanning to verify the vulnerabilities are gone","Correct. Verification closes the loop by measuring the actual state of systems."],["By checking the vendor's release notes","Release notes describe the patch, not your systems."]],"a":2,"k":"Verify patching with credentialed scans or compliance checks; report coverage as a metric."},{"id":"D7-046","d":7,"obj":"7.9","diff":2,"q":"In a formal change management process, what should happen BEFORE a change is implemented in production?","o":[["Users should be told only after it is complete","Communicating beforehand reduces disruption."],["Review, approval, testing and a rollback plan","Correct. A change is requested, reviewed for impact, approved, tested and scheduled with a way back."],["The change should be applied first and documented later","That is only acceptable for genuine emergencies, with documentation immediately after."],["Only the developer's approval is needed","Independent review prevents unsafe or unauthorized changes."]],"a":1,"k":"Change management: request → review and impact analysis → approve → test → implement → document, with rollback planned."},{"id":"D7-047","d":7,"obj":"7.9","diff":2,"q":"To stop an active attack, an administrator makes an emergency firewall change outside normal change approval. What must happen next?","o":[["Nothing; emergencies are exempt from change management","Emergency changes still require control."],["The change should be reversed once the attack stops","It may need to stay; reversal is a separate decision."],["The change is documented and reviewed retroactively","Correct. Emergency change procedures allow fast action, followed promptly by documentation and approval."],["The administrator should be disciplined for bypassing the process","Following the emergency procedure is not misconduct."]],"a":2,"k":"Emergency changes are allowed, but must be documented and reviewed after the fact."},{"id":"D7-048","d":7,"obj":"7.9","diff":2,"q":"A file integrity monitoring tool alerts that a production web server's configuration changed, but there is no matching change request. What does this MOST likely indicate?","o":[["The change process is working as intended","An unrecorded change means the process was bypassed."],["An unauthorized change that must be investigated","Correct. It could be a mistake or an attacker; either way, it needs investigation and possibly rollback."],["The monitoring tool is faulty and should be disabled","Disabling detection on the first alert is wrong."],["A routine automatic update that can be ignored","Approved automatic updates should still map to the change process."]],"a":1,"k":"Detect unauthorized changes (file integrity monitoring, drift detection) and reconcile against approved changes."},{"id":"D7-049","d":7,"obj":"7.10","diff":1,"q":"Which recovery site can take over operations within hours because it has current data and fully configured systems?","o":[["A hot site","Correct. Hot sites are fully equipped and kept in sync, offering the fastest recovery at the highest cost."],["A cold site with power and space only","Cold sites need equipment installed and data restored, which takes weeks."],["A warm site with equipment but no current data","Warm sites need data restored and configuration, which takes days."],["A reciprocal agreement with a partner company","Mutual assistance agreements are hard to enforce and rarely provide fast recovery."]],"a":0,"k":"Recovery sites: hot (hours, costly), warm (days), cold (weeks, cheapest); mobile and cloud options vary."},{"id":"D7-050","d":7,"obj":"7.10","diff":2,"q":"What is the main weakness of a mutual assistance (reciprocal) agreement as a recovery strategy?","o":[["It costs more than a hot site","Reciprocal agreements are usually cheap."],["It requires a third-party vendor","It is between two organizations, not a vendor."],["It requires dedicated hardware at both sites","It relies on spare capacity at the partner, not dedicated hardware."],["Enforcement and partner capacity","Correct. It is hard to enforce, and a partner may be hit by the same disaster or be unable to absorb your workload, and confidentiality is a concern."]],"a":3,"k":"Mutual assistance agreements are cheap but weak: enforcement, capacity, confidentiality and shared disasters."},{"id":"D7-051","d":7,"obj":"7.10","diff":2,"q":"A company takes a full backup every Sunday night and a differential backup every Monday through Saturday night. The server fails on Thursday morning. Which backups are needed to restore it?","o":[["Sunday's full backup and every differential from Monday to Wednesday","Each differential contains all changes since the full backup, so only the latest is needed."],["Sunday's full backup and Wednesday's differential","Correct. The latest differential holds every change since the last full backup."],["Wednesday's differential alone","A differential needs the full backup it is based on."],["Sunday's full backup alone","That loses Monday to Wednesday's changes."]],"a":1,"k":"Restore = full + latest differential, or full + every incremental since the full."},{"id":"D7-052","d":7,"obj":"7.10","diff":2,"q":"Which RAID level stripes data with parity across at least three disks and survives the failure of one disk?","o":[["RAID 0","RAID 0 stripes without redundancy; one failure loses everything."],["RAID 1","RAID 1 mirrors data across two disks."],["RAID 5","Correct. RAID 5 stripes data with distributed parity and tolerates one disk failure."],["RAID 10 with two disks","RAID 10 needs at least four disks and combines mirroring with striping."]],"a":2,"k":"RAID 0 striping (no fault tolerance), 1 mirroring, 5 striping with parity, 6 double parity, 10 mirrored stripes."},{"id":"D7-053","d":7,"obj":"7.10","diff":3,"q":"What distinguishes fault tolerance from high availability?","o":[["High availability requires no redundant components","HA depends on redundancy and failover."],["Fault tolerance applies to software, not hardware","Fault tolerance covers hardware too, such as redundant power supplies and RAID."],["They mean exactly the same thing","They differ in how failures affect service."],["Fault tolerance avoids any interruption","Correct. Fault-tolerant systems keep running through a failure; highly available systems recover quickly, minimizing downtime through failover."]],"a":3,"k":"Fault tolerance: no interruption. High availability: minimal interruption. QoS prioritizes critical traffic."},{"id":"D7-054","d":7,"obj":"7.11","diff":1,"q":"A fire breaks out in the data center during business hours. What is the FIRST priority?","o":[["Starting the backup tapes on their way to the recovery site","Data can be recovered; people cannot."],["Calling the insurance company","Insurance comes much later."],["The safety of personnel","Correct. Life safety always comes first in any disaster response."],["Shutting down the servers gracefully","Equipment is secondary to people's safety."]],"a":2,"k":"In every disaster, people first."},{"id":"D7-055","d":7,"obj":"7.11","diff":2,"q":"After a disaster, the organization moves operations to its recovery site. When the primary site is repaired, which functions should move back FIRST?","o":[["The most critical functions","Moving the most critical first risks them on a site that is not yet proven."],["The least critical functions","Correct. Least critical functions go first to prove the restored site before critical ones return."],["All functions at the same moment","A single cutover risks everything at once."],["Whichever functions the IT team prefers","Order should follow risk, not convenience."]],"a":1,"k":"Recover to the alternate site most-critical-first; return to the primary site least-critical-first."},{"id":"D7-056","d":7,"obj":"7.11","diff":2,"q":"Which DR process element ensures that employees, customers and regulators get accurate information during a disaster?","o":[["The backup schedule for critical data","Backups protect data, not communications."],["The hardware maintenance contract","Maintenance contracts cover equipment."],["The data classification policy","Classification governs handling, not crisis communication."],["A communications plan","Correct. The plan names spokespeople and methods: who communicates what, to whom, through which channels, including alternatives when normal systems are down."]],"a":3,"k":"DR processes include response, personnel, communications, assessment, restoration, training and lessons learned."},{"id":"D7-057","d":7,"obj":"7.12","diff":1,"q":"Team members meet in a conference room to walk through a disaster scenario and talk about their responses, without touching any systems. What type of test is this?","o":[["Structured walk-through (tabletop)","Correct. A tabletop has team members discuss their roles in a scenario."],["Parallel test at the recovery site","A parallel test runs systems at the recovery site."],["Full interruption test","A full interruption test shuts down the primary site."],["Simulation test with live systems","Simulations exercise the response to a scenario more realistically, often involving actual systems."]],"a":0,"k":"DR tests: checklist (read-through) → structured walk-through (tabletop) → simulation → parallel → full interruption."},{"id":"D7-058","d":7,"obj":"7.12","diff":2,"q":"Which DR test activates the recovery site and processes real data there, while the primary site keeps running normally?","o":[["Checklist test","A checklist test only has people review the plan."],["Structured walk-through","A walk-through is a discussion."],["Parallel test","Correct. A parallel test proves the recovery site works without disrupting operations at the primary site."],["Full interruption test","A full interruption test shuts down the primary site."]],"a":2,"k":"A parallel test proves recovery without risking operations; full interruption is the riskiest and rarest test."},{"id":"D7-059","d":7,"obj":"7.12","diff":3,"q":"Management proposes a full interruption test of the DR plan next month. What should the security professional advise?","o":[["It is the best test, so it should be run monthly","Its risk makes frequent use unwise."],["It is useless compared with a checklist review","It is the most realistic test; the issue is its risk."],["Build up to it with lesser tests, and get approval","Correct. A full interruption test can cause a real outage, so succeed first at less disruptive tests; it carries real business risk and need careful planning and senior management approval."],["It should be done without telling management, to make it realistic","Senior management must approve such a test."]],"a":2,"k":"Full interruption tests are the most realistic and the most dangerous; build up to them and get senior approval."},{"id":"D7-060","d":7,"obj":"7.13","diff":2,"q":"Who should take part in business continuity exercises?","o":[["Only the IT department and its vendors","Continuity covers business processes, not just IT."],["Only the security team","Security is one participant among many."],["Only senior management","Leaders decide, but the people who perform recovery must practice it."],["Everyone with a role in the plan","Correct. Exercises involve business process owners, IT and support functions, including facilities, HR, communications and key suppliers."]],"a":3,"k":"BC exercises involve business owners, IT, support functions and key suppliers; plans are updated from what is learned."},{"id":"D7-061","d":7,"obj":"7.13","diff":2,"q":"The company reorganized, moved offices and replaced its ERP system last year, but the BCP has not changed in three years. What is the MOST likely problem?","o":[["The plan lacks current executive sign-off","Sign-off may also be stale, but the core problem is that the plan describes offices and systems that no longer exist."],["It is out of date","Correct. The plan no longer reflects how the business works. BCPs must be maintained and retested when the business, technology or people change."],["Its recovery time objectives are too aggressive","The targets may need review, but the scenario points to content that no longer matches the organization."],["It relies on a single recovery site","Nothing in the scenario concerns the recovery site; the changes in structure, location and systems are what the plan missed."]],"a":1,"k":"Maintain the BCP: review it regularly and after significant change, and retest it."},{"id":"D7-062","d":7,"obj":"7.14","diff":1,"q":"Which fence height is generally considered enough to deter a determined intruder?","o":[["3 to 4 feet","That deters casual trespassers only."],["6 to 7 feet","That is difficult to climb but not a deterrent to the determined."],["8 feet with barbed wire on top","Correct. Eight feet or higher, topped with barbed or razor wire, deters determined intruders."],["Fence height makes no difference to deterrence","Height is the main factor in how much a fence deters."]],"a":2,"k":"Fences: 3–4 ft deters casual trespassers, 6–7 ft is hard to climb, 8 ft plus wire deters determined intruders."},{"id":"D7-063","d":7,"obj":"7.14","diff":2,"q":"Which physical security control is the MOST flexible, able to use judgment and respond to unexpected situations?","o":[["Motion detectors","Detectors only sense and alert."],["Security guards","Correct. Guards can assess situations and adapt, though they are expensive and can make errors or be deceived."],["Bollards","Bollards stop vehicles but cannot adapt."],["Badge readers","Readers apply fixed rules."]],"a":1,"k":"Guards are the most adaptable control; dogs are a strong deterrent; technology provides consistency."},{"id":"D7-064","d":7,"obj":"7.14","diff":2,"q":"A company wants to stop vehicles being driven through the glass front of its lobby. Which control fits BEST?","o":[["Brighter lighting at the entrance","Lighting deters and aids surveillance but does not stop a vehicle."],["A receptionist at the front desk","People cannot stop a vehicle."],["More CCTV cameras outside","Cameras record but do not prevent."],["Bollards","Correct. Bollards are a perimeter control that prevents vehicles from approaching or ramming entrances."]],"a":3,"k":"Perimeter controls: fences, gates, bollards, lighting, CCTV, guards; internal controls: locks, badges, vestibules."},{"id":"D7-065","d":7,"obj":"7.15","diff":2,"q":"Executives are travelling to a country known for state-sponsored industrial espionage. What is the BEST practice for their devices?","o":[["Bring their usual laptops and phones for convenience","Full devices carry full access and data into a high-risk environment."],["Leave their devices in hotel safes when not in use","Hotel safes are easily opened by staff or authorities."],["Disable encryption to pass through customs faster","That exposes data if the device is inspected or stolen."],["Issue clean loaner devices and reimage them on return","Correct. Loaners hold minimal data, and reimaging removes anything implanted during the trip."]],"a":3,"k":"Travel security: loaner devices, minimal data, VPN, and wiping and inspecting devices on return."},{"id":"D7-066","d":7,"obj":"7.15","diff":2,"q":"An employee being forced at gunpoint to open the vault can enter a special code that opens it but silently alerts security. What is this?","o":[["A clipping level","Clipping levels are monitoring thresholds."],["Two-person control","Two-person control requires two people for an action."],["A duress code","Correct. Duress codes signal coercion covertly while appearing to comply, protecting the employee."],["An access control vestibule","Vestibules control entry one person at a time."]],"a":2,"k":"Duress systems protect people: comply visibly, alert covertly."},{"id":"D7-067","d":7,"obj":"7.15","diff":2,"q":"An employee often posts office photos, travel plans and the names of the systems they administer. Which awareness topic addresses this MOST directly?","o":[["Oversharing details that attackers use for social engineering","Correct. Roles, systems, schedules and locations give phishers and pretexters the details that make their approaches convincing."],["Choosing strong, unique passwords for personal social media accounts","Good advice, but strong passwords do not stop the employee publishing what attackers use."],["Recognizing malicious links in direct messages","Useful, but the risk described is what the employee posts, not what they click."],["Reporting lost or stolen company devices","A different risk; these posts are published deliberately."]],"a":0,"k":"Personnel safety training covers social media exposure, insider threats, MFA fatigue and travel risk."},{"id":"D7-068","d":7,"obj":"7.15","diff":2,"q":"An employee notices a colleague copying large amounts of confidential data to a personal drive shortly after being denied a promotion. What should the employee do?","o":[["Confront the colleague directly","Confrontation can escalate the situation and tip them off."],["Ignore it to avoid getting involved","Ignoring possible insider activity lets it continue."],["Post about it on the team's internal chat channel","Public accusations harm the investigation and the person."],["Report it through the insider threat channel","Correct. Awareness programs should teach staff to recognize insider threat indicators and report them confidentially."]],"a":3,"k":"Insider threat programs rely on trained employees who report concerning behavior through confidential channels."},{"id":"D7-069","d":7,"obj":"7.10","diff":3,"q":"A company's DR plan restores its order database from nightly backups at a warm site. The business now says losing more than 15 minutes of orders is unacceptable. What must change?","o":[["Move to a hot site so systems come back faster","A faster site shortens downtime (RTO) but restores the same nightly data, so up to a day of orders could still be lost."],["Replicate or ship logs every few minutes","Correct. The new requirement is a 15-minute RPO, which concerns how current the copy is; nightly backups cannot meet it at any site."],["Run the backup twice each night","Two backups a night still leave a gap of many hours."],["Test the restore procedure every quarter","Testing is good practice, but it does not change how much data the backups capture."]],"a":1,"k":"RPO is met by backup or replication frequency; RTO by the recovery site and process. Do not confuse them."},{"id":"D7-070","d":7,"obj":"7.6","diff":3,"q":"During a ransomware incident, the incident commander learns the attackers also copied HR records containing personal data. Containment is under way. Which action is MOST urgent to add?","o":[["Pay the ransom so the HR data is not published","Payment does not guarantee deletion, may breach sanctions law, and is a management decision, not a response step."],["Involve legal counsel on notification deadlines","Correct. A personal data breach can start legal notification clocks, such as 72 hours under GDPR; counsel must assess them while the technical response continues."],["Restore the HR system from backups first","Recovery matters, but the exfiltration creates legal duties with deadlines that run in parallel."],["Delete the remaining HR records to limit exposure","Destroying records may breach retention duties and destroys evidence."]],"a":1,"k":"When personal data is exfiltrated, legal notification clocks start; bring in counsel early, alongside containment."},{"id":"D8-001","d":8,"obj":"8.1","diff":1,"q":"In which development methodology does each phase finish before the next begins, with little provision for going back?","o":[["Waterfall","Correct. Waterfall is sequential; changes discovered late are expensive."],["Agile with two-week sprints","Agile delivers in short iterations and expects change."],["The spiral model with repeated risk analysis","Spiral iterates through planning, risk analysis, engineering and evaluation."],["DevOps with continuous delivery","DevOps integrates development and operations for frequent, continuous releases."]],"a":0,"k":"Waterfall: sequential. Spiral: iterative and risk-driven. Agile: iterative and adaptive. DevOps: continuous delivery."},{"id":"D8-002","d":8,"obj":"8.1","diff":2,"q":"Which development model is built around repeated cycles, each starting with a risk analysis, which makes it suitable for large, high-risk projects?","o":[["Waterfall with a final security review","Waterfall does not repeat risk analysis in cycles."],["The spiral model","Correct. Each loop of the spiral includes risk analysis, and prototypes reduce uncertainty."],["Scrum with a product backlog","Scrum is an Agile framework built on sprints, not risk-analysis loops."],["Rapid application development with prototypes only","RAD emphasizes speed and prototyping, not formal risk analysis each cycle."]],"a":1,"k":"The spiral model puts risk analysis at the heart of every iteration."},{"id":"D8-003","d":8,"obj":"8.1","diff":2,"q":"A company moving to DevSecOps wants to \"shift left\". What does that mean?","o":[["Moving security reviews to just before release","That is shifting right, late in the pipeline."],["Letting operations own all security decisions","DevSecOps shares responsibility across teams."],["Building security in from the start","Correct. Security starts at the earliest stages: threat modeling, secure coding and automated testing happen early, when fixes are cheapest."],["Removing security testing to speed up delivery","DevSecOps automates security testing rather than removing it."]],"a":2,"k":"DevSecOps: security is everyone's job, automated in the pipeline, and starts at the beginning."},{"id":"D8-004","d":8,"obj":"8.1","diff":2,"q":"In the Capability Maturity Model, which level describes processes that are measured and controlled quantitatively?","o":[["Repeatable","Repeatable (level 2) means basic project management processes exist."],["Defined","Defined (level 3) means processes are documented and standardized."],["Managed","Correct. Managed (level 4) uses quantitative measures to control processes."],["Optimizing","Optimizing (level 5) focuses on continuous improvement."]],"a":2,"k":"CMM levels: 1 Initial, 2 Repeatable, 3 Defined, 4 Managed, 5 Optimizing."},{"id":"D8-005","d":8,"obj":"8.1","diff":2,"q":"Which maturity model is designed specifically to assess and improve an organization's software security practices across governance, design, implementation, verification and operations?","o":[["OWASP SAMM","Correct. The Software Assurance Maturity Model organizes software security practices into those five business functions."],["The IDEAL model","IDEAL is a general model for organizational improvement: initiating, diagnosing, establishing, acting, learning."],["ITIL service management","ITIL covers IT service management."],["The Common Criteria evaluation levels","Common Criteria evaluates products, not development organizations."]],"a":0,"k":"SAMM measures software security maturity; CMM measures process maturity in general."},{"id":"D8-006","d":8,"obj":"8.1","diff":2,"q":"In software change management, which stage makes sure that only tested and approved code reaches production?","o":[["Request control","Request control manages incoming change requests and their prioritization."],["Change control","Change control covers analyzing and developing the change."],["Configuration audit","Audits verify configurations; they do not gate releases."],["Release control","Correct. Release control approves releases, often including acceptance testing, before deployment."]],"a":3,"k":"Software change management: request control → change control → release control."},{"id":"D8-007","d":8,"obj":"8.1","diff":2,"q":"A program assembles a team of developers, security, operations, testers and business representatives who share responsibility for a system from the start. What is this?","o":[["A change advisory board","A CAB approves changes; it does not build the product."],["An integrated product team","Correct. An IPT brings all stakeholders, including security, together throughout development."],["A red team","A red team emulates attackers."],["A computer security incident response team","A CSIRT responds to incidents."]],"a":1,"k":"Integrated product teams (IPTs) build security and operations concerns in from the start."},{"id":"D8-008","d":8,"obj":"8.1","diff":1,"q":"When should security requirements be defined for a new application?","o":[["Alongside functional needs, at project start","Correct. Security requirements belong in the requirements phase alongside functionality."],["After the first release, based on user feedback","Post-release security is reactive and costly."],["During penetration testing before go-live","Testing finds problems; it does not define requirements."],["When a customer asks for them","Security is the organization's responsibility, whether asked or not."]],"a":0,"k":"Security requirements start at the beginning of the SDLC."},{"id":"D8-009","d":8,"obj":"8.1","diff":2,"q":"An application in production needs an urgent security fix. Which practice keeps operation and maintenance secure?","o":[["Developers patch production directly to save time","Direct changes bypass testing and approval."],["Skip testing because the fix is small","Small changes can still break things or introduce flaws."],["Use the change process, expedited if needed","Correct. O&M changes go through change management, including testing and documentation, with an expedited path for emergencies."],["Wait for the next major release","Delaying an urgent fix leaves the vulnerability open."]],"a":2,"k":"Operation and maintenance changes still follow change management; urgency changes speed, not control."},{"id":"D8-010","d":8,"obj":"8.1","diff":2,"q":"In Scrum, which artifact holds the prioritized list of work, including security requirements and user stories?","o":[["The sprint retrospective","A retrospective is a meeting to improve the process."],["The burndown chart","A burndown chart tracks remaining work over time."],["The product backlog","Correct. Security requirements and abuse cases should be in the product backlog so they are planned like any other work."],["The daily stand-up","The stand-up is a short coordination meeting."]],"a":2,"k":"In Agile, security work belongs in the backlog with definitions of done, not in a separate afterthought."},{"id":"D8-011","d":8,"obj":"8.1","diff":3,"q":"A large enterprise coordinates dozens of Agile teams with shared planning increments and portfolio governance. Which approach is this?","o":[["Waterfall with phase gates","Waterfall is not an Agile framework."],["Extreme Programming (XP)","XP is a team-level Agile practice focused on engineering."],["The spiral model with risk loops","Spiral is an iterative risk-driven model, not an enterprise Agile framework."],["Scaled Agile Framework (SAFe)","Correct. SAFe scales Agile across many teams with program increments and portfolio management."]],"a":3,"k":"The 2024 outline names SAFe alongside Agile, Waterfall, DevOps and DevSecOps."},{"id":"D8-012","d":8,"obj":"8.2","diff":2,"q":"Which tool identifies the open-source libraries an application uses and reports their known vulnerabilities and licenses?","o":[["Dynamic application security testing","DAST tests the running application from outside."],["Software composition analysis","Correct. SCA inventories third-party components and checks them against vulnerability and license databases."],["Static application security testing","SAST analyzes the organization's own code for flaws."],["Interactive application security testing","IAST instruments the running app to find flaws during testing."]],"a":1,"k":"SCA covers third-party components; SAST covers your code; DAST covers the running app; IAST instruments it."},{"id":"D8-013","d":8,"obj":"8.2","diff":2,"q":"Which approach instruments software while it runs during functional tests, combining insight from inside the code with real execution?","o":[["Interactive application security testing","Correct. IAST agents observe code paths and data flows during testing, which reduces false positives."],["Static analysis of the source code","SAST does not run the code."],["Black-box dynamic scanning from outside","DAST has no visibility inside the application."],["Manual code review by peers","Code review is human reading, not instrumentation."]],"a":0,"k":"IAST combines SAST-like visibility with DAST-like execution."},{"id":"D8-014","d":8,"obj":"8.2","diff":2,"q":"A developer accidentally commits a cloud access key to a public code repository. What should be done FIRST?","o":[["Delete the commit from the repository history","Others may already have copied the key; deletion alone is not enough."],["Make the repository private","The key may already be harvested by automated scanners."],["Email the team to remind them about secrets","Awareness helps later but does nothing about the exposed key."],["Revoke and rotate the key","Correct. Assume compromise: invalidate the key immediately, then review its use and clean up the history."]],"a":3,"k":"Exposed secrets: revoke and rotate first, then investigate and prevent recurrence with secret scanning and vaults."},{"id":"D8-015","d":8,"obj":"8.2","diff":2,"q":"Which practice BEST secures a CI/CD pipeline?","o":[["Giving the pipeline service account global admin rights","Excessive pipeline permissions make it a powerful target."],["Least-privilege runners, vaulted secrets and signed artifacts","Correct. Pipelines are part of the attack surface: protect credentials, restrict permissions and verify build outputs."],["Allowing any developer to change pipeline definitions without review","Unreviewed pipeline changes can inject malicious steps."],["Storing credentials in plain text in the pipeline configuration","Plain-text secrets in configuration are easily exposed."]],"a":1,"k":"Secure the software supply chain: protected pipelines, vaulted secrets, reviewed changes, signed and verified artifacts."},{"id":"D8-016","d":8,"obj":"8.2","diff":2,"q":"Which programming language characteristic MOST reduces buffer overflow vulnerabilities?","o":[["Dynamic typing","Typing discipline is not what prevents overflows."],["Compilation directly to native machine code","Native compilation is common in languages prone to overflows."],["Memory safety with bounds checking","Correct. Memory-safe languages prevent out-of-bounds reads and writes that cause overflows."],["Support for inline assembly","Inline assembly bypasses language protections."]],"a":2,"k":"Memory-safe languages (Rust, Java, C#, Go) eliminate whole classes of memory corruption bugs."},{"id":"D8-017","d":8,"obj":"8.2","diff":2,"q":"How should source code repositories be protected?","o":[["Allow anonymous write access to speed up collaboration","Anonymous writes destroy accountability and integrity."],["Store production credentials in the repository for convenience","Secrets in repositories are a common breach source."],["Let anyone merge directly to the main branch","Unreviewed merges allow malicious or flawed code into releases."],["Strong authentication, branch protection and required reviews","Correct. Repositories hold the organization's code and must be protected for integrity and confidentiality."]],"a":3,"k":"Repository security: MFA, least privilege, branch protection, required reviews, signed commits and secret scanning."},{"id":"D8-018","d":8,"obj":"8.2","diff":2,"q":"In a development ecosystem, what is the role of software configuration management (SCM)?","o":[["Versioning and tracking changes to code and settings","Correct. SCM gives an auditable history of what changed, when and by whom, and lets teams rebuild any version."],["Scanning committed code for vulnerabilities","That is application security testing."],["Approving production changes at the change advisory board","The CAB is part of change management."],["Monitoring production servers for performance","That is operations monitoring."]],"a":0,"k":"SCM provides version control, baselines and auditability for code and configuration."},{"id":"D8-019","d":8,"obj":"8.2","diff":2,"q":"A security team wants a protection that runs inside the application and blocks attacks such as injection at run time. What is this?","o":[["A web application firewall at the network edge","A WAF filters traffic outside the application."],["Static analysis in the build pipeline","SAST runs before deployment."],["Software composition analysis","SCA examines components, not run-time attacks."],["Runtime application self-protection (RASP)","Correct. RASP instruments the runtime to detect and block attacks with the application's own context."]],"a":3,"k":"Runtime protections (RASP) complement secure coding and WAFs."},{"id":"D8-020","d":8,"obj":"8.2","diff":3,"q":"A developer installs an IDE plugin from an unknown publisher that requests access to the whole file system and network. What is the main risk?","o":[["The plugin may break the build for other developers","A faulty plugin can disrupt work, but broad file system and network access points to data theft as the main risk."],["Theft of source code or secrets","Correct. Development tools are part of the attack surface; malicious extensions can steal code and credentials."],["The plugin may conflict with other installed extensions","Compatibility problems are a nuisance, not the main security risk."],["The plugin may introduce bugs into compiled code","Possible, but less likely and less damaging than a plugin quietly reading code and secrets and sending them out."]],"a":1,"k":"Tool sets and IDEs are part of the supply chain: approve, vet and limit extensions."},{"id":"D8-021","d":8,"obj":"8.2","diff":2,"q":"Which platform automates security response workflows, such as enriching an alert and isolating a host, by running playbooks across many tools?","o":[["SIEM","A SIEM collects and correlates events; it does not mainly orchestrate responses."],["SCA","SCA analyzes software components."],["SOAR","Correct. Security orchestration, automation and response executes playbooks across integrated tools."],["SAST","SAST analyzes source code."]],"a":2,"k":"SOAR automates and orchestrates response; SIEM detects and correlates."},{"id":"D8-022","d":8,"obj":"8.3","diff":2,"q":"How can an organization show who changed a critical application's code and when?","o":[["By asking developers to remember their changes","Memory is unreliable and unverifiable."],["By checking the application's file timestamps","Timestamps can be changed and do not show who made changes."],["By reviewing the latest release notes only","Release notes summarize changes; they are not an audit trail."],["By auditing the version control history and change logs","Correct. Auditing and logging of changes, tied to individual identities, makes software changes accountable."]],"a":3,"k":"Assess software security effectiveness through audited, attributable change logs."},{"id":"D8-023","d":8,"obj":"8.3","diff":2,"q":"Which measure BEST shows whether a secure development program is effective?","o":[["Vulnerability trends per release","Correct. Trends in vulnerabilities found per release, and how fast they are fixed, show whether fewer flaws reach production and how quickly they are closed."],["The number of developers who attended secure coding training","Attendance is an input; it does not show whether fewer flaws reach production."],["The total lines of code written per month","Productivity is not a security outcome."],["How many tools the security team has bought","Tools are inputs, not outcomes."]],"a":0,"k":"Measure software security by outcomes: defect density, time to remediate, escaped vulnerabilities."},{"id":"D8-024","d":8,"obj":"8.3","diff":2,"q":"A risk analysis of a new feature finds that it could expose personal data through an API. What should happen next?","o":[["Ship it and monitor for complaints","Knowingly shipping an unmitigated risk ignores the analysis."],["Mitigate the risk, then verify","Correct. Risk analysis leads to mitigation, such as access controls and data minimization, and then testing that it works."],["Cancel the whole product","Cancellation may be unnecessary if the risk can be mitigated."],["Hide the API's documentation","Obscurity does not protect the data."]],"a":1,"k":"Risk analysis in development leads to mitigations that are verified before release."},{"id":"D8-025","d":8,"obj":"8.3","diff":2,"q":"Users need assurance that an installer really comes from the vendor and has not been altered. What should the vendor do?","o":[["Publish the installer on a popular download site","Distribution channels can be compromised."],["Publish an MD5 checksum on the same download page","A checksum next to the file can be replaced along with it, and MD5 is broken; it shows integrity at best, never origin."],["Distribute it only over HTTPS","HTTPS protects the download from that site, but the file carries no proof of origin once copied elsewhere."],["Sign it with a code-signing certificate","Correct. Code signing provides integrity and proves the publisher's identity."]],"a":3,"k":"Code signing proves authorship and integrity, but not that the code is safe."},{"id":"D8-026","d":8,"obj":"8.4","diff":2,"q":"Before buying a commercial off-the-shelf (COTS) application, what should the security team do?","o":[["Rely on the vendor's marketing claims","Marketing is not assurance."],["Assess the vendor's security with evidence","Correct. Assess acquired software through evidence: questionnaires, independent reports, testing and enforceable requirements."],["Reverse engineer the product to find its flaws","Licenses usually prohibit reverse engineering, and it is rarely practical."],["Buy it, then assess it after deployment","Assessment should inform the purchase decision."]],"a":1,"k":"Assess acquired software before purchase: vendor practices, attestations, testing, SBOM and contract terms."},{"id":"D8-027","d":8,"obj":"8.4","diff":2,"q":"A company depends on a small vendor's custom software. What protects the company if the vendor goes out of business?","o":[["Buying extra licenses in advance","Licenses do not help if no one can maintain the software."],["An extended warranty","Warranties end with the vendor."],["A source code escrow agreement","Correct. A third party holds the source code and releases it under defined conditions, such as vendor failure."],["A non-disclosure agreement","An NDA protects confidentiality, not continuity."]],"a":2,"k":"Software escrow protects customers against a vendor's failure to support critical software."},{"id":"D8-028","d":8,"obj":"8.4","diff":2,"q":"Developers want to use an open-source library in a commercial product. What should be checked BEFORE adopting it?","o":[["The number of stars it has on the hosting site","Popularity is not assurance."],["Whether its documentation is available in several languages","Good documentation is helpful, but it says nothing about legal or security risk."],["Whether the maintainer lives in the same country","Location is rarely the deciding factor."],["Its license, vulnerabilities and upkeep","Correct. Open-source components carry legal and security risk; check licenses, vulnerabilities and project health."]],"a":3,"k":"Open-source due diligence: license compatibility, vulnerability history, maintenance activity and provenance."},{"id":"D8-029","d":8,"obj":"8.4","diff":2,"q":"The company adopts a SaaS customer relationship management platform. Which security responsibility remains with the company?","o":[["Patching the SaaS application servers","The provider patches its platform."],["Physical security of the provider's data centers","That is the provider's job."],["Its users, access settings and data","Correct. Customers keep responsibility for identities, configuration and how their data is used and shared."],["Writing the SaaS application's code","The provider develops the application."]],"a":2,"k":"Acquired cloud services shift infrastructure duties but never data, identity and configuration responsibility."},{"id":"D8-030","d":8,"obj":"8.4","diff":3,"q":"A managed service provider will run the company's enterprise resource planning (ERP) system. Which is the MOST important security consideration in the contract?","o":[["The provider's office location and staff size","Location matters only through data residency requirements."],["The provider's preferred programming language","Not a contract security priority."],["The brand of server hardware the provider uses","Hardware choice is the provider's operational decision; the contract should focus on obligations and outcomes."],["Enforceable security and exit terms","Correct. Security requirements, breach notification, audit rights and exit terms: managed services need enforceable obligations and a way to verify them and leave safely."]],"a":3,"k":"Managed services: define security requirements, SLAs, incident notification, right to audit and data return at exit."},{"id":"D8-031","d":8,"obj":"8.4","diff":2,"q":"A vendor refuses to say which third-party components its product contains. Which request would MOST improve visibility of supply chain risk?","o":[["A software bill of materials","Correct. An SBOM lists components and versions so new vulnerabilities can be matched quickly."],["A list of the vendor's customers","Customer lists say nothing about components."],["The vendor's marketing roadmap","Roadmaps describe future features."],["The vendor's financial statements","Financial health matters but does not reveal components."]],"a":0,"k":"Ask suppliers for SBOMs to manage vulnerabilities in acquired software."},{"id":"D8-032","d":8,"obj":"8.5","diff":2,"q":"Which coding practice MOST effectively prevents SQL injection?","o":[["Escaping single quotes with a custom function","Custom escaping is error-prone and easy to bypass."],["Parameterized queries (prepared statements)","Correct. Parameters keep data separate from SQL code, so input cannot change the query's structure."],["Hiding database error messages from users","Hiding errors makes attacks harder to tune but does not prevent injection."],["Using a longer database password","Credential strength does not stop injection through the application."]],"a":1,"k":"Prevent injection with parameterized queries, least-privilege database accounts and input validation."},{"id":"D8-033","d":8,"obj":"8.5","diff":2,"q":"A forum displays users' posts without encoding them, so a posted script runs in every reader's browser. What is this vulnerability?","o":[["SQL injection","SQL injection targets the database."],["Cross-site request forgery","CSRF tricks a browser into sending unwanted requests."],["Stored cross-site scripting","Correct. Stored XSS saves malicious script on the server and serves it to other users."],["Server-side request forgery","SSRF makes the server send requests to places it should not."]],"a":2,"k":"XSS: reflected, stored or DOM-based. Prevent with output encoding, input validation and Content Security Policy."},{"id":"D8-034","d":8,"obj":"8.5","diff":2,"q":"A malicious site causes a logged-in user's browser to submit a funds transfer to their bank without their knowledge. Which defense addresses this?","o":[["Anti-CSRF tokens and SameSite cookies","Correct. Unpredictable per-request tokens and SameSite cookies stop forged cross-site requests."],["Output encoding of user input","Output encoding prevents XSS, not CSRF."],["Parameterized SQL queries","These prevent SQL injection."],["Longer session timeouts","Longer sessions make CSRF easier."]],"a":0,"k":"CSRF abuses the browser's automatic credentials; defend with tokens, SameSite cookies and reauthentication for sensitive actions."},{"id":"D8-035","d":8,"obj":"8.5","diff":3,"q":"An application fetches images from URLs that users supply. An attacker submits an internal address and retrieves the cloud provider's metadata service, including credentials. What is this vulnerability?","o":[["Cross-site scripting","XSS runs scripts in users' browsers."],["Directory traversal","Traversal accesses files outside the intended directory."],["Insecure direct object reference","IDOR accesses other users' objects by changing identifiers."],["Server-side request forgery","Correct. SSRF makes the server issue requests to internal resources; allow-list destinations and block metadata endpoints."]],"a":3,"k":"SSRF: validate and allow-list outbound destinations, block internal and metadata addresses, and segment the network."},{"id":"D8-036","d":8,"obj":"8.5","diff":2,"q":"Where must input validation be enforced to be effective?","o":[["In client-side JavaScript, for speed","Attackers bypass client-side checks easily."],["On the server, using allow lists","Correct. Server-side validation against expected formats cannot be bypassed by the client; client checks are for usability only."],["In the database, through constraints","Validation should happen before data reaches the database."],["Nowhere, if a WAF is in place","WAFs are a supplement, not a replacement for validation."]],"a":1,"k":"Validate input on the server with allow lists; treat all client input as untrusted."},{"id":"D8-037","d":8,"obj":"8.5","diff":2,"q":"A program copies user input into a fixed-size buffer without checking its length, letting an attacker overwrite adjacent memory. What should developers do to fix the flaw?","o":[["Increase the buffer size","A bigger buffer only raises the threshold for overflow."],["Run the program as administrator","Elevated privileges make exploitation worse."],["Check input length and use safe functions","Correct. Bounds checking and safe library functions prevent the overflow; compiler and OS protections add layers."],["Mark the stack as non-executable","A non-executable stack makes exploitation harder but leaves the overflow in place; attackers can still corrupt data or reuse existing code."]],"a":2,"k":"Buffer overflows: bounds checking, safe functions, memory-safe languages, plus ASLR and DEP as extra layers."},{"id":"D8-038","d":8,"obj":"8.5","diff":3,"q":"A program checks that a file is safe, then opens it a moment later. An attacker swaps the file in between. What is this flaw?","o":[["An integer overflow","Integer overflows involve arithmetic exceeding a type's range."],["Cross-site scripting","XSS is a web output problem."],["Covert storage channel","Covert channels communicate information secretly."],["A TOCTOU race condition","Correct. Time-of-check to time-of-use flaws exploit the gap between a check and the use of what was checked."]],"a":3,"k":"TOCTOU race conditions: make check-and-use atomic, use file handles rather than names, and use locking."},{"id":"D8-039","d":8,"obj":"8.5","diff":2,"q":"A web application displays full stack traces and database errors to users when something fails. What should be done?","o":[["Keep them, because they help users report bugs","Detailed errors give attackers information about the system."],["Show generic messages and log details internally","Correct. Secure error handling reveals nothing useful to attackers while preserving details for developers."],["Disable all error logging","Developers and responders need the details."],["Show the details only to users who are logged in","Logged-in users can be attackers too; detailed errors should not reach any user."]],"a":1,"k":"Fail securely: generic messages to users, detailed logs internally."},{"id":"D8-040","d":8,"obj":"8.5","diff":2,"q":"An API returns any customer's records when a user simply changes the customer ID in the request. What is the flaw?","o":[["Missing rate limiting","Rate limiting slows abuse but is not the root cause."],["Weak TLS configuration","Transport security is not involved."],["Broken object-level authorization","Correct. The API must check that the caller is allowed to access each specific object, not just that they are logged in."],["Lack of input validation on the ID format","A well-formed ID for another customer would still be returned."]],"a":2,"k":"API security: authorize every object access, authenticate callers, rate-limit, validate input and log."},{"id":"D8-041","d":8,"obj":"8.5","diff":2,"q":"Developers left an undocumented command in production code that bypasses authentication \"for support purposes\". What is this called?","o":[["A logic bomb","A logic bomb triggers malicious action on a condition."],["A maintenance hook (backdoor)","Correct. Maintenance hooks bypass normal controls and must be removed before release."],["A covert timing channel","Covert channels leak information through timing or storage."],["A polymorphic virus","Polymorphic viruses change their code to evade detection."]],"a":1,"k":"Remove maintenance hooks and backdoors before release; code review and testing should look for them."},{"id":"D8-042","d":8,"obj":"8.5","diff":2,"q":"In object-oriented design, which combination is considered best for secure, maintainable code?","o":[["Low cohesion and high coupling","That is the worst combination: modules do many things and depend heavily on each other."],["High cohesion and high coupling","High coupling makes changes ripple and isolation difficult."],["High cohesion and low coupling","Correct. Modules that do one thing well and depend little on others are easier to secure and test."],["Low cohesion and low coupling","Low cohesion makes modules hard to understand."]],"a":2,"k":"Aim for high cohesion and low coupling; encapsulation hides internal details."},{"id":"D8-043","d":8,"obj":"8.5","diff":3,"q":"An application deserializes objects received from users without validation, allowing an attacker to run code on the server. What is the BEST mitigation?","o":[["Compress serialized data before sending it","Compression does not prevent malicious objects."],["Validate the objects' fields after deserializing them","Too late: the attack runs during deserialization itself, before any field check can happen."],["Move the server behind a corporate VPN","Internal attackers or compromised clients can still send payloads."],["Don't deserialize untrusted data","Correct. Avoid deserializing untrusted input; where unavoidable, use strict type allow lists and integrity checks to restrict what can be created."]],"a":3,"k":"Insecure deserialization: avoid native deserialization of untrusted data; prefer simple data formats with schema validation."},{"id":"D8-044","d":8,"obj":"8.5","diff":2,"q":"A cloud team defines firewall rules, encryption settings and access policies in code that is deployed and enforced automatically. What does the 2024 outline call this?","o":[["Security through obscurity","Nothing is hidden here."],["Static application security testing","SAST analyzes source code for flaws."],["Shadow IT","Shadow IT is unapproved technology."],["Software-defined security","Correct. Security controls defined and enforced through software and APIs can be versioned, reviewed and applied consistently."]],"a":3,"k":"Software-defined security treats controls as code: versioned, reviewed, tested and automatically enforced."},{"id":"D8-045","d":8,"obj":"8.5","diff":2,"q":"Where should an application store the database password it needs at run time?","o":[["Hard-coded in the source code","Hard-coded secrets end up in repositories and binaries."],["In a comment at the top of the configuration file","Anyone with file access can read it."],["In a secrets manager","Correct. The application retrieves it at run time; a secrets manager controls access, audits use and supports rotation without code changes."],["In the application's public README","Public documentation is the worst place for a secret."]],"a":2,"k":"Never hard-code secrets; use a secrets manager or vault, with rotation and least-privilege access."},{"id":"D8-046","d":8,"obj":"8.5","diff":3,"q":"Which security weakness at the source-code level is MOST likely to be found by static analysis but missed by a quick functional test?","o":[["A slow page load under heavy user traffic","Performance is found by load testing."],["Unvalidated input on a rarely used path","Correct. For example, input that reaches a SQL query unvalidated. SAST follows data flows through all code paths, including ones functional tests rarely exercise."],["A misconfigured TLS certificate on the server","Server configuration is found by scanning the running system."],["A missing HTTP security header on responses","Headers appear in every response, so dynamic scanning of the running site finds them easily."]],"a":1,"k":"Static analysis sees every path in the code; dynamic testing sees only what it exercises."},{"id":"D8-047","d":8,"obj":"8.4","diff":3,"q":"A team wants to add a popular open-source package maintained by one volunteer and last updated three years ago. It has no known CVEs. What is the BEST assessment?","o":[["Approve it, because no known vulnerabilities means low risk","No CVEs may only mean no one is looking; an unmaintained package will not get fixes when flaws appear."],["Treat it as abandoned: plan to fork, replace or watch it","Correct. Maintenance health is a supply chain risk: a dormant single-maintainer project may never patch future flaws and could be taken over."],["Prefer a commercial package with a support contract","Support can help, but a vendor product is not automatically safer; the issue to assess is this package's maintenance health."],["Approve it after scanning the package with antivirus","Antivirus looks for known malware, not for maintenance or vulnerability risk."]],"a":1,"k":"Assess open-source dependencies on maintenance health, not just known CVEs."},{"id":"D8-048","d":8,"obj":"8.5","diff":3,"q":"A web application stores user-supplied display names with parameterized queries. An admin page later shows the names, and a crafted name runs script in administrators' browsers. Where should the fix go?","o":[["Stricter parameterized queries when storing the names","Parameterized queries prevent SQL injection; they do nothing about how data is rendered in HTML."],["Context-aware output encoding on the admin page","Correct. This is stored cross-site scripting: data must be encoded for the context where it is output, whatever was done at input."],["A web application firewall rule blocking the word \"script\"","Simple filters are easy to bypass and leave the page rendering untrusted data."],["Encrypting the names in the database","The page decrypts and renders them, so the script still runs."]],"a":1,"k":"Stored XSS is fixed by output encoding where the data is rendered; input-side SQL protection does not cover it."}],"drills":{"sequences":[{"id":"seq-incident","obj":"7.6","title":"Incident management steps","prompt":"Put the incident management steps in the order the ISC2 study guide teaches.","steps":["Detection","Response","Mitigation","Reporting","Recovery","Remediation","Lessons learned"],"note":"Mitigation contains the incident. Reporting starts early and continues; remediation fixes the root cause after systems are recovered, and lessons learned closes the loop."},{"id":"seq-bcp","obj":"1.7","title":"Business continuity planning","prompt":"Order the phases of the business continuity planning process.","steps":["Project scope and planning","Business impact anal
