trols such as DLP or approved tools follow."],["Discipline the employees involved to set an example for others","Without a clear policy, discipline is hard to justify and does not fix the root cause."],["Ask the AI provider to delete the submitted code","Worth trying, but it does nothing to prevent the next occurrence."]],"a":1,"k":"Emerging technology risks (AI, crypto, blockchain) start with policy and awareness, followed by technical controls."},{"id":"D1-067","d":1,"obj":"1.9","diff":2,"q":"An e-commerce web server costs $50,000 to replace. A denial-of-service attack takes the site down for 5 hours without damaging any hardware, and such attacks are expected twice a year. The site earns $10,000 per hour. What is the annualized loss expectancy for this threat?","o":[["$100,000","Correct. The loss per event is lost revenue: 5 hours × $10,000 = $50,000. Twice a year gives an ALE of $100,000. The hardware value is irrelevant because it is not damaged."],["$50,000","$50,000 is the single loss expectancy, one event's loss, not the annual figure."],["$200,000","This double-counts by adding the server's replacement cost to each event."],["$25,000","This halves the per-event loss instead of doubling it."]],"a":0,"k":"Value what the threat actually destroys. For an outage, that is often lost revenue and productivity, not the hardware."},{"id":"D1-068","d":1,"obj":"1.4","diff":3,"q":"A customer in the EU asks your company to erase all of their personal data. Tax law requires you to keep their invoices for seven years. What should you do?","o":[["Refuse the request, because any legal retention duty overrides the right to erasure","The retention duty covers only the invoices. Refusing everything ignores the rest of the customer's data."],["Delete everything, including the invoices, because the customer's rights take precedence","Deleting records you are legally required to keep would break tax law. GDPR's erasure right has an exception for legal obligations."],["Erase the rest, keeping invoices only for tax purposes","Correct. Erase the data you have no other basis to keep: erasure applies where there is no overriding legal basis. Retain the invoices for the legal obligation, restrict their use to that purpose, and tell the customer."],["Anonymize the invoices so they can be kept and still used for marketing","Tax authorities need identifiable invoices, and using retained data for marketing would breach purpose limitation."]],"a":2,"k":"The right to erasure is not absolute; data required by a legal obligation may be kept, but only for that purpose."},{"id":"D1-069","d":1,"obj":"1.3","diff":3,"q":"Auditors note that the information security manager reports to the CIO, who also owns the IT operations budget and often overrides security findings to meet delivery dates. Which change BEST addresses the concern?","o":[["Increase the security manager's budget so findings can be fixed faster","More money does not remove the conflict of interest in who decides."],["Make security report independently of IT operations","Correct. Reporting to a function such as the CEO or a risk committee means security oversight is not subordinate to the function it oversees. Independence lets security findings reach the people who own the risk."],["Require the CIO to document every override","Documentation helps accountability, but the conflict of interest remains."],["Move security staff into each IT delivery team","Embedding staff can improve collaboration, but it deepens the reporting conflict."]],"a":1,"k":"Governance: the security function needs enough independence and authority to report risk to those accountable for it."},{"id":"D1-070","d":1,"obj":"1.7","diff":3,"q":"During the business impact analysis, a department head insists their reporting process has a maximum tolerable downtime of one hour. The financial data shows that a one-week outage would cost very little. How should the BCP coordinator resolve this?","o":[["Accept the department head's figure, because process owners know their processes best","Owners supply input, but MTDs must be supported by evidence of impact so that recovery spending is justified."],["Set the MTD to the IT department's current recovery capability","Recovery capability should be designed to meet business needs, not the other way round."],["Average the department's estimate with the financial estimate","Averaging two inconsistent numbers produces a third number with no basis."],["Present the impact evidence to senior management, who set the recovery priorities","Correct. The BIA should be grounded in quantitative and qualitative impact. Where views conflict, senior management decides priorities based on the evidence."]],"a":3,"k":"BIA priorities must be evidence-based, and senior management arbitrates competing claims of criticality."},{"id":"D1-071","d":1,"obj":"1.10","diff":2,"q":"While threat modeling a funds-transfer service with STRIDE, a team notices that the service does not record which user approved each transfer. Which threat does this gap MOST directly enable?","o":[["Elevation of privilege","Elevation of privilege is gaining rights you should not have; missing logs do not grant rights."],["Spoofing","Spoofing is impersonation. The gap here is the lack of a record afterward."],["Information disclosure","Nothing is exposed by missing logs."],["Repudiation","Correct. Without a reliable audit record, a user can deny approving a transfer. Logging with user attribution counters repudiation."]],"a":3,"k":"Repudiation threats are countered by strong authentication plus tamper-resistant audit trails."},{"id":"D1-072","d":1,"obj":"1.8","diff":2,"q":"A company plans to start monitoring employees' use of company email and internet access. What should it do FIRST to reduce legal and employee-relations risk?","o":[["Deploy the monitoring tools quietly to see what they reveal","Covert monitoring without notice can create legal exposure and destroys trust."],["Ask each employee for written consent after monitoring begins","Consent obtained after the fact does not cover what was already collected."],["Publish a monitoring policy and notify users","Correct. A clear policy stating that systems are monitored and users have no expectation of privacy, acknowledged by employees and reinforced with logon banners, sets expectations and supports lawful monitoring."],["Limit monitoring to employees who are already suspected of misconduct","Selective, undisclosed monitoring raises fairness and legal concerns, and the policy question remains."]],"a":2,"k":"Monitoring starts with policy and notice: an AUP and banners that remove the expectation of privacy."},{"id":"D1-073","d":1,"obj":"1.9","diff":3,"q":"A risk assessment rates a legacy system's risk as high. Replacing it would cost more than the expected loss over its remaining two years of life, and no cheaper control would reduce the risk meaningfully. The system owner wants to keep it. What should happen?","o":[["Replace the system anyway, since a high rating requires treatment","Treatment is not mandatory when it costs more than it saves; forcing it ignores the cost-benefit logic of risk management."],["Move the system to a cloud host to transfer the risk","Hosting it elsewhere does not transfer accountability, and the weakness is in the legacy software, which moves with it."],["Senior management formally accepts the risk with a review date","Correct. Acceptance is valid when treatment costs more than the loss it prevents, but it must be a documented decision by someone with authority, revisited as conditions change."],["The system owner accepts the risk informally and monitors it","The decision must be documented and taken at the right level; an informal owner decision leaves leadership unaware of a high risk."]],"a":2,"k":"Risk acceptance is legitimate when treatment costs more than it saves, but it must be formal, documented and made by management with authority."},{"id":"D1-074","d":1,"obj":"1.1","diff":3,"q":"A CISSP consultant notices, outside the scope of the engagement, that a client's patient portal appears to expose medical records to anyone on the internet. The client asks the consultant to ignore it because it is out of scope. What should the consultant do FIRST?","o":[["Stay silent, since the engagement contract limits the work to its scope","A contract does not override the duty to protect society; a serious public risk cannot be ignored because it is out of scope."],["Urge the client in writing to fix it, and escalate if it will not","Correct. The canons put protecting society first while acting honorably and legally. The owner gets the first chance to fix the exposure; escalation follows if it refuses."],["Post a warning on social media so patients can protect themselves","Going public first harms the client, may breach confidentiality and law, and skips giving the owner a chance to fix it."],["Report the client to ISC2 for an ethics violation","The ISC2 code binds its members, not the client, and a complaint would not fix the exposure."]],"a":1,"k":"Canon order: society, then honorable and legal conduct, then principals, then the profession. Raise serious risks with the owner first, then escalate."},{"id":"D2-001","d":2,"obj":"2.1","diff":1,"q":"Who is responsible for determining the classification of a set of business data?","o":[["The data owner","Correct. The owner, usually a senior manager accountable for the data, decides its classification and the protection it needs."],["The data custodian","Custodians implement the protection the owner specifies, such as backups and access settings."],["The security administrator","Administrators grant access according to the owner's rules; they do not set the classification."],["The chief information officer","The CIO runs IT. Classification is a business decision made by the owner of the data."]],"a":0,"k":"Owners classify and set requirements; custodians implement; users comply."},{"id":"D2-002","d":2,"obj":"2.1","diff":2,"q":"In the U.S. government classification scheme, unauthorized disclosure of which level could reasonably be expected to cause serious damage to national security?","o":[["Confidential","Confidential is the level where disclosure could cause damage, without the qualifier \"serious\"."],["Top Secret","Top Secret is reserved for exceptionally grave damage."],["Secret","Correct. Secret is defined by serious damage to national security."],["Controlled Unclassified Information","CUI is unclassified information that still needs safeguarding; it is not defined by damage to national security."]],"a":2,"k":"Government levels: Top Secret (exceptionally grave damage), Secret (serious damage), Confidential (damage), Unclassified."},{"id":"D2-003","d":2,"obj":"2.1","diff":1,"q":"What is the PRIMARY reason to classify information?","o":[["To satisfy the evidence requirements of external auditors","Audits check classification, but the reason to do it is protection, not passing the audit."],["To match protection to the data's value and sensitivity","Correct. Classification lets the organization spend on protection where it matters and avoid over-protecting low-value data."],["To decide which employees may be monitored","Monitoring decisions are not the purpose of data classification."],["To determine the order in which data is backed up","Backup priority comes from business impact analysis, not classification alone."]],"a":1,"k":"Classification exists so that controls match the value and sensitivity of the data, cost-effectively."},{"id":"D2-004","d":2,"obj":"2.1","diff":2,"q":"A company's quarterly earnings report is classified Confidential while it is being prepared. What should happen to its classification after the results are publicly announced?","o":[["It should stay Confidential for seven years under the retention policy","Retention determines how long you keep data, not how sensitive it remains."],["It should be raised, because the report now has regulatory significance","Regulatory relevance does not make public information more sensitive."],["It should be destroyed, since the public version replaces it","The company may still need its records; declassification does not mean destruction."],["It should be reclassified as Public, since disclosure no longer causes harm","Correct. Sensitivity changes over time. Once the information is public, keeping it under Confidential controls wastes resources."]],"a":3,"k":"Classification should be reviewed as information ages or loses sensitivity; declassification is part of the program."},{"id":"D2-005","d":2,"obj":"2.1","diff":2,"q":"A database server stores both public product information and confidential customer records. How should the server itself be classified?","o":[["As Public, because most of the data on it is public","Classifying by the majority of data leaves the confidential records under-protected."],["As Confidential, matching the most sensitive data it holds","Correct. A system is protected at the level of the most sensitive information it stores or processes."],["It does not need a classification; only data is classified","Assets such as servers are classified too, so that their handling and controls match what they hold."],["As Internal, a level between the two types of data","Averaging the levels under-protects the confidential records."]],"a":1,"k":"Systems and media take the classification of the most sensitive data they hold."},{"id":"D2-006","d":2,"obj":"2.1","diff":3,"q":"Analysts combine several datasets that are each classified Internal. The combination reveals the locations and shift patterns of security guards at every site. How should the combined dataset be classified?","o":[["Internal, because each source is Internal","This ignores aggregation: the combination is more sensitive than any of its parts."],["It should not be classified until the data owner of each source agrees","Owners should be involved, but the new dataset needs protection immediately."],["At a higher level that reflects the sensitivity of the aggregate","Correct. Aggregation can create information more sensitive than its inputs, and classification should reflect what the combination reveals."],["Public, because none of the sources is classified Confidential","Treating the aggregate as less sensitive than its inputs is backward."]],"a":2,"k":"Aggregation: combining lower-sensitivity data can produce information that deserves a higher classification."},{"id":"D2-007","d":2,"obj":"2.1","diff":2,"q":"An organization is starting a data classification program. What must it do before it can classify anything?","o":[["Buy a data loss prevention tool to scan file shares","DLP enforces classification later; it is not a prerequisite for classifying."],["Encrypt all data at rest on servers and laptops","Encryption is a control chosen based on classification, not a prerequisite."],["Train every employee on handling procedures","Training follows once the scheme and handling rules exist."],["Inventory its information assets and owners","Correct. You cannot classify what you have not found. Inventory and ownership come first."]],"a":3,"k":"Asset inventory and assigned ownership are the foundation of classification."},{"id":"D2-008","d":2,"obj":"2.2","diff":1,"q":"What PRIMARILY determines how a backup tape must be labeled, transported and stored?","o":[["The classification of the data on the tape","Correct. Handling requirements are set by classification, so the most sensitive data on the tape determines its treatment."],["The age of the tape","Age affects reliability, not handling requirements."],["The courier's standard terms of service","The organization sets handling rules; vendors must meet them."],["The backup software's default settings","Software defaults do not define organizational handling requirements."]],"a":0,"k":"Handling requirements (marking, storage, transport, destruction) follow from classification."},{"id":"D2-009","d":2,"obj":"2.2","diff":2,"q":"A technician finds an unlabeled hard drive in a storage room. How should it be handled until its contents are known?","o":[["As Public, since it has no label","Missing labels do not make data harmless."],["As Internal, the organization's default level","A default below the highest level could under-protect sensitive data."],["At the highest classification used by the organization","Correct. Unlabeled media should be treated as the most sensitive until someone authorized determines otherwise."],["It should be wiped immediately and reused","Wiping may destroy data the organization is required to keep."]],"a":2,"k":"Unlabeled media is handled at the highest classification until proven otherwise."},{"id":"D2-010","d":2,"obj":"2.2","diff":2,"q":"Backup tapes containing customer records are collected weekly by a third-party courier for offsite storage. Which control BEST protects the data if a tape is lost in transit?","o":[["A signed courier log at every handoff point","Logs support chain of custody but do nothing to protect data on a lost tape."],["Encrypting the tapes before pickup","Correct. Encryption keeps the data confidential even when the media is lost or stolen."],["Using a bonded and insured courier service","Bonding compensates for losses; it does not protect the data."],["Locked transport cases","Locks deter casual access but are easily defeated once the case is in someone else's hands."]],"a":1,"k":"Encrypt media that leaves your physical control; it is the control that still works when the media is lost."},{"id":"D2-011","d":2,"obj":"2.2","diff":1,"q":"Printed reports containing sensitive data are often left uncollected at shared printers. Which control BEST addresses this?","o":[["Moving the printers into a locked room near the team","Locking the room still leaves documents exposed to everyone with access to it."],["A policy reminding staff to collect printouts promptly","Reminders help, but documents are still printed before the owner arrives."],["Watermarking every printed page","Watermarks identify sensitivity but do not stop someone else picking the page up."],["Print release that requires a badge at the printer","Correct. Secure print release (pull printing) holds the job until its owner authenticates, so it only prints when they are standing at the printer."]],"a":3,"k":"Handling controls should protect data at every stage, including printed output."},{"id":"D2-012","d":2,"obj":"2.2","diff":2,"q":"An employee holding a Secret clearance asks for a Secret document about a project they are not assigned to. What should happen?","o":[["Release it, because the employee's clearance matches the document's level","Clearance establishes eligibility only; it does not grant access by itself."],["Deny it unless the employee has a need to know for the document","Correct. Access to classified information requires clearance, need to know and, where applicable, formal approval."],["Release a redacted version without asking further questions","Even a redacted classified document needs a justified need to know."],["Release it after logging the request for the security officer to review","Logging records the access but does not prevent it; without a need to know, the document should not be released."]],"a":1,"k":"Clearance and need to know are both required; one without the other is not enough."},{"id":"D2-013","d":2,"obj":"2.2","diff":2,"q":"Staff must send a confidential spreadsheet to an external auditor. What is the BEST way to meet the organization's data handling standard?","o":[["Rename the file so its contents are not obvious","Obscuring the filename is not protection."],["Send it in two halves in separate emails","Splitting the file does not stop either half from being read."],["Use the approved encrypted transfer method to the auditor's verified address","Correct. Handling standards specify approved protection for each level, such as encrypted transfer, and confirming the recipient is authorized."],["Paste the contents into the email body instead of attaching the file","This changes nothing about confidentiality; the data still travels in the clear."]],"a":2,"k":"Follow the handling standard for the classification: approved encryption, an authorized and verified recipient."},{"id":"D2-014","d":2,"obj":"2.3","diff":1,"q":"What is the foundation of an effective asset security program?","o":[["Encrypting every storage device","Encryption is one control, and you cannot apply it to devices you do not know about."],["Strong perimeter firewalls","Perimeter controls do not tell you what you are protecting."],["An accurate inventory of assets","Correct. You cannot protect, patch, monitor or classify assets you do not know you have."],["A cyber insurance policy","Insurance transfers financial risk but does not tell you what your assets are."]],"a":2,"k":"Asset management starts with an inventory; everything else depends on knowing what you own."},{"id":"D2-015","d":2,"obj":"2.3","diff":1,"q":"Which of the following is an intangible asset?","o":[["A rack of database servers in the data center","Servers are physical, tangible assets."],["A backup tape library","Tape libraries are tangible equipment."],["Laptops issued to staff","Laptops are tangible."],["The company's reputation and its patents","Correct. Intangible assets have value but no physical form, such as reputation, intellectual property and goodwill."]],"a":3,"k":"Asset inventories include intangible assets such as intellectual property, brand and reputation, not only hardware."},{"id":"D2-016","d":2,"obj":"2.3","diff":1,"q":"Why should each asset in the inventory have a named owner?","o":[["So someone is accountable for its classification and protection","Correct. Ownership creates accountability for decisions about the asset."],["So the asset can be depreciated in the accounting system","Depreciation is an accounting concern, not the security reason for ownership."],["So the help desk knows whom to call when it fails","That is a support contact, not ownership in the security sense."],["So that insurance claims can be filed quickly","Insurance is not the purpose of assigning ownership."]],"a":0,"k":"Asset ownership establishes accountability for classification, protection and acceptable use."},{"id":"D2-017","d":2,"obj":"2.3","diff":2,"q":"A company issues new laptops to remote employees. Which provisioning step is MOST important for asset security?","o":[["Shipping each laptop in tamper-evident packaging by courier","Packaging helps detect tampering in transit, but the laptop's ongoing security depends on how it is built and tracked."],["Letting employees install their preferred software before shipping","This undermines a standard secure configuration."],["Asking employees to set a strong password when the laptop arrives","Necessary, but less important than the device being secure and tracked before it leaves."],["Inventory each laptop and apply the secure baseline before handover","Correct. Secure provisioning means the asset is recorded, assigned and hardened, including disk encryption, before anyone uses it."]],"a":3,"k":"Provision securely: inventory and assign the asset, apply the baseline and encryption, then hand it over."},{"id":"D2-018","d":2,"obj":"2.3","diff":2,"q":"Several departments subscribe to cloud services on company credit cards without involving IT. What is the BEST way to bring these services under asset management?","o":[["Ban company credit cards","This blocks a symptom and disrupts legitimate purchasing."],["Discover cloud use and require approval for new services","Correct. Discovery, for example with a CASB, finds the existing shadow IT, and a procurement approval process keeps future services in the inventory."],["Ask department heads to list their services once a year","A yearly self-report will be incomplete and quickly out of date."],["Block all cloud storage and SaaS domains at the firewall","Blanket blocking stops legitimate business and pushes users to workarounds."]],"a":1,"k":"Shadow IT is an inventory problem: discover it, then route new services through governance."},{"id":"D2-019","d":2,"obj":"2.3","diff":1,"q":"Which tool records IT assets, their configurations and the relationships between them?","o":[["A security information and event management system","A SIEM collects and correlates logs; it is not the system of record for assets."],["A configuration management database","Correct. A CMDB stores configuration items and their relationships, supporting asset and change management."],["A data loss prevention system","DLP detects and blocks data exfiltration."],["An intrusion detection system","An IDS detects attacks; it does not maintain an asset record."]],"a":1,"k":"A CMDB is the system of record for configuration items and their relationships."},{"id":"D2-020","d":2,"obj":"2.4","diff":1,"q":"Which role performs daily backups and maintains the controls that the data owner specifies?","o":[["Data subject","The data subject is the person the data is about."],["Data owner","The owner sets the requirements; someone else carries them out day to day."],["Data custodian","Correct. Custodians implement and maintain the protection the owner requires, such as backups, access settings and integrity checks."],["Data processor","In privacy law, a processor handles personal data on behalf of a controller. The day-to-day IT role here is the custodian."]],"a":2,"k":"Custodians do the day-to-day protection work that owners define."},{"id":"D2-021","d":2,"obj":"2.4","diff":2,"q":"According to the CISSP Official Study Guide, which role grants users access to data according to the guidelines set by the data owner?","o":[["Administrator","Correct. Administrators grant appropriate access to personnel, following the owner's rules; they do not decide those rules."],["Data subject","Subjects are the people the data describes."],["Business owner","Business or mission owners own processes; they do not grant individual access."],["Auditor","Auditors review whether access is appropriate. They do not grant it."]],"a":0,"k":"Owner decides who should have access; the administrator grants it; the auditor checks it."},{"id":"D2-022","d":2,"obj":"2.4","diff":2,"q":"A payroll application processes salary data owned by HR. Who is responsible for making sure the application itself is operated in line with its security plan?","o":[["The HR director, as data owner","The data owner is accountable for the data, not for running the system that processes it."],["Each payroll clerk who uses it","Users must follow policy but are not responsible for the system's security posture."],["The system owner","Correct. The system owner is responsible for the system that processes the data, including its security plan and controls."],["The external auditor","Auditors assess; they are not responsible for operation."]],"a":2,"k":"Data owners own the information; system owners own the systems that store or process it."},{"id":"D2-023","d":2,"obj":"2.4","diff":1,"q":"The marketing team wants to collect customers' dates of birth \"in case it becomes useful later\". What principle should guide the decision?","o":[["Data portability","Portability is the right to receive your data in a usable format."],["Purpose specification only, which allows collection if the purpose is written down","A vague future purpose does not justify collection."],["Data accuracy","Accuracy concerns keeping data correct, not whether to collect it."],["Data minimization: gather only what a defined purpose needs","Correct. Collecting less data reduces the impact of a breach and is required by laws such as GDPR."]],"a":3,"k":"Data you never collect cannot be breached. Collect only what a defined purpose requires."},{"id":"D2-024","d":2,"obj":"2.4","diff":2,"q":"A regulator requires that its citizens' personal data be stored only within the country. The organization uses a global cloud provider. What is the BEST approach?","o":[["Use in-country regions, with contract terms covering backups too","Correct. Data location must be controlled technically and contractually, including copies that are easy to overlook, such as backups and disaster recovery replicas."],["Encrypt the data so that where it is stored no longer matters","Encryption protects confidentiality but does not satisfy a residency requirement."],["Rely on the provider's published global privacy policy and terms","A general policy does not commit the provider to keep your data in one country."],["Move all data on-premises","That works but is not necessary if the cloud can meet the requirement."]],"a":0,"k":"Data location (residency, sovereignty) must cover primary storage, backups and replicas."},{"id":"D2-025","d":2,"obj":"2.4","diff":2,"q":"Developers routinely copy production customer data into test environments. Which practice BEST reduces the risk?","o":[["Restrict test environments to the developers' own team","Fewer people with access helps, but full production data still sits in less-protected systems."],["Delete test data at the end of each project","Shortening exposure helps, but the data is still exposed during the project."],["Use masked or synthetic data in test environments","Correct. If sensitive values never reach the test environment, a breach there exposes nothing real."],["Apply the same firewall rules to test as to production","Network rules alone do not bring test environments up to production protection."]],"a":2,"k":"Minimize copies of sensitive data; use masking or synthetic data outside production."},{"id":"D2-026","d":2,"obj":"2.4","diff":2,"q":"Why is keeping data beyond its required retention period a security and legal risk?","o":[["Old data is more likely to be corrupted","Corruption is an integrity problem, not the main reason for disposal."],["It remains exposed to breaches and must be produced in legal discovery","Correct. Data you no longer need still carries breach risk and can be subpoenaed, while providing no value."],["Exceeding a retention period is a criminal offense in most jurisdictions","Some periods are set by business need, and keeping data longer is rarely a crime in itself. The risk is exposure and discovery."],["Storage is expensive","Cost matters, but it is not the main security and legal concern."]],"a":1,"k":"Retain data as long as required, then destroy it; excess data is liability without value."},{"id":"D2-027","d":2,"obj":"2.4","diff":2,"q":"Records are scheduled for routine destruction next week under the retention policy. Legal counsel says the company expects to be sued over a contract involving those records. What should happen?","o":[["Destroy them on schedule, since the retention policy allows it","Destroying records relevant to anticipated litigation can be spoliation of evidence."],["Move them to cheaper storage and destroy them after the case","Moving them is fine, but they must be preserved, not merely scheduled for later destruction."],["Ask the opposing party whether the records are needed","Preservation duties do not depend on the other side asking."],["Place them under a legal hold until the matter ends","Correct. Once litigation is reasonably anticipated, a legal hold overrides normal retention and destruction schedules."]],"a":3,"k":"A legal hold suspends destruction of relevant records when litigation is anticipated."},{"id":"D2-028","d":2,"obj":"2.4","diff":2,"q":"A company is retiring a batch of solid-state drives (SSDs) that held confidential data. Which sanitization method is NOT effective for them?","o":[["Physical shredding","Shredding into small particles destroys SSDs effectively."],["Cryptographic erase on self-encrypting drives","Destroying the media encryption key renders the data unrecoverable."],["Degaussing","Correct. SSDs store data in flash memory, not magnetically, so degaussing has no effect on the data."],["The manufacturer's verified sanitize command","Vendor sanitize commands, where verified, can purge flash media."]],"a":2,"k":"Degaussing only works on magnetic media; use cryptographic erase, sanitize commands or destruction for SSDs."},{"id":"D2-029","d":2,"obj":"2.4","diff":3,"q":"Hard drives that held sensitive data will be sold to an outside buyer. Under NIST SP 800-88, what is the minimum level of sanitization appropriate?","o":[["Clear","Clearing protects against simple, non-invasive recovery and suits reuse within the organization, not media leaving its control."],["Purge","Correct. Purging protects against laboratory-grade recovery and is appropriate when media leaves organizational control."],["Delete","Deleting only removes file references; the data remains on the disk."],["Format","A standard format may leave data recoverable."]],"a":1,"k":"NIST 800-88: Clear (reuse inside the organization), Purge (media leaving your control), Destroy (media will never be reused)."},{"id":"D2-030","d":2,"obj":"2.4","diff":2,"q":"How can a self-encrypting drive be sanitized almost instantly?","o":[["Overwriting the drive with zeros three times","Overwriting takes hours and may miss over-provisioned areas on flash media."],["Deleting the partition table","The data itself remains intact."],["Reformatting it with a new file system","A format does not reliably remove data."],["Destroying the drive's media encryption key","Correct. This is cryptographic erase: without the key, the encrypted data on the drive is unreadable."]],"a":3,"k":"Cryptographic erase (crypto-shredding) sanitizes encrypted media by destroying the key."},{"id":"D2-031","d":2,"obj":"2.4","diff":1,"q":"Which method provides the MOST secure destruction of highly sensitive paper records?","o":[["Strip-cut shredding","Strips can be reassembled."],["Recycling through the normal paper bin","Recycled paper is readable until it is pulped, and it passes through many hands."],["Incineration or pulping under supervision","Correct. Burning or pulping leaves nothing to reconstruct, and supervision preserves the chain of custody."],["Marking pages \"destroy\" and storing them in a locked cabinet","That defers destruction rather than performing it."]],"a":2,"k":"Destruction strength should match sensitivity: cross-cut shredding at a minimum, incineration or pulping for the most sensitive."},{"id":"D2-032","d":2,"obj":"2.4","diff":3,"q":"An organization is ending its use of a cloud storage service. It cannot physically destroy the provider's disks. What gives the BEST assurance that its data is unrecoverable?","o":[["Deleting every object and emptying the trash","Deleted objects may persist in replicas, snapshots or backups for some time."],["Asking the provider for a certificate of destruction for the physical disks","Providers do not usually destroy shared disks for one customer."],["Overwriting each object with random data before deleting it","Overwriting at the object level does not reach replicas, snapshots or how the provider maps data to physical media."],["Having encrypted the data with customer-managed keys, then destroying the keys","Correct. Crypto-shredding makes every copy unreadable, wherever it lives, once the keys are gone."]],"a":3,"k":"In the cloud, plan sanitization up front: encrypt with keys you control so you can crypto-shred."},{"id":"D2-033","d":2,"obj":"2.4","diff":2,"q":"At which phase of the data lifecycle should classification FIRST be assigned?","o":[["Store","Data may already have been shared or copied before it is stored."],["Create","Correct. Assigning classification at creation means the data is protected correctly from the start."],["Share","Waiting until sharing means it may already have been mishandled."],["Archive","By archiving, the data has been used for its whole active life without known handling rules."]],"a":1,"k":"Classify data when it is created or collected, and revisit the classification as it ages."},{"id":"D2-034","d":2,"obj":"2.5","diff":2,"q":"A vendor has stopped selling a firewall model but continues to release security patches for it for two more years. What is the product's status?","o":[["End of support","End of support means no more patches or updates. Patches are still coming."],["Obsolete","\"Obsolete\" is not the precise term here; the product still has vendor support."],["End of life","Correct. End of life means the product is no longer sold or developed, though support may continue for a period."],["Deprecated","Deprecation applies to features or APIs that are discouraged and may be removed."]],"a":2,"k":"EOL: no longer sold, may still be supported. EOS: no more patches; plan to replace before then."},{"id":"D2-035","d":2,"obj":"2.5","diff":2,"q":"A critical industrial control workstation runs an operating system that is past end of support, and it cannot be replaced for two years. What is the BEST approach?","o":[["Keep using it unchanged, since it has worked so far","Unpatched systems accumulate unfixed vulnerabilities; doing nothing is not a plan."],["Disconnect it immediately, accepting the production stoppage","That may cause more harm than the risk it removes."],["Isolate it, add compensating controls and plan its replacement","Correct. Segment the system, restrict and monitor access, have management accept the residual risk formally, and plan its replacement."],["Install a third-party patching tool and treat it as supported","Unofficial tools cannot supply vendor fixes that do not exist."]],"a":2,"k":"End-of-support systems need isolation, compensating controls, formal risk acceptance and a replacement plan."},{"id":"D2-036","d":2,"obj":"2.5","diff":3,"q":"Records must be retained for ten years. They are stored in a proprietary format that only a system being retired next month can read. What should be done?","o":[["Keep the backup tapes; the data is retained, so the requirement is met","Retained data you cannot read does not meet the purpose of retention."],["Retire the system and rebuild a reader if the records are ever requested","Rebuilding later may be impossible or very expensive."],["Delete the records early, since they will be unreadable anyway","That breaks the retention requirement."],["Migrate them to a readable format, or keep a reader","Correct. Migrate the records, or keep a working means of reading them: asset retention includes keeping the hardware, software or formats needed to access retained data."]],"a":3,"k":"Retaining data means retaining the ability to read it: plan format migration or keep the means to access it."},{"id":"D2-037","d":2,"obj":"2.5","diff":1,"q":"What is the MAIN security risk of running software after its end of support?","o":[["It runs more slowly over time","Performance is not the main security concern."],["New vulnerabilities will not be patched","Correct. Without vendor patches, every newly discovered vulnerability stays open."],["Its license automatically expires","Licensing is separate from support status."],["It can no longer be backed up","Backups are not affected by support status."]],"a":1,"k":"End-of-support software no longer receives security fixes, so its risk grows over time."},{"id":"D2-038","d":2,"obj":"2.6","diff":2,"q":"Which technology is designed to protect data while it is being processed?","o":[["Full-disk encryption","Full-disk encryption protects data at rest."],["TLS 1.3","TLS protects data in transit."],["Tokenization of sensitive fields at the database layer","Tokenization replaces stored values; it does not protect data while it is being computed on."],["A secure enclave (trusted execution environment)","Correct. Confidential computing isolates data in use in protected memory, so other software on the host cannot read it."]],"a":3,"k":"Data states: at rest (storage encryption), in transit (TLS, IPsec), in use (enclaves, TEEs, memory protection)."},{"id":"D2-039","d":2,"obj":"2.6","diff":2,"q":"A system has no wireless capability, so the team removes all wireless controls from the baseline it adopted. What is this called?","o":[["Scoping","Correct. Scoping removes baseline controls that do not apply to the system."],["Tailoring","Tailoring adjusts the remaining controls to fit the organization, for example by changing parameter values."],["Compensating","Compensating controls replace a control that cannot be met."],["Risk avoidance","Avoidance stops a risky activity; this is choosing applicable controls."]],"a":0,"k":"Scoping removes controls that don't apply; tailoring adjusts the ones that do."},{"id":"D2-040","d":2,"obj":"2.6","diff":2,"q":"A baseline recommends locking accounts after five failed logons. The organization changes the value to ten to fit its risk appetite and help desk capacity. What is this called?","o":[["Scoping","Scoping decides whether a control applies at all. Here the control applies and its value is adjusted."],["Tailoring","Correct. Tailoring modifies baseline controls, such as parameter values, to match the organization's mission and risk."],["Standards selection","Standards selection is choosing which baseline or framework to adopt."],["Exception handling","An exception is a documented deviation for a specific case, not a deliberate organization-wide adjustment."]],"a":1,"k":"Tailoring sets control parameters to suit the organization; document why."},{"id":"D2-041","d":2,"obj":"2.6","diff":1,"q":"Which control can detect and block employees emailing files that contain Social Security numbers to external addresses?","o":[["An intrusion prevention system","An IPS looks for attacks, not for sensitive content leaving the organization."],["A web application firewall","A WAF protects web applications from inbound attacks."],["Data loss prevention","Correct. DLP inspects content in motion, such as email, for sensitive patterns and can block or quarantine it."],["A next-generation antivirus agent","Antivirus looks for malware, not sensitive data patterns."]],"a":2,"k":"DLP finds sensitive data in motion, at rest and in use, and enforces policy on it."},{"id":"D2-042","d":2,"obj":"2.6","diff":1,"q":"Which solution sits between users and cloud services to provide visibility of cloud use and enforce security policy on it?","o":[["A virtual private network concentrator","A VPN encrypts traffic; it does not understand or control SaaS use."],["A cloud access security broker","Correct. A CASB discovers shadow IT, enforces policies such as DLP and access rules, and monitors activity in cloud services."],["A hardware security module","An HSM protects cryptographic keys."],["A security orchestration, automation and response platform","SOAR automates incident response workflows."]],"a":1,"k":"CASBs provide visibility, compliance, data security and threat protection for cloud services."},{"id":"D2-043","d":2,"obj":"2.6","diff":2,"q":"A company must send design documents to partners so that they cannot be printed or forwarded, and so that access can be revoked later. Which control fits BEST?","o":[["Encrypted email","Encryption protects the documents in transit, but once decrypted the recipient can do anything with them."],["A data loss prevention policy on the mail gateway","DLP controls what leaves; it has no control after the partner receives the file."],["A non-disclosure agreement","An NDA creates legal obligations but no technical enforcement."],["Digital rights management","Correct. DRM (or information rights management) attaches usage rules that travel with the document and can be revoked."]],"a":3,"k":"DRM enforces persistent usage rights (view, print, forward, expire, revoke) on content wherever it goes."},{"id":"D2-044","d":2,"obj":"2.6","diff":2,"q":"An application replaces credit card numbers with random values and keeps the mapping to real numbers in a separate, secured vault. Which protection method is this?","o":[["Hashing","Hashing is one-way; there is no vault to map back to the original value."],["Data masking","Masking hides part of a value for display, such as showing the last four digits."],["Tokenization","Correct. Tokens have no mathematical relationship to the original values, which can only be recovered through the token vault."],["Format-preserving encryption","That uses a key and an algorithm rather than a lookup vault."]],"a":2,"k":"Tokenization removes sensitive values from systems, shrinking compliance scope such as PCI DSS."},{"id":"D2-045","d":2,"obj":"2.6","diff":3,"q":"A research team replaces names in a dataset with random codes and stores the code key in a separate, access-controlled system. How does GDPR treat the coded dataset?","o":[["As anonymous data, outside the scope of GDPR","Data is anonymous only if individuals can no longer be identified by any reasonably likely means. The key still exists."],["As pseudonymized data, which is still personal data","Correct. Pseudonymization reduces risk, but because re-identification is possible with the key, GDPR still applies."],["As special category data, requiring explicit consent","Coding names does not make data special category; that depends on its content, such as health data."],["As encrypted data, exempt from breach notification","Pseudonymization is not encryption, and no blanket exemption applies."]],"a":1,"k":"Pseudonymized data is still personal data; only truly anonymized data falls outside GDPR."},{"id":"D2-046","d":2,"obj":"2.6","diff":1,"q":"Help desk staff need to confirm a caller's identity but should see only the last four digits of the caller's Social Security number. Which technique should the application use?","o":[["Data masking","Correct. Masking hides part of the value on screen, showing only what the role needs."],["Salting","Salting adds random data to passwords before hashing."],["Steganography","Steganography hides data inside other data, such as images."],["Data compression","Compression reduces size; it does not hide values."]],"a":0,"k":"Masking limits displayed data to what a role needs, applying least privilege to the screen."},{"id":"D2-047","d":2,"obj":"2.4","diff":3,"q":"A hospital uses a cloud analytics service to process patient data. The provider now wants to use the same data, with names removed, to train its own commercial models. Under GDPR-style roles, what is the provider's position?","o":[["It stays a processor, because the hospital collected the data","A processor acts only on the controller's instructions. Using the data for its own purposes makes it a controller for that use."],["It becomes a controller for that use, needing a lawful basis","Correct. A processor that decides the purpose of processing becomes a controller for it, and removing names alone does not make health data anonymous."],["It may proceed, because data without names is anonymous","Removing names is pseudonymization at best; health records can often be re-identified, so the data is still personal data."],["It becomes the data owner, since it holds the copy in use","Holding a copy does not make it the owner; accountability for patient data stays with the hospital."]],"a":1,"k":"A processor that uses personal data for its own purposes becomes a controller for that use; stripping names is not anonymization."},{"id":"D2-048","d":2,"obj":"2.6","diff":3,"q":"Analysts must query a customer dataset without ever seeing real account numbers, while the payments system must still be able to use the real numbers. Which technique fits BEST?","o":[["Encrypt the account numbers at rest with full-disk encryption on the servers","Full-disk encryption protects against stolen media; authorized users and applications still see the real values."],["Hash the account numbers with SHA-256 in the shared database","Hashing is one-way, so the payments system could not recover the numbers, and unsalted hashes of short numbers can be brute-forced."],["Tokenize them, keeping the mapping only in a payments vault","Correct. Analysts work with tokens that still support joins and counts, and only the payments system can redeem a token for the real number."],["Mask all but the last four digits on analysts' screens","Display masking leaves the real numbers in the data the analysts query and export."]],"a":2,"k":"Tokenization swaps sensitive values for tokens; only the vault maps them back, so most systems never hold the real data."},{"id":"D3-001","d":3,"obj":"3.1","diff":2,"q":"A web application's database account has full owner rights on the database, although the application only ever reads the product catalog. Which design principle does this violate?","o":[["Least privilege","Correct. The account should have only the rights it needs, here read access to the catalog. Excess rights turn an application flaw such as SQL injection into a much bigger breach."],["Defense in depth","Defense in depth is about layering controls; the problem here is the size of one account's rights."],["Separation of duties","Separation of duties splits a sensitive task between people so no one can complete it alone."],["Fail securely","Failing securely concerns how a system behaves when something breaks."]],"a":0,"k":"Least privilege applies to service accounts and applications as much as to people."},{"id":"D3-002","d":3,"obj":"3.1","diff":2,"q":"A VPN gateway authenticates users against a central directory. What should the gateway do when the directory becomes unreachable?","o":[["Deny new connections until the directory is reachable again","Correct. Failing secure (closed) means a failure of the control does not become a way around it."],["Allow connections from users who connected in the last 24 hours","Cached trust may let in an account that has since been disabled."],["Allow all connections and log them for later review","Failing open turns an outage, or an attack on the directory, into open access."],["Fall back to a shared emergency password published to staff","A shared password destroys accountability and is easily leaked."]],"a":0,"k":"Fail securely: when a security control fails, it should deny rather than permit, unless life safety requires otherwise."},{"id":"D3-003","d":3,"obj":"3.1","diff":2,"q":"An office uses electronically locked doors. How should the locks behave when power fails?","o":[["All doors should fail secure, staying locked, to protect equipment","Locking stairwell and exit doors in an emergency can trap people."],["All doors should fail safe, unlocking, so no one is ever trapped","Unlocking server rooms and cages on every power cut exposes critical assets unnecessarily."],["Exit and stairwell doors fail safe; server cage doors fail secure","Correct. Life safety comes first on egress routes, while doors that protect assets and are not escape routes can stay locked."],["Doors should keep their current state until a guard decides","In an emergency there may be no time for a decision, and egress must be guaranteed."]],"a":2,"k":"Fail-safe protects people (unlock); fail-secure protects assets (lock). Life safety always wins on escape routes."},{"id":"D3-004","d":3,"obj":"3.1","diff":1,"q":"Which statement BEST describes the zero trust approach?","o":[["Users inside the corporate network are trusted; only external users are verified","That is the traditional perimeter model zero trust replaces."],["No user is ever granted access to sensitive systems","Zero trust grants access, just never implicitly."],["Every request is verified on identity, device and context, wherever it comes from","Correct. No request is trusted because of its network location; zero trust authenticates and authorizes every access decision continuously, with least privilege."],["All traffic is encrypted, so trust is no longer needed","Encryption is part of it, but zero trust is about verifying access, not just protecting the channel."]],"a":2,"k":"Zero trust: never trust, always verify; location on the network grants nothing."},{"id":"D3-005","d":3,"obj":"3.1","diff":2,"q":"A company runs its application on infrastructure as a service (IaaS) virtual machines. Who is responsible for patching the guest operating system?","o":[["The cloud provider, because it owns the hardware","In IaaS the provider secures the physical hosts and hypervisor, not the guest OS."],["The customer","Correct. In IaaS the customer manages the operating system, middleware, applications and data on its VMs."],["Both, on a schedule the provider sets","The shared responsibility model gives this task to the customer alone."],["Neither, because the hypervisor isolates the guest","Isolation does not fix vulnerabilities inside the guest."]],"a":1,"k":"Shared responsibility: the further up the stack you consume (IaaS → PaaS → SaaS), the less you manage yourself."},{"id":"D3-006","d":3,"obj":"3.1","diff":2,"q":"An organization wants to combine SD-WAN networking with cloud-delivered protections such as web filtering, CASB, zero trust network access and firewall as a service. What is this architecture called?","o":[["Software-defined perimeter","SDP is an approach to zero trust access, one component that SASE can include."],["Network functions virtualization","NFV runs network functions as software on standard hardware; it is not a converged security service model."],["Virtual private cloud","A VPC is an isolated network inside a public cloud."],["Secure access service edge (SASE)","Correct. SASE converges wide-area networking and security functions into a cloud-delivered service close to users."]],"a":3,"k":"SASE = SD-WAN + cloud-delivered security (SWG, CASB, ZTNA, FWaaS), new in the 2024 outline."},{"id":"D3-007","d":3,"obj":"3.1","diff":1,"q":"A router ships with remote administration turned off and a unique random administrator password printed on each unit. Which principle does this demonstrate?","o":[["Secure defaults","Correct. The out-of-the-box configuration is the secure one; users must choose to open things up."],["Defense in depth","One device's default settings are not layered defenses."],["Separation of duties","Nothing here is split between people."],["Security through obscurity","Nothing relies on hiding how the device works."]],"a":0,"k":"Secure defaults: ship and deploy in the most secure state, and make opening up a deliberate choice."},{"id":"D3-008","d":3,"obj":"3.1","diff":2,"q":"Which design principle reduces attack surface and makes a security mechanism easier to analyze and verify?","o":[["Defense in depth with layered controls","Layering adds protection but also adds complexity."],["Open design","Open design means security should not depend on the design being secret."],["Keep it simple and small","Correct. Simpler, smaller mechanisms have fewer flaws and can be reviewed thoroughly, which is the economy of mechanism principle."],["Complete mediation","Complete mediation checks every access; it does not by itself reduce complexity."]],"a":2,"k":"Complexity is the enemy of security: keep mechanisms simple and small so they can be verified."},{"id":"D3-009","d":3,"obj":"3.1","diff":3,"q":"In a new accounts payable system, any user with the \"finance\" role can both create a new vendor and approve payments to it. What is the BEST design change?","o":[["Log every vendor creation and have a manager review the logs monthly","Logging detects fraud after the fact; the design still allows one person to commit it."],["Require all finance users to sign an annual code of conduct","A policy statement does not prevent the abuse the design allows."],["Limit the finance role to senior staff only","Seniority does not remove the conflict; one person can still complete the fraud."],["Split vendor creation and payment approval into separate roles","Correct. Separation of duties enforced by the system means fraud would need collusion between two people."]],"a":3,"k":"Design separation of duties into systems so no single role can complete a sensitive transaction end to end."},{"id":"D3-010","d":3,"obj":"3.2","diff":1,"q":"In the Bell-LaPadula model, which property prevents a subject cleared for Secret from reading a Top Secret document?","o":[["The simple security property","Correct. \"No read up\": a subject cannot read data at a higher classification than its clearance."],["The star (*) property","The star property is \"no write down\"."],["The simple integrity property","That is a Biba property, concerned with integrity."],["The discretionary security property","That property uses an access matrix for discretionary access, not levels."]],"a":0,"k":"Bell-LaPadula protects confidentiality: no read up (simple security), no write down (star property)."},{"id":"D3-011","d":3,"obj":"3.2","diff":2,"q":"A user logged in at Secret tries to save a file to a share classified Confidential. Bell-LaPadula blocks the write. Why?","o":[["The user might corrupt higher-integrity data","Integrity is Biba's concern. Bell-LaPadula is about confidentiality."],["Writing down could leak Secret information to a lower level","Correct. The star property, \"no write down\", prevents information flowing from a higher classification to a lower one."],["The share has not been accredited","Accreditation is not part of the model's rules."],["The model restricts writes to the subject's own level","That is the strong star property, which is stricter than what standard Bell-LaPadula requires."]],"a":1,"k":"The star property stops leaks: a subject cannot write to a lower classification."},{"id":"D3-012","d":3,"obj":"3.2","diff":2,"q":"A plant's control system must ensure that readings from an untrusted network cannot contaminate high-integrity control records. Which model's rules fit this requirement?","o":[["Bell-LaPadula","Bell-LaPadula protects confidentiality, not integrity."],["Brewer-Nash","Brewer-Nash prevents conflicts of interest."],["Biba","Correct. Biba prevents reading down (low-integrity data influencing a subject) and writing up (a subject corrupting higher-integrity objects)."],["Take-Grant","Take-Grant models how rights are passed between subjects."]],"a":2,"k":"Biba protects integrity: no read down, no write up."},{"id":"D3-013","d":3,"obj":"3.2","diff":2,"q":"Users may change financial records only through approved programs that enforce business rules, never directly. The records are checked regularly by verification procedures. Which model is this?","o":[["Bell-LaPadula","Bell-LaPadula is about classification levels and confidentiality."],["Graham-Denning","Graham-Denning defines protection rights for creating and deleting subjects and objects."],["Brewer-Nash","Brewer-Nash is about conflicts of interest."],["Clark-Wilson","Correct. Clark-Wilson uses the access triple of subject, program (transformation procedure) and object, with well-formed transactions and separation of duties."]],"a":3,"k":"Clark-Wilson: subjects reach constrained data only through transformation procedures; integrity verification procedures check it."},{"id":"D3-014","d":3,"obj":"3.2","diff":1,"q":"A consulting firm must stop an analyst who has worked on one bank's data from accessing a competing bank's data. Which model addresses this?","o":[["Brewer-Nash","Correct. The \"Chinese wall\" model changes access dynamically based on what a subject has already accessed, preventing conflicts of interest."],["Biba","Biba is about integrity levels."],["Bell-LaPadula","Bell-LaPadula is about fixed classification levels."],["Lattice-based access control","Lattices define fixed bounds between levels, not history-based restrictions."]],"a":0,"k":"Brewer-Nash (Chinese wall) prevents conflicts of interest based on what you have already accessed."},{"id":"D3-015","d":3,"obj":"3.2","diff":2,"q":"Which security model uses a directed graph to show how rights can be passed from one subject to another?","o":[["Graham-Denning","Graham-Denning defines eight protection rights but is not built on a directed graph."],["Take-Grant","Correct. Take-Grant uses take, grant, create and remove rules over a directed graph to determine how rights can propagate."],["Clark-Wilson","Clark-Wilson is about integrity through well-formed transactions."],["State machine","The state machine model requires the system to be secure in every state; it does not model rights transfer as a graph."]],"a":1,"k":"Take-Grant models rights propagation as a directed graph; Graham-Denning defines eight protection rights."},{"id":"D3-016","d":3,"obj":"3.2","diff":3,"q":"Which model requires that the actions of subjects at a higher security level cannot be observed by, or affect, subjects at a lower level, which helps prevent covert channels and inference?","o":[["Information flow","Information flow models track and restrict flows between levels; noninterference is the specific \"no observable effect\" requirement."],["Harrison-Ruzzo-Ullman","HRU addresses whether rights can be leaked when subjects and objects are created and modified."],["Noninterference","Correct. Noninterference holds when high-level activity has no effect a low-level subject could observe."],["Lattice","A lattice defines ordered security levels and their bounds."]],"a":2,"k":"Noninterference: high-level actions must not be observable at lower levels, addressing covert channels."},{"id":"D3-017","d":3,"obj":"3.2","diff":3,"q":"Under which Bell-LaPadula rule can a subject read and write only at its own security level?","o":[["The simple security property","That rule only forbids reading up."],["The tranquility principle","Tranquility concerns whether security labels may change during operation."],["The discretionary security property","That rule uses an access matrix for discretionary permissions."],["The strong star property","Correct. The strong star property restricts both reading and writing to the subject's own level."]],"a":3,"k":"Strong star: read and write only at your own level. Star: no write down."},{"id":"D3-018","d":3,"obj":"3.3","diff":2,"q":"Under the Common Criteria, what describes the security requirements a group of consumers want for a category of products, such as firewalls?","o":[["A protection profile","Correct. A protection profile states implementation-independent security needs for a type of product."],["A security target","A security target is written by the vendor to describe the security of a specific product being evaluated."],["The target of evaluation","The TOE is the product or system being evaluated."],["An evaluation assurance level","The EAL is the depth of evaluation, not a statement of requirements."]],"a":0,"k":"Common Criteria: protection profile (what consumers want), security target (what the vendor claims), TOE (what is evaluated), EAL (how deeply)."},{"id":"D3-019","d":3,"obj":"3.3","diff":2,"q":"Which Common Criteria evaluation assurance level means the product's design has been formally verified and tested?","o":[["EAL1","EAL1 is functionally tested, the lowest level."],["EAL4","EAL4 is methodically designed, tested and reviewed."],["EAL5","EAL5 is semiformally designed and tested."],["EAL7","Correct. EAL7 is formally verified design and tested, the highest level."]],"a":3,"k":"EAL1 functionally tested → EAL4 methodically designed, tested and reviewed → EAL7 formally verified design and tested."},{"id":"D3-020","d":3,"obj":"3.3","diff":2,"q":"A security architect is choosing controls for a new customer portal. What should the architect do FIRST?","o":[["Select controls from the most recent industry benchmark for portals","Benchmarks help, but controls should answer this system's requirements."],["Define its security requirements from data, risks and obligations","Correct. Controls are selected to meet requirements derived from classification, risk assessment and legal or contractual obligations."],["Buy the controls the organization already licenses","Using existing tools may be efficient but does not show they meet the need."],["Ask the developers which controls they prefer","Developer input is valuable, but preference is not a basis for selection."]],"a":1,"k":"Select controls based on security requirements, which come from data classification, risk and obligations."},{"id":"D3-021","d":3,"obj":"3.3","diff":2,"q":"What is the formal management decision to accept a system's residual risk and allow it to operate?","o":[["Certification of the controls","Certification is the technical evaluation of a system's security controls."],["Validation by stakeholders","Validation confirms the system meets stakeholders' needs."],["Authorization (accreditation)","Correct. An authorizing official grants authority to operate, accepting the residual risk on behalf of the organization."],["Verification against the design","Verification confirms the system was built to its specification."]],"a":2,"k":"Certification (technical evaluation) informs authorization (management's acceptance of risk to operate)."},{"id":"D3-022","d":3,"obj":"3.4","diff":1,"q":"Which component on a computer's motherboard stores keys for full-disk encryption and records measurements of the boot process?","o":[["A hardware security module","HSMs are dedicated appliances or cards for enterprise key management, not motherboard chips."],["A Trusted Platform Module","Correct. The TPM is a secure cryptoprocessor that can seal keys to a known-good boot state."],["The BIOS setup password","A firmware password restricts setup changes; it does not store encryption keys."],["The CPU cache","Cache is ordinary fast memory with no security function."]],"a":1,"k":"TPM: on-board chip for key storage, sealing and boot measurement (attestation)."},{"id":"D3-023","d":3,"obj":"3.4","diff":2,"q":"What prevents one process from reading or altering another process's memory?","o":[["Address space layout randomization (ASLR)","ASLR makes memory addresses hard to predict, which hinders exploits, but the operating system's memory protection is what keeps processes apart."],["Disk encryption","Disk encryption protects data at rest, not memory at run time."],["Memory protection that isolates each process","Correct. The operating system and hardware give each process its own address space and block access to others."],["Running every application process in user mode (ring 3)","User mode limits access to privileged instructions, but separate address spaces are what keep processes apart."]],"a":2,"k":"Memory protection and process isolation keep processes from interfering with each other."},{"id":"D3-024","d":3,"obj":"3.4","diff":1,"q":"In the protection ring model, which ring holds the most privileged code, such as the operating system kernel?","o":[["Ring 0","Correct. Ring 0 is the most privileged level, used by the kernel."],["Ring 1","Rings 1 and 2 are intermediate levels, sometimes used for drivers."],["Ring 2","Ring 2 is an intermediate level."],["Ring 3","Ring 3 is the least privileged level, where user applications run."]],"a":0,"k":"Lower ring number = more privilege. Kernel in ring 0, applications in ring 3."},{"id":"D3-025","d":3,"obj":"3.4","diff":2,"q":"Which concept mediates every access by subjects to objects and must be tamperproof, always invoked and small enough to be verified?","o":[["The security perimeter","The perimeter separates the trusted computing base from the rest of the system."],["The trusted computing base","The TCB is all the protection mechanisms together; the reference monitor is the access-mediating concept within it."],["The access control list","An ACL is data the reference monitor consults."],["The reference monitor","Correct. The security kernel implements the reference monitor concept."]],"a":3,"k":"Reference monitor: complete mediation, tamperproof, verifiable. The security kernel implements it."},{"id":"D3-026","d":3,"obj":"3.5","diff":3,"q":"Users may query average salaries by department. One department has a single employee, so a user can learn that person's salary. Which control BEST addresses this?","o":[["Encrypting the salary column","Encryption at rest does not stop authorized queries from revealing the result."],["Polyinstantiation","Polyinstantiation creates multiple records at different classification levels; it does not fix small result sets."],["Restricting the database to read-only access","Read-only access still allows the inference."],["Suppressing results drawn from too few records","Correct. Cell suppression or minimum query-set sizes stop aggregate results from exposing individuals."]],"a":3,"k":"Inference attacks deduce sensitive data from permitted queries; counter with cell suppression, query-size limits and noise."},{"id":"D3-027","d":3,"obj":"3.5","diff":2,"q":"A database holds two records with the same key: one visible to cleared users with the true cargo of a ship, and a cover story visible to everyone else. What is this technique?","o":[["Aggregation","Aggregation is the problem of combining data into something more sensitive."],["Polyinstantiation","Correct. Polyinstantiation creates multiple versions of a record at different classification levels to prevent inference."],["Data masking","Masking hides part of a value but does not create alternative records."],["Normalization","Normalization organizes tables to reduce redundancy."]],"a":1,"k":"Polyinstantiation prevents inference by giving lower levels a different version of the record."},{"id":"D3-028","d":3,"obj":"3.5","diff":2,"q":"A manufacturer's industrial control system runs legacy software that cannot easily be patched. What should be done FIRST to reduce risk?","o":[["Install endpoint antivirus on the controllers","Many controllers cannot run agents, and agents can disrupt real-time operations."],["Replace all controllers with current models","That may be the long-term plan, but it is slow and costly."],["Segment the ICS network from the corporate network and restrict remote access","Correct. Zones and tightly controlled conduits, as in ISA/IEC 62443, limit who and what can reach the controllers."],["Scan the controllers weekly with an aggressive vulnerability scanner","Active scanning can crash fragile industrial devices."]],"a":2,"k":"Protect ICS with segmentation, strict remote access and monitoring; availability and safety come first there."},{"id":"D3-029","d":3,"obj":"3.5","diff":1,"q":"What is the MOST serious security risk specific to virtualization?","o":[["VM escape from a guest to the hypervisor","Correct. Escaping a VM can compromise the hypervisor and every other guest on the host."],["VM sprawl, with forgotten and unpatched guests","Sprawl is a management problem that leads to unpatched VMs, but escape is the more severe risk."],["Higher licensing costs for guest operating systems","Cost is not a security risk."],["Slower disk performance from shared storage","Performance is not a security risk."]],"a":0,"k":"VM escape threatens the hypervisor and all co-hosted guests; keep hypervisors patched and minimal."},{"id":"D3-030","d":3,"obj":"3.5","diff":2,"q":"What is the key security difference between containers and virtual machines?","o":[["Containers are harder to patch than virtual machines","Container images are usually rebuilt rather than patched in place, which is often easier. Isolation is the key difference."],["Each virtual machine needs its own physical host","Many VMs share one physical host; that is what the hypervisor is for."],["Containers are more secure because their images are smaller","Smaller images help, but the shared kernel weakens isolation."],["Containers share the host operating system kernel","Correct. A kernel flaw or misconfiguration can let one container affect the host or others, so isolation is weaker than between VMs."]],"a":3,"k":"Containers share the host kernel: harden the host, run as non-root, use minimal images, and isolate sensitive workloads."},{"id":"D3-031","d":3,"obj":"3.5","diff":2,"q":"A team builds an application on serverless functions (FaaS). What remains the customer's security responsibility?","o":[["Patching the operating system under the function runtime","The provider manages the underlying servers and runtime."],["Physical security of the provider's data centers","That is always the provider's job."],["The function code and the permissions it is granted","Correct. Customers secure their code, dependencies, configuration and the identity permissions their functions use."],["Scaling the servers to handle load","Automatic scaling is part of the serverless service."]],"a":2,"k":"In serverless, you own code, dependencies, configuration and IAM permissions; over-permissive function roles are a common flaw."},{"id":"D3-032","d":3,"obj":"3.5","diff":1,"q":"Facilities installed smart thermostats on the corporate network. They use default credentials and get no security updates. What is the BEST response?","o":[["Isolate them on their own segment and change the defaults","Correct. Isolation limits what a compromised device can reach, and changing defaults closes the easiest way in."],["Leave them as they are, since thermostats hold no sensitive data","Compromised IoT devices are footholds into the network and can join botnets."],["Install antivirus on each thermostat","Most IoT devices cannot run security agents."],["Allow them only outbound access to the internet","That does not protect the internal network from the devices."]],"a":0,"k":"Treat IoT devices as untrusted: segment them, change defaults and monitor their traffic."},{"id":"D3-033","d":3,"obj":"3.5","diff":3,"q":"How should calls between internal services in a microservices application BEST be secured?","o":[["Trust any call that originates inside the cluster's private network","Network location is not identity; one compromised service could then call any other."],["Use a single shared API key for all internal services","A shared key gives every service the same identity and cannot express least privilege."],["Mutual TLS with per-service identities and per-call authorization","Correct. Each service authenticates its peer and is authorized only for the calls it needs, applying zero trust inside the application."],["Rely on the external API gateway to authenticate users","Gateway authentication protects the edge, not service-to-service traffic."]],"a":2,"k":"Microservices: authenticate and authorize every service call (mTLS, service identities), not just the edge."},{"id":"D3-034","d":3,"obj":"3.5","diff":2,"q":"Thousands of edge devices receive firmware updates over the internet. Which control is MOST important for the update process?","o":[["Compressing update packages to reduce bandwidth costs","Efficiency, not security."],["Signature verification of each image before install","Correct. Devices check a digital signature on each firmware image, so only authentic, unmodified firmware from the manufacturer is installed."],["Scheduling updates at night to avoid service disruption","Scheduling reduces disruption but does nothing against malicious firmware."],["Serving updates from a hidden, unpublished download URL","Obscurity is not protection."]],"a":1,"k":"Embedded and edge devices must accept only signed, verified firmware, ideally anchored in a hardware root of trust."},{"id":"D3-035","d":3,"obj":"3.5","diff":2,"q":"A desktop application connects directly to the central database using a privileged account whose password is stored in a configuration file on every workstation. What is the BEST fix?","o":[["Encrypt the configuration file with a key stored next to it","If the key sits beside the file, an attacker gets both."],["Make the configuration file read-only","Read-only still lets anyone read the password."],["Change the password every month","Rotation shortens exposure but every workstation still holds a privileged secret."],["Put a server-side tier between the clients and the database","Correct. Clients should never hold privileged credentials; a server-side tier authenticates each user and enforces authorization."]],"a":3,"k":"Client-based systems are untrusted: keep secrets and authorization decisions on the server."},{"id":"D3-036","d":3,"obj":"3.5","diff":1,"q":"In which cloud service model does the customer have the LEAST responsibility for security?","o":[["Infrastructure as a service","In IaaS the customer manages the OS and everything above it."],["Platform as a service","In PaaS the customer still manages its applications and their configuration."],["Software as a service","Correct. In SaaS the provider runs the application; the customer mainly manages its data, users and access."],["On-premises private cloud","In a private cloud the organization is responsible for everything."]],"a":2,"k":"Even in SaaS, the customer keeps responsibility for its data, identities and access configuration."},{"id":"D3-037","d":3,"obj":"3.6","diff":2,"q":"Twenty users must each be able to communicate privately with every other user using symmetric encryption. How many unique keys are needed?","o":[["190","Correct. Symmetric pairs need n(n − 1)/2 keys: 20 × 19 / 2 = 190."],["20","One key per user would let users read each other's traffic."],["40","40 is the number of keys for asymmetric encryption: two per user."],["380","380 counts each pair twice; n(n − 1) must be divided by 2."]],"a":0,"k":"Symmetric keys for n users: n(n − 1)/2. Asymmetric: 2n."},{"id":"D3-038","d":3,"obj":"3.6","diff":1,"q":"How many keys are needed in total for 50 users to communicate securely using asymmetric encryption?","o":[["50","Each user needs a key pair, not a single key."],["100","Correct. Each user has one public and one private key: 2 × 50 = 100."],["1,225","1,225 is the symmetric figure, 50 × 49 / 2."],["2,500","That is 50 squared, which has no meaning here."]],"a":1,"k":"Asymmetric cryptography scales: two keys per user, whatever the number of conversations."},{"id":"D3-039","d":3,"obj":"3.6","diff":1,"q":"Alice wants to send Bob a message that only Bob can read, using asymmetric cryptography. Which key should she encrypt it with?","o":[["Alice's private key","Anyone with Alice's public key could decrypt that, so it provides a signature, not confidentiality."],["Alice's public key","Only Alice could decrypt it."],["Bob's public key","Correct. Only Bob's private key can decrypt a message encrypted with his public key."],["Bob's private key","Alice does not have it; only Bob should."]],"a":2,"k":"Confidentiality: encrypt with the recipient's public key. Signature: sign with the sender's private key."},{"id":"D3-040","d":3,"obj":"3.6","diff":2,"q":"How is a digital signature created?","o":[["The sender encrypts the whole message with the recipient's public key","That provides confidentiality, not a signature."],["The sender encrypts the message with a shared secret key","That is symmetric encryption, which cannot prove which party created it."],["The recipient hashes the message and sends the hash back to the sender","The recipient does not create the signature."],["The sender encrypts a hash of the message with the sender's private key","Correct. The recipient decrypts the hash with the sender's public key and compares it to their own hash of the message."]],"a":3,"k":"Sign: hash, then encrypt the hash with your private key. Verify: decrypt with the sender's public key and compare hashes."},{"id":"D3-041","d":3,"obj":"3.6","diff":2,"q":"An application encrypts a bitmap image with AES in ECB mode. The outline of the picture is still visible in the ciphertext. Why?","o":[["AES has a known weakness when encrypting image files","AES itself is sound; the mode is the problem."],["Identical input blocks give identical output blocks","Correct. ECB encrypts each block independently, with no chaining or randomization, so repeating patterns in the input show through in the output."],["The key was too short for the size of the image","Key length does not create visible patterns."],["The initialization vector was reused for every block","ECB does not use an IV at all."]],"a":1,"k":"Avoid ECB: it leaks patterns. Use modes with IVs or nonces, preferably authenticated ones such as GCM."},{"id":"D3-042","d":3,"obj":"3.6","diff":2,"q":"Which AES mode provides both confidentiality and integrity (authenticated encryption)?","o":[["Galois/Counter Mode (GCM)","Correct. GCM combines counter-mode encryption with an authentication tag that detects tampering."],["Electron
