ngs to the right compartment. Which model is this?","o":[["Role-based access control","Roles do not compare clearances with labels."],["Mandatory access control","Correct. MAC uses labels set by the system or administrators, which users cannot override."],["Discretionary access control","In DAC, owners decide access."],["Risk-based access control","Risk-based access weighs context in real time."]],"a":1,"k":"MAC is nondiscretionary and label-based, often lattice-based with compartments for need to know."},{"id":"D5-028","d":5,"obj":"5.4","diff":2,"q":"A hospital lets nurses access patient records only for patients on their ward, during their shift, from hospital devices. Which model can express all of these conditions?","o":[["Role-based access control","A role alone cannot express ward, time and device conditions."],["Discretionary access control","Owner-granted permissions do not handle dynamic conditions."],["Attribute-based access control","Correct. ABAC evaluates attributes of the user, resource, action and environment in policies."],["Mandatory access control","MAC uses classification labels, not shift times or devices."]],"a":2,"k":"ABAC handles fine-grained, context-rich policies that RBAC cannot express without role explosion."},{"id":"D5-029","d":5,"obj":"5.4","diff":2,"q":"A company assigns permissions to job functions such as \"Accounts Payable Clerk\", and users get permissions by being placed in those functions. Which model is this?","o":[["Discretionary access control","DAC is owner-driven, not job-function-driven."],["Rule-based access control","Rule-based access applies the same rules to everyone."],["Attribute-based access control","ABAC uses policies over many attributes."],["Role-based access control","Correct. RBAC maps permissions to roles and users to roles, which simplifies administration."]],"a":3,"k":"RBAC suits stable job functions; watch for privilege creep as people change roles."},{"id":"D5-030","d":5,"obj":"5.4","diff":2,"q":"A firewall allows remote desktop connections to a server only between 8 a.m. and 6 p.m. for everyone. Which model does this best represent?","o":[["Rule-based access control","Correct. Global rules applied equally to all subjects are rule-based access control."],["Role-based access control","Roles are not involved; the rule applies to everyone."],["Discretionary access control","No owner is granting access."],["Mandatory access control","No labels or clearances are compared."]],"a":0,"k":"Rule-based access control applies the same rules to all subjects, as in firewalls and time restrictions."},{"id":"D5-031","d":5,"obj":"5.4","diff":2,"q":"In an access control architecture, which component evaluates requests against policy and decides whether to allow them?","o":[["The policy enforcement point","The PEP intercepts requests and enforces the decision it receives."],["The policy information point","The PIP supplies attribute values used in decisions."],["The policy decision point","Correct. The PDP evaluates policy and returns permit or deny to the PEP."],["The policy administration point","The PAP is where policies are written and managed."]],"a":2,"k":"PEP enforces, PDP decides, PIP supplies attributes, PAP manages policies (as in XACML and zero trust)."},{"id":"D5-032","d":5,"obj":"5.4","diff":3,"q":"An access control system stores, for each user, a list of the objects they may access and their rights on each. What is this structure?","o":[["An access control list","An ACL is attached to an object and lists the subjects that may access it."],["A capability table","Correct. Capability tables are subject-centric: each row is one subject's rights."],["A clearance label","A label is a classification marking, not a list of rights."],["A constrained interface","Constrained interfaces limit what users can see or do in an application."]],"a":1,"k":"ACLs are object-centric (columns of the access matrix); capability tables are subject-centric (rows)."},{"id":"D5-033","d":5,"obj":"5.4","diff":2,"q":"A database view shows managers only the rows for employees who report to them. Which type of access control is this?","o":[["Content-dependent access control","Correct. Access depends on the data itself, here whether the employee reports to the viewer."],["Context-dependent access control","Context-dependent access depends on circumstances such as time or location."],["Rule-based access control","Rule-based access applies global rules regardless of data content."],["Mandatory access control","MAC compares labels with clearances."]],"a":0,"k":"Content-dependent: what the data says. Context-dependent: when, where or how the request is made."},{"id":"D5-034","d":5,"obj":"5.4","diff":2,"q":"An ATM menu shows a customer only the functions they are allowed to use and greys out the rest. What is this control?","o":[["Rule-based access control","The menu is not applying global network rules."],["Separation of duties","No task is split between people."],["A constrained interface","Correct. Constrained (restricted) interfaces limit the actions available to a user based on their privileges."],["Mandatory access control","No classification labels are compared."]],"a":2,"k":"Constrained interfaces hide or disable functions a user is not authorized for."},{"id":"D5-035","d":5,"obj":"5.4","diff":3,"q":"A cloud application must enforce the same authorization policy across dozens of microservices written by different teams. Which design is BEST?","o":[["Let each team write its own authorization logic","Duplicated logic drifts and becomes inconsistent."],["Grant every authenticated user full access and audit later","That abandons least privilege."],["Put all permissions in each user's JWT and let services trust them indefinitely","Long-lived, bloated tokens become stale and cannot reflect revoked access promptly."],["Externalize decisions to a central policy decision point that every service queries","Correct. Central policy with local enforcement keeps authorization consistent and auditable."]],"a":3,"k":"Externalized authorization (central PDP, local PEPs) keeps policy consistent across distributed systems."},{"id":"D5-036","d":5,"obj":"5.4","diff":2,"q":"Which of the following is a nondiscretionary access control model?","o":[["Discretionary access control","By definition, DAC is discretionary."],["User-directed access control","User-directed access control is a form of DAC: users decide who may access what they own."],["Identity-based access control with owner-set ACLs","Identity-based access with owner-managed ACLs is the most common form of DAC."],["Role-based access control","Correct. In RBAC, central administrators define access through roles; users cannot pass on their permissions at will."]],"a":3,"k":"Nondiscretionary models (RBAC, rule-based, ABAC, MAC) are centrally administered."},{"id":"D5-037","d":5,"obj":"5.5","diff":1,"q":"An employee who has worked in four departments over ten years still has access from every previous role. What is this called?","o":[["Privilege creep","Correct. Access accumulates when transfers add rights without removing the old ones."],["Privilege escalation","Escalation is gaining higher rights through an exploit or misuse, not accumulation."],["Least privilege","Least privilege is the principle being violated here."],["Separation of duties","SoD splits tasks; it does not describe accumulated access."]],"a":0,"k":"Prevent privilege creep with access reviews and by removing old access at every transfer."},{"id":"D5-038","d":5,"obj":"5.5","diff":2,"q":"What is the PRIMARY purpose of periodic user access reviews (recertifications)?","o":[["To reset every user's password","Password resets are unrelated to reviewing entitlements."],["To measure system performance","Performance is not part of access review."],["To confirm access is still appropriate","Correct. Managers or data owners attest to each user's access and remove what is not needed, catching privilege creep and orphaned accounts."],["To train users on the acceptable use policy","Training is a separate activity."]],"a":2,"k":"Access reviews verify that access still matches need; they find privilege creep, orphaned accounts and SoD conflicts."},{"id":"D5-039","d":5,"obj":"5.5","diff":2,"q":"An access review finds dozens of active accounts belonging to people who left the company months ago. Which process failed?","o":[["Identity proofing","Proofing happens when an identity is first registered."],["Deprovisioning","Correct. Accounts should be disabled or removed promptly when people leave, triggered by HR events."],["Authentication","The accounts authenticate correctly; the problem is that they still exist."],["Federation","Federation trust is not the issue here."]],"a":1,"k":"Orphaned accounts come from weak deprovisioning; tie account removal to HR offboarding."},{"id":"D5-040","d":5,"obj":"5.5","diff":2,"q":"How should administrators' use of elevated privileges on Linux servers be managed?","o":[["Share the root password among the admin team","Shared root access destroys accountability."],["Individual accounts with logged sudo rules","Correct. Individual accounts, with sudo rules for specific commands and every use logged, give accountability with limited, audited elevation."],["Allow every administrator to log in directly as root over SSH","Direct root logins hide who did what and expose a high-value account."],["Disable logging of sudo to reduce noise","Logging privileged use is essential for accountability and detection."]],"a":1,"k":"Privilege escalation should be limited, individual and audited; sudo logs must be reviewed."},{"id":"D5-041","d":5,"obj":"5.5","diff":2,"q":"A service account used by a nightly batch job has a password that has never changed and is known to several former developers. What is the BEST improvement?","o":[["Allow interactive logon so the account can be tested easily","Interactive logon widens the attack surface of a non-human account."],["Add the account to the domain administrators group to avoid failures","That violates least privilege."],["Document the password in the team wiki for continuity","That spreads the secret further."],["Vault and rotate it, cut its rights, block interactive logon","Correct. Service accounts need an owner, least privilege, vaulted and rotated secrets, and no interactive use."]],"a":3,"k":"Service accounts: an owner, least privilege, no interactive logon, managed secrets and regular review."},{"id":"D5-042","d":5,"obj":"5.5","diff":2,"q":"A manager approves an employee's transfer to a new team. What should the access process do?","o":[["Keep the old access for 90 days in case the employee is needed back","Lingering access creates privilege creep."],["Grant access for the new role and remove access no longer needed","Correct. Role transitions are handled as a change of role definition, not an addition."],["Disable all access until the employee completes training","That disrupts work without reducing risk."],["Let the employee decide which old permissions to keep","Users should not decide their own entitlements."]],"a":1,"k":"Role transitions: add what the new role needs, remove what the old role had."},{"id":"D5-043","d":5,"obj":"5.5","diff":3,"q":"Access reviews keep finding that managers rubber-stamp approvals without looking at them. What is the BEST improvement?","o":[["Run the reviews more often","More frequent rubber-stamping does not help."],["Show risk-ranked data and require justifications","Correct. Reviews work when reviewers see risk-ranked, role-relative data that highlights what is unusual, and must justify high-risk entitlements."],["Have the security team approve all access instead of managers","Security staff lack the business context to judge need to know."],["Stop the reviews, since they add no value","Reviews are a key control; the fix is to make them meaningful."]],"a":1,"k":"Make access reviews effective: highlight outliers and risky entitlements, require justification, and track revocations."},{"id":"D5-044","d":5,"obj":"5.5","diff":2,"q":"Which account type is MOST important to include in access reviews?","o":[["Guest Wi-Fi accounts that expire daily","These are low risk and short-lived."],["Disabled accounts awaiting deletion","Disabled accounts matter less than active privileged ones."],["Read-only accounts on public websites","Low risk."],["Privileged and service accounts","Correct. They have the most power, are often shared or forgotten, and attackers target them."]],"a":3,"k":"Review privileged and service accounts most often and most rigorously."},{"id":"D5-045","d":5,"obj":"5.5","diff":1,"q":"When should a new employee's accounts be created?","o":[["After HR confirms the hire","Correct. Provisioning follows an authoritative HR trigger and grants role-based access."],["As soon as a candidate accepts an interview","Candidates are not employees; that creates unused accounts."],["On request from any team member","Requests must come through an authorized process."],["After the employee has worked for 30 days","Employees need appropriate access to do their jobs from the start."]],"a":0,"k":"Provisioning is driven by authoritative sources (HR) and role definitions, with approvals."},{"id":"D5-046","d":5,"obj":"5.6","diff":2,"q":"What does OAuth 2.0 provide on its own?","o":[["Authentication of users to applications","OAuth alone does not define how to authenticate a user; that is OpenID Connect's role."],["Delegated authorization for apps","Correct. An app gets limited access to resources on a user's behalf: OAuth issues access tokens with scopes, without sharing the user's password."],["Encryption of data at rest","OAuth has nothing to do with storage encryption."],["Network-level access control","OAuth works at the application layer."]],"a":1,"k":"OAuth 2.0 = authorization (access tokens). OpenID Connect = authentication layered on OAuth (ID tokens)."},{"id":"D5-047","d":5,"obj":"5.6","diff":2,"q":"A mobile app wants to sign users in with their existing account at a large identity provider and receive a verified identity token. Which protocol is designed for this?","o":[["RADIUS","RADIUS is for network access authentication."],["Kerberos","Kerberos is for authentication within an enterprise realm."],["OpenID Connect","Correct. OIDC adds an ID token (a signed JWT) describing the authenticated user on top of OAuth 2.0."],["TACACS+","TACACS+ is for device administration."]],"a":2,"k":"OIDC: modern web and mobile sign-in with ID tokens; SAML: XML assertions, common in enterprise web SSO."},{"id":"D5-048","d":5,"obj":"5.6","diff":2,"q":"A public mobile app uses the OAuth authorization code flow. Which addition protects the authorization code from being intercepted and redeemed by a malicious app?","o":[["Storing the client secret inside the app","Secrets embedded in public apps can be extracted."],["Using the implicit flow instead","The implicit flow is deprecated because it exposes tokens."],["Making access tokens never expire","Long-lived tokens increase the impact of theft."],["Proof Key for Code Exchange (PKCE)","Correct. PKCE binds the code to a secret the app created, so an intercepted code is useless to anyone else."]],"a":3,"k":"Public OAuth clients use the authorization code flow with PKCE; avoid the implicit flow."},{"id":"D5-049","d":5,"obj":"5.6","diff":2,"q":"In Kerberos, what does a client present to the ticket-granting service to obtain a ticket for a specific application server?","o":[["Its password, encrypted with the server's key","Kerberos never sends passwords over the network."],["Its ticket-granting ticket (TGT) and an authenticator","Correct. The TGT, issued by the authentication service, lets the client request service tickets without re-entering credentials."],["A SAML assertion","SAML is unrelated to Kerberos."],["A one-time password from a token","OTPs are not part of the standard Kerberos exchange."]],"a":1,"k":"Kerberos: authenticate to the AS to get a TGT; present the TGT to the TGS for service tickets; present those to services."},{"id":"D5-050","d":5,"obj":"5.6","diff":2,"q":"Users suddenly cannot authenticate with Kerberos, and the domain controller logs show \"clock skew too great\". What is the cause?","o":[["The users' passwords have expired","Expired passwords produce different errors."],["The KDC certificate has been revoked","Classic Kerberos does not rely on certificates."],["Clients and the KDC disagree on the time","Correct. Kerberos uses timestamps to prevent replay, so clocks must be synchronized, typically within five minutes."],["Port 88 is blocked","A blocked port would cause connection failures, not clock skew errors."]],"a":2,"k":"Kerberos depends on synchronized time (NTP) and an available KDC, which is a single point of failure."},{"id":"D5-051","d":5,"obj":"5.6","diff":2,"q":"Which AAA protocol uses TCP, encrypts the entire packet body, and separates authentication, authorization and accounting?","o":[["RADIUS","RADIUS uses UDP, encrypts only the password, and combines authentication with authorization."],["TACACS+","Correct. TACACS+ runs over TCP port 49, encrypts the whole payload and handles each A separately, which suits device administration."],["Diameter","Diameter is RADIUS's successor, used mainly in mobile networks."],["Kerberos","Kerberos is a ticket-based authentication protocol, not an AAA protocol for network devices."]],"a":1,"k":"RADIUS: UDP, password-only encryption, network access. TACACS+: TCP 49, full encryption, separate AAA, device admin."},{"id":"D5-052","d":5,"obj":"5.6","diff":2,"q":"An organization uses RADIUS to authenticate VPN and Wi-Fi users. Which weakness should it compensate for?","o":[["RADIUS cannot carry MFA challenges","RADIUS can carry MFA exchanges."],["RADIUS requires TCP, which is slow","RADIUS uses UDP."],["RADIUS cannot log accounting data","Accounting is one of RADIUS's three functions."],["Only the password is encrypted","Correct. Everything except the password attribute travels in the clear, so protect RADIUS traffic, for example with EAP-TLS inside, IPsec, or RADIUS over TLS (RadSec)."]],"a":3,"k":"RADIUS encrypts only the password attribute; protect its transport on untrusted networks."},{"id":"D5-053","d":5,"obj":"5.6","diff":3,"q":"An attacker with any domain account requests service tickets for accounts that have service principal names, then cracks them offline to recover service account passwords. What is this attack?","o":[["Kerberoasting","Correct. Service tickets are encrypted with the service account's key, so weak service account passwords can be cracked offline."],["Golden ticket","A golden ticket forges TGTs with the KRBTGT key."],["Pass the hash","Pass the hash reuses NTLM hashes without cracking them."],["Replay attack","Replay resends captured authentication messages."]],"a":0,"k":"Counter Kerberoasting with long random service account passwords or managed service accounts, AES-only tickets and monitoring."},{"id":"D5-054","d":5,"obj":"5.6","diff":2,"q":"In SAML, what does the service provider receive to prove the user authenticated at the identity provider?","o":[["The user's password, encrypted","SAML never passes passwords to the service provider."],["A Kerberos ticket","Kerberos tickets are a different technology."],["A digitally signed XML assertion","Correct. The SP validates the IdP's signature on the assertion, then trusts its statements about the user."],["An OAuth refresh token","Refresh tokens belong to OAuth."]],"a":2,"k":"SAML assertions are signed XML statements about authentication, attributes and authorization."},{"id":"D5-055","d":5,"obj":"5.6","diff":3,"q":"A SAML service provider accepts assertions without checking that they were issued for it and within their validity window. What attack does this enable?","o":[["SQL injection","SQL injection targets database queries."],["VLAN hopping","VLAN hopping is a network attack."],["A birthday attack on the signature","The weakness is in validation, not the hash function."],["Replay of assertions","Correct. Assertions captured or intended for other services can be replayed. SPs must check the signature, audience, recipient, validity period and one-time use of each assertion."]],"a":3,"k":"Validate SAML assertions fully: signature, issuer, audience, recipient, time window and replay."},{"id":"D5-056","d":5,"obj":"5.6","diff":1,"q":"Which TCP/UDP port does Kerberos use?","o":[["389","389 is LDAP."],["88","Correct. Kerberos uses port 88."],["1812","1812 is RADIUS authentication."],["49","49 is TACACS+."]],"a":1,"k":"Ports to know: Kerberos 88, LDAP 389, LDAPS 636, RADIUS 1812/1813, TACACS+ 49."},{"id":"D6-001","d":6,"obj":"6.1","diff":2,"q":"A company's customers want assurance about its security controls from someone other than the company's own staff. Which option gives them the MOST independent view?","o":[["An external audit by an independent firm","Correct. External auditors are outside the organization's control and have no stake in the result, so customers and regulators can rely on their findings."],["An internal audit by the company's own audit team","Internal auditors can be independent of the areas they audit, but they are still the company's employees."],["A self-assessment questionnaire completed by IT","Self-assessment is the least independent option of all."],["A review by the developers who built the system","Builders reviewing their own work have an obvious conflict of interest."]],"a":0,"k":"Internal audits use the organization's own staff; external audits use an outside firm; third-party audits are performed by or for another organization, such as a customer or regulator."},{"id":"D6-002","d":6,"obj":"6.1","diff":2,"q":"Before a penetration test begins, what MUST be in place?","o":[["A list of the vulnerabilities the testers are expected to find","Testers discover vulnerabilities; they do not start with a list of expected findings."],["Written authorization and agreed rules of engagement","Correct. Signed permission from someone with authority, plus scope, timing, methods and contacts, separates a test from an attack."],["Full administrator credentials for every system","Credentials depend on the test type; many tests start with none."],["A press release announcing the test","Tests are usually kept to a small group to avoid tipping off staff or attackers."]],"a":1,"k":"Never test without written authorization and rules of engagement that define scope, methods, timing and contacts."},{"id":"D6-003","d":6,"obj":"6.1","diff":2,"q":"A company wants to penetration-test its application running on a major public cloud platform. What should it check FIRST?","o":[["Whether its own firewall allows outbound scans","Outbound rules matter less than whether testing is permitted at all."],["Whether the testers have cloud certifications","Tester qualifications matter, but permission comes first."],["The provider's rules on customer testing","Correct. The cloud provider's testing policy sets what customers may test, and testing their shared infrastructure without permission can breach the contract or the law."],["Whether the test can be run during business hours","Timing is part of planning, after confirming the test is permitted."]],"a":2,"k":"Location matters: on-premises, cloud and hybrid environments have different ownership, permissions and responsibilities for testing."},{"id":"D6-004","d":6,"obj":"6.1","diff":2,"q":"How should an organization decide which systems to assess most often?","o":[["Alphabetically, so every system gets its turn","An arbitrary order ignores risk."],["By whichever system administrators volunteer","Volunteering does not reflect risk."],["Equally, with every system assessed every quarter","Equal frequency wastes effort on low-risk systems and under-tests critical ones."],["By risk to the business","Correct. Weigh criticality, data sensitivity, exposure and regulatory requirements, and focus effort where the risk is highest."]],"a":3,"k":"Design assessment strategies around risk, compliance obligations and change; validate that they cover what matters."},{"id":"D6-005","d":6,"obj":"6.1","diff":3,"q":"A company's application runs partly in its own data center and partly on a SaaS platform. How should its assessment strategy cover the SaaS portion?","o":[["Use the provider's attestations and test its own configuration","Correct. In a hybrid environment you rely on independent attestations, such as SOC 2 Type II, for the provider's controls, and test what you control yourself: configuration and integrations."],["Run an unannounced penetration test against the SaaS provider's infrastructure","Testing a provider without permission may be illegal and breaches its terms."],["Exclude it, because the SaaS provider is responsible for security","Shared responsibility leaves the customer accountable for its data, identities and configuration."],["Ask the provider to send its internal vulnerability scan results each week","Providers rarely share raw internal results; independent attestations are the normal route."]],"a":0,"k":"For cloud and hybrid systems: rely on provider attestations for their side, and test your own configuration, identities and integrations."},{"id":"D6-006","d":6,"obj":"6.1","diff":2,"q":"Which statement BEST distinguishes an audit from an assessment?","o":[["An audit is always performed by the organization's internal security team","Audits can be internal or external."],["An assessment always results in a certification","Assessments are usually advisory and lead to recommendations."],["Audits test against criteria; assessments evaluate and advise","Correct. An audit checks compliance against defined criteria and is formally reported; an assessment evaluates risk and recommends improvements."],["There is no difference; the terms are interchangeable","They differ in purpose, rigor and reporting."]],"a":2,"k":"Audits measure against criteria with formal attestation; assessments evaluate and advise."},{"id":"D6-007","d":6,"obj":"6.1","diff":2,"q":"A new regulation requires annual independent testing of security controls. Which design element ensures the testing strategy remains valid as the environment changes?","o":[["Using the same test plan every year without changes","A static plan misses new systems and threats."],["Testing only the systems that failed last year","That ignores new and changed systems."],["Letting the test vendor decide the scope each year","The organization must own the scope based on its risk."],["Updating the scope as systems and threats change","Correct. Strategies must be validated and refreshed so testing keeps covering the real environment."]],"a":3,"k":"Validate assessment strategies regularly: scope, methods and frequency must follow changes in systems, threats and requirements."},{"id":"D6-008","d":6,"obj":"6.2","diff":1,"q":"What is the main difference between a vulnerability assessment and a penetration test?","o":[["Pen tests exploit weaknesses; assessments find them","Correct. Exploitation shows real impact and attack paths; vulnerability assessments find and rank potential weaknesses."],["Vulnerability assessments are always performed manually","Most vulnerability assessments rely heavily on automated scanners."],["Penetration tests never require authorization","Penetration tests absolutely require authorization."],["A vulnerability assessment is more intrusive","Penetration testing is the more intrusive of the two."]],"a":0,"k":"Vulnerability assessment: find and prioritize. Penetration test: exploit to demonstrate impact."},{"id":"D6-009","d":6,"obj":"6.2","diff":2,"q":"Why are credentialed (authenticated) vulnerability scans usually more accurate than uncredentialed ones?","o":[["They run faster across the network","Speed is not why they are more accurate."],["The scanner can check software and settings directly","Correct. Logging in lets the scanner read configuration and versions instead of guessing from the outside, reducing false positives and negatives."],["They do not require written authorization from owners","All scans require authorization."],["They only look for zero-day vulnerabilities","Scanners look mostly for known vulnerabilities."]],"a":1,"k":"Credentialed scans see inside the host; uncredentialed scans show the attacker's external view. Both are useful."},{"id":"D6-010","d":6,"obj":"6.2","diff":2,"q":"A scanner reports a critical vulnerability, but investigation shows the affected software is not installed on the host. What is this result?","o":[["A false negative","A false negative is a missed real vulnerability."],["A true positive","A true positive is a real vulnerability that was correctly reported."],["A false positive","Correct. The scanner reported a vulnerability that does not exist."],["A true negative","A true negative is correctly reporting that no vulnerability exists."]],"a":2,"k":"False positives waste effort; false negatives leave real risk hidden. Tune scanners and validate findings."},{"id":"D6-011","d":6,"obj":"6.2","diff":2,"q":"During a penetration test, the testers are given network diagrams, source code and credentials in advance. What type of test is this?","o":[["Black box","Black-box testers start with no knowledge, like an outside attacker."],["Gray box","Gray-box testers get partial knowledge, such as user credentials."],["Blind test","In a blind test, the testers know little about the target."],["White box","Correct. White-box (crystal box) testers get full knowledge, allowing thorough coverage in less time."]],"a":3,"k":"Black box: no knowledge. Gray box: partial. White box: full knowledge."},{"id":"D6-012","d":6,"obj":"6.2","diff":2,"q":"In which exercise do attackers and defenders work together in real time, sharing what they see so the defenders can improve detection?","o":[["Red team exercise","A red team emulates adversaries, usually without telling the defenders."],["Purple team exercise","Correct. Purple teaming combines the red and blue teams collaboratively to improve detection and response."],["Blue team exercise","The blue team defends; on its own it does not emulate attacks."],["Tabletop exercise","Tabletops discuss scenarios verbally without live attack activity."]],"a":1,"k":"Red attacks, blue defends, purple collaborates to turn findings into better detection."},{"id":"D6-013","d":6,"obj":"6.2","diff":2,"q":"In a double-blind penetration test, who knows the test is taking place?","o":[["Everyone in the IT, security and operations teams","If everyone knows, the test is not blind at all."],["Only the testers","Someone with authority must always know and authorize the test."],["Testers and the senior managers who authorized it","Correct. The defenders are not told, so the test measures real detection and response."],["Only the system administrators","Administrators are typically among those not told."]],"a":2,"k":"Blind: testers have little information. Double-blind: defenders are not told either, which tests detection and response."},{"id":"D6-014","d":6,"obj":"6.2","diff":2,"q":"A monitoring tool runs a scripted login and purchase on the e-commerce site every five minutes from several locations. What is this?","o":[["Synthetic transactions","Correct. Scripted, simulated transactions check availability and function proactively, even when no real users are active."],["Real user monitoring (RUM)","RUM passively records real users' sessions."],["Fuzz testing of the checkout","Fuzzing feeds malformed input to find crashes."],["Static analysis of site code","Static analysis examines code without running it."]],"a":0,"k":"Synthetic transactions are proactive and scripted; real user monitoring is passive and based on actual traffic."},{"id":"D6-015","d":6,"obj":"6.2","diff":2,"q":"A security team wants to find flaws in source code before it is compiled or run. Which technique should it use?","o":[["Dynamic application security testing","DAST tests the running application from outside."],["Static application security testing","Correct. SAST analyzes source code or binaries without executing them."],["Penetration testing","Penetration testing attacks a running system."],["Real user monitoring","RUM observes production traffic."]],"a":1,"k":"SAST: code at rest (early, white box). DAST: running app (black box). IAST: instrumented runtime. SCA: third-party components."},{"id":"D6-016","d":6,"obj":"6.2","diff":2,"q":"A tester feeds a file parser thousands of randomly modified versions of valid input files to find crashes. What is this technique?","o":[["Generational fuzzing","Generational fuzzing builds inputs from a model of the format rather than changing samples."],["Regression testing","Regression tests check that old functionality still works after a change."],["Mutation (dumb) fuzzing","Correct. Mutation fuzzing alters existing valid inputs to create test cases."],["Misuse case testing","Misuse cases test scenarios of abuse defined by people, not random changes."]],"a":2,"k":"Fuzzing: mutation alters samples; generational builds inputs from a specification. Both find input-handling flaws."},{"id":"D6-017","d":6,"obj":"6.2","diff":2,"q":"A team writes test scenarios describing how an attacker might abuse the application, such as entering negative quantities to get refunds, and tests that the application resists them. What is this?","o":[["Unit testing","Unit tests check individual components against their expected behavior."],["Synthetic transaction testing","Synthetic transactions simulate normal user activity."],["Load testing","Load testing checks performance under volume."],["Misuse case testing","Correct. Misuse (abuse) cases model how the system could be attacked and verify the defenses."]],"a":3,"k":"Misuse case testing turns attacker behavior into test cases alongside normal use cases."},{"id":"D6-018","d":6,"obj":"6.2","diff":3,"q":"Testing executed every line of code, but not every true/false outcome of each decision. Which coverage measure is still incomplete?","o":[["Function coverage","Functions were all called if every line ran."],["Statement coverage","Executing every line achieves full statement coverage."],["Branch coverage","Correct. Branch coverage requires each decision to take both its true and false paths, which line coverage does not guarantee."],["Loop coverage","Loop coverage is a different measure, concerning loop iterations."]],"a":2,"k":"Coverage analysis: statement, branch, condition, function and loop coverage measure how thoroughly tests exercise code."},{"id":"D6-019","d":6,"obj":"6.2","diff":2,"q":"Testers send malformed and unexpected requests directly to an application's REST API, bypassing the web interface. What type of testing is this?","o":[["Interface testing","Correct. Interface testing checks how components behave at their boundaries: user interfaces, network interfaces and APIs."],["User acceptance testing","UAT confirms the system meets business needs."],["Regression testing","Regression testing checks that changes did not break existing functions."],["Code review","Code review reads code; it does not send requests."]],"a":0,"k":"Test every interface, especially APIs, which often lack the validation the user interface performs."},{"id":"D6-020","d":6,"obj":"6.2","diff":2,"q":"A company runs a platform that continuously simulates known attack techniques against its environment to check whether its controls detect and block them. What is this?","o":[["A tabletop exercise for responders","Tabletops are discussions, not technical simulations."],["A configuration compliance check","Compliance checks verify configurations against requirements."],["Breach and attack simulation","Correct. BAS tools automate safe attack scenarios, often mapped to MITRE ATT&CK, to validate controls continuously."],["Fuzz testing","Fuzzing targets input handling in software."]],"a":2,"k":"Breach and attack simulation continuously validates whether controls detect and stop real techniques."},{"id":"D6-021","d":6,"obj":"6.2","diff":2,"q":"Which code review method is the most formal, with defined roles, preparation, an inspection meeting, rework and follow-up?","o":[["Pair programming","Pairing reviews code informally as it is written."],["Over-the-shoulder review","An informal walkthrough at a developer's desk."],["Tool-assisted review in a pull request","Lightweight and common, but not the formal inspection process."],["Fagan inspection","Correct. Fagan inspections follow planning, overview, preparation, inspection, rework and follow-up."]],"a":3,"k":"Fagan inspection is the most formal code review; lighter methods include pull-request review and pair programming."},{"id":"D6-022","d":6,"obj":"6.2","diff":1,"q":"Why are log reviews valuable as a security control test?","o":[["They show whether controls are working and reveal suspicious activity","Correct. Reviewing logs verifies that controls operate as intended and catches anomalies, such as failed logins or policy violations."],["They replace the need for vulnerability scanning","Logs and scans answer different questions."],["They prevent attacks from occurring","Log review is detective, not preventive."],["They are required only for compliance and have no security value","Logs are a primary source of security evidence."]],"a":0,"k":"Log reviews are a detective test of controls; they need synchronized time and protected logs to be trustworthy."},{"id":"D6-023","d":6,"obj":"6.2","diff":2,"q":"After a patch is applied, testers re-run earlier test cases to confirm that nothing that worked before is now broken. What is this?","o":[["Acceptance testing","Acceptance testing confirms the system meets requirements before go-live."],["Regression testing","Correct. Regression testing checks that changes have not reintroduced old defects or broken existing functions."],["Fuzz testing","Fuzzing uses malformed inputs."],["Penetration testing","Penetration testing attempts to exploit weaknesses."]],"a":1,"k":"Regression testing protects against changes that break what already worked."},{"id":"D6-024","d":6,"obj":"6.2","diff":2,"q":"An automated tool compares server configurations with the organization's hardening standard and reports deviations. What type of test is this?","o":[["Penetration testing","Nothing is being exploited."],["Misuse case testing","No abuse scenarios are being exercised."],["A compliance check","Correct. Compliance checks verify that systems meet defined requirements and baselines."],["Real user monitoring","RUM observes user traffic."]],"a":2,"k":"Compliance checks compare actual configurations with required baselines and policies."},{"id":"D6-025","d":6,"obj":"6.2","diff":3,"q":"A penetration tester gains access to a database server and finds customer data. The rules of engagement do not mention data handling. What should the tester do?","o":[["Download a sample of records to prove impact in the report","Copying real customer data creates a data breach of its own."],["Continue deeper into the network to see how far the access goes","Continuing beyond authorized scope or without guidance risks harm."],["Stop, record the access without copying data, and escalate","Correct. Testers minimize exposure of sensitive data and escalate unexpected situations to the client's designated contact."],["Delete the data to show it was not protected","Destroying data causes real damage."]],"a":2,"k":"Pen testers prove access with minimal evidence, never exfiltrate real sensitive data, and escalate unexpected findings."},{"id":"D6-026","d":6,"obj":"6.3","diff":2,"q":"Which metric is a key risk indicator (KRI) rather than a key performance indicator (KPI)?","o":[["Percentage of help desk tickets closed within SLA","That measures operational performance."],["Number of awareness courses delivered this quarter","That measures activity or performance."],["Average time to deploy a new server","That measures operational efficiency."],["Critical vulnerabilities open past their deadline","Correct. KRIs signal rising risk exposure, prompting action before it materializes into an incident."]],"a":3,"k":"KPIs measure how well processes perform; KRIs warn that risk is rising toward or beyond appetite."},{"id":"D6-027","d":6,"obj":"6.3","diff":2,"q":"Backup jobs have reported \"success\" every night for a year, but no one has ever restored from them. What security process data is missing?","o":[["Backup job completion logs","Those exist; they show only that jobs ran."],["Evidence from regular test restores","Correct. Only restore tests prove that backups are complete and usable."],["Storage capacity reports","Capacity data does not show whether backups can be restored."],["The backup software's license status","Licensing is unrelated to recoverability."]],"a":1,"k":"Backup verification data comes from test restores, not just job success messages."},{"id":"D6-028","d":6,"obj":"6.3","diff":2,"q":"Which data BEST shows that account management processes are working?","o":[["The number of accounts in the directory","A count alone says nothing about correctness."],["The password complexity setting","A setting shows configuration, not process effectiveness."],["Accounts reconciled against HR records","Correct. Reconciling active accounts against authoritative HR records shows orphaned accounts and how long leavers take to be disabled."],["The number of failed logins recorded per day","Failed logins indicate attacks or user error, not account management quality."]],"a":2,"k":"Account management data: leaver deprovisioning times, orphaned accounts found, access review results."},{"id":"D6-029","d":6,"obj":"6.3","diff":2,"q":"Why should security process data be presented to management for review and approval?","o":[["To prove the security team is busy","Activity reports are not the purpose."],["Because auditors require a signature on every report","Audit requirements are a by-product, not the reason."],["So management can tune the technical configuration of controls","Technical tuning is the operational team's job."],["So the risk owners can make informed decisions","Correct. Those accountable for risk use the data to decide and allocate resources; management review closes the loop between measurement and governance."]],"a":3,"k":"Management review and approval turn security metrics into governance decisions."},{"id":"D6-030","d":6,"obj":"6.3","diff":2,"q":"Which measure of an awareness program is the MOST useful security process data?","o":[["The number of posters displayed in offices","Posters are an activity, not an outcome."],["Trends in phishing reports and clicks","Correct. The trend in reported phishing versus simulated-phishing clicks shows whether training is changing how people act."],["The training vendor's customer satisfaction score","Vendor satisfaction is not a security outcome."],["The length of the training videos","Length is not effectiveness."]],"a":1,"k":"Measure training by behavior: reporting rates, click rates and incident trends."},{"id":"D6-031","d":6,"obj":"6.3","diff":2,"q":"After a disaster recovery test, which data is MOST important to collect and report?","o":[["The number of people who attended the test","Attendance does not show whether recovery works."],["The cost of catering for the test day","Not relevant to recoverability."],["Measured recovery against RTO and RPO","Correct. Comparing actual recovery times and data loss to the objectives shows whether the plan can meet business requirements."],["The names of the vendors involved","Vendor names do not measure recovery capability."]],"a":2,"k":"DR and BC data: measured recovery times and data loss against RTO and RPO, plus issues found and fixed."},{"id":"D6-032","d":6,"obj":"6.3","diff":3,"q":"Management asks for a single dashboard to judge whether the security program is effective. Which approach is BEST?","o":[["Show raw counts of firewall blocks and antivirus detections","Large numbers of blocked events are activity, not evidence of effectiveness, and are easily misread."],["Show only metrics that are currently green","Hiding bad news prevents informed decisions."],["Show every metric the tools can generate","Too many metrics bury the signal."],["A few business-aligned KPIs and KRIs, with trends","Correct. Metrics should be relevant, trended and tied to decisions management can make."]],"a":3,"k":"Good security metrics are few, business-aligned, trended and actionable."},{"id":"D6-033","d":6,"obj":"6.4","diff":2,"q":"A vulnerability scan finds hundreds of issues. How should remediation be prioritized?","o":[["In the order the scanner listed them","Scanner order does not reflect risk."],["By severity, asset value and exploitability","Correct. Risk-based prioritization uses CVSS together with context, such as internet exposure and known exploits."],["Fix the easiest ones first to reduce the count quickly","Quick wins may leave the most dangerous issues open."],["Fix everything at once in a single maintenance window","Rarely feasible and risky for stability."]],"a":1,"k":"Prioritize remediation by risk: severity, asset value, exposure and exploit availability."},{"id":"D6-034","d":6,"obj":"6.4","diff":2,"q":"A critical vulnerability cannot be patched for three months because the vendor has no fix. How should this be handled?","o":[["Mark the finding as resolved in the report with a note","That misrepresents the risk."],["Remove the system from future scans until a patch exists","Hiding the finding does not reduce the risk."],["Ignore it until the vendor releases a patch","Ignoring risk is never acceptable."],["A time-limited, approved risk exception","Correct. Document the exception with compensating controls, approval by the risk owner and an expiry date."]],"a":3,"k":"Exceptions must be documented, justified, approved by the risk owner, time-bound and reviewed."},{"id":"D6-035","d":6,"obj":"6.4","diff":2,"q":"A researcher finds a vulnerability in a vendor's product. Which approach follows coordinated (responsible) disclosure?","o":[["Publish full details immediately so users can protect themselves","Immediate full disclosure exposes users before a fix exists."],["Report it privately and agree a disclosure date","Correct. Reporting privately to the vendor with an agreed timeline gives it time to fix the flaw while committing to eventual publication."],["Sell the details to the highest bidder","Selling vulnerabilities to unknown buyers is unethical and may be illegal."],["Never tell anyone, to avoid legal risk","Silence leaves users exposed indefinitely."]],"a":1,"k":"Ethical disclosure: private report, reasonable deadline, coordinated publication."},{"id":"D6-036","d":6,"obj":"6.4","diff":2,"q":"A penetration test report will be read by the board and by system administrators. How should it be structured?","o":[["A single technical section written for every reader","Executives need business impact, not packet captures."],["Only an executive summary, with technical details withheld","Administrators need technical details to fix issues."],["Executive summary first, then technical findings","Correct. An executive summary of risk and impact serves leaders, who decide; detailed findings and remediation steps serve technical teams, who fix."],["A list of every command the testers ran","Logs belong in an appendix, not as the report."]],"a":2,"k":"Test reports: executive summary (risk, impact, priorities) plus technical findings with evidence and remediation."},{"id":"D6-037","d":6,"obj":"6.4","diff":2,"q":"After remediation, what should happen to the findings from a penetration test?","o":[["Close them as soon as the owners say they are fixed","Owner claims need verification."],["Archive them; the test is over","Unverified fixes may not work."],["Retest to confirm the fixes are effective","Correct. Verification testing confirms the vulnerabilities are actually closed and no new ones were introduced."],["Wait for the next annual test to check","A year is too long to leave fixes unverified."]],"a":2,"k":"Close the loop: remediate, retest, then close findings with evidence."},{"id":"D6-038","d":6,"obj":"6.4","diff":3,"q":"A penetration test finds a critical flaw that is being actively exploited elsewhere. The final report is due in two weeks. What should the testers do?","o":[["Tell the client's designated contact now","Correct. Critical, exploitable findings should be escalated as soon as they are found, as the rules of engagement typically require."],["Include it in the final report as planned","Waiting two weeks leaves the client exposed to an active threat."],["Fix the flaw themselves to save time","Testers should not change production systems outside their authority."],["Publish an advisory to warn other companies","Client findings are confidential."]],"a":0,"k":"Critical findings are reported immediately through agreed channels, not held for the final report."},{"id":"D6-039","d":6,"obj":"6.5","diff":1,"q":"A cloud provider's customers need assurance about the controls relevant to their financial reporting. Which report should the provider supply?","o":[["SOC 1","Correct. SOC 1 reports cover controls relevant to customers' internal control over financial reporting."],["SOC 2","SOC 2 covers the Trust Services Criteria: security, availability, processing integrity, confidentiality and privacy."],["SOC 3","SOC 3 is a general-use summary of a SOC 2 engagement."],["ISO 27001 certificate","ISO certification covers an ISMS, not financial reporting controls."]],"a":0,"k":"SOC 1: financial reporting controls. SOC 2: Trust Services Criteria, restricted use. SOC 3: public summary."},{"id":"D6-040","d":6,"obj":"6.5","diff":2,"q":"A customer wants evidence that a provider's security controls operated effectively over the past twelve months, not just that they were designed well. Which report should it ask for?","o":[["SOC 2 Type I","Type I reports on control design at a single point in time."],["SOC 2 Type II","Correct. Type II reports test whether controls operated effectively over a period, typically 6–12 months."],["SOC 3","SOC 3 is a high-level public report without detailed test results."],["A vendor self-assessment questionnaire","Self-assessment is not independent assurance."]],"a":1,"k":"Type I: design at a point in time. Type II: operating effectiveness over a period."},{"id":"D6-041","d":6,"obj":"6.5","diff":2,"q":"A company wants to publish a security assurance report on its website for prospective customers. Which report is designed for general use?","o":[["SOC 1 Type II","SOC 1 reports are restricted to customers and their auditors."],["SOC 2 Type II","SOC 2 reports are restricted-use and usually shared under NDA."],["SOC 3","Correct. SOC 3 is a general-use report suitable for public distribution."],["An internal audit report","Internal reports are not meant for public release."]],"a":2,"k":"SOC 3 is the public, general-use report; SOC 1 and SOC 2 are restricted."},{"id":"D6-042","d":6,"obj":"6.5","diff":2,"q":"Which attestation standard governs SOC reports in the United States?","o":[["ISO/IEC 27001","ISO 27001 is a management system standard, not an attestation standard for SOC reports."],["PCI DSS","PCI DSS is a payment card industry standard."],["NIST SP 800-53","SP 800-53 is a control catalog."],["SSAE 18","Correct. SOC reports are issued under the AICPA's SSAE 18; ISAE 3402 is the international counterpart."]],"a":3,"k":"SSAE 18 (U.S.) and ISAE 3402 (international) govern service organization control reports."},{"id":"D6-043","d":6,"obj":"6.5","diff":2,"q":"What is the MOST important characteristic of an internal audit function?","o":[["It reports to the IT department it audits","Reporting to the audited function undermines objectivity."],["Independence from the areas it audits","Correct. Auditors must be free from influence by the functions they assess, for example by reporting to the audit committee."],["It performs all security operations tasks","Auditors evaluate controls; they should not operate them."],["It only audits areas management asks it to","Auditors should be able to set scope based on risk."]],"a":1,"k":"Auditor independence is essential: internal audit typically reports to the board's audit committee."},{"id":"D6-044","d":6,"obj":"6.5","diff":2,"q":"A company outsources payroll to a provider. Which contract clause BEST supports the company's ability to verify the provider's security?","o":[["A clause requiring the provider to follow industry best practices","Too vague to verify or enforce."],["A clause promising the provider will never be breached","No provider can guarantee that."],["A clause requiring monthly invoices","Billing terms do not provide assurance."],["A right-to-audit or attestation clause","Correct. A right to audit, or a duty to supply independent attestations such as SOC 2 Type II, gives you evidence that controls work."]],"a":3,"k":"Third-party audits rely on contract terms: right to audit or regular independent attestations."},{"id":"D6-045","d":6,"obj":"6.5","diff":3,"q":"An external auditor reviewing a provider's SOC 2 Type II report notes several \"complementary user entity controls\". What do these mean for the customer?","o":[["They are optional suggestions with no effect on assurance","They are required for the provider's controls to achieve their objectives."],["They are controls the auditor tested at the customer's site","The auditor does not test the customer's controls in the provider's report."],["The customer must run some controls itself","Correct. The provider's controls are only effective if customers implement these controls themselves, such as managing their own user access, or the assurance does not hold."],["They are controls the provider failed to implement","Exceptions are reported separately from complementary user entity controls."]],"a":2,"k":"Read SOC reports fully: exceptions, scope, carve-outs and the complementary controls you must operate yourself."},{"id":"D6-046","d":6,"obj":"6.5","diff":2,"q":"The external auditor finds a control deficiency. Who should decide how it is addressed?","o":[["The auditor, who should then fix it","Auditors report findings; fixing them would compromise their independence."],["Management, as the risk owner","Correct. Management decides the response and remediation plan; auditors later verify it."],["The help desk","The help desk is not accountable for control design."],["The vendor who supplied the system","Vendors may help, but the organization owns its controls."]],"a":1,"k":"Auditors find and report; management owns remediation decisions."},{"id":"D6-047","d":6,"obj":"6.5","diff":2,"q":"Internal and external audits are both planned this year. Where do they differ MOST?","o":[["Only internal audits can examine security controls","Both can examine security controls."],["External audits never involve any testing of controls","External audits test controls extensively."],["Internal audits always result in certification","Certification comes from external assessments against a standard."],["Who performs them, and their independence","Correct. Internal auditors are employees; external auditors are hired from outside and provide greater independence."]],"a":3,"k":"Audit types differ by who performs them and by their independence: internal, external, third-party."},{"id":"D7-001","d":7,"obj":"7.1","diff":1,"q":"A server's hard drive is seized and presented in court as evidence. What type of evidence is the drive itself?","o":[["Real evidence","Correct. Real (object) evidence is a physical item brought into court."],["Testimonial evidence from the server administrator","Testimonial evidence is what a witness says, orally or in writing."],["Demonstrative evidence, such as a diagram of the network","Demonstrative evidence helps explain other evidence, such as charts and diagrams."],["Documentary evidence, such as printed log reports","Documentary evidence is written material, including printouts, brought in to prove a fact."]],"a":0,"k":"Evidence types: real (objects), documentary (writings and records), testimonial (witnesses), demonstrative (aids that explain)."},{"id":"D7-002","d":7,"obj":"7.1","diff":2,"q":"Which rule says that when a document is introduced as evidence, the original must be used unless a valid exception applies?","o":[["The parol evidence rule, which governs written agreements","The parol evidence rule says a written agreement is assumed to contain all its terms; oral side agreements cannot change it."],["The best evidence rule","Correct. The original document is preferred over copies or descriptions of it."],["The hearsay rule, which limits second-hand statements","Hearsay concerns statements made outside court by someone not testifying."],["The exclusionary rule for illegally obtained evidence","That rule excludes evidence obtained in violation of rights."]],"a":1,"k":"Best evidence: originals preferred. Parol evidence: written contracts stand alone. Hearsay: second-hand statements are limited."},{"id":"D7-003","d":7,"obj":"7.1","diff":2,"q":"Responders arrive at a running server that is suspected of compromise. According to the order of volatility, which data should they collect FIRST?","o":[["The contents of the hard disk","Disk data persists after power-off, so it can wait."],["Archived backup tapes stored offsite","Archives are the least volatile source."],["The contents of memory (RAM)","Correct. Registers, cache and memory disappear when the system is powered off, so they are captured first."],["The physical network topology diagrams","Topology changes slowly and can be documented later."]],"a":2,"k":"Order of volatility (RFC 3227): registers and cache → memory, routing and process tables → temporary files → disk → remote logs → archives."},{"id":"D7-004","d":7,"obj":"7.1","diff":2,"q":"How should an investigator create a forensic copy of a seized hard drive?","o":[["Copy the files with the operating system's file manager","File copies miss deleted data and slack space and change timestamps."],["Boot the suspect system and run a backup to an external drive","Booting the suspect system alters evidence."],["Take a photo of the drive label and keep the original in a drawer","That preserves nothing about the contents."],["Make a bit-for-bit image through a write blocker and hash both copies","Correct. A write blocker prevents changes to the original, and matching hashes prove the image is identical."]],"a":3,"k":"Forensic imaging: write blocker, bit-stream copy, hashes of original and image, analysis on the copy only."},{"id":"D7-005","d":7,"obj":"7.1","diff":1,"q":"What is the PRIMARY purpose of the chain of custody?","o":[["To prove evidence integrity from collection to court","Correct. It shows the evidence was controlled and unaltered by recording who handled it, when, where and why."],["To list the investigators who are qualified to testify","Qualifications matter, but they are not what the chain of custody records."],["To speed up the processing of evidence in the lab","Documentation adds steps; its purpose is integrity, not speed."],["To determine which law enforcement agency has jurisdiction","Jurisdiction is decided separately."]],"a":0,"k":"Chain of custody documents every transfer of evidence so its integrity can be proven."},{"id":"D7-006","d":7,"obj":"7.1","diff":2,"q":"A smartphone seized as evidence is still powered on. What should the investigator do to preserve it?","o":[["Power it off immediately to save the battery","Powering off may lose volatile data and can trigger encryption that locks the device."],["Browse its messages to decide whether it is relevant","Browsing changes data and may break evidence integrity."],["Isolate it from networks, for example in a Faraday bag","Correct. Isolation prevents remote wiping or new data arriving, while keeping the device's state."],["Reset it to factory settings so it can be examined safely","A reset destroys the evidence."]],"a":2,"k":"Mobile device artifacts: isolate from networks (Faraday bag), keep power, document state, use proper forensic tools."},{"id":"D7-007","d":7,"obj":"7.1","diff":3,"q":"A company receives a court request to produce all emails related to a contract dispute. Which framework describes the process of identifying, preserving, collecting and producing this electronic information?","o":[["The NIST Cybersecurity Framework","The CSF organizes cybersecurity functions; it is not an eDiscovery process."],["The incident response lifecycle in NIST SP 800-61","That covers responding to security incidents."],["The Common Criteria evaluation process","Common Criteria evaluates product security."],["The Electronic Discovery Reference Model","Correct. The EDRM covers identification, preservation, collection, processing, review, analysis and production of electronically stored information."]],"a":3,"k":"eDiscovery follows the EDRM; good information governance and legal holds make it far easier."},{"id":"D7-008","d":7,"obj":"7.2","diff":2,"q":"Logs from firewalls, servers and applications are collected in one place and analyzed together to spot attacks that no single source would reveal. Which system does this?","o":[["A SIEM","Correct. A security information and event management system aggregates, normalizes and correlates events, then alerts."],["An intrusion prevention system on the perimeter","An IPS inspects traffic at one point; it does not correlate logs from many systems."],["A data loss prevention agent on each endpoint","DLP watches sensitive data, not event correlation across sources."],["A configuration management database","A CMDB records assets and their configurations."]],"a":0,"k":"SIEM: centralize, normalize, correlate and alert; SOAR then automates the response."},{"id":"D7-009","d":7,"obj":"7.2","diff":2,"q":"Investigators cannot reconstruct the order of an attack because each server's log timestamps disagree by several minutes. Which control would have prevented this?","o":[["Larger log storage capacity on each server","Storage size does not affect timestamp accuracy."],["Encrypting logs in transit","Encryption protects confidentiality, not time accuracy."],["Logging more event types","More events do not fix clock differences."],["Synchronized clocks (NTP)","Correct. Synchronizing every clock to a common time source is essential to correlate events across systems."]],"a":3,"k":"Synchronize clocks (NTP) so logs can be correlated and stand up as evidence."},{"id":"D7-010","d":7,"obj":"7.2","diff":2,"q":"How should an organization protect the integrity of its security logs against an attacker who gains administrator access to a server?","o":[["Store the logs on the same server in a hidden folder","An administrator on that server can still find and change them."],["Forward them in real time to a separate log store","Correct. Centralized, access-restricted, write-protected logging keeps evidence out of reach of an attacker on the source system."],["Delete logs older than a day to reduce what can be altered","Short retention destroys evidence."],["Make the log files read-only for administrators on the server","Administrators can change permissions back."]],"a":1,"k":"Protect logs: forward off-host promptly, restrict access, use write-once storage or hashing, and retain per policy."},{"id":"D7-011","d":7,"obj":"7.2","diff":2,"q":"Analysts start from the hypothesis that an attacker is using a specific technique in their network, then search proactively for evidence of it. What is this activity called?","o":[["Threat hunting","Correct. Threat hunting is proactive and hypothesis-driven, looking for threats that automated alerts have missed."],["Vulnerability scanning of all subnets","Scanning looks for weaknesses, not active attackers."],["Log rotation and archiving","Rotation manages storage, not detection."],["Penetration testing by an outside firm","Penetration testing simulates attacks; it does not search for real ones."]],"a":0,"k":"Threat hunting assumes compromise and looks for it, guided by threat intelligence and hypotheses."},{"id":"D7-012","d":7,"obj":"7.2","diff":2,"q":"A tool learns each user's normal behavior and alerts when an account suddenly downloads far more data than usual at an odd hour. What is this technology?","o":[["Signature-based network intrusion detection","Signatures match known attack patterns, not deviations from normal behavior."],["A web application firewall","A WAF filters web traffic."],["User and entity behavior analytics (UEBA)","Correct. UEBA models normal behavior for users and devices and flags anomalies, such as signs of an insider or a compromised account."],["Network address translation logging","NAT logs record address translations."]],"a":2,"k":"UEBA detects anomalies in user and entity behavior; it complements signature-based detection."},{"id":"D7-013","d":7,"obj":"7.2","diff":2,"q":"Which monitoring activity is MOST likely to detect data being exfiltrated from the network?","o":[["Monitoring inbound firewall denies","Inbound denies show attempted entry, not data leaving."],["Reviewing antivirus update logs","Update logs show whether signatures are current."],["Counting failed logins on the VPN","Failed logins indicate access attempts, not data theft."],["Egress monitoring of outbound traffic","Correct. Watching outbound flows, DNS and proxy traffic reveals unusual volumes and destinations."]],"a":3,"k":"Egress monitoring (outbound traffic, DLP, DNS) catches data leaving and command-and-control traffic."},{"id":"D7-014","d":7,"obj":"7.2","diff":2,"q":"The SOC wants to receive machine-readable threat intelligence from industry partners automatically. Which standards are designed for this?","o":[["STIX and TAXII","Correct. STIX describes threat intelligence in a structured format, and TAXII transports it between parties."],["SAML and OpenID Connect","These are identity federation standards."],["SNMP and syslog","These carry device management data and logs."],["SPF and DKIM","These authenticate email."]],"a":0,"k":"Threat intelligence sharing: STIX (format) over TAXII (transport); ISACs share sector-specific intelligence."},{"id":"D7-015","d":7,"obj":"7.2","diff":2,"q":"A system records failed logins but raises an alert only after five failures in ten minutes for the same account. What is this threshold called?","o":[["A baseline configuration","A baseline is a minimum security configuration."],["A clipping level","Correct. Clipping levels ignore routine errors below a threshold and flag activity above it."],["A recovery point objective","An RPO is a recovery measure."],["A service level agreement","An SLA defines service commitments."]],"a":1,"k":"Clipping levels reduce noise by alerting only when activity crosses a defined threshold."},{"id":"D7-016","d":7,"obj":"7.2","diff":3,"q":"The SIEM generates thousands of low-value alerts a day, and analysts are missing real incidents. What is the BEST response?","o":[["Disable alerting until analysts catch up","Turning off detection hides real attacks."],["Hire enough analysts to review every alert","Scaling people to noise is costly and unsustainable."],["Raise every threshold to the maximum","Blanket changes will suppress real detections too."],["Tune rules and prioritize by risk","Correct. Continuous monitoring includes tuning to the environment's context: remove false positives, enrich alerts and prioritize by asset and threat."]],"a":3,"k":"Monitoring needs continuous tuning; alert fatigue is a detection failure in its own right."},{"id":"D7-017","d":7,"obj":"7.3","diff":2,"q":"Servers are built from a hardened, approved image, and a tool alerts when a server's configuration drifts from it. What practice is this?","o":[["Configuration management with baselining","Correct. A secure baseline is applied consistently, and deviations are detected and corrected."],["Change management through the advisory board","Change management approves changes; baselining defines and enforces the approved state."],["Patch management for operating systems","Patching is one input to baselines, not the whole practice."],["Vulnerability scanning from outside","Scanning finds vulnerabilities rather than tracking configuration state."]],"a":0,"k":"Configuration management: define baselines, provision consistently (often automated), detect and correct drift."},{"id":"D7-018","d":7,"obj":"7.3","diff":2,"q":"Infrastructure is defined in code templates stored in version control and deployed automatically. What is the main security benefit?","o":[["No security reviews are needed any more","Code still needs review; the benefit is that reviews become possible and repeatable."],["Consistent, reviewable and repeatable configurations","Correct. Infrastructure as code lets teams review, test and reproduce configurations and spot unauthorized changes."],["Servers no longer need patching","Templates must still be updated to deploy patched images."],["Encryption is enabled automatically everywhere","Only if the templates specify it."]],"a":1,"k":"Automation and infrastructure as code make configuration consistent, auditable and recoverable."},{"id":"D7-019","d":7,"obj":"7.3","diff":1,"q":"Before a new server joins production, what should configuration management ensure?","o":[["That the administrator has customized it to their preferences","Personal customizations create inconsistency."],["That it uses the vendor's default settings","Defaults are often insecure."],["That it matches the approved secure baseline","Correct. Every system should start from the approved baseline and be recorded in the CMDB."],["That it has every available software package installed","Unnecessary software increases the attack surface."]],"a":2,"k":"Provision from approved baselines; record what you deploy."},{"id":"D7-020","d":7,"obj":"7.4","diff":2,"q":"An analyst has a Top Secret clearance but is denied a Top Secret report unrelated to their work. Which principle is being applied?","o":[["Separation of duties","SoD splits tasks; it does not limit access to particular information."],["Job rotation","Rotation moves people between roles."],["Least privilege","Least privilege limits rights and permissions; need to know specifically limits access to information."],["Need to know","Correct. Clearance makes someone eligible; need to know restricts access to information required for their duties."]],"a":3,"k":"Need to know restricts information access to what a job requires; least privilege restricts rights and permissions."},{"id":"D7-021","d":7,"obj":"7.4","diff":2,"q":"Why do separation of duties controls still leave some risk of fraud?","o":[["Because they rely on encryption","SoD does not depend on encryption."],["Two or more people can collude","Correct. SoD requires collusion to commit fraud, which makes it harder but not impossible; job rotation and audits help detect it."],["Because they only work on weekends","SoD applies at all times."],["Because they prevent all errors","SoD reduces fraud and errors but cannot prevent them all."]],"a":1,"k":"Separation of duties forces collusion; job rotation and mandatory vacations help uncover it."},{"id":"D7-022","d":7,"obj":"7.4","diff":2,"q":"A bank requires employees in sensitive roles to take two consecutive weeks of vacation each year. What is the PRIMARY purpose?","o":[["To improve morale and reduce burnout","That is a welcome side effect, not the security purpose."],["To reduce payroll costs","Vacation does not reduce payroll."],["To uncover ongoing fraud","Correct. Fraud often depends on the employee's continuous presence; someone else does the job meanwhile, so ongoing fraud or irregularities are likely to surface."],["To meet labor law requirements","Labor law is not the security reason."]],"a":2,"k":"Mandatory vacations and job rotation are detective controls against fraud."},{"id":"D7-023","d":7,"obj":"7.4","diff":2,"q":"Opening the vault holding the root CA's private key requires two authorized officers to be present together. What is this control?","o":[["Need to know","Need to know limits information access."],["Least privilege","Least privilege limits rights; it does not require two people."],["Job rotation","Rotation moves people between roles."],["Two-person control","Correct. Two-person (dual) control requires two people for a critical action, preventing one person acting alone."]],"a":3,"k":"Two-person control and split knowledge (M of N) protect the most critical operations."},{"id":"D7-024","d":7,"obj":"7.4","diff":2,"q":"Which practice BEST manages the risk of privileged administrator accounts?","o":[["Privileged access management with vaulting and monitoring","Correct. PAM vaults credentials, grants them just in time, records sessions and audits use."],["Giving every administrator the same domain admin account","Shared accounts remove accountability."],["Using privileged accounts for daily email and browsing","That exposes powerful credentials to phishing and malware."],["Never reviewing privileged access, to avoid disruption","Privileged access needs the most frequent review."]],"a":0,"k":"Privileged account management: separate admin accounts, vaulting, JIT elevation, session recording and review."},{"id":"D7-025","d":7,"obj":"7.4","diff":1,"q":"Which document defines the level of service a provider commits to deliver, such as 99.9% uptime, and the remedies if it falls short?","o":[["A memorandum of understanding","An MOU records intentions, usually without enforceable penalties."],["A service level agreement","Correct. SLAs set measurable service levels and consequences for missing them."],["An interconnection security agreement","An ISA covers the security of connections between organizations."],["A non-disclosure agreement","An NDA protects confidential information."]],"a":1,"k":"SLAs define measurable commitments; OLAs cover internal teams; ISAs cover interconnections; MOUs record intent."},{"id":"D7-026","d":7,"obj":"7.5","diff":2,"q":"Backup tapes are rotated offsite. Which practice protects them throughout their life?","o":[["Reusing tapes indefinitely to save costs","Old media degrades and may fail during restore."],["Labeling tapes with only the date","Without a classification label, handlers cannot apply the right protection."],["Labeling, encryption and tracked custody","Correct. Media management covers marking, protection, tracking, storage and sanitization at end of life."],["Keeping the only copy in the server room","A single onsite copy is lost with the site."]],"a":2,"k":"Media management: label by classification, encrypt, track custody, store securely, retire and sanitize."},{"id":"D7-027","d":7,"obj":"7.5","diff":2,"q":"A company must keep backups of critical data protected even if an attacker gains administrator access to the backup system. Which technique helps MOST?","o":[["Storing backups on a file share mapped to every server","Mapped shares are easily reached and encrypted by ransomware."],["Immutable or offline backup copies","Correct. Write-once or air-gapped copies cannot be altered or deleted by an attacker with online access."],["Compressing backups to save space","Compression does not protect integrity or availability."],["Running backups more frequently on the same system","More copies in the same reachable place do not survive a targeted attack."]],"a":1,"k":"Protect backups from ransomware with immutability, offline or air-gapped copies and separate credentials."},{"id":"D7-028","d":7,"obj":"7.6","diff":1,"q":"Following the incident management steps in the CISSP Official Study Guide, what comes immediately after detection?","o":[["Mitigation","Mitigation (containment) follows response."],["Response","Correct. The order is detection, response, mitigation, reporting, recovery, remediation, lessons learned."],["Recovery","Recovery comes later, after mitigation and reporting."],["Lessons learned","Lessons learned is the final step."]],"a":1,"k":"OSG incident steps: detection → response → mitigation → reporting → recovery → remediation → lessons learned."},{"id":"D7-029","d":7,"obj":"7.6","diff":2,"q":"The SOC confirms that ransomware is spreading from one workstation to file servers. What should responders do FIRST?","o":[["Wipe and rebuild every affected server","Rebuilding is recovery; it comes after containment and evidence preservation."],["Contact the attackers to negotiate","Negotiation is a later business decision with legal input, not a first step."],["Isolate the affected systems","Correct. Containment by disconnecting affected systems from the network stops further spread and limits damage while the investigation continues."],["Publish a statement to customers","Communications follow the plan and legal guidance once the scope is understood."]],"a":2,"k":"Contain first to limit damage; then eradicate, recover and learn."},{"id":"D7-030","d":7,"obj":"7.6","diff":2,"q":"Which phase of the NIST SP 800-61 incident response lifecycle includes building the team, tools and playbooks before any incident occurs?","o":[["Preparation","Correct. Preparation creates the capability to respond: people, processes, tools and communications."],["Detection and analysis","That phase begins when signs of an incident appear."],["Containment, eradication and recovery","That phase acts on an incident in progress."],["Post-incident activity","That phase captures lessons after an incident."]],"a":0,"k":"NIST 800-61: preparation → detection and analysis → containment, eradication and recovery → post-incident activity."},{"id":"D7-031","d":7,"obj":"7.6","diff":2,"q":"During remediation after an incident, what is the MOST important activity?","o":[["Restoring systems from backup as fast as possible","Restoration is recovery; remediation fixes why the incident happened."],["Disciplining the employee who clicked the link","Blame does not fix the underlying weakness."],["Closing the ticket so metrics stay green","Closure without a fix invites repetition."],["Root cause analysis, then fixing the cause","Correct. Remediation identifies why the incident happened and corrects it to prevent recurrence."]],"a":3,"k":"Remediation = root cause analysis plus fixes; lessons learned improve the process itself."},{"id":"D7-032","d":7,"obj":"7.6","diff":2,"q":"A breach exposed customers' personal data. Who should decide what must be reported to regulators and customers, and when?","o":[["The SOC analyst who first detected the incident","Analysts detect and escalate; they do not make legal reporting decisions."],["Management, advised by legal counsel","Correct. Reporting obligations depend on law and contracts, so counsel advises and management decides."],["The IT help desk, using a standard template","The help desk lacks the authority and legal context."],["The affected customers themselves","Customers are recipients of notification, not the decision makers."]],"a":1,"k":"Incident reporting follows legal and contractual requirements; involve counsel and follow the communication plan."},{"id":"D7-033","d":7,"obj":"7.6","diff":2,"q":"What is the PRIMARY purpose of a lessons-learned meeting after an incident?","o":[["To identify the person to blame","A blame-focused review discourages honest reporting."],["To improve controls and the response process","Correct. The review captures what went well, what failed and what to change, feeding back into preparation."],["To close the incident ticket","Closing tickets is administrative."],["To estimate the cost of the incident for insurance","Costing may be part of the report, but improvement is the purpose."]],"a":1,"k":"Lessons learned should be blameless and lead to concrete improvements in controls, playbooks and training."},{"id":"D7-034","d":7,"obj":"7.6","diff":3,"q":"While containing an incident, a responder wants to power off a compromised server immediately. Why might the incident handler object?","o":[["Powering off is always against policy","Sometimes shutdown is the right call; it depends on the situati
